(function () {
  function lv(L) { var m = /(\d)(?:\s*[–-]\s*(\d))?/.exec(L.level || ""); var lo = m ? +m[1] : 9; return [lo, m && m[2] ? +m[2] : lo]; }
  LESSONS = LESSONS.map(function (L, i) { return { L: L, i: i, k: lv(L) }; })
    .sort(function (a, b) { return a.k[0] - b.k[0] || a.k[1] - b.k[1] || a.i - b.i; })
    .map(function (x) { return x.L; });
})();
var DATA = [], GLOSS = {}, LINES = [], LESSON = null, LESSON_I = 0;
function makeData(L) {
  return L.raw.map(function (r, n) {
    var words = r[1].split(",").map(function (w) { var a = w.split("|"); return { h: a[0], p: a[1] }; });
    return { zh: r[0], words: words, en: r[2], vi: L.vis[n],
      py: words.map(function (w) { return w.p; }).join(" "),
      hz: words.map(function (w) { return w.h; }).join("") };
  });
}
function setLesson(i) { LESSON_I = i; LESSON = LESSONS[i]; DATA = makeData(LESSON); GLOSS = LESSON.gloss; LINES = LESSON.lines.slice(); }
setLesson(0);

function fold(s) {
  return s.toLowerCase().replace(/[üǖǘǚǜ]/g, "u").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z]/g, "").replace(/v/g, "u");
}
function hasTones(s) { return /[̀́̌̄]/.test(s.normalize("NFD")); }
function strict(s) { return s.toLowerCase().normalize("NFC").replace(/v/g, "ü").replace(/[^a-züāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/g, ""); }
var TONES = { a: "āáǎà", e: "ēéěè", i: "īíǐì", o: "ōóǒò", u: "ūúǔù", "ü": "ǖǘǚǜ" };
var LET = "a-züāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ";
function stripMarks(s) { return s.normalize("NFD").replace(/[\u0300\u0301\u030c\u0304]/g, "").normalize("NFC"); }
function applyTone(syl, t) {
  var b = stripMarks(syl.toLowerCase().replace(/v/g, "ü"));
  if (t < 1 || t > 4) return b;
  var k = b.search(/[ae]/);
  if (k < 0) { var ou = b.indexOf("ou"); k = ou >= 0 ? ou : -1; }
  if (k < 0) { for (var j = b.length - 1; j >= 0; j--) { if (TONES[b[j]]) { k = j; break; } } }
  if (k < 0) return b;
  return b.slice(0, k) + TONES[b[k]][t - 1] + b.slice(k + 1);
}
function convertTones(text) {
  return text.replace(new RegExp("([" + LET + "]+)([1-5])", "gi"), function (m, syl, d) { return applyTone(syl, +d); });
}
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

var state = { view: "home", dir: "vi", mode: "listen", deck: [], i: 0, score: 0, clean: true, done: false, hints: 0, showPy: false, answer: [], bank: [], solved: false };
var stage = document.getElementById("stage");
var listenCtl = null;

function startRound() {
  state.deck = DATA.slice(); state.i = 0; state.score = 0; state.done = false; state.paid = {};
  loadQuestion();
}
function cur() { return state.deck[state.i]; }
function loadQuestion() {
  state.clean = true; state.hints = 0; state.solved = false;
  if (state.mode === "order") {
    var q = cur();
    var tiles = q.words.map(function (w, k) { return { id: k, h: w.h, p: w.p }; });
    state.bank = shuffle(tiles);
    if (state.bank.length > 1 && state.bank.map(function (t) { return t.h; }).join("") === q.hz) state.bank = state.bank.reverse();
    state.answer = [];
  }
  render();
}
function updateStats() {
  document.getElementById("count").textContent = "Câu " + Math.min(state.i + 1, state.deck.length) + "/" + state.deck.length;
  document.getElementById("score").textContent = "Điểm " + state.score;
  paintProg();
  document.getElementById("barfill").style.width = (state.done ? 100 : (state.i / state.deck.length) * 100) + "%";
}
function award() { if (state.clean && !state.paid[state.i]) { state.paid[state.i] = true; state.score += 1; } }

/* ---------- Progress: sentences translated per lesson (saved in this browser) ---------- */
var PROG = {}, PKEY = "ldc_prog_v1", popIdx = -1, toastT = null;
try { var rawP = localStorage.getItem(PKEY); if (rawP) PROG = JSON.parse(rawP) || {}; } catch (e) { PROG = {}; }
function saveProg() { try { localStorage.setItem(PKEY, JSON.stringify(PROG)); } catch (e) {} }
function isDone(L, zh) { return !!(PROG[L.id] && PROG[L.id][zh]); }
function countDone(L) { var n = 0; L.raw.forEach(function (r) { if (isDone(L, r[0])) n++; }); return n; }
function toast(msg, full) {
  var t = document.getElementById("toast");
  if (!t) { t = el("div", "toast"); t.id = "toast"; t.setAttribute("role", "status"); t.setAttribute("aria-live", "polite"); document.body.appendChild(t); }
  t.textContent = msg; t.className = "toast show" + (full ? " full" : "");
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.className = "toast" + (full ? " full" : ""); }, full ? 3400 : 1800);
}
function markDone(zh) {
  if (isDone(LESSON, zh)) return;
  (PROG[LESSON.id] = PROG[LESSON.id] || {})[zh] = 1; saveProg();
  popIdx = state.i;
  var n = countDone(LESSON), t = LESSON.raw.length;
  if (n === t) toast("Hoàn thành bài! Bạn đã dịch đủ " + t + "/" + t + " câu", true);
  else toast("Đã dịch " + n + "/" + t + " câu", false);
}
function paintProg() {
  var box = document.getElementById("prog"); if (!box) return;
  box.textContent = "";
  var n = countDone(LESSON), t = DATA.length;
  var top = el("div", "progtop"), big = el("div", "progbig");
  big.appendChild(el("b", "", String(n))); big.appendChild(document.createTextNode(" / " + t + " câu đã dịch"));
  top.appendChild(big); top.appendChild(el("span", "progpct", Math.round(n / t * 100) + "%"));
  box.appendChild(top);

  hero.appendChild(el("h1", "", "Luyện dịch Việt-Trung từ Podcast"));
  hero.appendChild(el("p", "lead", "Mỗi bài là một tập podcast. Nghe trước, rồi dịch lại những câu trong tập từ tiếng Việt sang tiếng Trung."));
  h.appendChild(hero);
  var feats = [
    ["Nghe theo bài", "Nghe cả tập, chữ Hán, pinyin và nghĩa chạy theo lời nói.", "listen"],
    ["Gõ chữ Hán", "Gõ pinyin rồi chọn chữ Hán đúng. Bí thì có gợi ý.", "py"],
    ["Sắp xếp từ", "Xếp các từ thành câu. Xong rồi bấm vào từng từ để xem nghĩa.", "order"]
  ];
  var grid = el("div", "feats");
  feats.forEach(function (f) {
    var c = el("div", "feat"); c.appendChild(el("div", "ft", f[0])); c.appendChild(el("div", "fd", f[1])); grid.appendChild(c);
  });
  h.appendChild(grid);
  var tot = 0, tdone = 0; LESSONS.forEach(function (L) { tot += L.raw.length; tdone += countDone(L); });
  var sum = el("div", "sumbox");
  var st = el("div", "progtop"), sb = el("div", "progbig");
  sb.appendChild(el("b", "", String(tdone))); sb.appendChild(document.createTextNode(" / " + tot + " câu đã dịch ở tất cả các bài"));
  st.appendChild(sb); st.appendChild(el("span", "progpct", Math.round(tot ? tdone / tot * 100 : 0) + "%"));
  sum.appendChild(st);
  var sbar = el("div", "bar"), sfill = el("i"); sfill.style.width = (tot ? tdone / tot * 100 : 0) + "%"; if (tdone === tot && tot) sfill.className = "full"; sbar.appendChild(sfill); sum.appendChild(sbar);
  h.appendChild(sum);
  h.appendChild(el("div", "label hl", "Chọn bài (xếp từ dễ đến khó)"));
  var list = el("div", "lessons");
  LESSONS.forEach(function (L, i) {
    var c = el("div", "lesson");
    c.appendChild(el("span", "lvl", "Gợi ý trình độ: " + L.level + " · " + lessonMinutes(L) + " phút"));
    c.appendChild(el("span", "lz", L.zh));
    c.appendChild(el("span", "lv", L.vi));
    c.appendChild(el("span", "lm", L.raw.length + " câu luyện dịch"));
    var dn = countDone(L), tl = L.raw.length, full = dn === tl;
    var lp = el("div", "lprog"), lb = el("div", "bar"), lf = el("i");
    lf.style.width = (dn / tl * 100) + "%"; if (full) lf.className = "full"; lb.appendChild(lf); lp.appendChild(lb);
    lp.appendChild(el("span", "lprogt" + (full ? " full" : ""), dn === 0 ? "Chưa dịch câu nào" : full ? "Hoàn thành · đã dịch " + tl + "/" + tl + " câu" : "Đã dịch " + dn + "/" + tl + " câu"));
    c.appendChild(lp);
    if (full) c.className += " fin";
    var row = el("div", "row");
    var go = el("button", "btn main", dn > 0 && !full ? "Tiếp tục" : "Vào bài"); go.type = "button";
    go.addEventListener("click", function () { startLesson(i, "listen"); });
    row.appendChild(go);
    if (dn > 0) {
      var rs = el("button", "linkbtn", "Xóa tiến độ"); rs.type = "button"; var armed = false, tm = null;
      rs.addEventListener("click", function () {
        if (!armed) { armed = true; rs.textContent = "Bấm lần nữa để xóa"; tm = setTimeout(function () { armed = false; rs.textContent = "Xóa tiến độ"; }, 4000); return; }
        clearTimeout(tm); delete PROG[L.id]; saveProg(); paintHome();
      });
      row.appendChild(rs);
    }
    c.appendChild(row);
    list.appendChild(c);
  });
  h.appendChild(list);
  h.appendChild(supportBlock());
  var tb = el("button", "linkbtn", "Đổi giao diện sáng/tối"); tb.type = "button"; tb.id = "themebtn";
  tb.addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.getAttribute("data-theme") === "dark" || (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });
  h.appendChild(tb);
}
function supportBlock() {
  var d = el("details", "support");
  d.appendChild(el("summary", "", "Ủng hộ tác giả"));
  d.appendChild(el("p", "tip", "Nếu bài luyện này có ích với bạn và bạn muốn gửi một chút ủng hộ, quét mã dưới đây. Không bắt buộc."));
  var im = el("img"); im.src = "support-qr.png"; im.alt = "Mã QR chuyển khoản ủng hộ tác giả"; im.width = 280; im.loading = "lazy";
  d.appendChild(im);
  return d;
}
function paintHeader() {
  document.getElementById("lessonpill").textContent = "Gợi ý trình độ: " + LESSON.level;
  var sub = document.getElementById("lessonsub"); sub.textContent = "";
  sub.appendChild(el("span", "han2", LESSON.zh)); sub.appendChild(document.createTextNode("  ·  " + LESSON.vi + "  ·  "));
  var back = el("button", "linkbtn", "Đổi bài"); back.type = "button"; back.addEventListener("click", function () { showView("home"); });
  sub.appendChild(back);
}

/* ---------- Update ticker: newest announcements, scrolling across the top ---------- */
var UPDATES = [
  { d: "02/11", t: "Bài 13 mới: Gọi món bằng tiếng Trung như người bản xứ (HSK 3–5)", id: "l13" },
  { d: "02/11", t: "Các bài được xếp từ dễ đến khó" },
  { d: "30/10", t: "Theo dõi số câu đã dịch ở mỗi bài" },
  { d: "29/10", t: "4 bài HSKK mẫu mới: mua sắm online, thư giãn, học ngoại ngữ, kết bạn", id: "l9" }
];
var TKVER = UPDATES[0].d + "|" + UPDATES.length;
function paintTicker() {
  var box = document.getElementById("ticker"), track = document.getElementById("tktrack"); if (!box || !track) return;
  var hidden = false;
  try { hidden = localStorage.getItem("ldc_tk_hidden") === TKVER; } catch (e) {}
  if (hidden) { box.hidden = true; return; }
  track.textContent = "";
  function group(dup) {
    var g = el("span", "tkgrp"); if (dup) g.setAttribute("aria-hidden", "true");
    UPDATES.forEach(function (u) {
      var idx = u.id ? LESSONS.findIndex(function (L) { return L.id === u.id; }) : -1;
      var it = el(idx >= 0 ? "button" : "span", "tkitem"); if (idx >= 0) { it.type = "button"; if (dup) it.tabIndex = -1; it.addEventListener("click", function () { startLesson(idx, "listen"); }); }
      it.appendChild(el("b", "", u.d)); it.appendChild(document.createTextNode(u.t));
      g.appendChild(it);
    });
    return g;
  }
  track.appendChild(group(false)); track.appendChild(group(true));
  box.hidden = false;
  var w = track.scrollWidth / 2;
  track.style.setProperty("--tkdur", Math.max(18, Math.round(w / 55)) + "s");
}
document.getElementById("tkx").addEventListener("click", function () {
  document.getElementById("ticker").hidden = true;
  try { localStorage.setItem("ldc_tk_hidden", TKVER); } catch (e) {}
});
paintHome(); paintHeader(); paintTicker(); document.getElementById("supportslot").appendChild(supportBlock());
state.view = "home"; showView("home");
</script>
