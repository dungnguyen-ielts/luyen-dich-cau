lines:[{"t":6,"zh":"唉，我真的太替她难过了，心里特别不是滋味。","py":"Āi, wǒ zhēnde tài tì tā nánguò le, xīnlǐ tèbié búshì zīwèi.","vi":"Haizz, mình thật sự thấy buồn thay cho cô ấy, trong lòng rất khó chịu.","sec":"Tin buồn của Tiểu Giai"},{"t":11,"zh":"怎么了王雨？","py":"Zěnme le wángyǔ?","vi":"Sao vậy Vương Vũ?"},{"t":12,"zh":"刚刚在跟谁打电话呢，看你眉头皱得这么紧。","py":"Gānggāng zài gēn shuí dǎdiànhuà ne, kàn nǐ méitóu zhòu de zhème jǐn.","vi":"Vừa nãy cậu gọi điện cho ai thế, nhìn cậu nhíu mày chặt quá."},{"t":16,"zh":"是我大学的室友小佳。","py":"Shì wǒ dàxué de shìyǒu xiǎojiā.","vi":"Là Tiểu Giai, bạn cùng phòng đại học của mình."},{"t":18,"zh":"她刚刚哭着告诉我，她开的那家甜品店这个月底就要关门了，这几年的积蓄全赔进去了。","py":"Tā gānggāng kū zhe gàosù wǒ, tā kāi de nà jiā tiánpǐndiàn zhège yuèdǐ jiùyào guānmén le, zhè jǐnián de jīxù quán péi jìnqù le.","vi":"Cô ấy vừa khóc vừa kể với mình rằng tiệm bánh ngọt cô ấy mở cuối tháng này sẽ đóng cửa, tiền tiết kiệm mấy năm qua mất sạch rồi."},{"t":26,"zh":"这么突然？","py":"Zhème tūrán?","vi":"Đột ngột vậy sao?"},{"t":28,"zh":"我记得她做事一直特别拼命啊。","py":"Wǒ jìde tā zuòshì yìzhí tèbié pīnmìng a.","vi":"Mình nhớ cô ấy làm việc lúc nào cũng rất liều mình mà."},{"t":30,"zh":"我看她朋友圈里经常发凌晨四点起来做面包的照片，几乎全年无休。","py":"Wǒ kàn tā péngyouquān lǐ jīngcháng fā língchén sìdiǎn qǐlai zuò miànbāo de zhàopiān, jīhū quánnián wúxiū.","vi":"Mình thấy trên trang cá nhân cô ấy hay đăng ảnh dậy làm bánh mì lúc bốn giờ sáng, gần như quanh năm không nghỉ."},{"t":36,"zh":"这么努力，生意怎么会做不下去呢？","py":"Zhème nǔlì, shēngyì zěnme huì zuò bú xiàqu ne?","vi":"Chăm chỉ như vậy, sao việc kinh doanh lại không duy trì nổi chứ?"},{"t":39,"zh":"对啊！她绝对是我见过最勤奋的人。","py":"Duì a! Tā juéduì shì wǒ jiàn guo zuì qínfèn de rén.","vi":"Đúng vậy! Cô ấy chắc chắn là người siêng năng nhất mình từng gặp."},{"t":43,"zh":"为了做好甜品，她花了很多钱去学专业的烘焙技术，用的也都是最顶级的黄油，每天在店里站十五个小时。","py":"Wèile zuòhǎo tiánpǐn, tā huā le hěnduō qián qù xué zhuānyè de hōngbèi jìshù, yòng de yě dōu shì zuì dǐngjí de huángyóu, měitiān zài diànlǐ zhàn shíwǔgè xiǎoshí.","vi":"Để làm bánh ngọt ngon, cô ấy tốn rất nhiều tiền học kỹ thuật làm bánh chuyên nghiệp, dùng toàn bơ hảo hạng nhất, mỗi ngày đứng trong tiệm mười lăm tiếng."},{"t":53,"zh":"可是，她把店开在了一个非常老旧的居民区里。","py":"Kěshì, tā bǎ diàn kāi zài le yí ge fēicháng lǎo jiù de jūmínqū lǐ.","vi":"Nhưng cô ấy lại mở tiệm trong một khu dân cư rất cũ kỹ."},{"t":58,"zh":"那里住的几乎全都是退休的爷爷奶奶，老人家根本不吃那些又贵又甜的法式甜点，他们宁愿去早点摊买两块钱一个的肉包子！","py":"Nàlǐ zhù de jīhū quándōu shì tuìxiū de yéyénǎinǎi, lǎorenjia gēnběn bùchī nàxiē yòu guì yòu tián de fǎshì tiándiǎn, tāmen nìngyuàn qù zǎodiǎn tān mǎi liǎngkuàiqián yí ge de ròubāozi!","vi":"Ở đó hầu như toàn ông bà đã về hưu, người già hoàn toàn không ăn mấy món bánh Pháp vừa đắt vừa ngọt, họ thà ra quán điểm tâm mua cái bánh bao nhân thịt hai tệ!"},{"t":68,"zh":"啊原来是这样。","py":"A yuánlái shì zhèyàng.","vi":"À, hóa ra là vậy."},{"t":71,"zh":"那这就不是她甜品做得不好，或者是她不够努力的问题了。","py":"Nà zhè jiù búshì tā tiánpǐn zuò de bùhǎo, huòzhě shì tā búgòu nǔlì de wèntí le.","vi":"Vậy thì không phải do cô ấy làm bánh dở hay chưa đủ cố gắng."},{"t":75,"zh":"这完全是目标客户群和选址的战略错误啊。","py":"Zhè wánquán shì mùbiāo kèhùqún hé xuǎnzhǐ de zhànlüè cuòwù a.","vi":"Đây hoàn toàn là sai lầm chiến lược về nhóm khách hàng mục tiêu và chọn địa điểm."},{"t":79,"zh":"是的。我刚才听她在电话里哭，我眼泪都快掉下来了。","py":"Shì de. Wǒ gāngcái tīng tā zài diànhuà lǐ kū, wǒ yǎnlèi dōu kuài diàoxiàlái le.","vi":"Ừ. Vừa nãy nghe cô ấy khóc trong điện thoại, mình suýt rơi nước mắt."},{"t":85,"zh":"从小父母和老师都教我们“努力就有回报”，只要肯吃苦、只要花时间就一定能成功。","py":"Cóngxiǎo fùmǔ hé lǎoshī dōu jiào wǒmen \"nǔlì jiù yǒu huíbào\", zhǐyào kěnchīkǔ, zhǐyào huā shíjiān jiù yídìng néng chénggōng.","vi":"Từ nhỏ bố mẹ và thầy cô đã dạy chúng ta “nỗ lực sẽ có đền đáp”, chỉ cần chịu khổ, chịu bỏ thời gian là nhất định thành công."},{"t":93,"zh":"但是看到小佳这样，我突然觉得这句话是不是骗人的？","py":"Dànshì kàndào xiǎojiā zhèyàng, wǒ tūrán juéde zhè jù huà shìbúshì piànrén de?","vi":"Nhưng nhìn Tiểu Giai như vậy, mình bỗng thấy câu này có phải là nói dối không?"},{"t":97,"zh":"为什么她拼尽了全力，结果却是零呢？","py":"Wèishénme tā pīn jǐn le quánlì, jiéguǒ quèshì líng ne?","vi":"Tại sao cô ấy dốc hết sức mà kết quả lại bằng không?"},{"t":101,"zh":"其实，“努力就有回报”这句话并没有错。","py":"Qíshí, \"nǔlì jiù yǒu huíbào\" zhè jù huà bìng méiyǒu cuò.","vi":"Thật ra câu “nỗ lực sẽ có đền đáp” không hề sai.","sec":"Chọn lựa quan trọng hơn nỗ lực"},{"t":105,"zh":"但是，很多人在说这句话的时候，忘记了一个非常重要的大前提。","py":"Dànshì, hěnduō rén zài shuō zhè jù huà de shíhou, wàngjì le yí ge fēicháng zhòngyào de dàqiántí.","vi":"Nhưng nhiều người khi nói câu này đã quên một tiền đề rất quan trọng."},{"t":110,"zh":"这个前提就是：你的方向必须是正确的。","py":"Zhège qiántí jiùshì: nǐ de fāngxiàng bìxū shì zhèngquè de.","vi":"Tiền đề đó là: hướng đi của bạn phải đúng."},{"t":113,"zh":"最近几年大家经常讨论一个观点，我觉得特别适合用来解释小佳的遭遇，那就是“选择比努力更重要”。","py":"Zuìjìn jǐnián dàjiā jīngcháng tǎolùn yí ge guāndiǎn, wǒ juéde tèbié shìhé yònglái jiěshì xiǎojiā de zāoyù, nà jiùshì \"xuǎnzé bǐ nǔlì gèng zhòngyào\".","vi":"Mấy năm gần đây mọi người hay bàn về một quan điểm, mình thấy rất hợp để giải thích chuyện của Tiểu Giai, đó là “chọn lựa quan trọng hơn nỗ lực”."},{"t":122,"zh":"“选择比努力更重要”？","py":"\"xuǎnzé bǐ nǔlì gèng zhòngyào\"?","vi":"“Chọn lựa quan trọng hơn nỗ lực”?"},{"t":125,"zh":"你的意思是，因为她一开始没有选对开店的位置和客群，所以她后面每天熬夜做面包的那些努力，其实都是没有意义的吗？","py":"Nǐ de yìsi shì, yīnwèi tā yìkāishǐ méiyǒu xuǎn duì kāidiàn de wèizhì hé kè qún, suǒyǐ tā hòumiàn měitiān áoyè zuò miànbāo de nàxiē nǔlì, qíshí dōu shì méiyǒu yìyì de ma?","vi":"Ý cậu là vì ngay từ đầu cô ấy không chọn đúng vị trí mở tiệm và nhóm khách, nên những nỗ lực thức đêm làm bánh mì sau đó thật ra đều vô nghĩa sao?"},{"t":135,"zh":"可以这么说。","py":"Kěyǐ zhème shuō.","vi":"Có thể nói như vậy."},{"t":137,"zh":"努力就像是汽车的发动机，发动机越好，你的车跑得就越快。","py":"Nǔlì jiù xiàngshì qìchē de fādòngjī, fādòngjī yuè hǎo, nǐ de chē pǎo de jiù yuè kuài.","vi":"Nỗ lực giống như động cơ ô tô, động cơ càng tốt thì xe chạy càng nhanh."},{"t":142,"zh":"但是，选择就像是汽车的方向盘。","py":"Dànshì, xuǎnzé jiù xiàngshì qìchē de fāngxiàngpán.","vi":"Nhưng chọn lựa thì giống vô lăng của xe."},{"t":145,"zh":"如果你要去北京，但是你的方向盘一直指着南方，朝着广州的方向开。","py":"Rúguǒ nǐ yào qù běijīng, dànshì nǐ de fāngxiàngpán yìzhí zhǐzhe nánfāng, cháozhe guǎngzhōu de fāngxiàng kāi.","vi":"Nếu bạn muốn đi Bắc Kinh mà vô lăng cứ chỉ về phía nam, lái về hướng Quảng Châu."},{"t":151,"zh":"那么，你的发动机越好，你开得越快，你离北京是不是就越远？","py":"Nàme, nǐ de fādòngjī yuè hǎo, nǐ kāi de yuè kuài, nǐ lí běijīng shìbúshì jiù yuè yuǎn?","vi":"Vậy thì động cơ càng tốt, bạn lái càng nhanh, chẳng phải càng xa Bắc Kinh sao?"},{"t":157,"zh":"啊！我明白了。","py":"A! Wǒ míngbai le.","vi":"A! Mình hiểu rồi."},{"t":159,"zh":"小佳这几年的创业，就是开着一辆很快的车，但是完全走错了路。","py":"Xiǎojiā zhè jǐnián de chuàngyè, jiùshì kāi zhe yíliàng hěnkuài de chē, dànshì wánquán zǒu cuò le lù.","vi":"Mấy năm khởi nghiệp của Tiểu Giai chính là lái một chiếc xe rất nhanh nhưng hoàn toàn đi sai đường."},{"t":165,"zh":"她越努力，离赚钱的目标就越远。","py":"Tā yuè nǔlì, lí zhuànqián de mùbiāo jiù yuè yuǎn.","vi":"Cô ấy càng nỗ lực thì càng xa mục tiêu kiếm tiền."},{"t":168,"zh":"没错。说到这个，中国古代有一个非常有名的成语，叫做“南辕北辙”。","py":"Méicuò. Shuō dào zhège, zhōngguó gǔdài yǒu yí ge fēicháng yǒumíng de chéngyǔ, jiàozuò \"nányuánběizhé\".","vi":"Đúng vậy. Nói đến chuyện này, thời cổ Trung Quốc có một thành ngữ rất nổi tiếng, gọi là “南辕北辙” (nam viên bắc triệt).","sec":"Thành ngữ 南辕北辙"},{"t":175,"zh":"“南辕北辙”？我好像听说过，但是不知道具体是什么意思。","py":"\"nányuánběizhé\"? Wǒ hǎoxiàng tīngshuō guò, dànshì bù zhīdao jùtǐ shì shénme yìsi.","vi":"“南辕北辙”? Hình như mình từng nghe nhưng không biết cụ thể nghĩa là gì."},{"t":180,"zh":"你能给我解释一下吗？","py":"Nǐ néng gěi wǒ jiěshìyíxià ma?","vi":"Cậu giải thích cho mình được không?"},{"t":182,"zh":"当然可以。“南”就是南方，“北”就是北方。","py":"Dāngrán kěyǐ. \"nán\" jiùshì nánfāng, \"běi\" jiùshì běifāng.","vi":"Đương nhiên được. “南” là phía nam, “北” là phía bắc."},{"t":187,"zh":"“辕”和“辙”都是古代马车上的部分，在这里代表马车。","py":"\"yuán\" hé \"zhé\" dōu shì gǔdài mǎchē shàng de bùfèn, zài zhèlǐ dàibiǎo mǎchē.","vi":"“辕” và “辙” đều là bộ phận của xe ngựa thời xưa, ở đây đại diện cho xe ngựa."},{"t":192,"zh":"这个成语讲的是一个故事：有一个人想要去南方的楚国，但是他却让马车一直往北走。","py":"Zhège chéngyǔ jiǎng de shì yí ge gùshì: yǒu yí ge rén xiǎngyào qù nánfāng de chǔguó, dànshì tā què ràng mǎchē yìzhí wǎngběizǒu.","vi":"Thành ngữ này kể một câu chuyện: có người muốn đến nước Sở ở phương nam, nhưng lại bảo xe ngựa cứ đi về phía bắc."},{"t":199,"zh":"路人看到后，好心地提醒他：“你去楚国，应该往南走，怎么往北走呢？”那个人是怎么回答的？","py":"Lù rén kàndào hòu, hǎoxīn de tíxǐng tā: \"nǐ qù chǔguó, yīnggāi wǎng nán zǒu, zěnme wǎngběizǒu ne?\" nàge rén shì zěnme huídá de?","vi":"Người qua đường thấy vậy tốt bụng nhắc: “Anh đi nước Sở thì phải đi về phía nam, sao lại đi về phía bắc?” Người đó trả lời thế nào?"},{"t":207,"zh":"他发现自己错了吗？","py":"Tā fāxiànzìjǐ cuò le ma?","vi":"Anh ta có nhận ra mình sai không?"},{"t":208,"zh":"他不仅没有发现自己错了，反而非常自信地对路人说：“没关系，我的马跑得特别快！而且我带了非常多的钱，我的车夫技术也特别好！”","py":"Tā bùjǐn méiyǒu fāxiànzìjǐ cuò le, fǎnér fēicháng zìxìn de duì lù rén shuō: \"méiguānxì, wǒ de mǎ pǎo de tèbié kuài! Érqiě wǒ dài le fēicháng duō de qián, wǒ de chēfū jìshù yě tèbié hǎo!\"","vi":"Anh ta không những không nhận ra mình sai, mà còn rất tự tin nói với người qua đường: “Không sao, ngựa của tôi chạy rất nhanh! Tôi lại mang rất nhiều tiền, tay đánh xe của tôi cũng giỏi lắm!”"},{"t":220,"zh":"(笑)，这个人也太可笑了吧！","py":"(xiào), zhège rén yě tài kěxiào le ba!","vi":"(cười) Người này buồn cười quá đi!"},{"t":222,"zh":"马跑得再快，钱带得再多，车夫技术再好，可是方向反了呀！","py":"Mǎ pǎo de zài kuài, qián dài de zài duō, chēfū jìshù zài hǎo, kěshì fāngxiàng fǎn le ya!","vi":"Ngựa chạy nhanh đến mấy, mang nhiều tiền đến mấy, người đánh xe giỏi đến mấy, nhưng hướng ngược rồi mà!"},{"t":228,"zh":"他永远也到不了楚国。","py":"Tā yǒngyuǎn yě dào bùliǎo chǔguó.","vi":"Anh ta mãi mãi không đến được nước Sở."},{"t":230,"zh":"是呀，我们听这个故事的时候，都会觉得这个人很可笑。","py":"Shì ya, wǒmen tīng zhège gùshì de shíhou, dū huì juéde zhège rén hěn kěxiào.","vi":"Phải, khi nghe câu chuyện này, ai cũng thấy người này thật buồn cười."},{"t":236,"zh":"但是王雨，你想一想，在现实生活中，我们是不是经常做和这个人一样的事情？","py":"Dànshì wángyǔ, nǐ xiǎngyìxiǎng, zài xiànshíshēnghuó zhōng, wǒmen shìbúshì jīngcháng zuò hé zhège rén yíyàng de shìqing?","vi":"Nhưng Vương Vũ, cậu nghĩ xem, trong đời thực, chúng ta có phải thường làm điều giống người này không?"},{"t":243,"zh":"你说得对。","py":"Nǐ shuōdéduì.","vi":"Cậu nói đúng."},{"t":245,"zh":"小佳这几年的创业，不就是现实版的“南辕北辙”吗？","py":"Xiǎojiā zhè jǐnián de chuàngyè, bú jiùshì xiànshí bǎn de \"nányuánběizhé\" ma?","vi":"Mấy năm khởi nghiệp của Tiểu Giai chẳng phải là “南辕北辙” phiên bản đời thực sao?"},{"t":249,"zh":"她总是告诉自己，“我很努力，我经常熬夜做面包，我用了最好的材料”，但是因为她一开始没有选对开店的位置和目标客户，最后只能是白费力气。","py":"Tā zǒngshì gàosù zìjǐ, \"wǒ hěn nǔlì, wǒ jīngcháng áoyè zuò miànbāo, wǒ yòng le zuìhǎo de cáiliào\", dànshì yīnwèi tā yìkāishǐ méiyǒu xuǎn duì kāidiàn de wèizhì hé mùbiāo kèhù, zuìhòu zhǐnéng shì báifèilìqì.","vi":"Cô ấy luôn tự nhủ “mình rất nỗ lực, mình hay thức đêm làm bánh, mình dùng nguyên liệu tốt nhất”, nhưng vì ngay từ đầu không chọn đúng vị trí và khách hàng mục tiêu, cuối cùng chỉ uổng công."},{"t":262,"zh":"其实，不仅是在创业和工作中，在人生的很多重要阶段，选择都起着决定性的作用。","py":"Qíshí, bùjǐn shì zài chuàngyè hé gōngzuò zhōng, zài rénshēng de hěnduō zhòngyào jiēduàn, xuǎnzé dōu qǐ zhe juédìngxìng de zuòyòng.","vi":"Thật ra, không chỉ trong khởi nghiệp và công việc, ở nhiều giai đoạn quan trọng của đời người, sự lựa chọn đều đóng vai trò quyết định."},{"t":269,"zh":"有时候，一个错误的决定，会让我们多走很多年的弯路。","py":"Yǒushíhòu, yí ge cuòwù de juédìng, huì ràng wǒmen duō zǒu hěnduōnián de wānlù.","vi":"Đôi khi một quyết định sai sẽ khiến ta đi đường vòng thêm nhiều năm."},{"t":274,"zh":"没错。说到多走弯路，我马上就想到了我上大学时候的经历了。","py":"Méicuò. Shuō dào duō zǒuwānlù, wǒ mǎshàng jiù xiǎngdào le wǒ shàng dàxué shíhou de jīnglì le.","vi":"Đúng vậy. Nói đến đi đường vòng, mình lập tức nghĩ đến trải nghiệm thời đại học.","sec":"Chọn nhầm chuyên ngành kế toán"},{"t":280,"zh":"那真是我人生中做过的一个非常失败的选择。","py":"Nà zhēnshì wǒ rénshēng zhōng zuò guo de yí ge fēicháng shībài de xuǎnzé.","vi":"Đó thật sự là một lựa chọn rất thất bại trong đời mình."},{"t":284,"zh":"哦？是什么经历？说来听听。","py":"Ò? Shì shénme jīnglì? Shuōláitīngtīng.","vi":"Ồ? Chuyện gì vậy? Kể nghe thử xem."},{"t":286,"zh":"是因为选错了大学，还是选错了专业？","py":"Shìyīnwèi xuǎncuò le dàxué, háishì xuǎncuò le zhuānyè?","vi":"Là chọn nhầm trường đại học hay chọn nhầm chuyên ngành?"},{"t":289,"zh":"是选错了专业。","py":"Shì xuǎncuò le zhuānyè.","vi":"Là chọn nhầm chuyên ngành."},{"t":291,"zh":"当年我高中毕业的时候，要填报大学的志愿。","py":"Dāngnián wǒ gāozhōngbìyè de shíhou, yào tiánbào dàxué de zhìyuàn.","vi":"Hồi tốt nghiệp cấp ba, mình phải điền nguyện vọng đại học."},{"t":295,"zh":"其实我从小就特别喜欢语言和文学，我高中的时候经常写文章，还在杂志上发表过呢。","py":"Qíshí wǒ cóngxiǎo jiù tèbié xǐhuan yǔyán hé wénxué, wǒ gāozhōng de shíhou jīngcháng xiěwénzhāng, hái zài zázhì shàng fābiǎo guò ne.","vi":"Thật ra từ nhỏ mình đã rất thích ngôn ngữ và văn học, hồi cấp ba mình hay viết bài, còn được đăng trên tạp chí nữa."},{"t":303,"zh":"我本来想学中文专业或者新闻专业。","py":"Wǒ běnlái xiǎng xué zhōngwén zhuānyè huòzhě xīnwén zhuānyè.","vi":"Ban đầu mình muốn học ngành Ngữ văn Trung hoặc báo chí."},{"t":306,"zh":"这听起来很适合你啊。","py":"Zhè tīng qǐlai hěn shìhé nǐ a.","vi":"Nghe rất hợp với cậu đấy."},{"t":308,"zh":"你现在的性格这么开朗，又很喜欢和别人交流。","py":"Nǐ xiànzài de xìnggé zhème kāilǎng, yòu hěn xǐhuan hé biérén jiāoliú.","vi":"Tính cậu bây giờ vui vẻ cởi mở thế, lại thích trò chuyện với người khác."},{"t":312,"zh":"那后来为什么没有学这两个专业呢？","py":"Nà hòulái wèishénme méiyǒu xué zhè liǎnggè zhuānyè ne?","vi":"Vậy sau đó sao không học hai ngành này?"},{"t":314,"zh":"因为我父母不同意啊。","py":"Yīnwèi wǒ fùmǔ bù tóngyì a.","vi":"Vì bố mẹ mình không đồng ý."},{"t":317,"zh":"在我们中国，很多父母都觉得，学文学或者新闻以后不好找工作，工资也不高。","py":"Zài wǒmen zhōngguó, hěnduō fùmǔ dōu juéde, xué wénxué huòzhě xīnwén yǐhòu bùhǎo zhǎo gōngzuò, gōngzī yě bù gāo.","vi":"Ở Trung Quốc chúng ta, nhiều bố mẹ nghĩ học văn học hay báo chí sau này khó tìm việc, lương cũng không cao."},{"t":325,"zh":"我妈妈当时对我说：“女孩子学个会计多好啊！会计工作稳定，越老越吃香，而且每个公司都需要会计，绝对不会失业。”","py":"Wǒ māma dāngshí duì wǒ shuō: \"nǚháizi xué gè kuàijì duō hǎo a! Kuàijìgōngzuò wěndìng, yuè lǎo yuè chīxiāng, érqiě měigè gōngsī dōu xūyào kuàijì, juéduì búhuì shīyè.\"","vi":"Hồi đó mẹ mình nói: “Con gái học kế toán thì tốt biết bao! Công việc kế toán ổn định, càng lớn tuổi càng được trọng dụng, hơn nữa công ty nào cũng cần kế toán, tuyệt đối không thất nghiệp.”"},{"t":336,"zh":"会计专业确实是一个很稳妥的选择。","py":"Kuàijìzhuānyè quèshí shì yí ge hěn wěntuǒ de xuǎnzé.","vi":"Ngành kế toán quả thật là lựa chọn rất chắc chắn."},{"t":339,"zh":"当时也是非常热门的专业。","py":"Dāngshí yě shì fēicháng rèmén de zhuānyè.","vi":"Lúc đó cũng là ngành rất hot."},{"t":341,"zh":"那你听了父母的话吗？","py":"Nà nǐ tīng le fùmǔ dehuà ma?","vi":"Vậy cậu có nghe lời bố mẹ không?"},{"t":343,"zh":"是的，我当时觉得父母的人生经验比我丰富，他们一定是对的。","py":"Shì de, wǒ dāngshí juéde fùmǔ de rénshēng jīngyàn bǐ wǒ fēngfù, tāmen yídìng shì duì de.","vi":"Có, lúc đó mình nghĩ kinh nghiệm sống của bố mẹ phong phú hơn mình, họ chắc chắn đúng."},{"t":349,"zh":"而且看到很多同学也都选择了商科和财务相关的专业，我就跟着大家一起选了会计专业。","py":"Érqiě kàndào hěnduō tóngxué yě dōu xuǎnzé le shāngkē hé cáiwù xiāngguān de zhuānyè, wǒ jiù gēnzhe dàjiā yìqǐ xuǎn le kuàijìzhuānyè.","vi":"Hơn nữa thấy nhiều bạn học cũng chọn ngành kinh doanh và tài chính, nên mình theo mọi người chọn ngành kế toán."},{"t":356,"zh":"我以为只要我努力学，就一定能学好。","py":"Wǒ yǐwéi zhǐyào wǒ nǔlì xué, jiù yídìng néng xuéhǎo.","vi":"Mình tưởng chỉ cần chăm chỉ học thì nhất định học tốt."},{"t":360,"zh":"后来呢？大学四年的会计学得怎么样？","py":"Hòulái ne? Dàxué sìnián de kuàijìxué de zěnmeyàng?","vi":"Rồi sao nữa? Bốn năm đại học học kế toán thế nào?"},{"t":363,"zh":"简直是一场噩梦！","py":"Jiǎnzhí shì yì chǎng èmèng!","vi":"Quả thật là một cơn ác mộng!"},{"t":366,"zh":"你知道吗，我天生对数字就不敏感，看到那些复杂的财务报表我就头疼。","py":"Nǐ zhīdao ma, wǒ tiānshēng duì shùzì jiù bù mǐngǎn, kàndào nàxiē fùzá de cáiwùbàobiǎo wǒ jiù tóuténg.","vi":"Cậu biết không, mình bẩm sinh không nhạy với con số, nhìn mấy bảng báo cáo tài chính phức tạp là đau đầu."},{"t":373,"zh":"为了不让自己挂科，我每天晚上都在图书馆学习到闭馆。","py":"Wèile búràng zìjǐ guà kē, wǒ měitiānwǎnshàng dōu zài túshūguǎn xuéxí dào bìguǎn.","vi":"Để không bị rớt môn, tối nào mình cũng học ở thư viện đến giờ đóng cửa."},{"t":378,"zh":"别的同学看一遍就能明白的数学模型，我需要看三四遍，甚至还要请家教来给我补习。","py":"Biéde tóngxué kànyíbiàn jiù néng míngbai de shùxuémóxíng, wǒ xūyào kàn sānsìbiàn, shènzhì háiyào qǐng jiājiào lái gěi wǒ bǔxí.","vi":"Mô hình toán mà bạn khác xem một lần là hiểu, mình cần xem ba bốn lần, thậm chí còn phải thuê gia sư kèm."},{"t":385,"zh":"听得出你真的付出了巨大的努力。","py":"Tīngdéchū nǐ zhēnde fùchū le jùdà de nǔlì.","vi":"Nghe ra cậu thật sự đã bỏ ra nỗ lực rất lớn."},{"t":388,"zh":"你就像那个驾驶着马车的人，虽然方向不是你想去的，但你依然在拼命地让马车跑起来。","py":"Nǐ jiù xiàng nàge jiàshǐ zhe mǎchē de rén, suīrán fāngxiàng búshì nǐ xiǎng qù de, dàn nǐ yīrán zài pīnmìng de ràng mǎchē pǎo qǐlai.","vi":"Cậu giống người đánh xe ngựa đó, tuy hướng đi không phải nơi cậu muốn tới, nhưng cậu vẫn dốc sức làm cho xe chạy."},{"t":394,"zh":"对！我努力了整整四年。","py":"Duì! Wǒ nǔlì le zhěngzhěng sìnián.","vi":"Đúng! Mình đã nỗ lực suốt bốn năm trời."},{"t":396,"zh":"我的成绩虽然还不错，但是我一点都不快乐。","py":"Wǒ de chéngjì suīrán hái búcuò, dànshì wǒ yìdiǎn dōu bú kuàilè.","vi":"Điểm số của mình tuy khá tốt nhưng mình chẳng vui chút nào."},{"t":400,"zh":"每次考试结束，我都感觉自己好像生了一场大病。","py":"Měicì kǎoshì jiéshù, wǒ dōu gǎnjué zìjǐ hǎoxiàng shēng le yì chǎng dàbìng.","vi":"Mỗi lần thi xong, mình đều thấy như vừa ốm một trận nặng."},{"t":405,"zh":"大学毕业那年，我勉强进了一家小公司的财务部实习。","py":"Dàxuébìyè nànián, wǒ miǎnqiǎng jìn le yìjiā xiǎo gōngsī de cáiwùbù shíxí.","vi":"Năm tốt nghiệp đại học, mình miễn cưỡng vào thực tập ở phòng tài chính của một công ty nhỏ."},{"t":409,"zh":"实习了不到三个月，我就彻底受不了了。","py":"Shíxí le búdào sāngè yuè, wǒ jiù chèdǐ shòubùliǎo le.","vi":"Thực tập chưa đầy ba tháng, mình đã hoàn toàn không chịu nổi."},{"t":413,"zh":"每天对着电脑上的数字算账，不能跟人聊天，不能发挥我的创造力。","py":"Měitiān duì zhe diànnǎo shàng de shùzì suànzhàng, bùnéng gēn rén liáotiān, bùnéng fāhuī wǒ de chuàngzàolì.","vi":"Mỗi ngày đối mặt với con số trên máy tính để tính sổ, không được trò chuyện với ai, không thể phát huy sức sáng tạo."},{"t":419,"zh":"我那时候每天都在想：难道我要这样度过我的一生吗？","py":"Wǒ nà shíhou měitiān dōu zài xiǎng: nándào wǒ yào zhèyàng dùguò wǒ de yìshēng ma?","vi":"Lúc đó ngày nào mình cũng nghĩ: chẳng lẽ mình phải sống cả đời như thế này sao?"},{"t":423,"zh":"那你是怎么改变这个情况的？","py":"Nà nǐ shì zěnme gǎibiàn zhège qíngkuàng de?","vi":"Vậy cậu đã thay đổi tình hình này thế nào?"},{"t":425,"zh":"因为你现在的工作是市场推广，需要每天和人打交道，需要很多创意，完全不是会计的工作啊。","py":"Yīnwèi nǐ xiànzài de gōngzuò shì shìchǎngtuīguǎng, xūyào měitiān hé rén dǎjiāodào, xūyào hěnduō chuàngyì, wánquán búshì kuàijì de gōngzuò a.","vi":"Vì công việc hiện giờ của cậu là marketing, mỗi ngày giao tiếp với người, cần nhiều ý tưởng, hoàn toàn không phải việc của kế toán."},{"t":432,"zh":"实习结束之后，我做了一个非常勇敢的决定：我放弃了会计这条路。","py":"Shíxí jiéshù zhīhòu, wǒ zuò le yí ge fēicháng yǒnggǎn de juédìng: wǒ fàngqì le kuàijì zhè tiáo lù.","vi":"Sau khi thực tập xong, mình đưa ra một quyết định rất dũng cảm: mình từ bỏ con đường kế toán."},{"t":438,"zh":"我重新开始找和媒体、市场相关的工作。","py":"Wǒ chóngxīn kāishǐ zhǎo hé méitǐ, shìchǎng xiāngguān de gōngzuò.","vi":"Mình bắt đầu tìm lại những công việc liên quan đến truyền thông và thị trường."},{"t":441,"zh":"虽然一开始很难，因为我没有相关的专业背景，我被很多公司拒绝了。","py":"Suīrán yìkāishǐ hěn nán, yīnwèi wǒ méiyǒu xiāngguān de zhuānyè bèijǐng, wǒ bèi hěnduō gōngsī jùjué le.","vi":"Dù lúc đầu rất khó, vì mình không có nền tảng chuyên môn liên quan, nhiều công ty đã từ chối mình."},{"t":447,"zh":"但是我没有放弃。","py":"Dànshì wǒ méiyǒu fàngqì.","vi":"Nhưng mình không bỏ cuộc."},{"t":449,"zh":"后来终于有一家公司愿意给我机会从实习生做起。","py":"Hòulái zhōngyú yǒu yìjiā gōngsī yuànyì gěi wǒ jīhuì cóng shíxíshēng zuòqǐ.","vi":"Sau cùng cũng có một công ty chịu cho mình cơ hội, bắt đầu từ thực tập sinh."},{"t":453,"zh":"虽然工资很低，但我每天工作得特别开心。","py":"Suīrán gōngzī hěn dī, dàn wǒ měitiān gōngzuò de tèbié kāixīn.","vi":"Lương tuy rất thấp nhưng mỗi ngày mình làm việc rất vui."},{"t":457,"zh":"我发现，在市场部，我的沟通能力和写作能力终于有了用武之地。","py":"Wǒ fāxiàn, zài shìchǎngbù, wǒ de gōutōng nénglì hé xiězuònénglì zhōngyú yǒu le yòngwǔzhīdì.","vi":"Mình nhận ra ở phòng marketing, khả năng giao tiếp và viết lách của mình cuối cùng cũng có đất dụng võ."},{"t":462,"zh":"这是一个非常典型的例子。","py":"Zhè shì yí ge fēicháng diǎnxíng de lìzi.","vi":"Đây là một ví dụ rất điển hình."},{"t":465,"zh":"当你选择会计的时候，你花费了百分之两百的努力，但结果只是勉强及格，而且内心充满痛苦。","py":"Dāng nǐ xuǎnzé kuàijì de shíhou, nǐ huāfèi le bǎifēnzhī liǎngbǎi de nǔlì, dàn jiéguǒ zhǐshì miǎnqiǎng jígé, érqiě nèixīn chōngmǎn tòngkǔ.","vi":"Khi chọn kế toán, bạn bỏ ra hai trăm phần trăm nỗ lực, nhưng kết quả chỉ vừa đủ đạt, mà trong lòng đầy đau khổ."},{"t":471,"zh":"但是当你选择了适合你的市场推广工作后，你的每一次努力，都在为你真正喜欢的事业添砖加瓦。","py":"Dànshì dāng nǐ xuǎnzé le shìhé nǐ de shìchǎngtuīguǎng gōngzuò hòu, nǐ de měi yícì nǔlì, dōu zài wèi nǐ zhēnzhèng xǐhuan de shìyè tiānzhuānjiāwǎ.","vi":"Nhưng khi chọn công việc marketing hợp với mình, mỗi lần nỗ lực của bạn đều là góp gạch xây dựng sự nghiệp bạn thật sự yêu thích."},{"t":478,"zh":"这就是选择的力量。","py":"Zhè jiùshì xuǎnzé de lìliàng.","vi":"Đó chính là sức mạnh của sự lựa chọn."},{"t":480,"zh":"是的。如果我当年在填报志愿的时候，能坚定地选择自己喜欢的专业，我就不需要浪费四年的时间去学我不喜欢的东西了。","py":"Shì de. Rúguǒ wǒ dāngnián zài tiánbào zhìyuàn de shíhou, néng jiāndìng de xuǎnzé zìjǐ xǐhuan de zhuānyè, wǒ jiù bù xūyào làngfèi sìnián de shíjiān qù xué wǒ bù xǐhuan de dōngxi le.","vi":"Đúng. Nếu hồi đó khi điền nguyện vọng mình kiên định chọn ngành mình thích, thì mình đã không phải lãng phí bốn năm học thứ mình không thích."},{"t":490,"zh":"那四年，就是我人生中走过的一大段弯路。","py":"Nà sìnián, jiùshì wǒ rénshēng zhōng zǒuguò de yídà duàn wānlù.","vi":"Bốn năm đó chính là một đoạn đường vòng lớn trong đời mình."},{"t":494,"zh":"李明，那你呢？你的人生中，有没有遇到过因为做对了选择，而感觉自己很幸运的经历？","py":"Lǐmíng, nà nǐ ne? Nǐ de rénshēng zhōng, yǒuméiyǒu yùdào guò yīnwèi zuò duì le xuǎnzé, ér gǎnjué zìjǐ hěn xìngyùn de jīnglì?","vi":"Lý Minh, còn cậu thì sao? Trong đời cậu có trải nghiệm nào nhờ chọn đúng mà cảm thấy mình may mắn không?","sec":"Chọn đúng: ngân hàng hay công ty khởi nghiệp"},{"t":501,"zh":"当然有。就拿我大学毕业找工作的那段经历来说吧。","py":"Dāngrán yǒu. Jiù ná wǒ dàxuébìyè zhǎo gōngzuò de nàduàn jīnglì láishuō ba.","vi":"Đương nhiên có. Cứ lấy lúc mình mới tốt nghiệp đi tìm việc làm ví dụ đi."},{"t":505,"zh":"当时我和我的同班同学小张，面临着几乎一样的选择，但是因为我们做出了不同的决定，现在的生活完全不一样。","py":"Dāngshí wǒ hé wǒ de tóngbāntóngxué xiǎozhāng, miànlín zhe jīhū yíyàng de xuǎnzé, dànshì yīnwèi wǒmen zuòchū le bùtóng de juédìng, xiànzài de shēnghuó wánquán bù yíyàng.","vi":"Lúc đó mình và bạn cùng lớp là Tiểu Trương phải đối mặt với lựa chọn gần như giống nhau, nhưng vì chúng mình quyết định khác nhau nên cuộc sống bây giờ hoàn toàn khác."},{"t":513,"zh":"哦？你们当时面临着什么样的选择？","py":"Ò? Nǐmen dāngshí miànlín zhe shénmeyàng de xuǎnzé?","vi":"Ồ? Lúc đó các cậu đứng trước lựa chọn gì?"},{"t":515,"zh":"我们大学学的是计算机科学。","py":"Wǒmen dàxué xué de shì jìsuànjīkēxué.","vi":"Đại học chúng mình học khoa học máy tính."},{"t":517,"zh":"毕业那年，我们都拿到了两个工作机会。","py":"Bìyè nànián, wǒmen dōu nádào le liǎnggè gōngzuò jīhuì.","vi":"Năm tốt nghiệp, cả hai đều nhận được hai cơ hội việc làm."},{"t":520,"zh":"一个是去传统的国家银行做电脑维护，工作非常稳定，朝九晚五，几乎不需要加班，而且父母听起来也觉得非常有面子。","py":"Yí ge shì qù chuántǒng de guójiāyínháng zuò diànnǎo wéihù, gōngzuò fēicháng wěndìng, cháojiǔwǎnwǔ, jīhū bù xūyào jiābān, érqiě fùmǔ tīng qǐlai yě juéde fēicháng yǒu miànzi.","vi":"Một là vào ngân hàng nhà nước truyền thống làm bảo trì máy tính, công việc rất ổn định, chín giờ sáng đến năm giờ chiều, hầu như không phải tăng ca, bố mẹ nghe cũng thấy nở mày nở mặt."},{"t":529,"zh":"哇，这两个选择完全是不同的方向啊。","py":"Wa, zhè liǎnggè xuǎnzé wánquán shì bùtóng de fāngxiàng a.","vi":"Wow, hai lựa chọn này hoàn toàn là hai hướng khác nhau."},{"t":532,"zh":"银行代表着安全和稳定，创业公司代表着挑战和风险。","py":"Yínháng dàibiǎo zhe ānquán hé wěndìng, chuàngyègōngsī dàibiǎo zhe tiǎozhàn hé fēngxiǎn.","vi":"Ngân hàng đại diện cho an toàn và ổn định, công ty khởi nghiệp đại diện cho thử thách và rủi ro."},{"t":538,"zh":"你选择了哪一个？","py":"Nǐ xuǎnzé le nǎ yí ge?","vi":"Cậu chọn cái nào?"},{"t":539,"zh":"我选择了那家北京的刚刚成立不久的互联网创业公司做软件开发。","py":"Wǒ xuǎnzé le nà jiā běijīng de gānggāng chénglì bùjiǔ de hùliánwǎng chuàngyègōngsī zuò ruǎnjiànkāifā.","vi":"Mình chọn công ty khởi nghiệp internet ở Bắc Kinh mới thành lập chưa lâu để làm phát triển phần mềm."},{"t":543,"zh":"而我的同学小张，听从了家里的建议，去了银行。","py":"Ér wǒ de tóngxué xiǎozhāng, tīngcóng le jiālǐ de jiànyì, qù le yínháng.","vi":"Còn bạn mình là Tiểu Trương nghe theo lời khuyên của gia đình, vào ngân hàng."},{"t":547,"zh":"你当时为什么会选择去北京的创业公司呢？","py":"Nǐ dāngshí wèishénme huì xuǎnzé qù běijīng de chuàngyègōngsī ne?","vi":"Lúc đó tại sao cậu chọn công ty khởi nghiệp ở Bắc Kinh?"},{"t":550,"zh":"要知道，很多人为了求稳，都会选择银行的。","py":"Yào zhīdao, hěnduō rén wéile qiúwěn, dū huì xuǎnzé yínháng de.","vi":"Cậu biết đấy, nhiều người vì muốn ổn định sẽ chọn ngân hàng."},{"t":554,"zh":"我当时仔细分析了一下大环境。","py":"Wǒ dāngshí zǐxìfēnxī le yíxià dà huánjìng.","vi":"Lúc đó mình phân tích kỹ bối cảnh chung."},{"t":556,"zh":"我发现，那个时候中国的互联网行业正在飞速发展，智能手机刚刚开始普及。","py":"Wǒ fāxiàn, nàge shíhou zhōngguó de hùliánwǎng hángyè zhèngzài fēisùfāzhǎn, zhìnéngshǒujī gānggāngkāishǐ pǔjí.","vi":"Mình thấy lúc đó ngành internet Trung Quốc đang phát triển thần tốc, điện thoại thông minh mới bắt đầu phổ biến."},{"t":562,"zh":"我觉得，未来的世界一定是互联网的世界。","py":"Wǒ juéde, wèilái de shìjiè yídìng shì hùliánwǎng de shìjiè.","vi":"Mình nghĩ thế giới tương lai nhất định là thế giới của internet."},{"t":565,"zh":"虽然那家创业公司很小，工资也不高，而且我知道每天肯定要加班到很晚，但是我相信这个行业的发展方向是对的。","py":"Suīrán nà jiā chuàngyègōngsī hěnxiǎo, gōngzī yě bù gāo, érqiě wǒ zhīdao měitiān kěndìng yào jiābān dào hěn wǎn, dànshì wǒ xiāngxìn zhège hángyè de fāzhǎn fāngxiàng shì duì de.","vi":"Tuy công ty khởi nghiệp đó rất nhỏ, lương cũng không cao, mà mình biết chắc ngày nào cũng tăng ca đến khuya, nhưng mình tin hướng phát triển của ngành này là đúng."},{"t":573,"zh":"哇，你这是站在了时代的风口上啊！","py":"Wa, nǐ zhè shì zhàn zài le shídài de fēngkǒu shàng a!","vi":"Wow, cậu đã đứng đúng đầu ngọn gió của thời đại rồi!"},{"t":576,"zh":"那后来呢？你们现在的发展有什么不同？","py":"Nà hòulái ne? Nǐmen xiànzài de fāzhǎn yǒu shénme bùtóng?","vi":"Rồi sau đó thì sao? Sự phát triển của hai cậu bây giờ khác nhau thế nào?"},{"t":579,"zh":"后来，就像我预想的那样。","py":"Hòulái, jiù xiàng wǒ yùxiǎng de nàyàng.","vi":"Sau đó, đúng như mình dự đoán."},{"t":582,"zh":"那家互联网公司发展得非常快，短短几年时间就在美国上市了。","py":"Nà jiā hùliánwǎng gōngsī fāzhǎn de fēicháng kuài, duǎnduǎn jǐnián shíjiān jiù zài měiguó shàngshì le.","vi":"Công ty internet đó phát triển rất nhanh, chỉ vài năm ngắn ngủi đã niêm yết ở Mỹ."},{"t":586,"zh":"因为我加入得早，跟着公司一起成长，我的技术水平提高得特别快，后来也成为了部门的主管，收入也涨了很多倍。","py":"Yīnwèi wǒ jiārù de zǎo, gēnzhe gōngsī yìqǐ chéngzhǎng, wǒ de jìshùshuǐpíng tígāo de tèbié kuài, hòulái yě chéngwéi le bùmén de zhǔguǎn, shōurù yě zhǎng le hěnduō bèi.","vi":"Vì mình vào sớm, cùng công ty trưởng thành, trình độ kỹ thuật tiến bộ rất nhanh, sau đó cũng làm trưởng bộ phận, thu nhập tăng gấp nhiều lần."},{"t":593,"zh":"你的同学小张呢？他在银行过得怎么样？","py":"Nǐ de tóngxué xiǎozhāng ne? Tā zài yínháng guò de zěnmeyàng?","vi":"Còn bạn học Tiểu Trương của cậu thì sao? Anh ấy ở ngân hàng thế nào?"},{"t":598,"zh":"小张在银行工作得很轻松。","py":"Xiǎozhāng zài yínháng gōngzuò de hěn qīngsōng.","vi":"Tiểu Trương làm ở ngân hàng rất nhàn."},{"t":600,"zh":"前几年，他还经常跟我炫耀，说他每天五点半就下班回家打游戏了，而我还在北京的办公室里吃外卖加班。","py":"Qián jǐnián, tā hái jīngcháng gēn wǒ xuànyào, shuō tā měitiān wǔdiǎn bàn jiù xiàbān huíjiā dǎyóuxì le, ér wǒ hái zài běijīng de bàngōngshì lǐ chī wàimài jiābān.","vi":"Mấy năm đầu, anh ấy còn hay khoe với mình, bảo mỗi ngày năm giờ rưỡi đã tan làm về nhà chơi game, còn mình vẫn ở văn phòng Bắc Kinh ăn đồ giao tận nơi tăng ca."},{"t":607,"zh":"但是过了五年以后，情况就变了。","py":"Dànshì guò le wǔnián yǐhòu, qíngkuàng jiù biàn le.","vi":"Nhưng sau năm năm thì tình hình thay đổi."},{"t":611,"zh":"银行的系统更新非常慢，他这五年里用的都是最老旧的技术。","py":"Yínháng de xìtǒng gēngxīn fēicháng màn, tā zhè wǔnián lǐ yòng de dōu shì zuì lǎo jiù de jìshù.","vi":"Hệ thống ngân hàng cập nhật rất chậm, năm năm qua anh ấy dùng toàn công nghệ cũ nhất."},{"t":616,"zh":"后来，他想换一份工资更高的工作，却发现外面的互联网公司用的新技术，他完全不会了。","py":"Hòulái, tā xiǎng huàn yífèn gōngzī gèng gāo de gōngzuò, què fāxiàn wàimiàn de hùliánwǎng gōngsī yòng de xīn jìshù, tā wánquán búhuì le.","vi":"Sau đó anh ấy muốn đổi sang việc lương cao hơn, thì phát hiện các công ty internet bên ngoài dùng công nghệ mới mà anh hoàn toàn không biết."},{"t":623,"zh":"天哪，这太可惜了。","py":"Tiān nǎ, zhè tài kěxī le.","vi":"Trời ơi, tiếc quá."},{"t":625,"zh":"他虽然也有五年的工作经验，但是这些经验在现在的市场上已经没有竞争力了。","py":"Tā suīrán yě yǒu wǔnián de gōngzuò jīngyàn, dànshì zhèxiē jīngyàn zài xiànzài de shìchǎng shàng yǐjing méiyǒu jìngzhēnglì le.","vi":"Anh ấy tuy cũng có năm năm kinh nghiệm, nhưng những kinh nghiệm này trên thị trường hiện nay đã không còn sức cạnh tranh."},{"t":631,"zh":"对。小张在银行并没有不努力，他每天按时上班，认真完成领导交代的工作。","py":"Duì. Xiǎozhāng zài yínháng bìng méiyǒu bù nǔlì, tā měitiān ànshí shàngbān, rènzhēnwánchéng lǐngdǎo jiāodài de gōngzuò.","vi":"Đúng. Tiểu Trương ở ngân hàng không phải không nỗ lực, anh ấy ngày nào cũng đi làm đúng giờ, nghiêm túc hoàn thành việc cấp trên giao."},{"t":637,"zh":"但是，他选择了一个发展缓慢、几乎没有挑战的行业。","py":"Dànshì, tā xuǎnzé le yí ge fāzhǎnhuǎnmàn, jīhū méiyǒu tiǎozhàn de hángyè.","vi":"Nhưng anh ấy chọn một ngành phát triển chậm, gần như không có thử thách."},{"t":641,"zh":"这就意味着，他把自己的天花板设定得非常低。","py":"Zhè jiù yìwèizhe, tā bǎ zìjǐ de tiānhuābǎn shèdìng de fēichángdī.","vi":"Điều đó có nghĩa là anh ấy tự đặt trần của mình rất thấp."},{"t":645,"zh":"而我选择了一个快速发展的行业，在这个行业里，我的努力会被放大很多倍。","py":"Ér wǒ xuǎnzé le yí ge kuàisù fāzhǎn de hángyè, zài zhège hángyè lǐ, wǒ de nǔlì huì bèi fàngdà hěnduō bèi.","vi":"Còn mình chọn một ngành phát triển nhanh, trong ngành này nỗ lực của mình được khuếch đại nhiều lần."},{"t":651,"zh":"这就是所谓的“赛道”不同。","py":"Zhè jiùshì suǒwèi de \"sàidào\" bùtóng.","vi":"Đây chính là cái gọi là “đường đua” khác nhau."},{"t":652,"zh":"“赛道”这个词用得真好。","py":"\"sàidào\" zhège cí yòng de zhēn hǎo.","vi":"Từ “đường đua” dùng hay thật."},{"t":654,"zh":"就像跑步比赛一样，如果你选择了一条泥泞的小路，你跑得再努力也会摔倒；如果你选择了一条平坦的塑胶跑道，你的速度自然会快很多。","py":"Jiù xiàng pǎobù bǐsài yíyàng, rúguǒ nǐ xuǎnzé le yìtiáo nínìng de xiǎolù, nǐ pǎo de zài nǔlì yě huì shuāidǎo; rúguǒ nǐ xuǎnzé le yìtiáo píngtǎn de sùjiāopǎodào, nǐ de sùdù zìrán huì kuài hěnduō.","vi":"Giống như thi chạy, nếu bạn chọn con đường nhỏ lầy lội thì chạy cố gắng đến mấy cũng sẽ ngã; nếu chọn đường chạy nhựa phẳng phiu thì tốc độ tự nhiên nhanh hơn nhiều."},{"t":665,"zh":"是的。不过，听起来我们好像都在说选择很重要，但是王雨，你有没有发现一个问题？","py":"Shì de. Búguò, tīng qǐlai wǒmen hǎoxiàng dōu zài shuō xuǎnzé hěn zhòngyào, dànshì wángyǔ, nǐ yǒuméiyǒu fāxiàn yí ge wèntí?","vi":"Đúng. Có điều nghe như chúng ta đều nói chọn lựa rất quan trọng, nhưng Vương Vũ, cậu có thấy một vấn đề không?","sec":"Làm sao chọn đúng? Ba điểm cần nhớ"},{"t":672,"zh":"在我们真正面临选择的那个时刻，我们往往是不知道哪个选择才是绝对正确的。","py":"Zài wǒmen zhēnzhèng miànlín xuǎnzé de nàge shíkè, wǒmen wǎngwǎng shì bù zhīdao nǎge xuǎnzé cái shì juéduì zhèngquè de.","vi":"Vào khoảnh khắc thật sự phải lựa chọn, chúng ta thường không biết lựa chọn nào mới hoàn toàn đúng."},{"t":677,"zh":"这就是最让人痛苦的地方！","py":"Zhè jiùshì zuìràngrén tòngkǔ de dìfang!","vi":"Đó chính là chỗ khiến người ta đau khổ nhất!"},{"t":680,"zh":"就像站在十字路口，前面有四条路，但是我手里没有地图。","py":"Jiù xiàng zhàn zài shízìlùkǒu, qiánmiàn yǒu sìtiáo lù, dànshì wǒ shǒulǐ méiyǒu dìtú.","vi":"Giống như đứng ở ngã tư, phía trước có bốn con đường, mà trong tay mình không có bản đồ."},{"t":685,"zh":"我怎么知道哪条路能通向我想去的地方呢？","py":"Wǒ zěnme zhīdao nǎtiáo lù néng tōngxiàng wǒ xiǎng qù de dìfang ne?","vi":"Làm sao mình biết con đường nào dẫn đến nơi mình muốn đến?"},{"t":688,"zh":"李明，既然你觉得你的选择一直都比较理智，那你平时是怎么做决定的呢？","py":"Lǐmíng, jìrán nǐ juéde nǐ de xuǎnzé yìzhí dōu bǐjiào lǐzhì, nà nǐ píngshí shì zěnme zuò juédìng de ne?","vi":"Lý Minh, vì cậu thấy các lựa chọn của mình luôn khá lý trí, vậy bình thường cậu đưa ra quyết định thế nào?"},{"t":694,"zh":"有没有什么“独家秘方”可以分享一下？","py":"Yǒuméiyǒu shénme \"dújiāmìfāng\" kěyǐ fēnxiǎng yíxià?","vi":"Có “bí quyết riêng” nào chia sẻ không?"},{"t":697,"zh":"“独家秘方”算不上，但我确实有一个思考的习惯。","py":"\"dújiāmìfāng\" suànbúshàng, dàn wǒ quèshí yǒu yí ge sīkǎo de xíguàn.","vi":"“Bí quyết riêng” thì chưa đến mức, nhưng mình quả thật có một thói quen suy nghĩ."},{"t":701,"zh":"第一点，就像我们刚才聊到的，要做选择，首先要“了解自己”。","py":"Dìyìdiǎn, jiù xiàng wǒmen gāngcái liáodào de, yào zuò xuǎnzé, shǒuxiān yào \"liǎojiě zìjǐ\".","vi":"Điểm thứ nhất, như chúng ta vừa nói, muốn lựa chọn thì trước hết phải “hiểu bản thân”."},{"t":705,"zh":"“了解自己”？听起来很简单，但做起来很难吧。","py":"\"liǎojiě zìjǐ\"? Tīng qǐlai hěn jiǎndān, dàn zuò qǐlai hěn nán ba.","vi":"“Hiểu bản thân”? Nghe đơn giản nhưng làm thì khó nhỉ."},{"t":709,"zh":"我觉得很多人活了一辈子，都不一定真正了解自己。","py":"Wǒ juéde hěnduō rén huó le yíbèizi, dōu bù yídìng zhēnzhèng liǎojiě zìjǐ.","vi":"Mình thấy nhiều người sống cả đời cũng chưa chắc thật sự hiểu bản thân."},{"t":713,"zh":"是的，很难。但我们可以从最简单的地方开始。","py":"Shì de, hěn nán. Dàn wǒmen kěyǐ cóng zuì jiǎndān de dìfang kāishǐ.","vi":"Đúng, rất khó. Nhưng chúng ta có thể bắt đầu từ chỗ đơn giản nhất."},{"t":717,"zh":"比如，拿一张白纸，在左边写下“我擅长什么”，在右边写下“我不擅长什么”。","py":"Bǐrú, ná yìzhāngbáizhǐ, zài zuǒbiān xiěxià \"wǒ shàncháng shénme\", zài yòubiān xiěxià \"wǒ bú shàncháng shénme\".","vi":"Ví dụ, lấy một tờ giấy trắng, bên trái viết “mình giỏi gì”, bên phải viết “mình không giỏi gì”."},{"t":723,"zh":"然后在下面写上“我喜欢什么”和“我讨厌什么”。","py":"Ránhòu zài xiàmiàn xiě shàng \"wǒ xǐhuan shénme\" hé \"wǒ tǎoyàn shénme\".","vi":"Rồi bên dưới viết “mình thích gì” và “mình ghét gì”."},{"t":727,"zh":"你看，如果你当年填报志愿的时候，在一张纸上写下“讨厌数学”和“喜欢写作”，你可能就不会去选会计专业了。","py":"Nǐ kàn, rúguǒ nǐ dāngnián tiánbào zhìyuàn de shíhou, zài yìzhāng zhǐ shàng xiěxià \"tǎoyàn shùxué\" hé \"xǐhuan xiězuò\", nǐ kěnéng jiù búhuì qù xuǎn kuàijìzhuānyè le.","vi":"Cậu xem, nếu hồi đó khi điền nguyện vọng cậu viết lên giấy “ghét toán” và “thích viết lách”, có lẽ cậu đã không chọn ngành kế toán."},{"t":736,"zh":"唉，要是早几年认识你就好了。","py":"Āi, yàoshì zǎo jǐnián rènshi nǐ jiù hǎo le.","vi":"Haizz, giá mà quen cậu sớm vài năm thì hay biết mấy."},{"t":738,"zh":"我当时满脑子都是别人说哪个专业好，完全忘了问问自己到底喜欢什么。","py":"Wǒ dāngshí mǎnnǎozi dōu shì biérén shuō nǎge zhuānyè hǎo, wánquán wàng le wènwèn zìjǐ dàodǐ xǐhuan shénme.","vi":"Lúc đó đầu mình toàn là lời người ta nói ngành nào tốt, hoàn toàn quên hỏi bản thân rốt cuộc thích gì."},{"t":745,"zh":"这是不是因为我们太容易受到周围环境的影响了？","py":"Zhè shìbúshì yīnwèi wǒmen tài róngyì shòudào zhōuwéihuánjìng de yǐngxiǎng le?","vi":"Có phải vì chúng ta quá dễ bị môi trường xung quanh ảnh hưởng không?"},{"t":748,"zh":"没错，这就是我想说的第二点。","py":"Méicuò, zhè jiùshì wǒ xiǎng shuō de dìèrdiǎn.","vi":"Đúng vậy, đó chính là điểm thứ hai mình muốn nói."},{"t":750,"zh":"在做决定的时候，我们要学会把别人的意见当成参考，而不是标准。","py":"Zài zuò juédìng de shíhou, wǒmen yào xuéhuì bǎ biérén de yìjiàn dàngchéng cānkǎo, ér búshì biāozhǔn.","vi":"Khi đưa ra quyết định, ta phải học cách xem ý kiến người khác là tham khảo chứ không phải tiêu chuẩn."},{"t":755,"zh":"我们常常会听到别人说“大家都这么做”、“这条路最安全”。","py":"Wǒmen chángcháng huì tīngdào biérén shuō \"dàjiā dōu zhème zuò\", \"zhè tiáo lù zuì ānquán\".","vi":"Ta thường nghe người ta nói “mọi người đều làm vậy”, “con đường này an toàn nhất”."},{"t":760,"zh":"但是“大家”的鞋子，穿在你的脚上，不一定合适。","py":"Dànshì \"dàjiā\" de xiézi, chuān zài nǐ de jiǎo shàng, bù yídìng héshì.","vi":"Nhưng giày của “mọi người” mang vào chân bạn chưa chắc vừa."},{"t":765,"zh":"如果你是一个喜欢冒险、喜欢新鲜事物的人，强迫你去过那种每天重复的、极其稳定的生活，你会觉得像坐牢一样。","py":"Rúguǒ nǐ shì yí ge xǐhuan màoxiǎn, xǐhuan xīnxiān shìwù de rén, qiǎngpò nǐ qùguò nàzhǒng měitiān chóngfù de, jíqí wěndìng de shēnghuó, nǐ huì juéde xiàng zuòláo yíyàng.","vi":"Nếu bạn là người thích mạo hiểm, thích điều mới mẻ mà bị ép sống cuộc sống lặp lại mỗi ngày, cực kỳ ổn định, bạn sẽ thấy như ngồi tù."},{"t":774,"zh":"对，鞋子合不合脚，只有自己知道。","py":"Duì, xiézi hé bùhé jiǎo, zhǐyǒu zìjǐ zhīdao.","vi":"Đúng, giày có vừa chân hay không chỉ mình biết."},{"t":777,"zh":"别人的建议虽然是好心，但如果不符合我的性格，那就不是好建议。","py":"Biérén de jiànyì suīrán shì hǎoxīn, dàn rúguǒ bù fúhé wǒ de xìnggé, nà jiù búshì hǎo jiànyì.","vi":"Lời khuyên của người khác tuy xuất phát từ lòng tốt, nhưng nếu không hợp tính mình thì không phải lời khuyên hay."},{"t":783,"zh":"那第三点呢？","py":"Nà dìsāndiǎn ne?","vi":"Vậy điểm thứ ba là gì?","sec":"Dừng lỗ kịp thời và chi phí chìm"},{"t":784,"zh":"第三点非常关键，也就是我们要学会“及时止损”。","py":"Dìsāndiǎn fēicháng guānjiàn, yě jiùshì wǒmen yào xuéhuì \"jíshízhǐsǔn\".","vi":"Điểm thứ ba rất then chốt, đó là ta phải học “cắt lỗ kịp thời”."},{"t":788,"zh":"“及时止损”？这个词听起来有点专业。","py":"\"jíshízhǐsǔn\"? Zhège cí tīng qǐlai yǒudiǎn zhuānyè.","vi":"“Cắt lỗ kịp thời”? Từ này nghe hơi chuyên ngành."},{"t":791,"zh":"是不是经济学或者股票里的词？","py":"Shìbúshì jīngjìxué huòzhě gǔpiào lǐ de cí?","vi":"Có phải từ của kinh tế học hay chứng khoán không?"},{"t":794,"zh":"是的，这个词最初是从投资里来的。","py":"Shì de, zhège cí zuìchū shìcóng tóuzī lǐ lái de.","vi":"Đúng, từ này ban đầu xuất phát từ đầu tư."},{"t":797,"zh":"意思就是，当你发现自己做了一个错误的决定，已经造成了损失的时候，你要立刻停止，不能让损失继续扩大。","py":"Yìsi jiùshì, dāng nǐ fāxiànzìjǐ zuò le yí ge cuòwù de juédìng, yǐjing zàochéng le sǔnshī de shíhou, nǐ yào lìkè tíngzhǐ, bùnéng ràng sǔnshī jìxù kuòdà.","vi":"Nghĩa là khi bạn phát hiện mình đã đưa ra quyết định sai, đã gây ra tổn thất, bạn phải dừng ngay, không để tổn thất tiếp tục lan rộng."},{"t":806,"zh":"能举个生活中的例子吗？我觉得很多听众可能对这个概念还不太熟悉。","py":"Néng jǔ gè shēnghuó zhōng de lìzi ma? Wǒ juéde hěnduō tīngzhòng kěnéng duì zhège gàiniàn hái bútàishúxī.","vi":"Cậu cho một ví dụ đời thường được không? Mình nghĩ nhiều thính giả có thể chưa quen khái niệm này."},{"t":812,"zh":"当然。比如你去电影院看一部电影。","py":"Dāngrán. Bǐrú nǐ qù diànyǐngyuàn kàn yíbù diànyǐng.","vi":"Được chứ. Ví dụ bạn đi rạp xem một bộ phim."},{"t":815,"zh":"看了半个小时，你发现这部电影非常难看，故事无聊，演员演技也很差。","py":"Kàn le bàngè xiǎoshí, nǐ fāxiàn zhèbù diànyǐng fēicháng nánkàn, gùshì wúliáo, yǎnyuán yǎnjì yě hěn chà.","vi":"Xem được nửa tiếng, bạn thấy phim rất dở, cốt truyện chán, diễn xuất của diễn viên cũng tệ."},{"t":821,"zh":"这个时候，你是选择立刻离开电影院，去喝杯咖啡放松一下；还是选择继续坐在那里，把剩下的一大半时间浪费在这部烂片上？","py":"Zhège shíhou, nǐ shì xuǎnzé lìkè líkāi diànyǐngyuàn, qù hēbēi kāfēi fàngsōng yíxià; háishì xuǎnzé jìxù zuòzài nàlǐ, bǎ shèngxià de yídàbàn shíjiān làngfèi zài zhèbù lànpiàn shàng?","vi":"Lúc này bạn chọn rời rạp ngay, đi uống ly cà phê thư giãn; hay chọn tiếp tục ngồi đó, lãng phí hơn nửa thời gian còn lại cho bộ phim dở này?"},{"t":832,"zh":"(笑)，我必须承认，我以前经常是第二种人。","py":"(xiào), wǒ bìxū chéngrèn, wǒ yǐqián jīngcháng shì dìèrzhǒng rén.","vi":"(cười) Mình phải thừa nhận, trước đây mình thường là kiểu người thứ hai."},{"t":835,"zh":"我会觉得，我已经花钱买了电影票了，如果不把它看完，我的钱不是白花了吗？","py":"Wǒ huì juéde, wǒ yǐjing huāqiánmǎi le diànyǐngpiào le, rúguǒ bù bǎ tā kàn wán, wǒ de qián búshì báihuā le ma?","vi":"Mình sẽ nghĩ, mình đã bỏ tiền mua vé rồi, nếu không xem hết thì tiền chẳng phải tiêu phí sao?"},{"t":841,"zh":"很多人都是你这种想法。","py":"Hěnduō rén dōu shì nǐ zhèzhǒng xiǎngfǎ.","vi":"Nhiều người có suy nghĩ giống cậu."},{"t":844,"zh":"但是你想一想，买电影票的钱，无论你走不走，都已经花出去了，这是不能改变的事实。","py":"Dànshì nǐ xiǎngyìxiǎng, mǎi diànyǐngpiào de qián, wúlùn nǐ zǒu bù zǒu, dōu yǐjing huā chūqu le, zhè shì bùnéng gǎibiàn de shìshí.","vi":"Nhưng cậu nghĩ xem, tiền mua vé xem phim, dù cậu đi hay không đều đã tiêu rồi, đó là sự thật không thể thay đổi."},{"t":850,"zh":"如果你继续留下来看，你不仅浪费了钱，还浪费了你宝贵的两个小时的时间，最重要的是，你看了一部烂片，心情也变差了。","py":"Rúguǒ nǐ jìxù liúxiàlái kàn, nǐ bùjǐn làngfèi le qián, hái làngfèi le nǐ bǎoguì de liǎnggè xiǎoshí de shíjiān, zuì zhòngyào de shì, nǐ kàn le yíbù lànpiàn, xīnqíng yě biànchà le.","vi":"Nếu cậu ở lại xem tiếp, cậu không chỉ lãng phí tiền mà còn lãng phí hai tiếng quý báu, quan trọng nhất là xem phim dở, tâm trạng cũng xấu đi."},{"t":860,"zh":"所以，离开电影院，就是“及时止损”。","py":"Suǒyǐ, líkāi diànyǐngyuàn, jiùshì \"jíshízhǐsǔn\".","vi":"Vì vậy rời rạp chính là “cắt lỗ kịp thời”."},{"t":863,"zh":"我懂了！","py":"Wǒ dǒng le!","vi":"Mình hiểu rồi!"},{"t":865,"zh":"就像小佳开甜品店一样。","py":"Jiù xiàng xiǎojiā kāi tiánpǐndiàn yíyàng.","vi":"Giống như Tiểu Giai mở tiệm bánh ngọt vậy."},{"t":867,"zh":"如果她刚开业前几个月，发现社区里的老人家根本不买那些昂贵的法式甜点时，就能立刻停下来，换个地方，或者改卖便宜的中式早点，她就不会亏那么多钱了。","py":"Rúguǒ tā gāng kāiyè qián jǐgè yuè, fāxiàn shèqū lǐ de lǎorenjia gēnběn bù mǎi nàxiē ángguì de fǎshì tiándiǎn shí, jiù néng lìkè tíngxiàlái, huàn gè dìfang, huòzhě gǎi mài piányi de zhōngshì zǎodiǎn, tā jiù búhuì kuī nàme duō qián le.","vi":"Nếu mấy tháng đầu mới khai trương, khi phát hiện các cụ trong khu không hề mua bánh Pháp đắt tiền, cô ấy dừng ngay, đổi chỗ hoặc chuyển sang bán điểm tâm kiểu Trung rẻ, thì đã không lỗ nhiều như vậy."},{"t":881,"zh":"但是她没有，她直接埋头苦干了几年，结果损失了所有的积蓄和精力。","py":"Dànshì tā méiyǒu, tā zhíjiē máitóukǔgàn le jǐnián, jiéguǒ sǔnshī le suǒyǒu de jīxù hé jīnglì.","vi":"Nhưng cô ấy không làm vậy, cứ cắm đầu làm cật lực mấy năm, kết quả mất hết tiền tiết kiệm và sức lực."},{"t":887,"zh":"这也是不懂得及时止损的表现吧？","py":"Zhè yě shì bù dǒngde jíshízhǐsǔn de biǎoxiàn ba?","vi":"Đây cũng là biểu hiện của việc không biết cắt lỗ kịp thời phải không?"},{"t":890,"zh":"非常正确的理解。","py":"Fēicháng zhèngquè de lǐjiě.","vi":"Hiểu rất đúng."},{"t":891,"zh":"很多时候，我们不敢重新选择，是因为我们舍不得之前付出的努力。","py":"Hěnduō shíhou, wǒmen bùgǎn chóngxīn xuǎnzé, shìyīnwèi wǒmen shěbùde zhīqián fùchū de nǔlì.","vi":"Nhiều khi ta không dám chọn lại vì tiếc những nỗ lực đã bỏ ra trước đó."},{"t":897,"zh":"这就是心理学上说的“沉没成本”。","py":"Zhè jiùshì xīnlǐxué shàng shuō de \"chénmòchéngběn\".","vi":"Đó chính là “chi phí chìm” mà tâm lý học nói đến."},{"t":900,"zh":"但是你要知道，方向错了，停下来就是前进。","py":"Dànshì nǐ yào zhīdao, fāngxiàng cuò le, tíngxiàlái jiùshì qiánjìn.","vi":"Nhưng bạn phải biết, hướng sai rồi thì dừng lại chính là tiến lên."},{"t":904,"zh":"方向错了，停下来就是前进。","py":"Fāngxiàng cuò le, tíngxiàlái jiùshì qiánjìn.","vi":"Hướng sai rồi, dừng lại chính là tiến lên."},{"t":908,"zh":"这句话说得真好。","py":"Zhè jù huà shuō de zhēn hǎo.","vi":"Câu này nói hay thật."},{"t":910,"zh":"可是李明，放弃真的很难啊。","py":"Kěshì lǐmíng, fàngqì zhēnde hěn nán a.","vi":"Nhưng Lý Minh, từ bỏ thật sự rất khó."},{"t":913,"zh":"承认自己选错了，就像是承认自己是个失败者。","py":"Chéngrèn zìjǐ xuǎncuò le, jiù xiàngshì chéngrèn zìjǐ shì gè shībàizhě.","vi":"Thừa nhận mình chọn sai giống như thừa nhận mình là kẻ thất bại."},{"t":917,"zh":"比如很多人学习中文，一开始选了一本非常难的语法书，学了几个月，发现自己完全听不懂也不会说，每天翻开书就觉得痛苦。","py":"Bǐrú hěnduō rén xuéxí zhōngwén, yìkāishǐ xuǎn le yìběn fēicháng nán de yǔfǎ shū, xué le jǐgè yuè, fāxiànzìjǐ wánquán tīngbùdǒng yě búhuì shuō, měitiān fānkāishū jiù juéde tòngkǔ.","vi":"Ví dụ nhiều người học tiếng Trung, lúc đầu chọn một cuốn ngữ pháp rất khó, học mấy tháng thấy hoàn toàn không nghe hiểu cũng không nói được, ngày nào mở sách cũng thấy khổ sở."},{"t":928,"zh":"但是他们不想放弃，觉得放弃了，前面的几个月就白学了。","py":"Dànshì tāmen bùxiǎng fàngqì, juéde fàngqì le, qiánmiàn de jǐgè yuè jiù bái xué le.","vi":"Nhưng họ không muốn bỏ, nghĩ bỏ rồi thì mấy tháng trước học uổng công."},{"t":932,"zh":"你说得太对了！","py":"Nǐ shuō de tài duì le!","vi":"Cậu nói quá đúng!"},{"t":934,"zh":"语言学习也是一个充满选择的过程。","py":"Yǔyán xuéxí yě shì yí ge chōngmǎn xuǎnzé de guòchéng.","vi":"Học ngôn ngữ cũng là một quá trình đầy lựa chọn."},{"t":937,"zh":"我经常看到一些外国朋友学习中文，他们认为只要每天把词典抄写十遍，或者把生词背下来，中文就一定能好。","py":"Wǒ jīngcháng kàndào yìxiē wàiguó péngyou xuéxí zhōngwén, tāmen rènwéi zhǐyào měitiān bǎ cídiǎn chāoxiě shíbiàn, huòzhě bǎ shēngcí bèixiàlái, zhōngwén jiù yídìng néng hǎo.","vi":"Mình thường thấy một số bạn nước ngoài học tiếng Trung, họ cho rằng chỉ cần mỗi ngày chép từ điển mười lần hoặc học thuộc từ mới thì tiếng Trung nhất định giỏi."},{"t":946,"zh":"他们非常努力，手都写酸了。","py":"Tāmen fēicháng nǔlì, shǒu dōu xiě suān le.","vi":"Họ rất nỗ lực, viết đến mỏi cả tay."},{"t":948,"zh":"这就是只看重“努力”，而忽略了“选择”。","py":"Zhè jiùshì zhǐ kànzhòng \"nǔlì\", ér hūlüè le \"xuǎnzé\".","vi":"Đây chính là chỉ coi trọng “nỗ lực” mà bỏ qua “lựa chọn”."},{"t":952,"zh":"对，那遇到这种情况，他们应该怎么“及时止损”呢？","py":"Duì, nà yùdào zhèzhǒng qíngkuàng, tāmen yīnggāi zěnme \"jíshízhǐsǔn\" ne?","vi":"Đúng, vậy gặp tình huống này họ nên “cắt lỗ kịp thời” thế nào?"},{"t":956,"zh":"如果一本教材或者一种学习方法让你感到极其痛苦，而且没有任何进步，这时候你就应该停下来。","py":"Rúguǒ yìběn jiàocái huòzhě yìzhǒng xuéxí fāngfǎ ràng nǐ gǎndào jíqí tòngkǔ, érqiě méiyǒu rènhé jìnbù, zhè shíhou nǐ jiù yīnggāi tíngxiàlái.","vi":"Nếu một cuốn giáo trình hay một phương pháp học khiến bạn cực kỳ đau khổ mà không tiến bộ chút nào, lúc này bạn nên dừng lại."},{"t":964,"zh":"告诉自己，这不是我的错，而是这个方法不适合我。","py":"Gàosù zìjǐ, zhè búshì wǒ de cuò, érshì zhège fāngfǎ bú shìhé wǒ.","vi":"Hãy tự nhủ, đây không phải lỗi của mình mà là phương pháp này không hợp với mình."},{"t":969,"zh":"这时候，你可以重新做选择。","py":"Zhè shíhou, nǐ kěyǐ chóngxīn zuò xuǎnzé.","vi":"Lúc này bạn có thể chọn lại."},{"t":971,"zh":"比如，你可以选择每天听听像我们《每天中文》这样轻松的播客，在自然的对话中学习。","py":"Bǐrú, nǐ kěyǐ xuǎnzé měitiān tīngting xiàng wǒmen \"měitiān zhōngwén\" zhèyàng qīngsōng de bōkè, zài zìrán de duìhuà zhōng xuéxí.","vi":"Ví dụ, bạn có thể chọn mỗi ngày nghe podcast nhẹ nhàng như “Tiếng Trung mỗi ngày” của chúng mình, học trong hội thoại tự nhiên."},{"t":978,"zh":"或者去找一个语言伙伴聊天。","py":"Huòzhě qù zhǎo yí ge yǔyán huǒbàn liáotiān.","vi":"Hoặc đi tìm một bạn học ngôn ngữ để trò chuyện."},{"t":980,"zh":"选择一种你真正感兴趣、能坚持下去的方法。","py":"Xuǎnzé yìzhǒng nǐ zhēnzhèng gǎnxìngqù, néng jiānchíxiàqù de fāngfǎ.","vi":"Chọn một phương pháp bạn thật sự hứng thú và có thể kiên trì."},{"t":984,"zh":"当你选择了对的方法，你的努力就会事半功倍。","py":"Dāng nǐ xuǎnzé le duì de fāngfǎ, nǐ de nǔlì jiù huì shìbàngōngbèi.","vi":"Khi bạn chọn đúng phương pháp, nỗ lực sẽ đạt hiệu quả gấp bội."},{"t":989,"zh":"哇，把做决定的道理用在学中文上，真的太贴切了！","py":"Wa, bǎ zuò juédìng de dàolǐ yòng zài xué zhōngwén shàng, zhēnde tài tiēqiè le!","vi":"Wow, đem đạo lý đưa ra quyết định áp dụng vào học tiếng Trung thật quá sát!"},{"t":993,"zh":"所以说，如果我们发现现在的学习方法不对，不要自责，也不要死磕到底，换一种方法，也许就会打开新世界的大门。","py":"Suǒyǐ shuō, rúguǒ wǒmen fāxiàn xiànzài de xuéxí fāngfǎ bú duì, búyào zìzé, yě búyào sǐ kē dàodǐ, huàn yìzhǒng fāngfǎ, yěxǔ jiù huì dǎkāi xīnshìjiè de dàmén.","vi":"Vì vậy nếu thấy phương pháp học hiện tại không đúng, đừng tự trách cũng đừng cố chấp đến cùng, đổi cách khác có thể sẽ mở ra cánh cửa thế giới mới."},{"t":1003,"zh":"没错。其实人生就是一个不断试错的过程。","py":"Méicuò. Qíshí rénshēng jiùshì yí ge búduàn shìcuò de guòchéng.","vi":"Đúng vậy. Thật ra đời người là một quá trình không ngừng thử và sai.","sec":"Bước nhỏ chạy nhanh"},{"t":1007,"zh":"如果害怕选错而不去选择，那你就永远只能停留在原地。","py":"Rúguǒ hàipà xuǎncuò ér bú qù xuǎnzé, nà nǐ jiù yǒngyuǎn zhǐnéng tíngliú zài yuándì.","vi":"Nếu sợ chọn sai mà không chọn, bạn sẽ mãi chỉ dừng tại chỗ."},{"t":1012,"zh":"我们可以用“小步快跑”的方式来降低试错的成本。","py":"Wǒmen kěyǐ yòng \"xiǎobùkuàipǎo\" de fāngshì lái jiàngdī shìcuò de chéngběn.","vi":"Chúng ta có thể dùng cách “bước nhỏ chạy nhanh” để giảm chi phí thử sai."},{"t":1016,"zh":"“小步快跑”？这个概念又是什么？今天真是学到了好多新词。","py":"\"xiǎobùkuàipǎo\"? Zhège gàiniàn yòu shì shénme? Jīntiān zhēnshì xuédào le hǎoduō xīncí.","vi":"“Bước nhỏ chạy nhanh”? Khái niệm này lại là gì? Hôm nay thật sự học được nhiều từ mới."},{"t":1022,"zh":"意思就是，在做一个巨大的决定之前，先用最小的成本去试一试。","py":"Yìsi jiùshì, zài zuò yí ge jùdà de juédìng zhīqián, xiān yòng zuìxiǎo de chéngběn qù shìyíshì.","vi":"Nghĩa là trước khi đưa ra một quyết định lớn, hãy thử trước với chi phí nhỏ nhất."},{"t":1027,"zh":"比如，你不想做现在的市场调查工作了，你想开一家咖啡店。","py":"Bǐrú, nǐ bùxiǎng zuò xiànzài de shìchǎng diàochá gōngzuò le, nǐ xiǎngkāi yìjiā kāfēidiàn.","vi":"Ví dụ, bạn không muốn làm công việc khảo sát thị trường hiện tại nữa, bạn muốn mở quán cà phê."},{"t":1032,"zh":"你不需要马上辞职，把所有的存款都拿去租店面、买咖啡机。","py":"Nǐ bù xūyào mǎshàng cízhí, bǎ suǒyǒu de cúnkuǎn dōu ná qù zū diànmiàn, mǎi kāfēijī.","vi":"Bạn không cần nghỉ việc ngay, đem hết tiền tiết kiệm đi thuê mặt bằng, mua máy pha cà phê."},{"t":1035,"zh":"对啊，如果咖啡店没有客人，那我不就破产了吗？这风险太大了。","py":"Duì a, rúguǒ kāfēidiàn méiyǒu kèrén, nà wǒ bú jiù pòchǎn le ma? Zhè fēngxiǎn tài dà le.","vi":"Đúng vậy, nếu quán cà phê không có khách, chẳng phải mình phá sản sao? Rủi ro lớn quá."},{"t":1042,"zh":"所以你可以“小步快跑”。","py":"Suǒyǐ nǐ kěyǐ \"xiǎobùkuàipǎo\".","vi":"Vì vậy bạn có thể “bước nhỏ chạy nhanh”."},{"t":1044,"zh":"你可以先利用周末的时间，去一家咖啡店打工，看看自己是不是真的喜欢做咖啡，是不是能忍受长时间站立和打扫卫生。","py":"Nǐ kěyǐ xiān lìyòng zhōumò de shíjiān, qù yìjiā kāfēidiàn dǎgōng, kànkan zìjǐ shìbúshì zhēnde xǐhuan zuò kāfēi, shìbúshì néng rěnshòu zhǎngshíjiān zhànlì hé dǎsǎowèishēng.","vi":"Bạn có thể trước tiên tận dụng cuối tuần đi làm thêm ở một quán cà phê, xem mình có thật sự thích pha cà phê không, có chịu được đứng lâu và dọn vệ sinh không."},{"t":1054,"zh":"或者，你可以先在家里做一些咖啡和甜点，在朋友圈里卖给朋友们试试看。","py":"Huòzhě, nǐ kěyǐ xiān zài jiālǐ zuò yìxiē kāfēi hé tiándiǎn, zài péngyouquān lǐ mài gěi péngyou men shìshìkàn.","vi":"Hoặc bạn có thể trước tiên làm ít cà phê và bánh ngọt ở nhà, đăng lên vòng bạn bè bán thử cho bạn bè."},{"t":1060,"zh":"如果大家都觉得好，你再去考虑开店。","py":"Rúguǒ dàjiā dōu juéde hǎo, nǐ zài qù kǎolǜ kāidiàn.","vi":"Nếu mọi người đều thấy ngon, lúc đó bạn hãy cân nhắc mở tiệm."},{"t":1063,"zh":"这样，你的损失也非常小。","py":"Zhèyàng, nǐ de sǔnshī yě fēicháng xiǎo.","vi":"Như vậy tổn thất của bạn cũng rất nhỏ."},{"t":1068,"zh":"这就是聪明的选择方式。","py":"Zhè jiùshì cōngming de xuǎnzé fāngshì.","vi":"Đây chính là cách chọn lựa thông minh."},{"t":1070,"zh":"如果小佳当年开店前，能先在朋友圈卖几个月甜点测试一下，或者先租个小摊位试试，可能就不会有今天的遗憾了。","py":"Rúguǒ xiǎojiā dāngnián kāidiàn qián, néng xiān zài péngyouquān mài jǐgè yuè tiándiǎn cèshì yíxià, huòzhě xiān zū gè xiǎo tānwèi shìshi, kěnéng jiù búhuì yǒu jīntiān de yíhàn le.","vi":"Nếu hồi đó trước khi mở tiệm, Tiểu Giai bán thử bánh ngọt trên vòng bạn bè vài tháng, hoặc thuê quầy nhỏ thử trước, có lẽ đã không có nuối tiếc hôm nay."},{"t":1079,"zh":"哇，这个方法太棒了！","py":"Wa, zhège fāngfǎ tàibàngle!","vi":"Wow, cách này tuyệt quá!"},{"t":1081,"zh":"先用小成本去测试一下，收集一些反馈，然后再决定要不要投入所有的精力和金钱。","py":"Xiān yòng xiǎo chéngběn qù cèshì yíxià, shōují yìxiē fǎnkuì, ránhòu zài juédìng yào búyào tóurù suǒyǒu de jīnglì hé jīnqián.","vi":"Thử trước với chi phí nhỏ, thu thập phản hồi, rồi mới quyết định có đầu tư toàn bộ sức lực và tiền bạc hay không."},{"t":1089,"zh":"如果当年我上大学之前，能去会计事务所实习哪怕一个星期，我绝对不会选会计专业！","py":"Rúguǒ dāngnián wǒ shàng dàxué zhīqián, néng qù kuàijì shìwùsuǒ shíxí nǎpà yí ge xīngqī, wǒ juéduì búhuì xuǎn kuàijìzhuānyè!","vi":"Nếu hồi đó trước khi vào đại học mình được thực tập ở văn phòng kế toán dù chỉ một tuần, mình tuyệt đối không chọn ngành kế toán!"},{"t":1097,"zh":"(笑)，是啊。","py":"(xiào), shì a.","vi":"(cười) Đúng vậy."},{"t":1098,"zh":"很多时候我们对某件事情的向往，只是我们自己想象出来的。","py":"Hěnduō shíhou wǒmen duì mǒujiàn shìqing de xiàngwǎng, zhǐshì wǒmen zìjǐ xiǎngxiàng chūlái de.","vi":"Nhiều khi sự khao khát của ta với một việc nào đó chỉ là do ta tự tưởng tượng ra."},{"t":1102,"zh":"只有亲自去体验一下，才能做出最符合现实的选择。","py":"Zhǐyǒu qīnzì qù tǐyàn yíxià, cáinéng zuòchū zuì fúhé xiànshí de xuǎnzé.","vi":"Chỉ có tự mình trải nghiệm mới đưa ra được lựa chọn sát thực tế nhất."},{"t":1107,"zh":"所以，总结一下我们今天聊的内容，王雨，如果你以后要在工作中负责一个新的项目，或者要做一个重要决定，你会怎么做？","py":"Suǒyǐ, zǒngjié yíxià wǒmen jīntiān liáo de nèiróng, wángyǔ, rúguǒ nǐ yǐhòu yào zài gōngzuò zhōng fùzé yí ge xīn de xiàngmù, huòzhě yào zuò yí ge zhòngyào juédìng, nǐ huì zěnme zuò?","vi":"Vậy tổng kết nội dung hôm nay, Vương Vũ, nếu sau này trong công việc cậu phụ trách một dự án mới hoặc phải đưa ra quyết định quan trọng, cậu sẽ làm thế nào?","sec":"Tổng kết và từ vựng chính"},{"t":1116,"zh":"还会盲目地马上开始熬夜加班吗？","py":"Hái huì mángmù de mǎshàng kāishǐ áoyè jiābān ma?","vi":"Còn mù quáng bắt đầu thức đêm tăng ca ngay không?"},{"t":1119,"zh":"绝对不会了！","py":"Juéduì búhuì le!","vi":"Tuyệt đối không nữa!"},{"t":1121,"zh":"我一定会先花时间把目标和核心需求一项一项地确认清楚。","py":"Wǒ yídìng huì xiān huā shíjiān bǎ mùbiāo hé héxīn xūqiú yíxiàng yíxiàng de quèrèn qīngchǔ.","vi":"Mình nhất định sẽ dành thời gian xác nhận rõ từng mục tiêu và nhu cầu cốt lõi trước."},{"t":1126,"zh":"我要确保我的“方向盘”是完全正确的。","py":"Wǒ yào quèbǎo wǒ de \"fāngxiàngpán\" shì wánquánzhèngquè de.","vi":"Mình phải đảm bảo “vô lăng” của mình hoàn toàn đúng."},{"t":1129,"zh":"等方向确认好了，我再去启动我的“发动机”，全力以赴地去完成它！","py":"Děng fāngxiàng quèrèn hǎo le, wǒ zài qù qǐdòng wǒ de \"fādòngjī\", quánlìyǐfù de qù wánchéng tā!","vi":"Đợi hướng xác định xong, mình mới khởi động “động cơ”, dốc toàn lực hoàn thành nó!"},{"t":1135,"zh":"太好了，看到你这么有信心，我真为你高兴。","py":"Tàihǎole, kàndào nǐ zhème yǒu xìnxīn, wǒ zhēn wèi nǐ gāoxìng.","vi":"Tuyệt quá, thấy cậu tự tin như vậy mình thật mừng cho cậu."},{"t":1138,"zh":"我相信只要选对了方向，以你的能力，一定能把事情做得非常漂亮。","py":"Wǒ xiāngxìn zhǐyào xuǎn duì le fāngxiàng, yǐ nǐ de nénglì, yídìng néng bǎ shìqing zuò de fēicháng piàoliàng.","vi":"Mình tin chỉ cần chọn đúng hướng, với năng lực của cậu, nhất định làm việc rất tốt."},{"t":1144,"zh":"谢谢你李明！","py":"Xièxie nǐ lǐmíng!","vi":"Cảm ơn cậu Lý Minh!"},{"t":1145,"zh":"今天跟你聊完，我觉得心里轻松多了，也能更好地去安慰小佳了。","py":"Jīntiān gēn nǐ liáo wán, wǒ juéde xīnlǐ qīngsōng duō le, yě néng gènghǎo de qù ānwèi xiǎojiā le.","vi":"Hôm nay nói chuyện xong với cậu, mình thấy nhẹ lòng hơn nhiều, cũng có thể an ủi Tiểu Giai tốt hơn."},{"t":1151,"zh":"我以前也总是用“我很努力”来感动自己，用战术上的勤奋，掩盖了战略上的懒惰。","py":"Wǒ yǐqián yě zǒngshì yòng \"wǒ hěn nǔlì\" lái gǎndòng zìjǐ, yòng zhànshù shàng de qínfèn, yǎngài le zhànlüè shàng de lǎnduò.","vi":"Trước đây mình cũng luôn dùng câu “mình rất nỗ lực” để tự cảm động, dùng sự chăm chỉ về chiến thuật để che đậy sự lười biếng về chiến lược."},{"t":1158,"zh":"战术上的勤奋，掩盖战略上的懒惰。","py":"Zhànshù shàng de qínfèn, yǎngài zhànlüè shàng de lǎnduò.","vi":"Chăm chỉ về chiến thuật che đậy lười biếng về chiến lược."},{"t":1162,"zh":"这句话总结得非常精辟。","py":"Zhè jù huà zǒngjié de fēicháng jīngpì.","vi":"Câu này tổng kết rất sâu sắc."},{"t":1164,"zh":"努力当然很重要，它是我们成功的基石，没有人可以不努力就获得成功。","py":"Nǔlì dāngrán hěn zhòngyào, tā shì wǒmen chénggōng de jīshí, méiyǒu rén kěyǐ bù nǔlì jiù huòdéchénggōng.","vi":"Nỗ lực dĩ nhiên rất quan trọng, nó là nền tảng thành công của chúng ta, không ai không nỗ lực mà thành công."},{"t":1170,"zh":"但是，在努力之前，请先停下来，花一点时间去思考，去观察，去选择。","py":"Dànshì, zài nǔlì zhīqián, qǐng xiān tíngxiàlái, huā yìdiǎn shíjiān qù sīkǎo, qù guānchá, qù xuǎnzé.","vi":"Nhưng trước khi nỗ lực, hãy dừng lại trước, dành chút thời gian suy nghĩ, quan sát và lựa chọn."},{"t":1177,"zh":"是的。如果方向错了，停下来就是前进。","py":"Shì de. Rúguǒ fāngxiàng cuò le, tíngxiàlái jiùshì qiánjìn.","vi":"Đúng. Nếu hướng sai, dừng lại chính là tiến lên."},{"t":1181,"zh":"好啦，那我们今天的聊天也差不多了。","py":"Hǎo la, nà wǒmen jīntiān de liáotiān yě chàbuduō le.","vi":"Được rồi, buổi trò chuyện hôm nay của chúng ta cũng gần xong rồi."},{"t":1183,"zh":"今天我们聊了很多关于选择和努力的话题，也提到了几个非常核心的词汇。","py":"Jīntiān wǒmen liáo le hěnduō guānyú xuǎnzé hé nǔlì de huàtí, yě tídào le jǐgè fēicháng héxīn de cíhuì.","vi":"Hôm nay chúng ta nói nhiều về chủ đề chọn lựa và nỗ lực, cũng nhắc đến vài từ vựng rất cốt lõi."},{"t":1189,"zh":"不知道大家有没有记住呢？","py":"Bù zhīdao dàjiā yǒuméiyǒu jìzhù ne?","vi":"Không biết mọi người có nhớ không nhỉ?"},{"t":1190,"zh":"首先是“方向”，方向不对，努力白费。其次是“选择”，做出适合自己的决定。","py":"Shǒuxiān shì \"fāngxiàng\", fāngxiàng bú duì, nǔlì báifèi. Qícì shì \"xuǎnzé\", zuòchū shìhé zìjǐ de juédìng.","vi":"Trước hết là “phương hướng”, hướng không đúng thì nỗ lực uổng công. Tiếp theo là “lựa chọn”, đưa ra quyết định phù hợp với mình."},{"t":1197,"zh":"最后还有一个很重要的概念，就是“及时止损”，发现错了，立刻停下来。","py":"Zuìhòu háiyǒu yí ge hěn zhòngyào de gàiniàn, jiùshì \"jíshízhǐsǔn\", fāxiàn cuò le, lìkè tíngxiàlái.","vi":"Cuối cùng còn một khái niệm rất quan trọng là “cắt lỗ kịp thời”, phát hiện sai thì dừng ngay."},{"t":1203,"zh":"这些词汇大家在生活中一定会经常用到。","py":"Zhèxiē cíhuì dàjiā zàishēnghuózhōng yídìng huì jīngcháng yòngdào.","vi":"Những từ này mọi người chắc chắn sẽ thường dùng trong cuộc sống."},{"t":1206,"zh":"其实，每个人每天都在面临大大小小的选择。","py":"Qíshí, měigè rén měitiān dōu zài miànlín dàdàxiǎoxiǎo de xuǎnzé.","vi":"Thật ra mỗi người mỗi ngày đều đối mặt với những lựa chọn lớn nhỏ."},{"t":1210,"zh":"小到今天中午吃什么，大到选择什么样的职业，或者选择跟什么样的人共度一生。","py":"Xiǎo dào jīntiān zhōngwǔ chī shénme, dà dào xuǎnzé shénmeyàng de zhíyè, huòzhě xuǎnzé gēn shénmeyàng de rén gòngdù yìshēng.","vi":"Nhỏ như trưa nay ăn gì, lớn như chọn nghề nghiệp nào, hoặc chọn sống cả đời với người như thế nào."},{"t":1217,"zh":"那么，听到这里的听众朋友们，你最近有没有面临什么让你感到纠结、难以做决定的选择呢？","py":"Nàme, tīngdào zhèlǐ de tīngzhòng péngyou men, nǐ zuìjìn yǒuméiyǒu miànlín shénme ràng nǐ gǎndào jiūjié, nányǐ zuò juédìng de xuǎnzé ne?","vi":"Vậy các bạn thính giả nghe đến đây, gần đây bạn có đối mặt lựa chọn nào khiến bạn phân vân, khó quyết định không?"},{"t":1225,"zh":"或者，你曾经做过什么改变了你一生的重要选择？","py":"Huòzhě, nǐ céngjīng zuò guo shénme gǎibiàn le nǐ yìshēng de zhòngyào xuǎnzé?","vi":"Hoặc bạn từng đưa ra lựa chọn quan trọng nào thay đổi cả cuộc đời mình?"},{"t":1230,"zh":"欢迎大家在评论区留言和我们分享。","py":"Huānyíng dàjiā zài pínglùnqū liúyán hé wǒmen fēnxiǎng.","vi":"Mời mọi người để lại bình luận chia sẻ với chúng mình."},{"t":1233,"zh":"非常期待看到大家的故事。","py":"Fēicháng qīdài kàndào dàjiā de gùshì.","vi":"Rất mong được đọc câu chuyện của mọi người."},{"t":1235,"zh":"无论你现在处于人生的哪一个阶段，希望我们今天的对话，能给你带来一点点启发。","py":"Wúlùn nǐ xiànzài chǔyú rénshēng de nǎ yí ge jiēduàn, xīwàng wǒmen jīntiān de duìhuà, néng gěi nǐ dàilái yìdiǎndiǎn qǐfā.","vi":"Dù hiện giờ bạn đang ở giai đoạn nào của cuộc đời, mong cuộc trò chuyện hôm nay mang lại cho bạn chút gợi ý."},{"t":1241,"zh":"祝大家都能在人生的十字路口，做出最适合自己的选择。","py":"Zhù dàjiā dōu néng zài rénshēng de shízìlùkǒu, zuòchū zuì shìhé zìjǐ de xuǎnzé.","vi":"Chúc mọi người ở ngã tư cuộc đời đều đưa ra được lựa chọn phù hợp nhất với mình."},{"t":1245,"zh":"感谢大家今天的陪伴。","py":"Gǎnxiè dàjiā jīntiān de péibàn.","vi":"Cảm ơn sự đồng hành của mọi người hôm nay."},{"t":1247,"zh":"如果觉得我们的播客对你有帮助，不要忘了点赞和订阅哦。","py":"Rúguǒ juéde wǒmen de bōkè duì nǐ yǒu bāngzhù, búyào wàng le diǎn zàn hé dìngyuè ò.","vi":"Nếu thấy podcast của chúng mình có ích với bạn, đừng quên nhấn thích và đăng ký nhé."},{"t":1252,"zh":"我们下期节目再见啦！","py":"Wǒmen xiàqī jiémù zàijiàn la!","vi":"Hẹn gặp lại trong tập sau nhé!"},{"t":1253,"zh":"下期见，拜拜！","py":"Xiàqī jiàn, bàibài!","vi":"Hẹn tập sau, tạm biệt!"}]},
{id:"l3",zh:"怎样才算一个好领导",vi:"Thế nào là một người lãnh đạo tốt",level:"HSK 4–5",audio:"episode3.mp3",
hl:{"v":[["合格","hégé","đạt tiêu chuẩn"],["领导","lǐngdǎo","lãnh đạo"],["团队","tuánduì","đội nhóm"],["责任心","zérènxīn","tinh thần trách nhiệm"],["承担","chéngdān","đảm nhận, gánh vác"],["信任","xìnrèn","tin tưởng"],["员工","yuángōng","nhân viên"],["空间","kōngjiān","không gian"],["发挥","fāhuī","phát huy"],["长远","chángyuǎn","lâu dài"],["眼光","yǎnguāng","tầm nhìn"],["关注","guānzhù","quan tâm, chú ý"],["优点","yōudiǎn","ưu điểm"],["不足","bùzú","thiếu sót"],["成绩","chéngjì","thành tích"],["分享","fēnxiǎng","chia sẻ"],["位置","wèizhì","vị trí"],["未来","wèilái","tương lai"],["发展","fāzhǎn","phát triển"]],"g":[{"t":"不只是…更…","re":"不只是.{1,12}更","k":["不只是","更"],"vi":"không chỉ là… mà quan trọng hơn là…","n":"Nêu ý phụ rồi nhấn mạnh ý chính."},{"t":"不是…而是…","re":"不是.{1,14}而是","k":["不是","而是"],"vi":"không phải… mà là…","n":"Phủ định vế trước, khẳng định vế sau."},{"t":"而不是…","re":"而不是","k":["而不是"],"vi":"chứ không phải…","n":"Dùng sau ý chính để loại trừ lựa chọn khác."},{"t":"把…","re":"把[^，。？！]{1,14}","k":["把"],"vi":"đưa đối tượng lên trước động từ","n":"Câu chữ 把: 把合适的人安排在合适的位置."},{"t":"首先 / 其次 / 另外","re":"^(首先|其次|另外)","k":[],"vi":"trước hết / thứ đến / ngoài ra","n":"Từ nối để liệt kê ý theo thứ tự."},{"t":"应该…","re":"应该","k":["应该"],"vi":"nên, cần phải","n":"Nêu việc cần làm theo lẽ thường."},{"t":"遇到…时","re":"遇到.{1,8}时","k":["遇到","时"],"vi":"khi gặp…","n":"Nêu hoàn cảnh xảy ra."},{"t":"要懂得…","re":"要懂得","k":["要懂得"],"vi":"phải biết…","n":"Nhấn mạnh năng lực hoặc thái độ cần có."}]},
raw:[["首先，领导要有责任心。", "首先|shǒuxiān,领导|lǐngdǎo,要|yào,有|yǒu,责任心|zérènxīn", ""], ["其次，领导要懂得用人。", "其次|qícì,领导|lǐngdǎo,要|yào,懂得|dǒngde,用|yòng,人|rén", ""], ["领导还要有长远的眼光。", "领导|lǐngdǎo,还|hái,要|yào,有|yǒu,长远|chángyuǎn,的|de,眼光|yǎnguāng", ""], ["这样才能得到团队的信任。", "这样|zhèyàng,才能|cáinéng,得到|dédào,团队|tuánduì,的|de,信任|xìnrèn", ""], ["领导应该了解员工的特点。", "领导|lǐngdǎo,应该|yīnggāi,了解|liǎojiě,员工|yuángōng,的|de,特点|tèdiǎn", ""], ["不能只关注眼前的工作结果。", "不能|bùnéng,只|zhǐ,关注|guānzhù,眼前|yǎnqián,的|de,工作|gōngzuò,结果|jiéguǒ", ""], ["每个人都有自己的优点和不足。", "每个|měigè,人|rén,都|dōu,有|yǒu,自己|zìjǐ,的|de,优点|yōudiǎn,和|hé,不足|bùzú", ""], ["好的领导不是让员工害怕自己。", "好|hǎo,的|de,领导|lǐngdǎo,不是|búshì,让|ràng,员工|yuángōng,害怕|hàipà,自己|zìjǐ", ""], ["把合适的人安排在合适的位置上。", "把|bǎ,合适|héshì,的|de,人|rén,安排|ānpái,在|zài,合适|héshì,的|de,位置|wèizhì,上|shàng", ""], ["遇到问题时，也应该主动承担责任。", "遇到|yùdào,问题|wèntí,时|shí,也|yě,应该|yīnggāi,主动|zhǔdòng,承担|chéngdān,责任|zérèn", ""], ["一个合格的领导不只是会安排工作。", "一个|yí ge,合格|hégé,的|de,领导|lǐngdǎo,不|bù,只是|zhǐshì,会|huì,安排|ānpái,工作|gōngzuò", ""], ["团队取得成绩时，要懂得和大家分享。", "团队|tuánduì,取得|qǔdé,成绩|chéngjì,时|shí,要|yào,懂得|dǒngde,和|hé,大家|dàjiā,分享|fēnxiǎng", ""], ["也要考虑员工的成长和团队未来的发展。", "也|yě,要|yào,考虑|kǎolǜ,员工|yuángōng,的|de,成长|chéngzhǎng,和|hé,团队|tuánduì,未来|wèilái,的|de,发展|fāzhǎn", ""], ["同时给他们一定的空间去发挥自己的能力。", "同时|tóngshí,给|gěi,他们|tāmen,一定|yídìng,的|de,空间|kōngjiān,去|qù,发挥|fāhuī,自己|zìjǐ,的|de,能力|nénglì", ""]],
vis:["Trước hết, người lãnh đạo cần có tinh thần trách nhiệm.", "Thứ hai, người lãnh đạo cần biết cách dùng người.", "Lãnh đạo còn cần có tầm nhìn dài hạn.", "Như vậy mới nhận được sự tin tưởng của cả đội.", "Lãnh đạo nên hiểu đặc điểm của từng nhân viên.", "Không thể chỉ quan tâm đến kết quả công việc trước mắt.", "Mọi người đều có ưu điểm và khuyết điểm riêng.", "Người lãnh đạo tốt không phải là khiến nhân viên sợ mình.", "Sắp xếp đúng người vào đúng vị trí.", "Khi gặp vấn đề, cũng nên chủ động nhận trách nhiệm.", "Một người lãnh đạo đạt yêu cầu không chỉ biết sắp xếp công việc.", "Khi tập thể đạt được thành tích, cần biết chia sẻ với mọi người.", "Cũng phải nghĩ đến sự trưởng thành của nhân viên và sự phát triển tương lai của tập thể.", "Đồng thời cho họ không gian nhất định để phát huy năng lực của mình."],

lines:[{"t": 0.0, "zh": "我认为，一个合格的领导不只是会安排工作，更重要的是能够带领团队一起成长。", "py": "Wǒ rènwéi, yí ge hégé de lǐngdǎo bù zhǐshì huì ānpái gōngzuò, gèng zhòngyào de shì nénggòu dàilǐng tuánduì yìqǐ chéngzhǎng.", "vi": "Theo mình, một người lãnh đạo đạt yêu cầu không chỉ biết sắp xếp công việc mà quan trọng hơn là có thể dẫn dắt cả đội cùng phát triển.", "sec": "Người lãnh đạo tốt"}, {"t": 7.0, "zh": "首先，领导要有责任心。", "py": "Shǒuxiān, lǐngdǎo yào yǒu zérènxīn.", "vi": "Trước hết, người lãnh đạo cần có tinh thần trách nhiệm.", "sec": "Trước hết: tinh thần trách nhiệm"}, {"t": 9.3, "zh": "团队取得成绩时，要懂得和大家分享；", "py": "Tuánduì qǔdé chéngjì shí, yào dǒngde hé dàjiā fēnxiǎng;", "vi": "Khi tập thể đạt được thành tích, cần biết chia sẻ với mọi người;"}, {"t": 12.9, "zh": "遇到问题时，也应该主动承担责任，而不是把责任推给员工，这样才能得到团队的信任。", "py": "Yùdào wèntí shí, yě yīnggāi zhǔdòng chéngdān zérèn, ér búshì bǎ zérèn tuī gěi yuángōng, zhèyàng cáinéng dédào tuánduì de xìnrèn.", "vi": "khi gặp vấn đề, cũng nên chủ động nhận trách nhiệm thay vì đổ lỗi cho nhân viên, như vậy mới nhận được sự tin tưởng của cả đội."}, {"t": 21.0, "zh": "其次，领导要懂得用人。", "py": "Qícì, lǐngdǎo yào dǒngde yòng rén.", "vi": "Thứ hai, người lãnh đạo cần biết cách dùng người.", "sec": "Thứ hai: biết dùng người"}, {"t": 23.5, "zh": "每个人都有自己的优点和不足，", "py": "Měigè rén dōu yǒu zìjǐ de yōudiǎn hé bùzú,", "vi": "Mọi người đều có ưu điểm và khuyết điểm riêng,"}, {"t": 26.6, "zh": "领导应该了解员工的特点，把合适的人安排在合适的位置上，", "py": "Lǐngdǎo yīnggāi liǎojiě yuángōng de tèdiǎn, bǎ héshì de rén ānpái zài héshì de wèizhì shàng,", "vi": "lãnh đạo nên hiểu đặc điểm của từng nhân viên, sắp xếp đúng người vào đúng vị trí,"}, {"t": 32.7, "zh": "同时给他们一定的空间去发挥自己的能力。", "py": "Tóngshí gěi tāmen yídìng de kōngjiān qù fāhuī zìjǐ de nénglì.", "vi": "đồng thời cho họ không gian nhất định để phát huy năng lực của mình."}, {"t": 37.0, "zh": "另外，我觉得领导还要有长远的眼光，", "py": "Lìngwài, wǒ juéde lǐngdǎo hái yào yǒu chángyuǎn de yǎnguāng,", "vi": "Ngoài ra, tôi cho rằng lãnh đạo còn cần có tầm nhìn dài hạn,", "sec": "Thêm nữa: tầm nhìn dài hạn"}, {"t": 40.9, "zh": "不能只关注眼前的工作结果，", "py": "Bùnéng zhǐ guānzhù yǎnqián de gōngzuò jiéguǒ,", "vi": "không chỉ quan tâm đến kết quả công việc trước mắt,"}, {"t": 43.9, "zh": "也要考虑员工的成长和团队未来的发展。", "py": "Yě yào kǎolǜ yuángōng de chéngzhǎng hé tuánduì wèilái de fāzhǎn.", "vi": "mà còn phải nghĩ đến sự trưởng thành của nhân viên và sự phát triển tương lai của tập thể."}, {"t": 48.0, "zh": "所以，我认为好的领导不是让员工害怕自己，而是让员工愿意相信和跟随自己。", "py": "Suǒyǐ, wǒ rènwéi hǎo de lǐngdǎo búshì ràng yuángōng hàipà zìjǐ, érshì ràng yuángōng yuànyì xiāngxìn hé gēnsuí zìjǐ.", "vi": "Vì vậy, theo mình, người lãnh đạo tốt không phải là khiến nhân viên sợ mình, mà là khiến nhân viên sẵn sàng tin tưởng và đi theo mình.", "sec": "Kết luận"}]},

vis:["Sau đó thế nào? Anh ấy có hẹn lại cậu không?", "Có phải cậu cũng từng gặp chuyện tương tự không?", "Mình có thể hơi bận, đến lúc đó xem sao nhé.", "Câu chuyện hôm nay đến đây thôi, hẹn gặp lại lần sau.", "Đúng vậy. Nhưng ở đây có một điểm khác biệt rất quan trọng.", "Vậy cậu có thể tạm đừng hỏi dồn mãi, hãy cho một chút không gian.", "Vậy cậu thật sự có việc, hay thật ra không muốn đi lắm?", "Đúng, đây chính là tác dụng mà cách nói khéo đôi khi phát huy được.", "Đúng vậy, nhất là khi hai người còn chưa thân lắm.", "Ví dụ như gì? Cậu còn nhớ họ cụ thể nói gì không?", "Mình bảo là mình có thể hơi bận, đến lúc đó xem sao.", "Thời tiết đẹp thế, nghe cũng hay đấy. Cậu trả lời anh ấy thế nào?", "Được chứ. Chúng ta bắt đầu từ lời mời cuối tuần phổ biến nhất nhé.", "Lúc đó mình quả thật hơi mệt, nhưng cũng chưa hẳn quyết định không đi.", "Hôm qua bạn mình hỏi cuối tuần có muốn cùng đi dạo công viên không.", "Vậy cuối cùng cậu có nhận lời không? Hay lại nói thêm lần nữa là cậu khá bận?", "Vậy làm sao mình biết anh ấy thật sự không rảnh hay không muốn đi?", "Được. Giả sử mình là bạn cậu, muốn hẹn cậu thứ Bảy cùng đi xem phim.", "Hóa ra đôi khi không hỏi tiếp cũng là đang tôn trọng lựa chọn của người khác.", "Mình hiểu rồi, nói khéo không có nghĩa là bất lịch sự, cũng không có nghĩa là không nói thật.", "Khác biệt gì? Đừng bảo mình là những câu này đều có một nghĩa khác nhé.", "Cậu có thể nêu một ví dụ cụ thể không? Như vậy mình dễ hiểu hơn.", "Đúng vậy, nghe xong Tiểu Lâm cũng nhận ra trước đó mình đã nghĩ quá nhiều.", "Nếu chỉ nhìn nghĩa mặt chữ, quả thật rất khó đoán suy nghĩ thật của đối phương.", "Nói hay lắm. Quan hệ khác nhau, hoàn cảnh khác nhau thì cách nói phù hợp cũng khác nhau.", "Vậy câu cậu nói, ngay cả bản thân cậu cũng chưa có đáp án rõ ràng.", "Nhưng nếu lần nào cũng nói vậy, đối phương vẫn có thể cảm thấy mình bị từ chối.", "Anh ấy là người mời, hay là người không biết từ chối thế nào?", "Anh ấy nói chưa chắc, nhưng mấy lần liền không xác định được lịch thì đúng là đáng để ý.", "Sau đó anh quyết định đổi cách nói, vừa không làm người ta tổn thương, vừa nói rõ lịch của mình.", "Còn người nghe câu trả lời mơ hồ cũng không cần vội hỏi dồn cho ra một đáp án chắc chắn.", "Điều này không nhất thiết có nghĩa là anh không chân thành với đồng nghiệp, chỉ là mức độ thân quen của hai bên khác nhau.", "Đương nhiên. Lần đầu mình mời đồng nghiệp Trung Quốc ăn cơm, cũng nghe kiểu trả lời này nhiều lần.", "Đúng. Nhưng nếu hai người đã hỏi mấy lần mà đối phương vẫn cứ trả lời như vậy thì sao?", "Mình nói tuần sau cũng chưa chắc có thời gian, kết quả nghe như mình cứ viện cớ mãi.", "Nghĩa là không thể vì một câu mà kết luận, phải xem xét nhiều lần trao đổi cùng nhau.", "Tiếp theo, chúng ta kể một câu chuyện rất đời thực để xem loại hiểu lầm này xảy ra thế nào.", "Được, nhưng điều kiện là anh thật sự có ý đó, chứ không phải nhận lời bừa chỉ để kết thúc câu chuyện.", "Những câu này nghe đều rất bình thường, vì vốn là cách nói thường dùng trong đời sống hằng ngày.", "Nhưng câu chuyện chưa kết thúc, vì sau đó Tiểu Lâm cũng gặp tình huống cần từ chối người khác.", "Nhưng mình thấy chỗ dễ hiểu lầm nhất là chúng ta hay đem thói quen của mình áp lên người khác."],
