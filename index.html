lines:[{"t": 3.0, "zh": "昨天我朋友问我周末要不要一起去公园走走。", "py": "Zuótiān wǒ péngyou wèn wǒ zhōumò yàobúyào yìqǐ qù gōngyuán zǒuzǒu.", "vi": "Hôm qua bạn mình hỏi cuối tuần có muốn cùng đi dạo công viên không.", "sec": "Lời hẹn cuối tuần và câu “có thể hơi bận”"}, {"t": 8.0, "zh": "天气这么好，听起来不错啊。你怎么回答他的？", "py": "Tiānqì zhème hǎo, tīng qǐlai búcuò a. Nǐ zěnme huídá tā de?", "vi": "Thời tiết đẹp thế, nghe cũng hay đấy. Cậu trả lời anh ấy thế nào?"}, {"t": 12.0, "zh": "我跟他说，我可能有点忙，到时候再看看吧。", "py": "Wǒ gēn tā shuō, wǒ kěnéng yǒudiǎn máng, dàoshíhòu zài kànkan ba.", "vi": "Mình bảo là mình có thể hơi bận, đến lúc đó xem sao."}, {"t": 17.0, "zh": "那你是真的有事，还是其实不太想去？", "py": "Nà nǐ shì zhēnde yǒu shì, háishì qíshí bú tài xiǎng qù?", "vi": "Vậy cậu thật sự có việc, hay thật ra không muốn đi lắm?"}, {"t": 21.2, "zh": "我当时确实有点累，但也没有完全决定不去。", "py": "Wǒ dāngshí quèshí yǒudiǎn lèi, dàn yě méiyǒu wánquán juédìng bú qù.", "vi": "Lúc đó mình quả thật hơi mệt, nhưng cũng chưa hẳn quyết định không đi."}, {"t": 25.9, "zh": "所以你说的这句话，连你自己都没有一个明确的答案。", "py": "Suǒyǐ nǐ shuō de zhè jù huà, lián nǐ zìjǐ dōu méiyǒu yí ge míngquè de dáàn.", "vi": "Vậy câu cậu nói, ngay cả bản thân cậu cũng chưa có đáp án rõ ràng."}, {"t": 30.8, "zh": "对。不过他好像把这句话理解成“我只是暂时没空”。", "py": "Duì. Búguò tā hǎoxiàng bǎ zhè jù huà lǐjiě chéng \"wǒ zhǐshì zànshí méi kòng\".", "vi": "Đúng. Nhưng anh ấy dường như hiểu câu đó là “mình chỉ tạm thời không rảnh”."}, {"t": 37.0, "zh": "后来发生什么了？他又约你了吗？", "py": "Hòulái fāshēng shénme le? Tā yòu yuē nǐ le ma?", "vi": "Sau đó thế nào? Anh ấy có hẹn lại cậu không?"}, {"t": 40.1, "zh": "他马上说：“那我们下周末再去。”我一下子不知道怎么回答，哈哈。", "py": "Tā mǎshàng shuō: \"nà wǒmen xià zhōumò zài qù.\" wǒ yíxiàzi bù zhīdao zěnme huídá, hāhā.", "vi": "Anh ấy lập tức nói: “Vậy cuối tuần sau mình đi.” Mình nhất thời không biết trả lời sao, haha."}, {"t": 46.9, "zh": "他可能觉得你很想去，只是这个周末不方便。", "py": "Tā kěnéng juéde nǐ hěn xiǎng qù, zhǐshì zhège zhōumò bù fāngbiàn.", "vi": "Có lẽ anh ấy nghĩ cậu rất muốn đi, chỉ là cuối tuần này không tiện."}, {"t": 51.9, "zh": "是啊。我本来只是想先保留一点空间，他却开始安排下周了。", "py": "Shì a. Wǒ běnlái zhǐshì xiǎng xiān bǎoliú yìdiǎn kōngjiān, tā què kāishǐ ānpái xiàzhōu le.", "vi": "Đúng vậy. Mình vốn chỉ muốn giữ lại chút khoảng trống, vậy mà anh ấy đã bắt đầu sắp xếp cho tuần sau."}, {"t": 57.8, "zh": "那你最后答应了吗？还是又说了一次你比较忙？", "py": "Nà nǐ zuìhòu dāyìng le ma? Háishì yòu shuō le yícì nǐ bǐjiào máng?", "vi": "Vậy cuối cùng cậu có nhận lời không? Hay lại nói thêm lần nữa là cậu khá bận?"}, {"t": 63.1, "zh": "我说下周也不一定有时间，结果听起来好像我一直在找借口。", "py": "Wǒ shuō xiàzhōu yě bù yídìng yǒu shíjiān, jiéguǒ tīng qǐlai hǎoxiàng wǒ yìzhí zài zhǎo jièkǒu.", "vi": "Mình nói tuần sau cũng chưa chắc có thời gian, kết quả nghe như mình cứ viện cớ mãi."}, {"t": 70.0, "zh": "我能理解他的感觉，因为如果是我，也可能会有一点困惑。", "py": "Wǒ néng lǐjiě tā de gǎnjué, yīnwèi rúguǒ shì wǒ, yě kěnéng huì yǒu yìdiǎn kùnhuò.", "vi": "Mình hiểu cảm giác của anh ấy, vì nếu là mình thì cũng có thể thấy hơi khó hiểu."}, {"t": 74.6, "zh": "所以我就在想，为什么有时候中国人不直接说“不”呢？", "py": "Suǒyǐ wǒ jiù zài xiǎng, wèishénme yǒu shíhou zhōngguó rén bù zhíjiē shuō \"bù\" ne?", "vi": "Vì thế mình cứ nghĩ, sao đôi khi người Trung Quốc không nói thẳng “không”?", "sec": "Vì sao người Trung Quốc ít nói “không” thẳng?"}, {"t": 79.1, "zh": "这个问题很有意思。不过我想先问你一个问题。", "py": "Zhège wèntí hěn yǒuyìsi. Búguò wǒ xiǎng xiān wèn nǐ yí ge wèntí.", "vi": "Câu hỏi này rất thú vị. Nhưng mình muốn hỏi cậu một câu trước."}, {"t": 83.6, "zh": "什么问题？", "py": "Shénme wèntí?", "vi": "Câu gì?"}, {"t": 84.6, "zh": "是不是你也遇到过类似的事情？", "py": "Shìbúshì nǐ yě yùdào guò lèisì de shìqing?", "vi": "Có phải cậu cũng từng gặp chuyện tương tự không?"}, {"t": 87.9, "zh": "当然。我第一次邀请中国同事吃饭时，也听过很多次这种回答。", "py": "Dāngrán. Wǒ dìyīcì yāoqǐng zhōngguó tóngshì chīfàn shí, yě tīng guo hěn duōcì zhèzhǒng huídá.", "vi": "Đương nhiên. Lần đầu mình mời đồng nghiệp Trung Quốc ăn cơm, cũng nghe kiểu trả lời này nhiều lần."}, {"t": 93.4, "zh": "比如什么？你还记得他们具体说了什么吗？", "py": "Bǐrú shénme? Nǐ hái jìde tāmen jùtǐ shuō le shénme ma?", "vi": "Ví dụ như gì? Cậu còn nhớ họ cụ thể nói gì không?"}, {"t": 97.2, "zh": "有人说“最近比较忙”，有人说“再看看”，还有人说“下次吧”。", "py": "Yǒurén shuō \"zuìjìn bǐjiào máng\", yǒurén shuō \"zài kànkan\", háiyǒu rén shuō \"xiàcì ba\".", "vi": "Có người nói “dạo này khá bận”, có người nói “xem lại sau”, còn có người nói “lần sau nhé”."}, {"t": 102.6, "zh": "这些话听起来都很正常，因为它们本来就是日常生活里的常用表达。", "py": "Zhèxiē huà tīng qǐlai dōu hěn zhèngcháng, yīnwèi tāmen běnlái jiùshì rìchángshēnghuó lǐ de chángyòng biǎodá.", "vi": "Những câu này nghe đều rất bình thường, vì vốn là cách nói thường dùng trong đời sống hằng ngày."}, {"t": 108.1, "zh": "可是对中文学习者来说，问题就在这里：他们到底是什么意思？", "py": "Kěshì duì zhōngwén xuéxízhě láishuō, wèntí jiù zài zhè lǐ: tāmen dàodǐ shì shénme yìsi?", "vi": "Nhưng với người học tiếng Trung, vấn đề nằm ở đây: rốt cuộc chúng có nghĩa là gì?"}, {"t": 114.2, "zh": "如果你只看字面意思，确实很难判断对方真正的想法。", "py": "Rúguǒ nǐ zhǐ kàn zìmiàn yìsi, quèshí hěn nán pànduàn duìfāng zhēnzhèng de xiǎngfǎ.", "vi": "Nếu chỉ nhìn nghĩa mặt chữ, quả thật rất khó đoán suy nghĩ thật của đối phương."}, {"t": 119.1, "zh": "比如他说“最近比较忙”，我就会想，那等他不忙的时候再约。", "py": "Bǐrú tā shuō \"zuìjìn bǐjiào máng\", wǒ jiù huì xiǎng, nà děng tā bù máng de shíhou zài yuē.", "vi": "Ví dụ anh ấy nói “dạo này khá bận”, mình sẽ nghĩ, vậy đợi lúc anh ấy rảnh rồi hẹn."}, {"t": 124.2, "zh": "对，但有时候他可能不是在告诉你什么时候有空，而是在委婉地表达，他暂时不想接受这个邀请。", "py": "Duì, dàn yǒu shíhou tā kěnéng búshì zài gàosù nǐ shénme shíhou yǒu kòng, érshì zài wěiwǎn de biǎodá, tā zànshí bù xiǎng jiēshòu zhège yāoqǐng.", "vi": "Đúng, nhưng đôi khi anh ấy không phải đang cho bạn biết khi nào rảnh, mà đang khéo léo bày tỏ rằng tạm thời anh ấy không muốn nhận lời mời này."}, {"t": 133.9, "zh": "没错。不过这里有一个很重要的区别。", "py": "Méicuò. Búguò zhè lǐ yǒu yí ge hěn zhòngyào de qūbié.", "vi": "Đúng vậy. Nhưng ở đây có một điểm khác biệt rất quan trọng."}, {"t": 137.3, "zh": "什么区别？你可别告诉我这些话都有另外一个意思。", "py": "Shénme qūbié? Nǐ kě bié gàosù wǒ zhèxiē huà dōu yǒu lìngwài yí ge yìsi.", "vi": "Khác biệt gì? Đừng bảo mình là những câu này đều có một nghĩa khác nhé."}, {"t": 143.1, "zh": "不是每一句委婉的话都代表拒绝。有时候人家真的很忙。", "py": "Búshì měi yíjù wěiwǎn dehuà dōu dàibiǎo jùjué. Yǒu shíhou rénjiā zhēnde hěn máng.", "vi": "Không phải câu nói khéo nào cũng có nghĩa là từ chối. Có khi người ta thật sự rất bận."}, {"t": 148.9, "zh": "那我怎么知道他是真的没空，还是不太想去呢？", "py": "Nà wǒ zěnme zhīdao tā shì zhēnde méi kòng, háishì bú tài xiǎng qù ne?", "vi": "Vậy làm sao mình biết anh ấy thật sự không rảnh hay không muốn đi?"}, {"t": 153.1, "zh": "这个问题不能只靠一句话来判断，还要看当时的情况，比如我们是什么关系，之前有没有约好，还有他平时怎么说话。", "py": "Zhège wèntí bùnéng zhǐ kào yíjù huà lái pànduàn, háiyào kàn dāngshí de qíngkuàng, bǐrú wǒmen shì shénme guānxì, zhīqián yǒuméiyǒu yuē hǎo, háiyǒu tā píngshí zěnme shuōhuà.", "vi": "Vấn đề này không thể chỉ dựa vào một câu để phán đoán, còn phải xem tình huống lúc đó, ví dụ chúng ta có quan hệ gì, trước đó đã hẹn chưa, và bình thường anh ấy nói chuyện thế nào."}, {"t": 163.4, "zh": "对，而且你提出的事情，对他来说是不是一件容易答应的事？", "py": "Duì, érqiě nǐ tíchū de shìqing, duì tā láishuō shìbúshì yíjiàn róngyì dāyìng de shì?", "vi": "Đúng, và việc bạn đề nghị, với anh ấy có phải là việc dễ nhận lời không?"}, {"t": 168.8, "zh": "你能不能举一个具体的例子？这样我比较容易理解。", "py": "Nǐ néng bùnéng jǔ yí ge jùtǐ de lìzi? Zhèyàng wǒ bǐjiào róngyì lǐjiě.", "vi": "Cậu có thể nêu một ví dụ cụ thể không? Như vậy mình dễ hiểu hơn."}, {"t": 174.1, "zh": "当然。我们就从最常见的周末邀请开始说吧。", "py": "Dāngrán. Wǒmen jiù cóng zuì chángjiàn de zhōumò yāoqǐng kāishǐ shuō ba.", "vi": "Được chứ. Chúng ta bắt đầu từ lời mời cuối tuần phổ biến nhất nhé.", "sec": "Ví dụ: lời mời đi xem phim"}, {"t": 178.8, "zh": "好。假设我是你的朋友，想约你周六一起去看电影。", "py": "Hǎo. Jiǎshè wǒ shì nǐ de péngyou, xiǎng yuē nǐ zhōuliù yīqǐ qù kàn diànyǐng.", "vi": "Được. Giả sử mình là bạn cậu, muốn hẹn cậu thứ Bảy cùng đi xem phim."}, {"t": 183.8, "zh": "可以，你先邀请我，我来告诉你不同回答可能带来的感觉。", "py": "Kěyǐ, nǐ xiān yāoqǐng wǒ, wǒ lái gàosù nǐ bùtóng huídá kěnéng dàilái de gǎnjué.", "vi": "Được, cậu mời mình trước, mình sẽ nói cậu nghe các cách trả lời khác nhau có thể tạo cảm giác thế nào."}, {"t": 189.7, "zh": "这个周六你有空吗？我们一起去看那部新电影吧。", "py": "Zhège zhōuliù nǐ yǒu kòng ma? Wǒmen yìqǐ qù kàn nà bù xīn diànyǐng ba.", "vi": "Thứ Bảy này cậu rảnh không? Mình cùng đi xem bộ phim mới đó nhé."}, {"t": 194.0, "zh": "我可能有点忙，到时候再看看吧。", "py": "Wǒ kěnéng yǒudiǎn máng, dàoshíhòu zài kànkan ba.", "vi": "Mình có thể hơi bận, đến lúc đó xem sao nhé."}, {"t": 196.3, "zh": "如果你这样回答，我会觉得你可能真的有事，还没确定时间。这很正常，因为你没有直接说不，也没有明确答应。", "py": "Rúguǒ nǐ zhèyàng huídá, wǒhuì juéde nǐ kěnéng zhēnde yǒu shì, hái méi quèdìng shíjiān. Zhè hěn zhèngcháng, yīnwèi nǐ méiyǒu zhíjiē shuō bù, yě méiyǒu míngquè dāyìng.", "vi": "Nếu cậu trả lời thế, mình sẽ nghĩ có lẽ cậu thật sự có việc, chưa xác định được thời gian. Điều này rất bình thường, vì cậu không nói thẳng không, cũng không nhận lời rõ ràng."}, {"t": 206.9, "zh": "那我可能会继续问你：周日怎么样？周日你有没有时间？", "py": "Nà wǒ kěnéng huì jìxù wèn nǐ: zhōurì zěnmeyàng? Zhōurì nǐ yǒuméiyǒu shíjiān?", "vi": "Vậy mình có thể hỏi tiếp: Chủ nhật thì sao? Chủ nhật cậu có thời gian không?"}, {"t": 212.0, "zh": "如果我只是临时有事，我可能会告诉你周日可以。", "py": "Rúguǒ wǒ zhǐshì línshí yǒu shì, wǒ kěnéng huì gàosù nǐ zhōurì kěyǐ.", "vi": "Nếu mình chỉ tạm thời có việc, mình có thể nói với cậu là Chủ nhật được."}, {"t": 216.6, "zh": "如果我再约你，你还是说“最近比较忙”呢？", "py": "Rúguǒ wǒ zài yuē nǐ, nǐ háishì shuō \"zuìjìn bǐjiào máng\" ne?", "vi": "Nếu mình hẹn lại mà cậu vẫn nói “dạo này khá bận” thì sao?"}, {"t": 220.2, "zh": "那你就可以留意一下，我有没有主动提出其他时间。如果一个人真的想见我，即使这周没空，也可能提出别的安排。", "py": "Nà nǐ jiù kěyǐ liúyì yíxià, wǒ yǒuméiyǒu zhǔdòng tíchū qítā shíjiān. Rúguǒ yí ge rén zhēnde xiǎngjiàn wǒ, jíshǐ zhè zhōu méi kòng, yě kěnéng tíchū biéde ānpái.", "vi": "Vậy cậu có thể để ý xem mình có chủ động đề xuất thời gian khác không. Nếu một người thật sự muốn gặp mình, dù tuần này không rảnh cũng có thể đề xuất sắp xếp khác."}, {"t": 230.3, "zh": "对，这只是一个参考，不是绝对的规则。", "py": "Duì, zhè zhǐshì yí ge cānkǎo, búshì juéduì de guīzé.", "vi": "Đúng, đây chỉ là một gợi ý tham khảo, không phải quy tắc tuyệt đối."}, {"t": 235.0, "zh": "如果他一直说没时间，却从来没有主动约我呢？", "py": "Rúguǒ tā yìzhí shuō méi shíjiān, què cónglái méiyǒu zhǔdòng yuē wǒ ne?", "vi": "Nếu anh ấy cứ nói không có thời gian mà chưa bao giờ chủ động hẹn mình thì sao?"}, {"t": 239.0, "zh": "那你可以先别一直追问，给一点空间。", "py": "Nà nǐ kěyǐ xiān bié yìzhí zhuīwèn, gěi yìdiǎn kōngjiān.", "vi": "Vậy cậu có thể tạm đừng hỏi dồn mãi, hãy cho một chút không gian."}, {"t": 243.4, "zh": "原来有时候不继续追问，也是在尊重别人的选择。", "py": "Yuánlái yǒu shíhou bú jìxù zhuīwèn, yě shì zài zūnzhòng biérén de xuǎnzé.", "vi": "Hóa ra đôi khi không hỏi tiếp cũng là đang tôn trọng lựa chọn của người khác."}, {"t": 248.7, "zh": "是的，尤其是当你们还不太熟悉的时候。", "py": "Shì de, yóuqí shì dāng nǐmen hái bú tài shúxī de shíhou.", "vi": "Đúng vậy, nhất là khi hai người còn chưa thân lắm."}, {"t": 252.3, "zh": "我发现这跟直接说“不”确实有一点不一样。", "py": "Wǒ fāxiàn zhè gēn zhíjiē shuō \"bù\" quèshí yǒu yìdiǎn bù yíyàng.", "vi": "Mình thấy điều này quả thật hơi khác với việc nói thẳng “không”."}, {"t": 255.9, "zh": "直接拒绝会让意思更清楚，但也可能让对方当场觉得尴尬。", "py": "Zhíjiē jùjué huì ràng yìsi gèng qīngchǔ, dàn yě kěnéng ràng duìfāng dāngchǎng juéde gāngà.", "vi": "Từ chối thẳng làm ý rõ ràng hơn, nhưng cũng có thể khiến đối phương thấy ngượng ngay tại chỗ."}, {"t": 261.0, "zh": "比如你直接告诉我“我不想跟你去看电影”，这句话很清楚，不过如果没有其他解释，听起来可能有点冷淡，尤其是我们刚认识不久，我可能会想，是不是我做错了什么？", "py": "Bǐrú nǐ zhíjiē gàosù wǒ \"wǒ bù xiǎng gēn nǐ qù kàn diànyǐng\", zhè jù huà hěn qīngchǔ, búguò rúguǒ méiyǒu qítā jiěshì, tīng qǐlai kěnéng yǒudiǎn lěngdàn, yóuqí shì wǒmen gāng rènshi bùjiǔ, wǒ kěnéng huì xiǎng, shìbúshì wǒ zuò cuò le shénme?", "vi": "Ví dụ cậu nói thẳng “mình không muốn đi xem phim với cậu”, câu này rất rõ, nhưng nếu không giải thích thêm thì nghe có thể hơi lạnh nhạt, nhất là khi chúng ta mới quen, mình có thể nghĩ, có phải mình đã làm sai điều gì không?"}, {"t": 276.5, "zh": "所以有些人会先说自己有事，而不是直接评价这个邀请。这样听起来像是时间安排的问题，而不是“我这个人有问题”。", "py": "Suǒyǐ yǒuxiē rén huì xiān shuō zìjǐ yǒu shì, ér búshì zhíjiē píngjià zhège yāoqǐng. Zhèyàng tīng qǐlai xiàngshì shíjiān ānpái de wèntí, ér búshì \"wǒ zhège rén yǒu wèntí\".", "vi": "Vì vậy có người sẽ nói mình có việc trước, thay vì đánh giá thẳng lời mời. Như thế nghe như vấn đề sắp xếp thời gian, chứ không phải “con người mình có vấn đề”."}, {"t": 286.7, "zh": "对，这就是委婉表达有时能发挥的作用。", "py": "Duì, zhè jiùshì wěiwǎn biǎodá yǒushí néng fāhuī de zuòyòng.", "vi": "Đúng, đây chính là tác dụng mà cách nói khéo đôi khi phát huy được."}, {"t": 290.2, "zh": "但如果每次都这样说，对方还是可能觉得自己被拒绝了。", "py": "Dàn rúguǒ měicì dōu zhèyàng shuō, duìfāng háishì kěnéng juéde zìjǐ bèi jùjué le.", "vi": "Nhưng nếu lần nào cũng nói vậy, đối phương vẫn có thể cảm thấy mình bị từ chối."}, {"t": 295.5, "zh": "当然，委婉并不代表别人一定不会受伤，也不代表一定更好。而且一直让别人猜，也确实很累。", "py": "Dāngrán, wěiwǎn bìng bú dàibiǎo biérén yídìng búhuì shòushāng, yě bú dàibiǎo yídìng gènghǎo. Érqiě yìzhí ràng biérén cāi, yě quèshí hěn lèi.", "vi": "Đương nhiên, nói khéo không có nghĩa là người khác chắc chắn không bị tổn thương, cũng không có nghĩa là nhất định tốt hơn. Hơn nữa cứ bắt người khác đoán mãi cũng thật sự mệt."}, {"t": 305.3, "zh": "没错，所以我们不能只说“委婉是礼貌，直接就是不礼貌”。我觉得关键是，你既要表达自己的意思，也要考虑对方怎么理解。", "py": "Méicuò, suǒyǐ wǒmen bùnéng zhǐ shuō \"wěiwǎn shì lǐmào, zhíjiē jiùshì bù lǐmào\". Wǒ juéde guānjiàn shì, nǐ jì yào biǎodá zìjǐ de yìsi, yě yào kǎolǜ duìfāng zěnme lǐjiě.", "vi": "Đúng, nên chúng ta không thể chỉ nói “khéo léo là lịch sự, thẳng thừng là bất lịch sự”. Mình thấy mấu chốt là bạn vừa phải nói ra ý mình, vừa phải nghĩ xem đối phương sẽ hiểu thế nào."}, {"t": 317.0, "zh": "说得好。不同关系、不同场合，适合的表达方式也不一样。", "py": "Shuō de hǎo. Bùtóng guānxì, bùtóng chǎnghé, shìhé de biǎodá fāngshì yě bù yíyàng.", "vi": "Nói hay lắm. Quan hệ khác nhau, hoàn cảnh khác nhau thì cách nói phù hợp cũng khác nhau."}, {"t": 323.3, "zh": "那我们接着说几个最容易让中文学习者误会的表达吧。", "py": "Nà wǒmen jiēzhe shuō jǐgè zuì róngyì ràng zhōngwén xuéxízhě wùhuì de biǎodá ba.", "vi": "Vậy chúng ta nói tiếp vài cách diễn đạt dễ khiến người học tiếng Trung hiểu lầm nhất nhé.", "sec": "Ba câu dễ gây hiểu lầm"}, {"t": 329.4, "zh": "第一个就是“最近比较忙”。", "py": "Dìyígè jiùshì \"zuìjìn bǐjiào máng\".", "vi": "Câu đầu tiên là “dạo này khá bận”."}, {"t": 332.0, "zh": "这句话的意思其实很宽。他可能是真的工作太多，也可能是最近没有心情参加活动，也可能是对方不想去，但又不想当面让你失望。", "py": "Zhè jù huà de yìsi qíshí hěn kuān. Tā kěnéng shì zhēnde gōngzuò tài duō, yě kěnéng shì zuìjìn méiyǒu xīnqíng cānjiā huódòng, yě kěnéng shì duìfāng bù xiǎng qù, dàn yòu bù xiǎng dāngmiàn ràng nǐ shīwàng.", "vi": "Nghĩa của câu này thật ra rất rộng. Có thể anh ấy thật sự nhiều việc, cũng có thể dạo này không có tâm trạng tham gia hoạt động, hoặc là không muốn đi nhưng lại không muốn làm bạn thất vọng ngay trước mặt."}, {"t": 344.7, "zh": "那如果他说：“我最近工作特别忙，周末可能还要加班”呢？", "py": "Nà rúguǒ tā shuō: \"wǒ zuìjìn gōngzuò tèbié máng, zhōumò kěnéng háiyào jiābān\" ne?", "vi": "Vậy nếu anh ấy nói: “Dạo này công việc mình đặc biệt bận, cuối tuần có thể còn phải tăng ca” thì sao?"}, {"t": 349.4, "zh": "如果他具体说明了情况，你就可以先相信他说的内容。我可以回答：“没关系，你先忙，等有空我们再约。”", "py": "Rúguǒ tā jùtǐ shuōmíng le qíngkuàng, nǐ jiù kěyǐ xiān xiāngxìn tā shuō de nèiróng. Wǒ kěyǐ huídá: \"méiguānxì, nǐ xiān máng, děng yǒu kòng wǒmen zài yuē.\"", "vi": "Nếu anh ấy nói rõ tình hình cụ thể, bạn có thể tin những gì anh ấy nói trước. Mình có thể đáp: “Không sao, cậu cứ bận đi, khi nào rảnh mình hẹn lại.”"}, {"t": 358.6, "zh": "对，这样既表达了理解，也没有给对方增加压力。", "py": "Duì, zhèyàng jì biǎodá le lǐjiě, yě méiyǒu gěi duìfāng zēngjiā yālì.", "vi": "Đúng, như vậy vừa thể hiện sự thông cảm, vừa không tạo thêm áp lực cho đối phương."}, {"t": 363.5, "zh": "第二个表达是“再看吧”。", "py": "Dìèrgè biǎodá shì \"zài kànba\".", "vi": "Cách nói thứ hai là “xem lại sau”."}, {"t": 366.0, "zh": "我以前总觉得，他等于“让我等一等”。", "py": "Wǒ yǐqián zǒng juéde, tā děngyú \"ràng wǒ děngyìděng\".", "vi": "Trước đây mình luôn nghĩ nó tương đương với “hãy đợi một chút”."}, {"t": 369.7, "zh": "有时候确实是这个意思，比如他还要确认自己的时间。如果我问你：“下个月要不要一起去旅行？”你说：“我可能得先看看工作安排，再决定能不能去。”", "py": "Yǒu shíhou quèshí shì zhège yìsi, bǐrú tā háiyào quèrèn zìjǐ de shíjiān. Rúguǒ wǒ wèn nǐ: \"xiàgèyuè yàobúyào yìqǐ qù lǚxíng?\" nǐ shuō: \"wǒ kěnéng de xiān kànkan gōngzuò ānpái, zài juédìng néng bùnéng qù.\"", "vi": "Đôi khi đúng là nghĩa đó, ví dụ anh ấy còn phải xác nhận thời gian của mình. Nếu mình hỏi cậu: “Tháng sau có muốn cùng đi du lịch không?” cậu nói: “Mình có thể phải xem lịch làm việc trước rồi mới quyết định đi được không.”"}, {"t": 383.6, "zh": "那你说“再看看吧”，就表示事情还没有确定。", "py": "Nà nǐ shuō \"zài kànkan ba\", jiù biǎoshì shìqing hái méiyǒu quèdìng.", "vi": "Vậy cậu nói “xem lại sau nhé” nghĩa là việc đó chưa được xác định."}, {"t": 387.6, "zh": "对。不过如果你们已经问了好几次，对方还是一直这样回答呢？", "py": "Duì. Búguò rúguǒ nǐmen yǐjing wèn le hǎo jǐcì, duìfāng háishì yìzhí zhèyàng huídá ne?", "vi": "Đúng. Nhưng nếu hai người đã hỏi mấy lần mà đối phương vẫn cứ trả lời như vậy thì sao?"}, {"t": 393.0, "zh": "那我就应该意识到，他可能还没有准备好答应，甚至不想去。", "py": "Nà wǒ jiù yīnggāi yìshí dào, tā kěnéng hái méiyǒu zhǔnbèi hǎo dāyìng, shènzhì bù xiǎng qù.", "vi": "Vậy mình nên nhận ra rằng có lẽ anh ấy chưa sẵn sàng nhận lời, thậm chí không muốn đi."}, {"t": 398.2, "zh": "是的，但我们仍然不必马上认定他是在拒绝我们，因为有的人做决定比较慢，有的人确实不喜欢提前安排。所以理解一句话，不能只看他本身，还要看前后的情况。", "py": "Shì de, dàn wǒmen réngrán búbì mǎshàng rèndìng tā shì zài jùjué wǒmen, yīnwèi yǒu de rén zuò juédìng bǐjiàomàn, yǒu de rén quèshí bù xǐhuan tíqián ānpái. Suǒyǐ lǐjiě yíjù huà, bùnéng zhǐ kàn tā běnshēn, háiyào kàn qiánhòu de qíngkuàng.", "vi": "Đúng, nhưng chúng ta vẫn không cần vội cho rằng anh ấy đang từ chối mình, vì có người quyết định chậm, có người quả thật không thích sắp xếp trước. Vì vậy để hiểu một câu nói, không thể chỉ nhìn bản thân câu đó mà còn phải xem bối cảnh trước sau."}, {"t": 414.7, "zh": "第三个表达就是“下次吧”。", "py": "Dìsāngè biǎodá jiùshì \"xiàcì ba\".", "vi": "Cách nói thứ ba là “lần sau nhé”."}, {"t": 417.5, "zh": "这个我听过特别多次。比如朋友请你吃饭，你说“下次吧”，听起来就很自然。可是这个“下次”到底是什么时候呢？明天、下周，还是永远没有？", "py": "Zhège wǒ tīng guo tèbié duōcì. Bǐrú péngyou qǐng nǐ chīfàn, nǐ shuō \"xiàcì ba\", tīng qǐlai jiù hěn zìrán. Kěshì zhège \"xiàcì\" dàodǐ shì shénme shíhou ne? Míngtiān, xiàzhōu, háishì yǒngyuǎn méiyǒu?", "vi": "Câu này mình nghe rất nhiều lần. Ví dụ bạn mời ăn cơm, cậu nói “lần sau nhé”, nghe rất tự nhiên. Nhưng “lần sau” rốt cuộc là khi nào? Ngày mai, tuần sau, hay là không bao giờ?"}, {"t": 431.8, "zh": "有时候连说这句话的人也没有确定的时间。", "py": "Yǒu shíhou lián shuō zhè jù huà de rén yě méiyǒu quèdìng de shíjiān.", "vi": "Có khi ngay cả người nói câu này cũng không có thời gian xác định."}, {"t": 436.6, "zh": "那是不是可以理解成一种比较轻松的结束方式？", "py": "Nà shìbúshì kěyǐ lǐjiě chéng yìzhǒng bǐjiào qīngsōng de jiéshù fāngshì?", "vi": "Vậy có thể hiểu đó là một cách kết thúc khá nhẹ nhàng không?"}, {"t": 441.6, "zh": "可以，但也要看对方有没有接着提出一个真正的“下次”。如果他说“下周三怎么样？”，那这次就有了一个比较具体的安排。", "py": "Kěyǐ, dàn yě yào kàn duìfāng yǒuméiyǒu jiēzhe tíchū yí ge zhēnzhèng de \"xiàcì\". Rúguǒ tā shuō \"xià zhōusān zěnmeyàng?\", nà zhècì jiù yǒu le yí ge bǐjiào jùtǐ de ānpái.", "vi": "Được, nhưng cũng phải xem đối phương có đề xuất tiếp một “lần sau” thật sự không. Nếu anh ấy nói “thứ Tư tuần sau thì sao?”, thì lần này đã có một sắp xếp khá cụ thể."}, {"t": 452.5, "zh": "没错。如果只是说“下次吧”，然后话题就结束了，就需要多留意一点。", "py": "Méicuò. Rúguǒ zhǐshì shuō \"xiàcì ba\", ránhòu huàtí jiù jiéshù le, jiù xūyào duō liúyì yìdiǎn.", "vi": "Đúng vậy. Nếu chỉ nói “lần sau nhé” rồi câu chuyện kết thúc, thì cần để ý thêm một chút."}, {"t": 458.8, "zh": "不过我觉得最容易误会的地方是，我们会把自己的习惯放到别人身上。", "py": "Búguò wǒ juéde zuì róngyì wùhuì de dìfang shì, wǒmen huì bǎ zìjǐ de xíguàn fàngdào biérén shēnshàng.", "vi": "Nhưng mình thấy chỗ dễ hiểu lầm nhất là chúng ta hay đem thói quen của mình áp lên người khác."}, {"t": 465.6, "zh": "比如我习惯直接说没空，就会觉得别人也应该这样回答。", "py": "Bǐrú wǒ xíguàn zhíjiē shuō méi kòng, jiù huì juéde biérén yě yīnggāi zhèyàng huídá.", "vi": "Ví dụ mình quen nói thẳng là không rảnh, thì sẽ nghĩ người khác cũng nên trả lời như vậy."}, {"t": 471.0, "zh": "而中国朋友可能觉得，先把话说得柔和一点，大家比较舒服。", "py": "Ér zhōngguó péngyou kěnéng juéde, xiān bǎ huà shuō de róuhé yìdiǎn, dàjiā bǐjiào shūfu.", "vi": "Còn bạn bè Trung Quốc có thể nghĩ nói mềm mỏng một chút trước thì mọi người dễ chịu hơn."}, {"t": 477.3, "zh": "但这并不是所有中国人都这样，也不是只有中国人才会委婉拒绝。不同国家、不同家庭，甚至不同性格的人，表达习惯都不一样。", "py": "Dàn zhè bìng búshì suǒyǒu zhōngguó rén dōu zhèyàng, yě búshì zhǐyǒu zhōngguó réncái huì wěiwǎn jùjué. Bùtóng guójiā, bùtóng jiātíng, shènzhì bùtóng xìnggé de rén, biǎodá xíguàn dōu bù yíyàng.", "vi": "Nhưng không phải người Trung Quốc nào cũng vậy, cũng không phải chỉ người Trung Quốc mới từ chối khéo. Quốc gia khác nhau, gia đình khác nhau, thậm chí tính cách khác nhau, thói quen diễn đạt đều khác nhau."}, {"t": 489.8, "zh": "所以我们今天不是要给所有中国人的回答下定义，而是想弄清楚，为什么同一句话，在不同情境里会有不同的意思。", "py": "Suǒyǐ wǒmen jīntiān búshì yào gěi suǒyǒu zhōngguó rén de huídá xiàdìngyì, érshì xiǎng nòngqīngchǔ, wèishénme tóng yíjù huà, zài bùtóng qíngjìng lǐ huì yǒu bùtóng de yìsi.", "vi": "Vì vậy hôm nay chúng ta không phải để định nghĩa cách trả lời của mọi người Trung Quốc, mà muốn hiểu vì sao cùng một câu, trong những hoàn cảnh khác nhau lại có nghĩa khác nhau."}, {"t": 500.4, "zh": "接下来，我们讲一个真实感很强的故事，看看这种误会怎样发生。", "py": "Jiēxiàlái, wǒmen jiǎng yí ge zhēnshígǎn hěn qiáng de gùshì, kànkan zhèzhǒng wùhuì zěnyàng fāshēng.", "vi": "Tiếp theo, chúng ta kể một câu chuyện rất đời thực để xem loại hiểu lầm này xảy ra thế nào.", "sec": "Câu chuyện của Tiểu Lâm"}, {"t": 507.0, "zh": "好，我想知道，如果一直猜错对方的意思，最后会发生什么？", "py": "Hǎo, wǒ xiǎng zhīdao, rúguǒ yìzhí cāi cuò duìfāng de yìsi, zuìhòu huì fāshēng shénme?", "vi": "Được, mình muốn biết, nếu cứ đoán sai ý đối phương thì cuối cùng sẽ ra sao?"}, {"t": 513.1, "zh": "我有个朋友叫小林，他之前就遇到过一件类似的事情。", "py": "Wǒ yǒu gè péngyou jiào xiǎolín, tā zhīqián jiù yùdào guò yíjiàn lèisì de shìqing.", "vi": "Mình có một người bạn tên Tiểu Lâm, trước đây anh ấy từng gặp chuyện tương tự."}, {"t": 518.4, "zh": "他是那个邀请别人的人，还是那个不知道怎么拒绝的人？", "py": "Tā shì nàge yāoqǐng biérén de rén, háishì nàge bù zhīdao zěnme jùjué de rén?", "vi": "Anh ấy là người mời, hay là người không biết từ chối thế nào?"}, {"t": 524.4, "zh": "这次他是邀请别人的人。他认识了一位外国同事，他们平时相处得不错，所以小林想邀请他周末一起吃饭。", "py": "Zhècì tā shì yāoqǐng biérén de rén. Tā rènshi le yíwèi wàiguó tóngshì, tāmen píngshí xiāngchǔ de búcuò, suǒyǐ xiǎolín xiǎng yāoqǐng tā zhōumò yìqǐ chīfàn.", "vi": "Lần này anh ấy là người mời. Anh quen một đồng nghiệp nước ngoài, bình thường hai người hòa hợp, nên Tiểu Lâm muốn mời anh ấy cuối tuần cùng ăn cơm."}, {"t": 535.0, "zh": "他问对方：“周六晚上有空吗？要不要一起去吃火锅？”", "py": "Tā wèn duìfāng: \"zhōuliù wǎnshàng yǒu kòng ma? Yàobúyào yìqǐ qù chīhuǒguō?\"", "vi": "Anh hỏi đối phương: “Tối thứ Bảy có rảnh không? Có muốn cùng đi ăn lẩu không?”"}, {"t": 539.5, "zh": "对方回答：“我可能有点忙，我们到时候再看看吧。”", "py": "Duìfāng huídá: \"wǒ kěnéng yǒudiǎn máng, wǒmen dàoshíhòu zài kànkan ba.\"", "vi": "Đối phương đáp: “Mình có thể hơi bận, đến lúc đó mình xem lại nhé.”"}, {"t": 544.1, "zh": "小林觉得对方只是周六没空，于是又问：“周日行不行？”", "py": "Xiǎolín juéde duìfāng zhǐshì zhōuliù méi kòng, yúshì yòu wèn: \"zhōurì xíngbùxíng?\"", "vi": "Tiểu Lâm nghĩ đối phương chỉ là thứ Bảy không rảnh, nên hỏi tiếp: “Chủ nhật được không?”"}, {"t": 549.8, "zh": "对方还是说：“周日也不太确定，要不我们下次再约？”", "py": "Duìfāng háishì shuō: \"zhōurì yě bú tài quèdìng, yào bù wǒmen xiàcì zài yuē?\"", "vi": "Đối phương vẫn nói: “Chủ nhật cũng không chắc lắm, hay là lần sau mình hẹn nhé?”"}, {"t": 554.9, "zh": "小林没有多想。过了几天，又发消息问他下周有没有时间。", "py": "Xiǎolín méiyǒu duō xiǎng. Guò le jǐtiān, yòu fāxiāoxī wèn tā xiàzhōu yǒuméiyǒu shíjiān.", "vi": "Tiểu Lâm không nghĩ nhiều. Mấy ngày sau, anh lại nhắn hỏi tuần sau có thời gian không."}, {"t": 559.9, "zh": "这次对方隔了很久才回复，说：“最近事情比较多。”", "py": "Zhècì duìfāng gé le hěn jiǔ cái huífù, shuō: \"zuìjìn shìqing bǐjiào duō.\"", "vi": "Lần này đối phương rất lâu sau mới trả lời, nói: “Dạo này nhiều việc quá.”"}, {"t": 564.7, "zh": "小林开始有点不高兴，他觉得，对方是不是不愿意跟自己做朋友？甚至想，是不是自己哪里做得不好，让对方不喜欢自己？", "py": "Xiǎolín kāishǐ yǒudiǎn bù gāoxìng, tā juéde, duìfāng shìbúshì bú yuànyì gēn zìjǐ zuò péngyou? Shènzhì xiǎng, shìbúshì zìjǐ nǎlǐ zuò de bùhǎo, ràng duìfāng bù xǐhuan zìjǐ?", "vi": "Tiểu Lâm bắt đầu hơi buồn, anh nghĩ, có phải đối phương không muốn làm bạn với mình? Thậm chí nghĩ, có phải mình làm chưa tốt chỗ nào khiến đối phương không thích mình?"}, {"t": 574.6, "zh": "后来他把这件事告诉了另一个中国朋友，想听听对方的看法。", "py": "Hòulái tā bǎ zhèjiàn shì gàosù le lìng yí ge zhōngguó péngyou, xiǎng tīngting duìfāng de kànfǎ.", "vi": "Sau đó anh kể chuyện này với một người bạn Trung Quốc khác, muốn nghe ý kiến của họ."}, {"t": 580.7, "zh": "那位朋友怎么说？他有没有告诉小林，这其实就是拒绝？", "py": "Nàwèi péngyou zěnme shuō? Tā yǒuméiyǒu gàosù xiǎolín, zhè qíshí jiùshì jùjué?", "vi": "Người bạn đó nói sao? Có bảo Tiểu Lâm rằng thật ra đó chính là từ chối không?"}, {"t": 586.4, "zh": "他说不一定，但连续几次都没有确定安排，确实值得留意。", "py": "Tā shuō bù yídìng, dàn liánxù jǐcì dōu méiyǒu quèdìng ānpái, quèshí zhíde liúyì.", "vi": "Anh ấy nói chưa chắc, nhưng mấy lần liền không xác định được lịch thì đúng là đáng để ý."}, {"t": 591.8, "zh": "也就是说，不能因为一句话就下结论，要把几次交流放在一起看。", "py": "Yějiùshìshuō, bùnéng yīnwèi yíjù huà jiù xiàjiélùn, yào bǎ jǐcì jiāoliú fàngzài yìqǐ kàn.", "vi": "Nghĩa là không thể vì một câu mà kết luận, phải xem xét nhiều lần trao đổi cùng nhau."}, {"t": 598.2, "zh": "没错，尤其要看看对方有没有主动回应，或者提出其他时间。", "py": "Méicuò, yóuqí yào kànkan duìfāng yǒuméiyǒu zhǔdòng huíyìng, huòzhě tíchū qítā shíjiān.", "vi": "Đúng, nhất là phải xem đối phương có chủ động phản hồi hoặc đề xuất thời gian khác không."}, {"t": 604.2, "zh": "那小林后来怎么办了？他有没有再邀请那位外国同事？", "py": "Nà xiǎolín hòulái zěnmebàn le? Tā yǒuméiyǒu zài yāoqǐng nàwèi wàiguó tóngshì?", "vi": "Vậy sau đó Tiểu Lâm làm thế nào? Anh có mời lại người đồng nghiệp nước ngoài đó không?"}, {"t": 609.0, "zh": "他决定先不继续追问，也不再把这件事看成对自己的否定。", "py": "Tā juédìng xiān bú jìxù zhuīwèn, yě búzài bǎ zhèjiàn shì kànchéng duì zìjǐ de fǒudìng.", "vi": "Anh quyết định tạm không hỏi dồn nữa, cũng không xem chuyện này là sự phủ nhận đối với bản thân."}, {"t": 614.3, "zh": "我觉得这个决定挺好的，毕竟别人可能只是有自己的安排。", "py": "Wǒ juéde zhège juédìng tǐng hǎo de, bìjìng biérén kěnéng zhǐshì yǒu zìjǐ de ānpái.", "vi": "Mình thấy quyết định này khá hay, dù sao người khác có thể chỉ là có kế hoạch riêng."}, {"t": 619.5, "zh": "过了一周，那位同事却主动找小林，说想跟他聊聊周末的计划。", "py": "Guò le yìzhōu, nàwèi tóngshì què zhǔdòng zhǎo xiǎolín, shuō xiǎng gēn tā liáoliáo zhōumò de jìhuà.", "vi": "Một tuần sau, người đồng nghiệp đó lại chủ động tìm Tiểu Lâm, nói muốn bàn chuyện kế hoạch cuối tuần."}, {"t": 624.8, "zh": "原来他并不是完全不想交朋友，只是之前确实有很多事情要处理。他还解释说，那段时间家里有些事，晚上经常要打电话回去，所以他当时说自己比较忙，其实并不是在找借口。", "py": "Yuánlái tā bìng búshì wánquán bù xiǎng jiāopéngyǒu, zhǐshì zhīqián quèshí yǒu hěnduō shìqing yào chǔlǐ. Tā hái jiěshì shuō, nà duànshíjiān jiālǐ yǒuxiē shì, wǎnshàng jīngcháng yào dǎdiànhuà huíqù, suǒyǐ tā dāngshí shuō zìjǐ bǐjiào máng, qíshí bìng búshì zài zhǎo jièkǒu.", "vi": "Hóa ra anh ấy không phải hoàn toàn không muốn kết bạn, chỉ là trước đó thật sự có nhiều việc phải xử lý. Anh còn giải thích, thời gian đó nhà có chuyện, buổi tối thường phải gọi điện về, nên khi ấy nói mình khá bận, thật ra không phải viện cớ."}, {"t": 641.6, "zh": "是的，小林听完以后，也意识到自己之前想得太多了。", "py": "Shì de, xiǎolín tīng wán yǐhòu, yě yìshí dào zìjǐ zhīqián xiǎng de tài duō le.", "vi": "Đúng vậy, nghe xong Tiểu Lâm cũng nhận ra trước đó mình đã nghĩ quá nhiều."}, {"t": 647.0, "zh": "这就是为什么我们不能把所有模糊的回答都当成拒绝。", "py": "Zhè jiùshì wèishénme wǒmen bùnéng bǎ suǒyǒu móhú de huídá dōu dàngchéng jùjué.", "vi": "Đó chính là lý do chúng ta không thể coi mọi câu trả lời mơ hồ là từ chối."}, {"t": 651.7, "zh": "不过故事还没有结束，因为小林后来也遇到了需要拒绝别人的情况。", "py": "Búguò gùshì hái méiyǒu jiéshù, yīnwèi xiǎolín hòulái yě yùdào le xūyào jùjué biérén de qíngkuàng.", "vi": "Nhưng câu chuyện chưa kết thúc, vì sau đó Tiểu Lâm cũng gặp tình huống cần từ chối người khác.", "sec": "Khi Tiểu Lâm phải từ chối"}, {"t": 658.4, "zh": "这次轮到他不知道怎么说“不”了吗？我想听听他怎么处理。", "py": "Zhècì lún dào tā bù zhīdao zěnme shuō \"bù\" le ma? Wǒ xiǎng tīngting tā zěnme chǔlǐ.", "vi": "Lần này đến lượt anh không biết nói “không” thế nào sao? Mình muốn nghe anh xử lý ra sao."}, {"t": 663.8, "zh": "有一天，另一位同事邀请他参加一个周末的聚会，可是小林已经答应周末要回家吃饭，时间完全冲突了。", "py": "Yǒu yìtiān, lìng yíwèi tóngshì yāoqǐng tā cānjiā yí ge zhōumò de jùhuì, kěshì xiǎolín yǐjing dāyìng zhōumò yào huíjiā chīfàn, shíjiān wánquán chōngtū le.", "vi": "Một hôm, một đồng nghiệp khác mời anh dự buổi tụ họp cuối tuần, nhưng Tiểu Lâm đã nhận lời cuối tuần về nhà ăn cơm, thời gian hoàn toàn trùng nhau."}, {"t": 673.7, "zh": "他其实不想参加聚会，但又担心直接拒绝会让同事觉得不舒服，于是他的第一反应就是：“最近可能有点忙，到时候再看看。”", "py": "Tā qíshí bù xiǎng cānjiā jùhuì, dàn yòu dānxīn zhíjiē jùjué huì ràng tóngshì juéde bù shūfu, yúshì tā de dìyī fǎnyìng jiùshì: \"zuìjìn kěnéng yǒudiǎn máng, dàoshíhòu zài kànkan.\"", "vi": "Thật ra anh không muốn dự tiệc, nhưng lại lo từ chối thẳng sẽ khiến đồng nghiệp khó chịu, nên phản ứng đầu tiên của anh là: “Dạo này có thể hơi bận, đến lúc đó xem sao.”"}, {"t": 685.9, "zh": "可是他说完以后，马上就发现自己把事情变得更复杂了，因为同事可能会继续问：“周六不行的话，周日可以吗？”", "py": "Kěshì tā shuōwán yǐhòu, mǎshàng jiù fāxiànzìjǐ bǎ shìqing biànde gèng fùzá le, yīnwèi tóngshì kěnéng huì jìxù wèn: \"zhōuliù bùxíng dehuà, zhōurì kěyǐ ma?\"", "vi": "Nhưng nói xong anh lập tức nhận ra mình đã làm mọi chuyện phức tạp hơn, vì đồng nghiệp có thể hỏi tiếp: “Thứ Bảy không được thì Chủ nhật được không?”"}, {"t": 696.5, "zh": "没错，而且如果对方一直帮他找时间，他就更难开口了。这时候他才发现，自己不清楚的表达，也会给别人带来麻烦。", "py": "Méicuò, érqiě rúguǒ duìfāng yìzhí bāng tā zhǎo shíjiān, tā jiù gèng nán kāikǒu le. Zhè shíhou tā cái fāxiàn, zìjǐ bù qīngchǔ de biǎodá, yě huì gěi biérén dàilái máfán.", "vi": "Đúng, hơn nữa nếu đối phương cứ giúp anh tìm thời gian thì anh càng khó mở lời. Lúc đó anh mới nhận ra, cách nói không rõ ràng của mình cũng gây phiền cho người khác."}, {"t": 707.9, "zh": "后来他决定换一种说法，既不伤人，也把自己的安排说清楚。", "py": "Hòulái tā juédìng huàn yìzhǒng shuōfǎ, jì bù shāngrén, yě bǎ zìjǐ de ānpái shuō qīngchǔ.", "vi": "Sau đó anh quyết định đổi cách nói, vừa không làm người ta tổn thương, vừa nói rõ lịch của mình."}, {"t": 713.6, "zh": "他具体是怎么说的？有没有直接说自己不想参加？", "py": "Tā jùtǐ shì zěnme shuō de? Yǒuméiyǒu zhíjiē shuō zìjǐ bù xiǎng cānjiā?", "vi": "Cụ thể anh nói thế nào? Có nói thẳng là mình không muốn tham gia không?"}, {"t": 718.0, "zh": "他说：“谢谢你邀请我，不过这个周末我要回家陪家人，可能参加不了了。”", "py": "Tā shuō: \"xièxie nǐ yāoqǐng wǒ, búguò zhège zhōumò wǒ yào huíjiā péi jiārén, kěnéng cānjiā bùliǎo le.\"", "vi": "Anh nói: “Cảm ơn bạn đã mời mình, nhưng cuối tuần này mình phải về nhà với gia đình, có lẽ không tham gia được rồi.”"}, {"t": 725.1, "zh": "这句话很自然啊。先感谢对方，再说明自己已经有安排。", "py": "Zhè jù huà hěn zìrán a. Xiān gǎnxiè duìfāng, zài shuōmíng zìjǐ yǐjing yǒu ānpái.", "vi": "Câu này rất tự nhiên. Cảm ơn đối phương trước, rồi nói rõ mình đã có sắp xếp."}, {"t": 730.7, "zh": "对，而且他没有编一个复杂的理由，也没有让对方一直等答案。如果他真的很想参加，也可以补充一句：“下次有机会我一定去。”", "py": "Duì, érqiě tā méiyǒu biān yí ge fùzá de lǐyóu, yě méiyǒu ràng duìfāng yìzhí děng dáàn. Rúguǒ tā zhēnde hěn xiǎng cānjiā, yě kěyǐ bǔchōng yíjù: \"xiàcì yǒu jīhuì wǒ yídìng qù.\"", "vi": "Đúng, hơn nữa anh không bịa lý do phức tạp, cũng không để đối phương chờ đáp án mãi. Nếu anh thật sự rất muốn tham gia, cũng có thể nói thêm: “Lần sau có dịp mình nhất định đi.”"}, {"t": 742.0, "zh": "可以，但前提是他确实有这个想法，而不是为了结束话题随便答应。", "py": "Kěyǐ, dàn qiántí shì tā quèshí yǒu zhège xiǎngfǎ, ér búshì wèile jiéshù huàtí suíbiàn dāyìng.", "vi": "Được, nhưng điều kiện là anh thật sự có ý đó, chứ không phải nhận lời bừa chỉ để kết thúc câu chuyện."}, {"t": 749.0, "zh": "我明白了，委婉不等于不礼貌，也不等于不说实话。", "py": "Wǒ míngbai le, wěiwǎn bù děngyú bù lǐmào, yě bù děngyú bù shuō shíhuà.", "vi": "Mình hiểu rồi, nói khéo không có nghĩa là bất lịch sự, cũng không có nghĩa là không nói thật."}, {"t": 754.0, "zh": "说得非常好。有时候把事情说明白，反而能让双方都轻松。", "py": "Shuō de fēicháng hǎo. Yǒu shíhou bǎ shìqing shuō míngbai, fǎnér néng ràng shuāngfāng dōu qīngsōng.", "vi": "Nói rất hay. Đôi khi nói rõ ràng mọi chuyện lại khiến cả hai bên đều nhẹ nhõm."}, {"t": 759.3, "zh": "那如果我不想参加，而且以后也不想参加呢？还要说“下次一定”吗？", "py": "Nà rúguǒ wǒ bù xiǎng cānjiā, érqiě yǐhòu yě bù xiǎng cānjiā ne? Háiyào shuō \"xiàcì yídìng\" ma?", "vi": "Vậy nếu mình không muốn tham gia, mà sau này cũng không muốn thì sao? Có cần nói “lần sau nhất định” không?"}, {"t": 765.8, "zh": "不必。如果你并不打算参加，就不用给别人一个没有把握的承诺。你可以说：“谢谢你想到我，不过这次我就不参加了。”", "py": "Búbì. Rúguǒ nǐ bìng bù dǎsuàn cānjiā, jiù búyòng gěi biérén yí ge méiyǒu bǎwò de chéngnuò. Nǐ kěyǐ shuō: \"xièxie nǐ xiǎngdào wǒ, búguò zhècì wǒ jiù bù cānjiā le.\"", "vi": "Không cần. Nếu bạn không định tham gia thì không cần hứa một lời hứa không chắc chắn với người ta. Bạn có thể nói: “Cảm ơn bạn đã nghĩ đến mình, nhưng lần này mình xin không tham gia.”"}, {"t": 776.2, "zh": "对，这句话已经足够礼貌，也没有把对方的邀请说成一件坏事。既表达了自己的选择，也没有评价对方，更没有故意让人难堪。", "py": "Duì, zhè jù huà yǐjing zúgòu lǐmào, yě méiyǒu bǎ duìfāng de yāoqǐng shuō chéng yíjiàn huàishì. Jì biǎodá le zìjǐ de xuǎnzé, yě méiyǒu píngjià duìfāng, gèng méiyǒu gùyì ràng rén nánkān.", "vi": "Đúng, câu này đã đủ lịch sự, cũng không coi lời mời của đối phương là điều xấu. Vừa nói rõ lựa chọn của mình, vừa không đánh giá đối phương, càng không cố ý làm người ta khó xử."}, {"t": 788.2, "zh": "是的，我们可以拒绝一件事情，但不必否定邀请我们的人。", "py": "Shì de, wǒmen kěyǐ jùjué yíjiàn shìqing, dàn búbì fǒudìng yāoqǐng wǒmen de rén.", "vi": "Đúng vậy, chúng ta có thể từ chối một việc, nhưng không cần phủ nhận người mời mình."}, {"t": 793.3, "zh": "那为什么有些人还是觉得，说不出口比说清楚更容易呢？", "py": "Nà wèishénme yǒuxiē rén háishì juéde, shuōbùchūkǒu bǐ shuō qīngchǔ gèng róngyì ne?", "vi": "Vậy tại sao có người vẫn thấy không nói ra dễ hơn là nói rõ?", "sec": "Vì sao khó nói thẳng? Tôn trọng cả hai bên"}, {"t": 798.9, "zh": "因为说不出口的那一刻，我们往往想避免眼前的不舒服，比如害怕对方失望，害怕气氛突然变冷，也害怕关系受到影响。", "py": "Yīnwèi shuōbùchūkǒu de nàyíkè, wǒmen wǎngwǎng xiǎng bìmiǎn yǎnqián de bù shūfu, bǐrú hàipà duìfāng shīwàng, hàipà qìfēn tūrán biànlěng, yě hàipà guānxì shòudào yǐngxiǎng.", "vi": "Vì ở khoảnh khắc không nói ra được, ta thường muốn tránh cảm giác khó chịu trước mắt, ví dụ sợ đối phương thất vọng, sợ không khí đột nhiên lạnh đi, cũng sợ quan hệ bị ảnh hưởng."}, {"t": 809.2, "zh": "所以我们先说一句模糊的话，希望对方能够自己明白。可是如果对方没有明白，我们就得继续解释，甚至重复拒绝。这时候，原本想避免的尴尬，反而可能变得更大。", "py": "Suǒyǐ wǒmen xiān shuō yíjù móhú dehuà, xīwàng duìfāng nénggòu zìjǐ míngbai. Kěshì rúguǒ duìfāng méiyǒu míngbai, wǒmen jiù de jìxù jiěshì, shènzhì chóngfù jùjué. Zhè shíhou, yuánběn xiǎng bìmiǎn de gāngà, fǎnér kěnéng biànde gèng dà.", "vi": "Vì thế ta nói một câu mơ hồ trước, hy vọng đối phương tự hiểu. Nhưng nếu họ không hiểu, ta lại phải giải thích tiếp, thậm chí từ chối lặp lại. Lúc này, sự ngượng ngùng vốn muốn tránh lại có thể lớn hơn."}, {"t": 823.9, "zh": "所以真正照顾对方的感受，不一定是把拒绝藏起来，有时是用温和的方式，把自己的真实情况说清楚。", "py": "Suǒyǐ zhēnzhèng zhàogù duìfāng de gǎnshòu, bù yídìng shì bǎ jùjué cáng qǐlai, yǒushí shì yòng wēnhé de fāngshì, bǎ zìjǐ de zhēnshíqíngkuàng shuō qīngchǔ.", "vi": "Vì vậy thật sự quan tâm đến cảm nhận của người kia không nhất thiết là giấu sự từ chối đi, có khi là dùng cách nhẹ nhàng để nói rõ tình hình thật của mình."}, {"t": 834.2, "zh": "而听到模糊回答的人，也不需要马上追问到一个确定答案。", "py": "Ér tīngdào móhú huídá de rén, yě bù xūyào mǎshàng zhuīwèn dào yí ge quèdìng dáàn.", "vi": "Còn người nghe câu trả lời mơ hồ cũng không cần vội hỏi dồn cho ra một đáp án chắc chắn."}, {"t": 840.0, "zh": "没错，你可以给对方一点时间，也可以观察对方之后的行动。如果对方一直没有回应，我就先把自己的生活安排好，不一直等着。", "py": "Méicuò, nǐ kěyǐ gěi duìfāng yìdiǎn shíjiān, yě kěyǐ guānchá duìfāng zhīhòu de xíngdòng. Rúguǒ duìfāng yìzhí méiyǒu huíyìng, wǒ jiù xiān bǎ zìjǐ de shēnghuó ānpái hǎo, bù yìzhí děng zhe.", "vi": "Đúng vậy, bạn có thể cho đối phương một chút thời gian, cũng có thể quan sát hành động sau đó của họ. Nếu họ mãi không phản hồi, mình sẽ sắp xếp cuộc sống của mình trước, không chờ mãi."}, {"t": 850.5, "zh": "对，不要因为一个没有确定的答复，就把所有计划都停下来。我觉得这也是一种尊重，既尊重别人，也尊重自己的时间。", "py": "Duì, búyào yīnwèi yí ge méiyǒu quèdìng de dáfù, jiù bǎ suǒyǒu jìhuà dōu tíngxiàlái. Wǒ juéde zhè yě shì yìzhǒng zūnzhòng, jì zūnzhòng biérén, yě zūnzhòng zìjǐ de shíjiān.", "vi": "Đúng, đừng vì một câu trả lời chưa chắc chắn mà dừng hết mọi kế hoạch. Mình thấy đây cũng là một dạng tôn trọng, vừa tôn trọng người khác, vừa tôn trọng thời gian của chính mình."}, {"t": 860.8, "zh": "而且我们还要记住，有些人确实不擅长表达自己的想法，有的人怕冲突，有的人怕伤人，也有人只是习惯先考虑别人。", "py": "Érqiě wǒmen háiyào jìzhù, yǒuxiē rén quèshí bú shàncháng biǎodá zìjǐ de xiǎngfǎ, yǒu de rén pà chōngtū, yǒu de rén pà shāngrén, yě yǒurén zhǐshì xíguàn xiān kǎolǜ biérén.", "vi": "Hơn nữa chúng ta cũng cần nhớ, có người quả thật không giỏi diễn đạt suy nghĩ của mình, có người sợ xung đột, có người sợ làm tổn thương người khác, cũng có người chỉ quen nghĩ cho người khác trước."}, {"t": 872.0, "zh": "但我们不能因此认为，所有委婉表达都是一种文化规则。因为每个人的性格不同，同一个人面对不同关系时，表达也可能不同。", "py": "Dàn wǒmen bùnéng yīncǐ rènwéi, suǒyǒu wěiwǎn biǎodá dōu shì yìzhǒng wénhuà guīzé. Yīnwèi měigè rén de xìnggé bùtóng, tóngyígè rén miànduì bùtóng guānxì shí, biǎodá yě kěnéng bùtóng.", "vi": "Nhưng chúng ta không thể vì thế mà cho rằng mọi cách nói khéo đều là quy tắc văn hóa. Vì tính cách mỗi người khác nhau, cùng một người khi đối diện các mối quan hệ khác nhau cách nói cũng có thể khác."}, {"t": 883.9, "zh": "比如面对很熟悉的朋友，他可能会直接说“今天不想出门”，但面对刚认识的同事，他可能会说“不好意思，我今天有点事”。", "py": "Bǐrú miànduì hěn shúxī de péngyou, tā kěnéng huì zhíjiē shuō \"jīntiān bù xiǎng chūmén\", dàn miànduì gāng rènshi de tóngshì, tā kěnéng huì shuō \"bùhǎoyìsī, wǒ jīntiān yǒudiǎn shì\".", "vi": "Ví dụ với người bạn rất thân, anh ấy có thể nói thẳng “hôm nay mình không muốn ra ngoài”, nhưng với đồng nghiệp mới quen, anh có thể nói “xin lỗi, hôm nay mình có chút việc”."}, {"t": 894.6, "zh": "这不一定代表他对同事不真诚，只是双方的熟悉程度不同。", "py": "Zhè bù yídìng dàibiǎo tā duì tóngshì bù zhēnchéng, zhǐshì shuāngfāng de shúxī chéngdù bùtóng.", "vi": "Điều này không nhất thiết có nghĩa là anh không chân thành với đồng nghiệp, chỉ là mức độ thân quen của hai bên khác nhau."}, {"t": 900.4, "zh": "所以理解对方的时候，除了听他说什么，还要看你们是什么关系，也要看他说话的语气、当时的情况，以及后面有没有实际行动。", "py": "Suǒyǐ lǐjiě duìfāng de shíhou, chúle tīng tā shuō shénme, háiyào kàn nǐmen shì shénme guānxì, yě yào kàn tā shuōhuà de yǔqì, dāngshí de qíngkuàng, yǐjí hòumiàn yǒuméiyǒu shíjìxíngdòng.", "vi": "Vì vậy khi hiểu đối phương, ngoài nghe họ nói gì còn phải xem hai người có quan hệ thế nào, cũng phải xem giọng điệu, tình huống lúc đó và sau đó có hành động thực tế không."}, {"t": 911.5, "zh": "如果我还是不确定，可以直接问：“你是真的没空，还是不太方便？”", "py": "Rúguǒ wǒ háishì bú quèdìng, kěyǐ zhíjiē wèn: \"nǐ shì zhēnde méi kòng, háishì bú tài fāngbiàn?\"", "vi": "Nếu mình vẫn không chắc, có thể hỏi thẳng: “Cậu thật sự không rảnh hay không tiện lắm?”"}, {"t": 917.6, "zh": "可以，不过语气要自然，别让对方觉得自己正在接受审问。比如我可以说：“没关系，你不用勉强，有时间再告诉我就好。”", "py": "Kěyǐ, búguò yǔqì yào zìrán, bié ràng duìfāng juéde zìjǐ zhèngzài jiēshòu shěnwèn. Bǐrú wǒ kěyǐ shuō: \"méiguānxì, nǐ búyòng miǎnqiǎng, yǒu shíjiān zài gàosù wǒ jiù hǎo.\"", "vi": "Được, nhưng giọng điệu phải tự nhiên, đừng để đối phương cảm thấy như đang bị thẩm vấn. Ví dụ mình có thể nói: “Không sao, cậu đừng cố, khi nào có thời gian cho mình biết là được.”"}, {"t": 927.3, "zh": "这句话给了对方选择的空间，也让他更容易表达真实想法。如果他确实很忙，就可以放心安排自己的事情，不必担心伤害我。如果他其实不想去，也不用编很多理由才能结束这次邀请。", "py": "Zhè jù huà gěi le duìfāng xuǎnzé de kōngjiān, yě ràng tā gèng róngyì biǎodá zhēnshí xiǎngfǎ. Rúguǒ tā quèshí hěn máng, jiù kěyǐ fàngxīn ānpái zìjǐ de shìqing, búbì dānxīn shānghài wǒ. Rúguǒ tā qíshí bù xiǎng qù, yě búyòng biān hěnduō lǐyóu cáinéng jiéshù zhècì yāoqǐng.", "vi": "Câu này cho đối phương không gian lựa chọn, cũng giúp họ dễ nói ra suy nghĩ thật. Nếu họ thật sự bận, họ có thể yên tâm lo việc của mình, không cần sợ làm mình tổn thương. Nếu họ thật ra không muốn đi, cũng không cần bịa nhiều lý do mới kết thúc được lời mời này."}, {"t": 943.8, "zh": "我觉得这比反复问“你到底有没有空”要舒服得多。", "py": "Wǒ juéde zhè bǐ fǎnfù wèn \"nǐ dàodǐ yǒuméiyǒu kòng\" yào shūfu de duō.", "vi": "Mình thấy cách này dễ chịu hơn nhiều so với hỏi đi hỏi lại “rốt cuộc cậu có rảnh không”."}, {"t": 949.1, "zh": "是的，关系里的理解不应该只靠猜，也应该靠双方的沟通。", "py": "Shì de, guānxì lǐ de lǐjiě bù yīnggāi zhǐ kào cāi, yě yīnggāi kào shuāngfāng de gōutōng.", "vi": "Đúng vậy, sự thấu hiểu trong một mối quan hệ không nên chỉ dựa vào đoán, mà cũng nên dựa vào trao đổi giữa hai bên."}, {"t": 954.7, "zh": "我们今天讲了很多表达，我想最后复习五个常用的中文词语。", "py": "Wǒmen jīntiān jiǎng le hěnduō biǎodá, wǒ xiǎng zuìhòu fùxí wǔgè chángyòng de zhōngwén cíyǔ.", "vi": "Hôm nay chúng ta nói nhiều cách diễn đạt, cuối cùng mình muốn ôn năm từ tiếng Trung hay dùng.", "sec": "Năm từ vựng cần nhớ và tổng kết"}, {"t": 960.0, "zh": "第一个是“委婉”，意思是表达得比较柔和，不那么直接。比如，委婉地拒绝别人，可以减少当面拒绝带来的尴尬。", "py": "Dìyígè shì \"wěiwǎn\", yìsi shì biǎodá de bǐjiào róuhé, bú nàme zhíjiē. Bǐrú, wěiwǎn de jùjué biérén, kěyǐ jiǎnshǎo dāngmiàn jùjué dàilái de gāngà.", "vi": "Từ thứ nhất là “委婉”, nghĩa là diễn đạt khá mềm mỏng, không quá thẳng. Ví dụ, từ chối người khác một cách khéo léo có thể giảm sự ngượng ngùng khi từ chối trực tiếp."}, {"t": 971.2, "zh": "第二个是“拒绝”，意思是不接受别人的请求、邀请或者建议。比如，我今天没时间，所以拒绝了朋友的邀请。", "py": "Dìèrgè shì \"jùjué\", yìsi shì bù jiēshòu biérén de qǐngqiú, yāoqǐng huòzhě jiànyì. Bǐrú, wǒ jīntiān méi shíjiān, suǒyǐ jùjué le péngyou de yāoqǐng.", "vi": "Từ thứ hai là “拒绝”, nghĩa là không chấp nhận yêu cầu, lời mời hay đề nghị của người khác. Ví dụ, hôm nay mình không có thời gian nên đã từ chối lời mời của bạn."}, {"t": 981.7, "zh": "第三个是“尴尬”，就是一种不知道该说什么、该怎么做的感觉。比如，对方一直邀请我，而我又不想去，场面就有点尴尬。", "py": "Dìsāngè shì \"gāngà\", jiùshì yìzhǒng bù zhīdao gāi shuō shénme, gāi zěnme zuò de gǎnjué. Bǐrú, duìfāng yìzhí yāoqǐng wǒ, ér wǒ yòu bù xiǎng qù, chǎngmiàn jiù yǒudiǎn gāngà.", "vi": "Từ thứ ba là “尴尬”, là cảm giác không biết nên nói gì, nên làm gì. Ví dụ, đối phương cứ mời mình mà mình lại không muốn đi, không khí sẽ hơi ngượng."}, {"t": 992.1, "zh": "第四个是“安排”，指提前决定一件事情要在什么时间进行。比如，我已经有了周末安排，所以不能参加这次聚会。", "py": "Dìsìgè shì \"ānpái\", zhǐ tíqián juédìng yíjiàn shìqing yào zài shénme shíjiān jìnxíng. Bǐrú, wǒ yǐjing yǒu le zhōumò ānpái, suǒyǐ bùnéng cānjiā zhècì jùhuì.", "vi": "Từ thứ tư là “安排”, chỉ việc quyết định trước một việc sẽ diễn ra vào lúc nào. Ví dụ, mình đã có kế hoạch cuối tuần nên không thể tham gia buổi tụ họp này."}, {"t": 1002.7, "zh": "第五个是“理解”，意思是不只听见别人的话，也试着明白他的处境。比如，我理解你最近很忙，所以我们可以等有空的时候再见面。", "py": "Dìwǔgè shì \"lǐjiě\", yìsi shì bù zhǐ tīngjiàn biérén dehuà, yě shì zhe míngbai tā de chǔjìng. Bǐrú, wǒ lǐjiě nǐ zuìjìn hěn máng, suǒyǐ wǒmen kěyǐ děng yǒu kòng de shíhou zàijiànmiàn.", "vi": "Từ thứ năm là “理解”, nghĩa là không chỉ nghe lời người khác mà còn cố hiểu hoàn cảnh của họ. Ví dụ, mình hiểu dạo này bạn rất bận nên chúng ta có thể đợi khi rảnh rồi gặp."}, {"t": 1014.8, "zh": "这五个词都很实用，希望你以后在真实对话里，也能听懂它们。", "py": "Zhè wǔgè cí dōu hěn shíyòng, xīwàng nǐ yǐhòu zài zhēnshí duìhuà lǐ, yě néng tīngdǒng tāmen.", "vi": "Năm từ này đều rất thiết thực, mong sau này trong hội thoại thật bạn cũng nghe hiểu được chúng."}, {"t": 1020.2, "zh": "我现在觉得，听懂中文不只是知道每个词的意思，还要知道对方为什么这样说，以及他当时可能面对什么情况。", "py": "Wǒ xiànzài juéde, tīngdǒng zhōngwén bù zhǐshì zhīdao měigè cí de yìsi, háiyào zhīdao duìfāng wèishénme zhèyàng shuō, yǐjí tā dāngshí kěnéng miànduì shénme qíngkuàng.", "vi": "Giờ mình thấy, nghe hiểu tiếng Trung không chỉ là biết nghĩa từng từ, mà còn phải biết vì sao đối phương nói vậy và lúc đó họ có thể đang đối mặt với tình huống gì."}, {"t": 1029.8, "zh": "如果有人说“maybe”，我就不会马上认定他答应了，也不会认定他拒绝了。", "py": "Rúguǒ yǒurén shuō \"maybe\", wǒ jiù búhuì mǎshàng rèndìng tā dāyìng le, yě búhuì rèndìng tā jùjué le.", "vi": "Nếu có người nói “maybe”, mình sẽ không vội cho rằng họ đã nhận lời, cũng không cho rằng họ đã từ chối."}, {"t": 1036.5, "zh": "对，因为“maybe”不一定是“yes”，也不一定是“no”。我们要看整个情景，也要看对方接下来怎么做。", "py": "Duì, yīnwèi \"maybe\" bù yídìng shì \"yes\", yě bù yídìng shì \"no\". Wǒmen yào kàn zhěnggè qíngjǐng, yě yào kàn duìfāng jiēxiàlái zěnme zuò.", "vi": "Đúng, vì “maybe” không nhất định là “yes”, cũng không nhất định là “no”. Chúng ta phải xem toàn bộ bối cảnh, cũng phải xem đối phương làm gì tiếp theo."}, {"t": 1044.9, "zh": "当然，我们也可以用更清楚、更温和的方式表达自己的真实想法，这样既能照顾别人的感受，也能减少不必要的误会。", "py": "Dāngrán, wǒmen yě kěyǐ yòng gèng qīngchǔ, gèng wēnhé de fāngshì biǎodá zìjǐ de zhēnshí xiǎngfǎ, zhèyàng jì néng zhàogù biérén de gǎnshòu, yě néng jiǎnshǎo búbìyào de wùhuì.", "vi": "Đương nhiên, chúng ta cũng có thể dùng cách rõ ràng hơn, nhẹ nhàng hơn để nói suy nghĩ thật của mình, vừa quan tâm cảm nhận người khác, vừa giảm những hiểu lầm không cần thiết."}, {"t": 1055.8, "zh": "希望今天的故事，能帮你更自然地理解中国人的日常对话。", "py": "Xīwàng jīntiān de gùshì, néng bāng nǐ gèng zìrán de lǐjiě zhōngguó rén de rìcháng duìhuà.", "vi": "Mong câu chuyện hôm nay giúp bạn hiểu hội thoại đời thường của người Trung Quốc một cách tự nhiên hơn."}, {"t": 1060.9, "zh": "今天的故事就到这里，我们下次见。", "py": "Jīntiān de gùshì jiù dào zhè lǐ, wǒmen xiàcì jiàn.", "vi": "Câu chuyện hôm nay đến đây thôi, hẹn gặp lại lần sau."}, {"t": 1065.0, "zh": "下次见。", "py": "Xiàcì jiàn.", "vi": "Hẹn gặp lại."}]},
{id:"l5",zh:"为什么学了很久还是不会说中文？",vi:"Vì sao học lâu rồi vẫn không biết nói tiếng Trung?",level:"HSK 1–2",audio:"episode5.mp3",

vis:["Ừm, ngữ pháp câu này sai rồi.", "Bạn sẽ rất có cảm giác thành tựu.", "Có phải cô ấy cũng sợ nói sai không?", "Đúng. Mắc lỗi là một phần của việc học.", "Ừm, với người mới học thì đúng là vậy.", "Anh ta học thuộc hết mọi lý thuyết.", "Ha ha, cách này thú vị quá.", "Nghĩ đi nghĩ lại, cuối cùng bỏ cuộc, không nói nữa.", "Tự nói chuyện một mình? Là tự nói chuyện với chính mình sao?", "Ngữ pháp phải đúng, dùng từ phải đúng, phát âm cũng phải đúng.", "Từ đó trở đi, mình bắt đầu trở nên dũng cảm hơn.", "Hai bên có thể trở thành bạn bè, trở thành bạn học ngôn ngữ của nhau.", "Nhưng càng nghĩ như vậy, cô ấy càng nói không ra.", "Vì sao chứ? Anh ta đã học nhiều kiến thức như vậy rồi mà.", "Hoàn toàn đúng! Học nói tiếng Trung cũng y hệt như vậy.", "Nói xong mặt mình đỏ bừng. Mình thấy xấu hổ quá.", "Ví dụ bạn đọc sách, nhận mặt chữ Hán, nghe podcast của chúng mình.", "Dĩ nhiên là có. Mình là người khá thích theo đuổi sự hoàn hảo.", "Nạp vào? Xuất ra? Nghĩa là gì vậy? Nghe hơi giống từ của máy tính.", "Đến khi mình nghĩ xong thì người ta đã chuyển sang chủ đề tiếp theo rồi.", "Cách này hay quá, rất hợp với những bạn khá nhút nhát.", "Những điều đó đều không phải vấn đề. Bạn có thể tự tạo ra môi trường tiếng Trung cho riêng mình.", "À, đây chính là vấn đề trước đây của mình mà mình vừa nói. Theo đuổi sự hoàn hảo.", "Không có em bé nào lúc mới tập đi mà không bị ngã.", "Cũng không có ai lúc mới tập nói mà không mắc lỗi.", "Thứ hai, bạn sẽ không sợ, vì không có ai nghe, nói sai cũng không sao.", "Cách này cũng rất tốt. Vì bạn có một đối tượng giao tiếp thật.", "Mình nói sai thì cứ sai. Quan trọng là mình đã nói! Mình đã diễn đạt được ý của mình.", "Mình nghĩ nhiều bạn đang nghe podcast của chúng ta có lẽ cũng gặp vấn đề y hệt.", "Được. Hôm nay chúng ta đã nói về việc vì sao bạn học lâu rồi mà vẫn không biết nói tiếng Trung.", "Đúng vậy. Trong đầu mình có rất nhiều ý, nhưng cái miệng cứ không chịu nghe lời.", "Ví dụ nếu dưới nhà bạn có cửa hàng bán trái cây, bạn có thể đến trò chuyện với bà chủ.", "Anh ấy hoàn toàn hiểu ý mình! Anh ấy chẳng thấy ngữ pháp của mình kỳ lạ chút nào.", "Mình nhớ đến một học trò của mình tên là Mary. Cô ấy có một vấn đề rất điển hình.", "Hơi giống. Mình có một ví dụ hay hơn. Mình thấy học nói tiếng Trung giống như học bơi vậy.", "Vì anh ta chưa bao giờ xuống nước mà! Cơ thể anh ta không biết ở dưới nước là cảm giác thế nào.", "Mình có một cách rất đơn giản mà ai cũng làm được. Đó là: tự nói chuyện một mình.", "Đúng! Cô ấy muốn nói một câu giống hệt người Trung Quốc thật, không sai một chút nào.", "Cậu thử nghĩ, nếu có một người muốn học bơi. Anh ta mua rất nhiều sách về bơi lội, mỗi ngày ở nhà đọc.", "Đúng. Hãy dũng cảm mở miệng ra, đó là bước đầu tiên và cũng là bước quan trọng nhất để học nói tiếng Trung.", "Mình nhớ lại hồi mới học tiếng Anh. Mình biết rất nhiều từ, trên sách thì đọc hiểu hết.", "Đúng đúng đúng, chính là một bức tường! Cậu nói hay quá. Hồi trước học ngoại ngữ cậu có cảm giác này không?", "Mình không nói nổi một câu. Mình sợ phát âm sai, sợ câu sai, sợ các bạn cười mình.", "Đợi sau này bạn nói ngày càng giỏi, tự nhiên sẽ nói ra được câu hoàn hảo, một trăm điểm đó.", "Mary là một học trò rất chăm chỉ. Cô ấy học tiếng Trung hai năm rồi, biết có khi còn nhiều chữ Hán hơn cả mình.", "Đúng. Hơn nữa, khi trò chuyện với người thật, bạn sẽ học được nhiều cách nói rất bản xứ mà sách không có.", "Vì vậy, các bạn đang nghe podcast của chúng mình, mình muốn nói với các bạn: xin đừng sợ. Nói sai thật sự không sao."],
