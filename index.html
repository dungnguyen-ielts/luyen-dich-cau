lines:[{"t": 2.0, "zh": "我更喜欢网上购物，不过有些东西，我还是会去商店买。", "py": "Wǒ gèng xǐhuan wǎngshàng gòuwù, búguò yǒuxiē dōngxi, wǒ háishì huì qù shāngdiàn mǎi.", "vi": "Mình thích mua sắm online hơn, nhưng có vài thứ mình vẫn sẽ ra cửa hàng mua.", "sec": "Câu trả lời mẫu: mua sắm online hay ra cửa hàng"}, {"t": 5.6, "zh": "先说网上购物的好处。", "py": "Xiān shuō wǎngshàng gòuwù de hǎochù.", "vi": "Nói về điểm tốt của mua sắm online trước.", "sec": "Điểm tốt của mua sắm online"}, {"t": 7.9, "zh": "第一，很方便。", "py": "Dìyī, hěn fāngbiàn.", "vi": "Thứ nhất, rất tiện."}, {"t": 9.7, "zh": "不用出门，在手机上点几下，过两三天东西就送到家里了。", "py": "Búyòng chūmén, zài shǒujī shàng diǎn jǐ xià, guò liǎng sān tiān dōngxi jiù sòngdào jiālǐ le.", "vi": "Không cần ra khỏi nhà, bấm vài cái trên điện thoại, hai ba ngày sau đồ đã được giao tới nhà."}, {"t": 14.8, "zh": "我平时工作很忙，没有时间逛街，所以网上购物帮了我很大的忙。", "py": "Wǒ píngshí gōngzuò hěn máng, méiyǒu shíjiān guàngjiē, suǒyǐ wǎngshàng gòuwù bāng le wǒ hěn dà de máng.", "vi": "Ngày thường mình làm việc rất bận, không có thời gian đi dạo phố, nên mua sắm online giúp mình rất nhiều."}, {"t": 20.9, "zh": "第二，选择多，价格也常常比商店便宜。", "py": "Dì èr, xuǎnzé duō, jiàgé yě chángcháng bǐ shāngdiàn piányi.", "vi": "Thứ hai, lựa chọn nhiều, giá cũng thường rẻ hơn cửa hàng."}, {"t": 24.6, "zh": "我可以在不同的网店比较一下，再决定买哪一个。", "py": "Wǒ kěyǐ zài bùtóng de wǎngdiàn bǐjiào yíxià, zài juédìng mǎi nǎ yí ge.", "vi": "Mình có thể so sánh giữa các cửa hàng online khác nhau rồi mới quyết định mua cái nào."}, {"t": 28.9, "zh": "不过，网上购物也有问题。", "py": "Búguò, wǎngshàng gòuwù yě yǒu wèntí.", "vi": "Nhưng mua sắm online cũng có vấn đề.", "sec": "Vấn đề và lựa chọn cuối cùng"}, {"t": 31.7, "zh": "有时候收到的东西和照片不一样，退货还很麻烦。", "py": "Yǒu shíhou shōudào de dōngxi hé zhàopiān bù yíyàng, tuìhuò hái hěn máfán.", "vi": "Đôi khi đồ nhận được khác với ảnh, trả hàng cũng rất phiền."}, {"t": 36.2, "zh": "所以像衣服、鞋子这些需要试穿的东西，我更愿意去商店买。", "py": "Suǒyǐ xiàng yīfú, xiézi zhèxiē xūyào shìchuān de dōngxi, wǒ gèng yuànyì qù shāngdiàn mǎi.", "vi": "Vì vậy những thứ cần mặc thử như quần áo, giày dép, mình thích ra cửa hàng mua hơn."}, {"t": 41.8, "zh": "总的来说，我觉得两种方式各有各的好处。", "py": "Zǒng de lái shuō, wǒ juéde liǎng zhǒng fāngshì gè yǒu gè de hǎochù.", "vi": "Nói tóm lại, mình thấy hai cách đều có cái hay riêng."}, {"t": 45.6, "zh": "平时买日用品，我会在网上买；买衣服的时候，我会去商店。", "py": "Píngshí mǎi rìyòngpǐn, wǒ huì zài wǎngshàng mǎi; mǎi yīfú de shíhou, wǒ huì qù shāngdiàn.", "vi": "Ngày thường mua đồ dùng hằng ngày thì mình mua online; lúc mua quần áo thì mình ra cửa hàng."}]},

vis:["Bạn thường thư giãn bằng cách nào?", "Ngoài vận động, mình còn thích nghe nhạc.", "Ngày thường mình thích thư giãn bằng vận động.", "Chỉ khi nghỉ ngơi tốt, mới có tinh thần hơn để làm việc và học tập.", "Ví dụ khi làm việc mệt, mình sẽ ra công viên chạy bộ hoặc chơi bóng.", "Vì vậy dù bận đến đâu, mình cũng dành cho bản thân một chút thời gian thư giãn.", "Ở bên bạn bè, bọn mình có thể kể về cuộc sống và công việc dạo này, động viên lẫn nhau.", "Mình thấy thư giãn rất quan trọng, vì nhịp sống bây giờ rất nhanh, áp lực cũng lớn.", "Đổ một thân mồ hôi xong, tâm trạng tốt lên nhiều, phiền muộn cũng như biến mất trong chốc lát.", "Mỗi tối trước khi đi ngủ, mình đều nghe nhạc nhẹ nửa tiếng, như vậy ngủ ngon hơn.", "Ngoài ra, cuối tuần mình sẽ cùng bạn bè uống cà phê, trò chuyện, hoặc đi xem một bộ phim."],

lines:[{"t": 0.0, "zh": "你平时怎么放松心情？", "py": "Nǐ píngshí zěnme fàngsōng xīnqíng?", "vi": "Bạn thường thư giãn bằng cách nào?", "sec": "Câu hỏi"}, {"t": 2.4, "zh": "我平时喜欢通过运动来放松心情。", "py": "Wǒ píngshí xǐhuan tōngguò yùndòng lái fàngsōng xīnqíng.", "vi": "Ngày thường mình thích thư giãn bằng vận động.", "sec": "Thư giãn bằng vận động"}, {"t": 5.6, "zh": "比如工作累了的时候，我会去公园跑步或者打球。", "py": "Bǐrú gōngzuò lèile de shíhou, wǒ huì qù gōngyuán pǎobù huòzhě dǎqiú.", "vi": "Ví dụ khi làm việc mệt, mình sẽ ra công viên chạy bộ hoặc chơi bóng."}, {"t": 10.1, "zh": "出一身汗以后，心情就会好很多，烦恼也好像一下子都不见了。", "py": "Chū yì shēn hàn yǐhòu, xīnqíng jiù huì hǎo hěn duō, fánnǎo yě hǎoxiàng yíxiàzi dōu bújiàn le.", "vi": "Đổ một thân mồ hôi xong, tâm trạng tốt lên nhiều, phiền muộn cũng như biến mất trong chốc lát."}, {"t": 15.8, "zh": "除了运动，我还喜欢听音乐。", "py": "Chúle yùndòng, wǒ hái xǐhuan tīng yīnyuè.", "vi": "Ngoài vận động, mình còn thích nghe nhạc.", "sec": "Âm nhạc và bạn bè"}, {"t": 18.4, "zh": "每天晚上睡觉以前，我都会听半个小时轻音乐，这样能睡得更香。", "py": "Měitiān wǎnshàng shuìjiào yǐqián, wǒ dōu huì tīng bàn ge xiǎoshí qīngyīnyuè, zhèyàng néng shuì de gèng xiāng.", "vi": "Mỗi tối trước khi đi ngủ, mình đều nghe nhạc nhẹ nửa tiếng, như vậy ngủ ngon hơn."}, {"t": 24.1, "zh": "另外，周末的时候，我会和朋友一起喝咖啡、聊天，或者去看一场电影。", "py": "Lìngwài, zhōumò de shíhou, wǒ huì hé péngyou yìqǐ hē kāfēi, liáotiān, huòzhě qù kàn yì chǎng diànyǐng.", "vi": "Ngoài ra, cuối tuần mình sẽ cùng bạn bè uống cà phê, trò chuyện, hoặc đi xem một bộ phim."}, {"t": 30.1, "zh": "和朋友在一起，我们可以说说最近的生活和工作，互相鼓励。", "py": "Hé péngyou zài yìqǐ, wǒmen kěyǐ shuōshuo zuìjìn de shēnghuó hé gōngzuò, hùxiāng gǔlì.", "vi": "Ở bên bạn bè, bọn mình có thể kể về cuộc sống và công việc dạo này, động viên lẫn nhau."}, {"t": 35.1, "zh": "我觉得放松非常重要，因为现在生活节奏很快，压力也很大。", "py": "Wǒ juéde fàngsōng fēicháng zhòngyào, yīnwèi xiànzài shēnghuó jiézòu hěn kuài, yālì yě hěn dà.", "vi": "Mình thấy thư giãn rất quan trọng, vì nhịp sống bây giờ rất nhanh, áp lực cũng lớn.", "sec": "Vì sao thư giãn quan trọng"}, {"t": 40.7, "zh": "只有休息好了，才能更有精神地工作和学习。", "py": "Zhǐyǒu xiūxi hǎo le, cáinéng gèng yǒu jīngshen de gōngzuò hé xuéxí.", "vi": "Chỉ khi nghỉ ngơi tốt, mới có tinh thần hơn để làm việc và học tập."}, {"t": 44.6, "zh": "所以不管多忙，我都会给自己留一点儿放松的时间。", "py": "Suǒyǐ bùguǎn duō máng, wǒ dōu huì gěi zìjǐ liú yìdiǎnr fàngsōng de shíjiān.", "vi": "Vì vậy dù bận đến đâu, mình cũng dành cho bản thân một chút thời gian thư giãn."}]},

hl:{"v": [["困难", "kùnnán", "khó khăn"], ["坚持", "jiānchí", "kiên trì"], ["热情", "rèqíng", "nhiệt tình, hào hứng"], ["词汇", "cíhuì", "từ vựng"], ["语法", "yǔfǎ", "ngữ pháp"], ["放弃", "fàngqì", "bỏ cuộc"], ["环境", "huánjìng", "môi trường"], ["开口", "kāikǒu", "mở miệng nói"], ["复习", "fùxí", "ôn tập"], ["模仿", "mófǎng", "bắt chước"], ["进步", "jìnbù", "tiến bộ"], ["耐心", "nàixīn", "kiên nhẫn"]], "g": [{"t": "越来越…", "re": "越来越[^，。]", "k": [], "vi": "càng ngày càng…", "n": "Diễn tả mức độ tăng dần: 越来越多, 越来越难."}, {"t": "除此以外", "re": "除此以外", "k": [], "vi": "ngoài ra", "n": "Dùng để thêm một ý khác sau khi đã nêu ý đầu."}, {"t": "如果…就…", "re": "如果[^。]{1,14}就", "k": ["如果", "就"], "vi": "nếu… thì…", "n": "Giả thiết và kết quả: 如果没有机会开口，就很容易忘."}, {"t": "只要…", "re": "只要[^，。]{1,6}", "k": ["只要"], "vi": "chỉ cần…", "n": "Điều kiện đủ; vế sau hay đi với 就, 都 hoặc 一定."}, {"t": "一…就…", "re": "一有空就", "k": ["一", "就"], "vi": "hễ… là…", "n": "Hai việc nối tiếp nhau ngay: 一有空就看一看."}, {"t": "把字句", "re": "把[^，。]{2,14}上", "k": ["把"], "vi": "đưa tân ngữ lên trước động từ", "n": "把 + đối tượng + động từ + vị trí: 把新词写在本子上."}]},
raw:[["很多人就想放弃了。", "很|hěn,多|duō,人|rén,就|jiù,想|xiǎng,放弃|fàngqì,了|le", ""], ["词汇越来越多，语法也越来越难。", "词汇|cíhuì,越来越|yuèláiyuè,多|duō,语法|yǔfǎ,也|yě,越来越|yuèláiyuè,难|nán", ""], ["刚开始学的时候，大家都很有热情。", "刚|gāng,开始|kāishǐ,学|xué,的|de,时候|shíhou,大家|dàjiā,都|dōu,很|hěn,有|yǒu,热情|rèqíng", ""], ["你觉得学习外语最大的困难是什么？", "你|nǐ,觉得|juéde,学习|xuéxí,外语|wàiyǔ,最大|zuìdà,的|de,困难|kùnnán,是|shì,什么|shénme", ""], ["我觉得学习外语最大的困难是坚持。", "我|wǒ,觉得|juéde,学习|xuéxí,外语|wàiyǔ,最大|zuìdà,的|de,困难|kùnnán,是|shì,坚持|jiānchí", ""], ["除此以外，缺少说外语的环境也是一个问题。", "除此|chúcǐ,以外|yǐwài,缺少|quēshǎo,说|shuō,外语|wàiyǔ,的|de,环境|huánjìng,也|yě,是|shì,一|yí,个|ge,问题|wèntí", ""], ["如果平时没有机会开口，就很容易学了就忘。", "如果|rúguǒ,平时|píngshí,没有|méiyǒu,机会|jīhuì,开口|kāikǒu,就|jiù,很|hěn,容易|róngyì,学|xué,了|le,就|jiù,忘|wàng", ""], ["语言不是一两天就能学好的，最重要的是有耐心。", "语言|yǔyán,不是|búshì,一|yì,两|liǎng,天|tiān,就|jiù,能|néng,学好|xuéhǎo,的|de,最|zuì,重要|zhòngyào,的|de,是|shì,有|yǒu,耐心|nàixīn", ""], ["我认为只要方法对，而且不放弃，进步一定会很明显。", "我|wǒ,认为|rènwéi,只要|zhǐyào,方法|fāngfǎ,对|duì,而且|érqiě,不|bù,放弃|fàngqì,进步|jìnbù,一定|yídìng,会|huì,很|hěn,明显|míngxiǎn", ""], ["我还会把每天学到的新词写在本子上，一有空就看一看。", "我|wǒ,还|hái,会|huì,把|bǎ,每天|měitiān,学|xué,到|dào,的|de,新词|xīncí,写|xiě,在|zài,本子|běnzi,上|shàng,一|yì,有空|yǒukòng,就|jiù,看|kàn,一|yi,看|kàn", ""], ["我自己的办法是每天花半个小时复习，而且尽量找机会开口说。", "我|wǒ,自己|zìjǐ,的|de,办法|bànfǎ,是|shì,每天|měitiān,花|huā,半|bàn,个|ge,小时|xiǎoshí,复习|fùxí,而且|érqiě,尽量|jǐnliàng,找|zhǎo,机会|jīhuì,开口|kāikǒu,说|shuō", ""], ["比如我会跟朋友用汉语聊天，有时候也会看中文电影，模仿里面的发音。", "比如|bǐrú,我|wǒ,会|huì,跟|gēn,朋友|péngyou,用|yòng,汉语|hànyǔ,聊天|liáotiān,有时候|yǒushíhou,也|yě,会|huì,看|kàn,中文|zhōngwén,电影|diànyǐng,模仿|mófǎng,里面|lǐmiàn,的|de,发音|fāyīn", ""]],
vis:["Nhiều người bắt đầu muốn bỏ cuộc.", "Từ vựng càng ngày càng nhiều, ngữ pháp cũng càng ngày càng khó.", "Lúc mới bắt đầu học, ai cũng rất hào hứng.", "Theo bạn, khó khăn lớn nhất khi học ngoại ngữ là gì?", "Mình thấy khó khăn lớn nhất khi học ngoại ngữ là sự kiên trì.", "Ngoài ra, thiếu môi trường để nói ngoại ngữ cũng là một vấn đề.", "Nếu ngày thường không có cơ hội mở miệng nói, rất dễ học xong là quên.", "Ngôn ngữ không phải học một hai ngày là giỏi, quan trọng nhất là có kiên nhẫn.", "Mình cho rằng chỉ cần phương pháp đúng và không bỏ cuộc, tiến bộ nhất định sẽ rất rõ.", "Mình còn ghi những từ mới học mỗi ngày vào vở, hễ rảnh là xem lại.", "Cách của mình là mỗi ngày dành nửa tiếng ôn bài, và cố gắng tìm cơ hội để nói.", "Ví dụ mình sẽ trò chuyện với bạn bè bằng tiếng Trung, đôi khi cũng xem phim tiếng Trung, bắt chước cách phát âm trong đó."],

lines:[{"t": 0.0, "zh": "你觉得学习外语最大的困难是什么？", "py": "Nǐ juéde xuéxí wàiyǔ zuìdà de kùnnán shì shénme?", "vi": "Theo bạn, khó khăn lớn nhất khi học ngoại ngữ là gì?", "sec": "Câu hỏi"}, {"t": 3.5, "zh": "我觉得学习外语最大的困难是坚持。", "py": "Wǒ juéde xuéxí wàiyǔ zuìdà de kùnnán shì jiānchí.", "vi": "Mình thấy khó khăn lớn nhất khi học ngoại ngữ là sự kiên trì.", "sec": "Khó khăn: kiên trì và môi trường"}, {"t": 7.3, "zh": "刚开始学的时候，大家都很有热情，可是过了一段时间，词汇越来越多，语法也越来越难，很多人就想放弃了。", "py": "Gāng kāishǐ xué de shíhou, dàjiā dōu hěn yǒu rèqíng, kěshì guò le yí duàn shíjiān, cíhuì yuè lái yuè duō, yǔfǎ yě yuè lái yuè nán, hěn duō rén jiù xiǎng fàngqì le.", "vi": "Lúc mới bắt đầu học, ai cũng rất hào hứng, nhưng sau một thời gian, từ vựng càng ngày càng nhiều, ngữ pháp cũng càng ngày càng khó, nhiều người bắt đầu muốn bỏ cuộc."}, {"t": 16.9, "zh": "除此以外，缺少说外语的环境也是一个问题。", "py": "Chúcǐ yǐwài, quēshǎo shuō wàiyǔ de huánjìng yě shì yí ge wèntí.", "vi": "Ngoài ra, thiếu môi trường để nói ngoại ngữ cũng là một vấn đề."}, {"t": 21.0, "zh": "如果平时没有机会开口，就很容易学了就忘。", "py": "Rúguǒ píngshí méiyǒu jīhuì kāikǒu, jiù hěn róngyì xué le jiù wàng.", "vi": "Nếu ngày thường không có cơ hội mở miệng nói, rất dễ học xong là quên."}, {"t": 24.8, "zh": "我自己的办法是每天花半个小时复习，而且尽量找机会开口说。", "py": "Wǒ zìjǐ de bànfǎ shì měitiān huā bàn ge xiǎoshí fùxí, érqiě jǐnliàng zhǎo jīhuì kāikǒu shuō.", "vi": "Cách của mình là mỗi ngày dành nửa tiếng ôn bài, và cố gắng tìm cơ hội để nói.", "sec": "Cách của mình"}, {"t": 30.6, "zh": "比如我会跟朋友用汉语聊天，有时候也会看中文电影，模仿里面的发音。", "py": "Bǐrú wǒ huì gēn péngyou yòng hànyǔ liáotiān, yǒu shíhou yě huì kàn zhōngwén diànyǐng, mófǎng lǐmiàn de fāyīn.", "vi": "Ví dụ mình sẽ trò chuyện với bạn bè bằng tiếng Trung, đôi khi cũng xem phim tiếng Trung, bắt chước cách phát âm trong đó."}, {"t": 36.6, "zh": "我还会把每天学到的新词写在本子上，一有空就看一看。", "py": "Wǒ hái huì bǎ měitiān xué dào de xīncí xiě zài běnzi shàng, yì yǒu kòng jiù kàn yi kàn.", "vi": "Mình còn ghi những từ mới học mỗi ngày vào vở, hễ rảnh là xem lại."}, {"t": 41.3, "zh": "我认为只要方法对，而且不放弃，进步一定会很明显。", "py": "Wǒ rènwéi zhǐyào fāngfǎ duì, érqiě bú fàngqì, jìnbù yídìng huì hěn míngxiǎn.", "vi": "Mình cho rằng chỉ cần phương pháp đúng và không bỏ cuộc, tiến bộ nhất định sẽ rất rõ.", "sec": "Kết luận"}, {"t": 46.3, "zh": "语言不是一两天就能学好的，最重要的是有耐心。", "py": "Yǔyán búshì yì liǎng tiān jiù néng xué hǎo de, zuì zhòngyào de shì yǒu nàixīn.", "vi": "Ngôn ngữ không phải học một hai ngày là giỏi, quan trọng nhất là có kiên nhẫn."}]},

|hé,运动|yùndòng", ""], ["相反，如果总是和爱抱怨的人在一起，自己的心情也会受到影响。", "相反|xiāngfǎn,如果|rúguǒ,总是|zǒngshì,和|hé,爱|ài,抱怨|bàoyuàn,的|de,人|rén,在|zài,一起|yìqǐ,自己|zìjǐ,的|de,心情|xīnqíng,也|yě,会|huì,受到|shòudào,影响|yǐngxiǎng", ""], ["当然，我也喜欢有趣的朋友，不过比起有趣，我更看重一个人的品质。", "当然|dāngrán,我|wǒ,也|yě,喜欢|xǐhuan,有趣|yǒuqù,的|de,朋友|péngyou,不过|bùguò,比起|bǐqǐ,有趣|yǒuqù,我|wǒ,更|gèng,看重|kànzhòng,一|yí,个|ge,人|rén,的|de,品质|pǐnzhì", ""], ["看到她那么努力，我也不好意思偷懒，所以我们常常互相鼓励，一起进步。", "看到|kàndào,她|tā,那么|nàme,努力|nǔlì,我|wǒ,也|yě,不好意思|bù hǎoyìsi,偷懒|tōulǎn,所以|suǒyǐ,我们|wǒmen,常常|chángcháng,互相|hùxiāng,鼓励|gǔlì,一起|yìqǐ,进步|jìnbù", ""], ["首先，这样的人总是很乐观，遇到问题的时候，他们不会抱怨，而是想办法解决。", "首先|shǒuxiān,这样|zhèyàng,的|de,人|rén,总是|zǒngshì,很|hěn,乐观|lèguān,遇到|yùdào,问题|wèntí,的|de,时候|shíhou,他们|tāmen,不会|búhuì,抱怨|bàoyuàn,而是|érshì,想|xiǎng,办法|bànfǎ,解决|jiějué", ""], ["当然，每个人都有缺点，我不要求朋友完美，只要他们心态好，愿意努力就可以了。", "当然|dāngrán,每|měi,个|ge,人|rén,都|dōu,有|yǒu,缺点|quēdiǎn,我|wǒ,不|bù,要求|yāoqiú,朋友|péngyou,完美|wánměi,只要|zhǐyào,他们|tāmen,心态|xīntài,好|hǎo,愿意|yuànyì,努力|nǔlì,就|jiù,可以|kěyǐ,了|le", ""], ["去年我搬家的时候，他特意请了一天假来帮我，累得满头大汗，却一点儿也不抱怨。", "去年|qùnián,我|wǒ,搬家|bānjiā,的|de,时候|shíhou,他|tā,特意|tèyì,请|qǐng,了|le,一|yì,天|tiān,假|jià,来|lái,帮|bāng,我|wǒ,累|lèi,得|de,满头大汗|mǎn tóu dà hàn,却|què,一点儿|yìdiǎnr,也|yě,不|bù,抱怨|bàoyuàn", ""], ["还有，性格开朗的人一般很会聊天，聚会的时候气氛不会尴尬，大家都玩得很开心。", "还有|hái yǒu,性格|xìnggé,开朗|kāilǎng,的|de,人|rén,一般|yìbān,很|hěn,会|huì,聊天|liáotiān,聚会|jùhuì,的|de,时候|shíhou,气氛|qìfēn,不会|búhuì,尴尬|gāngà,大家|dàjiā,都|dōu,玩|wán,得|de,很|hěn,开心|kāixīn", ""], ["可靠的人也很重要，比如我遇到困难的时候，他们会主动来帮我，而不是只在旁边看着。", "可靠|kěkào,的|de,人|rén,也|yě,很|hěn,重要|zhòngyào,比如|bǐrú,我|wǒ,遇到|yùdào,困难|kùnnán,的|de,时候|shíhou,他们|tāmen,会|huì,主动|zhǔdòng,来|lái,帮|bāng,我|wǒ,而|ér,不是|búshì,只|zhǐ,在|zài,旁边|pángbiān,看着|kànzhe", ""]],
vis:["Nhưng khi cần thì chắc chắn sẽ xuất hiện.", "Mình thích kết bạn với người chân thành và đáng tin cậy.", "Chỉ khi bạn đối tốt với người khác, người khác mới đối tốt với bạn.", "Ở bên họ, mình cũng trở nên tích cực hơn.", "Bạn thích kết bạn với kiểu người nào? Vì sao?", "Mình có một người bạn học đại học, bạn ấy đúng là người như vậy.", "Vì bạn tốt có thể khiến cuộc sống của chúng ta thêm rực rỡ.", "Mình thích kết bạn với người tính cách cởi mở, tích cực hướng lên.", "Ở bên họ, mình thấy rất thoải mái, không phải lo bị lừa.", "Thứ hai, mình mong bạn bè có điều đáng để mình học hỏi.", "Nói tóm lại, mình thích kết bạn với người tích cực lạc quan hơn.", "Vì vậy mình thấy chân thành đáng tin là điều kiện quan trọng nhất khi kết bạn.", "Vì người chân thành nói chuyện không vòng vo, có gì nói nấy.", "Lúc đó mình rất cảm động, cũng hiểu ra rằng bạn bè thật sự không nhất định ngày nào cũng gặp.", "Ngoài ra, mình cũng đòi hỏi bản thân phải là người chân thành, vì tình bạn là chuyện của hai phía.", "Ví dụ mình có một người bạn, cô ấy làm việc rất bận, nhưng ngày nào cũng kiên trì học tiếng Anh và tập thể thao.", "Ngược lại, nếu cứ ở cùng người hay than phiền, tâm trạng của mình cũng sẽ bị ảnh hưởng.", "Tất nhiên mình cũng thích những người bạn thú vị, nhưng so với thú vị, mình coi trọng phẩm chất của một người hơn.", "Thấy cô ấy chăm chỉ như vậy, mình cũng ngại lười biếng, nên bọn mình thường động viên nhau, cùng tiến bộ.", "Trước hết, những người như vậy luôn rất lạc quan, gặp vấn đề họ không than phiền mà nghĩ cách giải quyết.", "Tất nhiên ai cũng có khuyết điểm, mình không đòi bạn bè phải hoàn hảo, chỉ cần họ có tâm thế tốt, sẵn sàng cố gắng là được.", "Năm ngoái lúc mình chuyển nhà, bạn ấy cố ý xin nghỉ một ngày đến giúp, mệt đến đẫm mồ hôi mà không hề than phiền.", "Còn nữa, người tính cách cởi mở thường rất biết trò chuyện, lúc tụ tập không khí không gượng gạo, ai cũng chơi rất vui.", "Người đáng tin cậy cũng rất quan trọng, ví dụ khi mình gặp khó khăn, họ sẽ chủ động đến giúp, chứ không chỉ đứng bên cạnh nhìn."],

lines:[{"t": 0.0, "zh": "你喜欢和什么样的人交朋友？为什么？", "py": "Nǐ xǐhuan hé shénme yàng de rén jiāo péngyou? Wèishénme?", "vi": "Bạn thích kết bạn với kiểu người nào? Vì sao?", "sec": "Câu hỏi"}, {"t": 5.0, "zh": "我喜欢和真诚、可靠的人交朋友。", "py": "Wǒ xǐhuan hé zhēnchéng, kěkào de rén jiāo péngyou.", "vi": "Mình thích kết bạn với người chân thành và đáng tin cậy.", "sec": "Trả lời 1: chân thành, đáng tin cậy"}, {"t": 8.3, "zh": "因为真诚的人说话不会绕圈子，有什么就说什么，和他们在一起，我觉得很轻松，不用担心被骗。", "py": "Yīnwèi zhēnchéng de rén shuōhuà bú huì rào quānzi, yǒu shénme jiù shuō shénme, hé tāmen zài yìqǐ, wǒ juéde hěn qīngsōng, búyòng dānxīn bèi piàn.", "vi": "Vì người chân thành nói chuyện không vòng vo, có gì nói nấy, ở bên họ mình thấy rất thoải mái, không phải lo bị lừa."}, {"t": 16.8, "zh": "可靠的人也很重要，比如我遇到困难的时候，他们会主动来帮我，而不是只在旁边看着。", "py": "Kěkào de rén yě hěn zhòngyào, bǐrú wǒ yùdào kùnnán de shíhou, tāmen huì zhǔdòng lái bāng wǒ, ér bú shì zhǐ zài pángbiān kànzhe.", "vi": "Người đáng tin cậy cũng rất quan trọng, ví dụ khi mình gặp khó khăn, họ sẽ chủ động đến giúp, chứ không chỉ đứng bên cạnh nhìn."}, {"t": 24.3, "zh": "我有一个大学同学，他就是这样的人。", "py": "Wǒ yǒu yí ge dàxué tóngxué, tā jiù shì zhèyàng de rén.", "vi": "Mình có một người bạn học đại học, bạn ấy đúng là người như vậy."}, {"t": 27.1, "zh": "去年我搬家的时候，他特意请了一天假来帮我，累得满头大汗，却一点儿也不抱怨。", "py": "Qùnián wǒ bānjiā de shíhou, tā tèyì qǐng le yì tiān jià lái bāng wǒ, lèi de mǎn tóu dà hàn, què yìdiǎnr yě bú bàoyuàn.", "vi": "Năm ngoái lúc mình chuyển nhà, bạn ấy cố ý xin nghỉ một ngày đến giúp, mệt đến đẫm mồ hôi mà không hề than phiền."}, {"t": 33.9, "zh": "那时候我很感动，也明白了真正的朋友不一定天天见面，但是需要的时候一定会出现。", "py": "Nà shíhou wǒ hěn gǎndòng, yě míngbai le zhēnzhèng de péngyou bù yídìng tiāntiān jiànmiàn, dànshì xūyào de shíhou yídìng huì chūxiàn.", "vi": "Lúc đó mình rất cảm động, cũng hiểu ra rằng bạn bè thật sự không nhất định ngày nào cũng gặp, nhưng khi cần thì chắc chắn sẽ xuất hiện."}, {"t": 41.8, "zh": "另外，我也会要求自己做一个真诚的人，因为友谊是互相的。", "py": "Lìngwài, wǒ yě huì yāoqiú zìjǐ zuò yí ge zhēnchéng de rén, yīnwèi yǒuyì shì hùxiāng de.", "vi": "Ngoài ra, mình cũng đòi hỏi bản thân phải là người chân thành, vì tình bạn là chuyện của hai phía."}, {"t": 46.8, "zh": "只有你对别人好，别人才会对你好。", "py": "Zhǐyǒu nǐ duì biérén hǎo, biérén cái huì duì nǐ hǎo.", "vi": "Chỉ khi bạn đối tốt với người khác, người khác mới đối tốt với bạn."}, {"t": 50.0, "zh": "当然，我也喜欢有趣的朋友，不过比起有趣，我更看重一个人的品质。", "py": "Dāngrán, wǒ yě xǐhuan yǒuqù de péngyou, búguò bǐqǐ yǒuqù, wǒ gèng kànzhòng yí ge rén de pǐnzhì.", "vi": "Tất nhiên mình cũng thích những người bạn thú vị, nhưng so với thú vị, mình coi trọng phẩm chất của một người hơn."}, {"t": 56.0, "zh": "所以，我觉得真诚可靠是交朋友最重要的条件。", "py": "Suǒyǐ, wǒ juéde zhēnchéng kěkào shì jiāo péngyou zuì zhòngyào de tiáojiàn.", "vi": "Vì vậy mình thấy chân thành đáng tin là điều kiện quan trọng nhất khi kết bạn."}, {"t": 62.1, "zh": "我喜欢和性格开朗、积极向上的人交朋友。", "py": "Wǒ xǐhuan hé xìnggé kāilǎng, jījí xiàngshàng de rén jiāo péngyou.", "vi": "Mình thích kết bạn với người tính cách cởi mở, tích cực hướng lên.", "sec": "Trả lời 2: cởi mở, tích cực"}, {"t": 66.1, "zh": "首先，这样的人总是很乐观，遇到问题的时候，他们不会抱怨，而是想办法解决。", "py": "Shǒuxiān, zhèyàng de rén zǒngshì hěn lèguān, yùdào wèntí de shíhou, tāmen bú huì bàoyuàn, érshì xiǎng bànfǎ jiějué.", "vi": "Trước hết, những người như vậy luôn rất lạc quan, gặp vấn đề họ không than phiền mà nghĩ cách giải quyết."}, {"t": 72.9, "zh": "和他们在一起，我也会变得更积极。", "py": "Hé tāmen zài yìqǐ, wǒ yě huì biàn de gèng jījí.", "vi": "Ở bên họ, mình cũng trở nên tích cực hơn."}, {"t": 76.1, "zh": "其次，我希望朋友身上有值得我学习的地方。", "py": "Qícì, wǒ xīwàng péngyou shēnshàng yǒu zhíde wǒ xuéxí de dìfang.", "vi": "Thứ hai, mình mong bạn bè có điều đáng để mình học hỏi."}, {"t": 80.0, "zh": "比如我有一个朋友，她工作很忙，可是每天都坚持学英语和运动。", "py": "Bǐrú wǒ yǒu yí ge péngyou, tā gōngzuò hěn máng, kěshì měitiān dōu jiānchí xué yīngyǔ hé yùndòng.", "vi": "Ví dụ mình có một người bạn, cô ấy làm việc rất bận, nhưng ngày nào cũng kiên trì học tiếng Anh và tập thể thao."}, {"t": 85.9, "zh": "看到她那么努力，我也不好意思偷懒，所以我们常常互相鼓励，一起进步。", "py": "Kàndào tā nàme nǔlì, wǒ yě bù hǎoyìsi tōulǎn, suǒyǐ wǒmen chángcháng hùxiāng gǔlì, yìqǐ jìnbù.", "vi": "Thấy cô ấy chăm chỉ như vậy, mình cũng ngại lười biếng, nên bọn mình thường động viên nhau, cùng tiến bộ."}, {"t": 92.3, "zh": "还有，性格开朗的人一般很会聊天，聚会的时候气氛不会尴尬，大家都玩得很开心。", "py": "Hái yǒu, xìnggé kāilǎng de rén yìbān hěn huì liáotiān, jùhuì de shíhou qìfēn bú huì gāngà, dàjiā dōu wán de hěn kāixīn.", "vi": "Còn nữa, người tính cách cởi mở thường rất biết trò chuyện, lúc tụ tập không khí không gượng gạo, ai cũng chơi rất vui."}, {"t": 99.4, "zh": "相反，如果总是和爱抱怨的人在一起，自己的心情也会受到影响。", "py": "Xiāngfǎn, rúguǒ zǒngshì hé ài bàoyuàn de rén zài yìqǐ, zìjǐ de xīnqíng yě huì shòudào yǐngxiǎng.", "vi": "Ngược lại, nếu cứ ở cùng người hay than phiền, tâm trạng của mình cũng sẽ bị ảnh hưởng."}, {"t": 104.9, "zh": "当然，每个人都有缺点，我不要求朋友完美，只要他们心态好，愿意努力就可以了。", "py": "Dāngrán, měi gè rén dōu yǒu quēdiǎn, wǒ bù yāoqiú péngyou wánměi, zhǐyào tāmen xīntài hǎo, yuànyì nǔlì jiù kěyǐ le.", "vi": "Tất nhiên ai cũng có khuyết điểm, mình không đòi bạn bè phải hoàn hảo, chỉ cần họ có tâm thế tốt, sẵn sàng cố gắng là được."}, {"t": 112.0, "zh": "总的来说，我更喜欢和积极乐观的人做朋友，因为好朋友可以让我们的生活更精彩。", "py": "Zǒng de lái shuō, wǒ gèng xǐhuan hé jījí lèguān de rén zuò péngyou, yīnwèi hǎo péngyou kěyǐ ràng wǒmen de shēnghuó gèng jīngcǎi.", "vi": "Nói tóm lại, mình thích kết bạn với người tích cực lạc quan hơn, vì bạn tốt có thể khiến cuộc sống của chúng ta thêm rực rỡ."}]},

会|huì,觉得|juéde,关系|guānxì,有|yǒu,点|diǎn,生疏|shēngshū", ""], ["用最简单的词配上热情的语气，你的中文立刻就会变得有生命力。", "用|yòng,最|zuì,简单|jiǎndān,的|de,词|cí,配上|pèishàng,热情|rèqíng,的|de,语气|yǔqì,你|nǐ,的|de,中文|zhōngwén,立刻|lìkè,就|jiù,会|huì,变得|biànde,有生命力|yǒushēngmìnglì", ""], ["如果做饭或者招呼你的人看起来像这家店的店主，可以直接叫他老板。", "如果|rúguǒ,做饭|zuòfàn,或者|huòzhě,招呼|zhāohū,你|nǐ,的|de,人|rén,看|kàn,起来|qǐlai,像|xiàng,这家|zhèjiā,店|diàn,的|de,店主|diànzhǔ,可以|kěyǐ,直接|zhíjiē,叫|jiào,他|tā,老板|lǎobǎn", ""], ["但是在绝大多数普通的餐馆饭店里，如果你这么说，服务员可能会愣一下。", "但是|dànshì,在|zài,绝大|juédà,多数|duōshù,普通|pǔtōng,的|de,餐馆|cānguǎn,饭店|fàndiàn,里|lǐ,如果|rúguǒ,你|nǐ,这么|zhème,说|shuō,服务员|fúwùyuán,可能|kěnéng,会|huì,愣|lèng,一下|yíxià", ""], ["那壶热水和那个大塑料盆是用来烫碗筷的，这是中国南方吃饭的一个习惯。", "那|nà,壶|hú,热水|rèshuǐ,和|hé,那个|nàge,大|dà,塑料盆|sùliàopén,是|shì,用来|yònglái,烫|tàng,碗筷|wǎnkuài,的|de,这|zhè,是|shì,中国|zhōngguó,南方|nánfāng,吃饭|chīfàn,的|de,一个|yí ge,习惯|xíguàn", ""], ["很多外国朋友之所以说话像机器人，就是因为在脑子里把简单的问题想复杂了。", "很|hěn,多|duō,外国|wàiguó,朋友|péngyou,之|zhī,所以|suǒyǐ,说话|shuōhuà,像|xiàng,机器人|jīqìrén,就|jiù,是|shì,因为|yīnwèi,在|zài,脑子|nǎozi,里|lǐ,把|bǎ,简单|jiǎndān,的|de,问题|wèntí,想|xiǎng,复杂|fùzá,了|le", ""], ["买奶茶绝对是很多外国朋友的噩梦，因为在中国买奶茶，店员的问题实在是太多了。", "买|mǎi,奶茶|nǎichá,绝对|juéduì,是|shì,很|hěn,多|duō,外国|wàiguó,朋友|péngyou,的|de,噩梦|èmèng,因为|yīnwèi,在|zài,中国|zhōngguó,买|mǎi,奶茶|nǎichá,店员|diànyuán,的|de,问题|wèntí,实在|shízài,是|shì,太|tài,多|duō,了|le", ""]],
vis:["Thật ra, cách gọi thông dụng nhất chỉ có ba.", "Nhưng nghe lúc nào cũng thấy là lạ, lạnh tanh.", "Đồ uống lạnh thường có ba lựa chọn dùng nhiều nhất.", "Nghe rất thân thiện, một cái là kéo gần khoảng cách ngay.", "Cả quá trình trả tiền, bạn chỉ nói ba chữ: “扫哪里?”.", "Mọi người tự nhiên có cớ hẹn bữa ăn tiếp theo.", "Nghe rất nhẹ nhàng, rất tự nhiên, không có chút khoảng cách nào.", "Tình huống đời sống càng thường ngày thì ngôn ngữ càng đơn giản, càng trực tiếp.", "“来个牛肉面” nghĩa là hãy mang mì bò đến chỗ tôi.", "Nếu bạn không ăn được chút ớt nào, bạn có thể nói thẳng “不要辣”.", "Nếu bạn không muốn quá ngọt, có thể chọn “半糖”, tức là một nửa lượng đường.", "Không những hóa giải sự ngượng ngùng mà còn hẹn luôn lần gặp tiếp theo với bạn.", "Đi quán xào với hai người bạn, bạn có thể nói: “我们先来三个菜”.", "Nếu bạn cứ nói “我想要”, nghe sẽ rất cứng nhắc, rất nghiêm trọng.", "Bạn muốn gói đồ ăn không hết mang về, bạn nói: “服务员，帮我打包一下”.", "Cách cậu gọi món vừa rồi, nghe y như đang đọc sách giáo khoa tiếng Trung của hai mươi năm trước.", "“小二” là cách gọi chỉ có trong quán trọ thời xưa, Trung Quốc hiện đại tuyệt đối không gọi như vậy.", "Câu rất đầy đủ, nhưng quá dài, đầu bếp ở bếp sau căn bản không nhớ nổi nhiều từ như vậy.", "Người Trung Quốc nêu yêu cầu khẩu vị, cốt lõi chỉ có ba từ: cho nhiều, cho ít, không cho.", "Nếu bạn nước ngoài không biết thói quen này, uống một hơi hết nước rửa bát.", "Nhiều bạn nước ngoài ngồi vào chỗ muốn gọi người đến gọi món nhưng không biết nên gọi thế nào.", "Câu “我想要” mà bạn nước ngoài thích nói nhất, người Trung Quốc thực ra dùng từ gì để thay?", "Người Trung Quốc chính gốc bước vào quán ăn, quán cà phê hay tiệm trà sữa thì rốt cuộc mở miệng thế nào?", "Hoàn toàn không cần nói “我想要” dài dòng, cứ nói thẳng “来个…”, rõ ràng, dứt khoát.", "Bạn bước đến, dùng thẳng một công thức: “来杯” cộng tên đồ uống, rồi nói cỡ cốc, nhiệt độ, độ ngọt.", "Lúc này nếu bạn muốn trả bằng WeChat hoặc Alipay, không cần nói câu dài.", "Nếu lần nào cũng tính toán rõ ràng, ai trả phần nấy, mọi người sẽ thấy quan hệ hơi xa cách.", "Dùng từ đơn giản nhất kèm giọng điệu nhiệt tình, tiếng Trung của bạn lập tức sẽ có sức sống.", "Nếu người nấu ăn hay đón tiếp bạn trông giống chủ quán, có thể gọi thẳng “老板”.", "Nhưng ở phần lớn quán ăn nhà hàng bình thường, nếu bạn nói vậy, phục vụ có thể sẽ ngẩn ra một chút.", "Ấm nước nóng và cái chậu nhựa to đó là để tráng bát đũa, đây là một thói quen ăn uống ở miền Nam Trung Quốc.", "Nhiều bạn nước ngoài sở dĩ nói chuyện như người máy là vì trong đầu nghĩ vấn đề đơn giản thành phức tạp.", "Mua trà sữa chắc chắn là cơn ác mộng của nhiều bạn nước ngoài, vì ở Trung Quốc mua trà sữa, câu hỏi của nhân viên thật sự quá nhiều."],

什么": "cái gì", "说话": "nói chuyện", "轻松": "nhẹ nhàng, thoải mái", "借口": "cái cớ", "一起": "cùng nhau", "课本": "sách giáo khoa", "说": "nói", "根本": "hoàn toàn (không), căn bản", "一口": "một ngụm", "过程": "quá trình", "老板": "sếp, ông chủ", "中国": "Trung Quốc", "特别": "đặc biệt, rất", "变得": "trở nên", "位子": "chỗ ngồi", "里": "trong", "他": "anh ấy", "实在": "thật sự, quả thật", "人": "người", "烫": "tráng nước nóng; nóng bỏng", "一点": "một chút", "古代": "thời cổ đại", "样子": "dáng vẻ, cách", "这么": "như thế này, đến vậy", "一下": "một chút, thử", "字": "chữ", "只有": "chỉ có", "像": "giống, như", "多": "nhiều", "最": "nhất", "亲切": "thân thiện, gần gũi", "餐馆": "quán ăn, nhà hàng", "碗筷": "bát đũa", "打包": "gói mang về", "这个": "cái này", "冷冰冰": "lạnh tanh, lạnh lùng", "甜度": "độ ngọt", "二十": "hai mươi", "还": "còn, thêm", "愣": "ngẩn ra, sững lại", "因为": "vì, bởi vì", "化解": "hóa giải", "见面": "gặp mặt", "清清楚楚": "rõ ràng, rành mạch", "放": "cho vào, để", "再": "lại, rồi hãy", "如果": "nếu", "自然而然": "tự nhiên mà thành", "只": "chỉ"},
lines:[{"t": 0, "zh": "您好，请问吃点什么？", "py": "Nínhǎo, qǐngwèn chī diǎn shénme?", "vi": "Xin chào, quý khách dùng gì ạ?", "sec": "Mở đầu: gọi món như đọc sách giáo khoa"}, {"t": 2.3, "zh": "你好，服务员。", "py": "Nǐhǎo, fúwùyuán.", "vi": "Chào bạn, phục vụ ơi."}, {"t": 4.4, "zh": "我想要一份牛肉面，我想要一碗米饭，我还要一杯冰可乐，请快一点送过来，谢谢。", "py": "Wǒ xiǎng yào yí fèn niúròu miàn, wǒ xiǎng yào yì wǎn mǐfàn, wǒ hái yào yì bēi bīng kělè, qǐng kuài yìdiǎn sòng guòlái, xièxie.", "vi": "Tôi muốn một phần mì bò, tôi muốn một bát cơm, tôi còn muốn một ly cola đá, làm ơn mang ra nhanh một chút, cảm ơn."}, {"t": 13.1, "zh": "好的，还有别的吗？", "py": "Hǎo de, hái yǒu biéde ma?", "vi": "Vâng, còn gì nữa không ạ?"}, {"t": 15.3, "zh": "不要别的了，请给我账单。", "py": "Búyào biéde le, qǐng gěi wǒ zhàngdān.", "vi": "Không cần gì nữa, làm ơn cho tôi hóa đơn."}, {"t": 18.0, "zh": "停停停，小雨。", "py": "Tíngtíng tíng, Xiǎo Yǔ.", "vi": "Dừng dừng dừng, Tiểu Vũ."}, {"t": 20.2, "zh": "你刚才点菜的样子，简直太像在念二十年前的中文课本了。", "py": "Nǐ gāngcái diǎncài de yàngzi, jiǎnzhí tài xiàng zài niàn èrshí niánqián de zhōngwén kèběn le.", "vi": "Cách cậu gọi món vừa rồi, nghe y như đang đọc sách giáo khoa tiếng Trung của hai mươi năm trước vậy."}, {"t": 26.5, "zh": "正在听节目的朋友们，大家刚才听我点菜，是不是觉得每一句话语法都很对？", "py": "Zhèngzài tīng jiémù de péngyoumen, dàjiā gāngcái tīng wǒ diǎncài, shì búshì juéde měi yí jù huà yǔfǎ dōu hěn duì?", "vi": "Các bạn đang nghe chương trình, vừa nghe mình gọi món, có phải thấy câu nào ngữ pháp cũng đúng không?"}, {"t": 34.3, "zh": "但听起来总是怪怪的，冷冰冰的。", "py": "Dàn tīng qǐlai zǒngshì guàiguài de, lěngbīngbīng de.", "vi": "Nhưng nghe lúc nào cũng thấy là lạ, lạnh tanh."}, {"t": 39.9, "zh": "先跟大家打个招呼。大家好，欢迎收听我们的中文播客，我是小陈。", "py": "Xiān gēn dàjiā dǎ ge zhāohu. Dàjiā hǎo, huānyíng shōutīng wǒmen de zhōngwén bōkè, wǒ shì Xiǎo Chén.", "vi": "Trước hết chào mọi người một tiếng. Chào mọi người, chào mừng đến với podcast tiếng Trung của chúng mình, mình là Tiểu Trần.", "sec": "Chào hỏi và chủ đề hôm nay"}, {"t": 46.6, "zh": "大家好，我是刚才在模仿课本说话的小雨。", "py": "Dàjiā hǎo, wǒ shì gāngcái zài mófǎng kèběn shuōhuà de Xiǎo Yǔ.", "vi": "Chào mọi người, mình là Tiểu Vũ, người vừa nãy bắt chước giọng sách giáo khoa."}, {"t": 50.9, "zh": "之前有一期节目，我们聊了为什么不要每天对朋友说“你好吗”。", "py": "Zhīqián yǒu yì qī jiémù, wǒmen liáo le wèishénme búyào měitiān duì péngyou shuō \"nǐhǎo ma\".", "vi": "Có một kỳ trước, chúng mình đã nói về việc vì sao đừng ngày nào cũng hỏi bạn bè “bạn khỏe không”."}, {"t": 57.7, "zh": "很多听众朋友留言说太实用了，终于知道了中国人平时是怎么打招呼的。", "py": "Hěn duō tīngzhòng péngyou liúyán shuō tài shíyòng le, zhōngyú zhīdao le Zhōngguórén píngshí shì zěnme dǎ zhāohu de.", "vi": "Nhiều thính giả nhắn lại là rất thực tế, cuối cùng cũng biết người Trung Quốc ngày thường chào hỏi thế nào."}, {"t": 64.6, "zh": "既然大家这么喜欢，今天我们接着来做“地道口语实战”第二期。", "py": "Jìrán dàjiā zhème xǐhuan, jīntiān wǒmen jiēzhe lái zuò \"dìdào kǒuyǔ shízhàn\" dì èr qī.", "vi": "Vì mọi người thích như vậy, hôm nay chúng mình tiếp tục làm kỳ thứ hai của “khẩu ngữ đời thường thực chiến”."}, {"t": 71.5, "zh": "今天我们要聊一个大家每天都要做，但很多人一直在用错误方式说话的场景：点餐、买饮料，还有在中国餐厅吃饭的各种小秘密。", "py": "Jīntiān wǒmen yào liáo yí ge dàjiā měitiān dōu yào zuò, dàn hěn duō rén yìzhí zài yòng cuòwù fāngshì shuōhuà de chǎngjǐng: diǎncān, mǎi yǐnliào, hái yǒu zài Zhōngguó cāntīng chīfàn de gèzhǒng xiǎo mìmì.", "vi": "Hôm nay chúng mình nói về một tình huống ngày nào ai cũng gặp nhưng nhiều người cứ nói sai cách: gọi món, mua đồ uống, và đủ thứ bí mật nhỏ khi ăn ở nhà hàng Trung Quốc."}, {"t": 84.6, "zh": "没错。很多外国朋友学中文的时候，学会了“想要”，还有“请”。", "py": "Méicuò. Hěn duō wàiguó péngyou xué zhōngwén de shíhou, xuéhuì le \"xiǎng yào\", hái yǒu \"qǐng\".", "vi": "Đúng vậy. Nhiều bạn nước ngoài khi học tiếng Trung đã học được “想要” và “请”."}, {"t": 91.7, "zh": "所以到了餐厅或者咖啡店，一开口就是：“我想要这个”“我想要那个”。", "py": "Suǒyǐ dào le cāntīng huòzhě kāfēidiàn, yì kāikǒu jiù shì: \"wǒ xiǎng yào zhège\" \"wǒ xiǎng yào nàge\".", "vi": "Vì thế vào nhà hàng hay quán cà phê, vừa mở miệng là: “Tôi muốn cái này”, “Tôi muốn cái kia”."}, {"t": 98.8, "zh": "虽然服务员肯定听得懂，但老实说，在真实的中国生活里，很少有中国人会一句一个“我想要”。", "py": "Suīrán fúwùyuán kěndìng tīng de dǒng, dàn lǎoshí shuō, zài zhēnshí de Zhōngguó shēnghuó lǐ, hěn shǎo yǒu Zhōngguórén huì yí jù yí ge \"wǒ xiǎng yào\".", "vi": "Tuy nhân viên chắc chắn nghe hiểu, nhưng nói thật, trong đời sống thực ở Trung Quốc, hiếm người Trung Quốc câu nào cũng “tôi muốn”."}, {"t": 109.0, "zh": "如果你总是说“我想要”，听起来会显得特别生硬，特别严肃。", "py": "Rúguǒ nǐ zǒngshì shuō \"wǒ xiǎng yào\", tīng qǐlai huì xiǎnde tèbié shēngyìng, tèbié yánsù.", "vi": "Nếu bạn cứ nói “我想要”, nghe sẽ rất cứng nhắc, rất nghiêm trọng."}, {"t": 115.5, "zh": "一听就像从英语的“I want”直接翻译过来的。", "py": "Yì tīng jiù xiàng cóng yīngyǔ de \"I want \" zhíjiē fānyì guòlái de.", "vi": "Nghe một cái là biết dịch thẳng từ “I want” trong tiếng Anh."}, {"t": 120.5, "zh": "地道的中国人走进餐馆、咖啡店或者奶茶店，到底是怎么开口的？", "py": "Dìdào de Zhōngguórén zǒujìn cānguǎn, kāfēidiàn huòzhě nǎichádiàn, dàodǐ shì zěnme kāikǒu de?", "vi": "Người Trung Quốc chính gốc bước vào quán ăn, quán cà phê hay tiệm trà sữa thì rốt cuộc mở miệng thế nào?"}, {"t": 127.3, "zh": "怎么样才能用最简单的几个词，让自己听起来像一个在中国生活了很久的老朋友？", "py": "Zěnme yàng cáinéng yòng zuì jiǎndān de jǐ gè cí, ràng zìjǐ tīng qǐlai xiàng yí ge zài Zhōngguó shēnghuó le hěn jiǔ de lǎopéngyǒu?", "vi": "Làm sao chỉ dùng vài từ đơn giản nhất mà nghe như một người bạn cũ sống ở Trung Quốc rất lâu?"}, {"t": 135.0, "zh": "今天这期节目，我们就把课本里那些冷冰冰的句子全扔掉，教给大家中国人天天挂在嘴边的点餐密码。", "py": "Jīntiān zhè qī jiémù, wǒmen jiù bǎ kèběn lǐ nàxiē lěngbīngbīng de jùzi quán rēngdiào, jiāogěi dàjiā Zhōngguórén tiāntiān guàzài zuǐbiān de diǎncān mìmǎ.", "vi": "Kỳ này chúng mình vứt hết những câu lạnh tanh trong sách giáo khoa, dạy mọi người “mật mã gọi món” mà người Trung Quốc ngày nào cũng nói."}, {"t": 146.1, "zh": "学会了今天这几个词，下次你再去餐厅吃饭，服务员听到你开口的第一秒，肯定会以为你的中文水平特别高。", "py": "Xuéhuì le jīntiān zhè jǐ gè cí, xià cì nǐ zài qù cāntīng chīfàn, fúwùyuán tīngdào nǐ kāikǒu de dì yī miǎo, kěndìng huì yǐwéi nǐ de zhōngwén shuǐpíng tèbié gāo.", "vi": "Học được mấy từ hôm nay, lần sau bạn đi ăn nhà hàng, ngay giây đầu tiên phục vụ nghe bạn mở miệng, chắc chắn sẽ nghĩ trình tiếng Trung của bạn rất cao."}, {"t": 157.2, "zh": "好。那在正式看菜单点菜之前，我们得先解决进门后的第一个大问题：你怎么把服务员叫过来？", "py": "Hǎo. Nà zài zhèngshì kàn càidān diǎncài zhīqián, wǒmen de xiān jiějué jìnmén hòu de dì yí ge dà wèntí: nǐ zěnme bǎ fúwùyuán jiào guòlái?", "vi": "Được rồi. Trước khi chính thức xem thực đơn gọi món, mình phải giải quyết vấn đề lớn đầu tiên sau khi vào cửa: làm sao gọi phục vụ lại?", "sec": "Cách gọi phục vụ"}, {"t": 168.0, "zh": "这个问题特别关键。很多外国朋友坐在位子上想叫人点菜，但是不知道该怎么喊。", "py": "Zhège wèntí tèbié guānjiàn. Hěn duō wàiguó péngyou zuòzài wèizi shàng xiǎng jiào rén diǎncài, dànshì bù zhīdao gāi zěnme hǎn.", "vi": "Vấn đề này rất quan trọng. Nhiều bạn nước ngoài ngồi vào chỗ muốn gọi người đến gọi món nhưng không biết nên gọi thế nào."}, {"t": 175.6, "zh": "我见过一些外国朋友，因为看了很多古装剧，一进门就大声喊：“小二，点菜！”", "py": "Wǒ jiàn guo yìxiē wàiguó péngyou, yīnwèi kàn le hěn duō gǔzhuāngjù, yí jìnmén jiù dàshēng hǎn: \"xiǎoèr, diǎncài!\"", "vi": "Mình từng gặp vài bạn nước ngoài, vì xem nhiều phim cổ trang nên vừa vào cửa đã hô to: “Tiểu nhị, gọi món!”"}, {"t": 183.7, "zh": "把旁边几桌吃饭的人全给逗笑了。", "py": "Bǎ pángbiān jǐ zhuō chīfàn de rén quán gěi dòuxiào le.", "vi": "Làm cả mấy bàn ăn bên cạnh bật cười."}, {"t": 188.4, "zh": "“小二”是古代客栈里才有的称呼，现代中国绝对不能这么叫。", "py": "\"xiǎoèr\" shì gǔdài kèzhàn lǐ cái yǒu de chēnghu, xiàndài Zhōngguó juéduì bù néng zhème jiào.", "vi": "“小二” là cách gọi chỉ có trong quán trọ thời xưa, Trung Quốc hiện đại tuyệt đối không gọi như vậy."}, {"t": 195.1, "zh": "也有些外国朋友把年轻的女服务员叫做“小姐”。", "py": "Yě yǒuxiē wàiguó péngyou bǎ niánqīng de nǚ fúwùyuán jiàozuò \"xiǎojiě\".", "vi": "Cũng có bạn nước ngoài gọi nữ phục vụ trẻ là “小姐”."}, {"t": 199.7, "zh": "大家注意，在现代中国很多地方，“小姐”这个词可千万不要随便叫，因为在一些语境里，它有不好的意思，会显得非常不礼貌。", "py": "Dàjiā zhùyì, zài xiàndài Zhōngguó hěn duō dìfang, \"xiǎojiě\" zhège cí kě qiānwàn búyào suíbiàn jiào, yīnwèi zài yìxiē yǔjìng lǐ, tā yǒu bù hǎo de yìsi, huì xiǎnde fēicháng bù lǐmào.", "vi": "Mọi người chú ý, ở nhiều nơi tại Trung Quốc hiện đại, từ “小姐” tuyệt đối đừng tùy tiện gọi, vì trong một số ngữ cảnh nó có nghĩa không tốt, sẽ rất bất lịch sự."}, {"t": 212.9, "zh": "那到底怎么叫才最得体、最自然呢？其实，最通用的称呼只有三个。", "py": "Nà dàodǐ zěnme jiào cái zuì détǐ, zuì zìrán ne? Qíshí, zuì tōngyòng de chēnghu zhǐyǒu sān gè.", "vi": "Vậy rốt cuộc gọi thế nào mới lịch sự và tự nhiên nhất? Thật ra, cách gọi thông dụng nhất chỉ có ba."}, {"t": 220.4, "zh": "第一个，最标准、永远不会出错的称呼，大声、礼貌地喊一声：“服务员！”", "py": "Dì yí ge, zuì biāozhǔn, yǒngyuǎn bú huì chūcuò de chēnghu, dàshēng, lǐmào de hǎn yìshēng: \"fúwùyuán!\"", "vi": "Cách thứ nhất, chuẩn nhất, không bao giờ sai: hô to một tiếng thật lịch sự “服务员!”."}, {"t": 228.4, "zh": "不管对方是男是女，年轻还是年长，微笑着抬起一只手说一句：“服务员，点个菜。”", "py": "Bùguǎn duìfāng shì nán shì nǚ, niánqīng háishì niánzhǎng, wēixiàozhe táiqǐ yì zhī shǒu shuō yí jù: \"fúwùyuán, diǎn gè cài.\"", "vi": "Bất kể đối phương là nam hay nữ, trẻ hay lớn tuổi, mỉm cười giơ một tay lên nói: “Phục vụ ơi, gọi món.”"}, {"t": 237.6, "zh": "这就非常大方，非常得体。", "py": "Zhè jiù fēicháng dàfāng, fēicháng détǐ.", "vi": "Như vậy rất thoải mái, rất lịch sự."}, {"t": 240.9, "zh": "第二个称呼，适合在街边的小面馆、烧烤店或者小炒店。", "py": "Dì èr gè chēnghu, shìhé zài jiēbiān de xiǎo miànguǎn, shāokǎo diàn huòzhě xiǎochǎo diàn.", "vi": "Cách gọi thứ hai, hợp với quán mì nhỏ ven đường, quán nướng hoặc quán xào."}, {"t": 246.9, "zh": "如果做饭或者招呼你的人看起来像这家店的店主，可以直接叫他：“老板！”", "py": "Rúguǒ zuòfàn huòzhě zhāohu nǐ de rén kàn qǐlai xiàng zhè jiā diàn de diànzhǔ, kěyǐ zhíjiē jiào tā: \"lǎobǎn!\"", "vi": "Nếu người nấu ăn hay đón tiếp bạn trông giống chủ quán, có thể gọi thẳng: “老板!”."}, {"t": 255.5, "zh": "这个词在中国特别好听。哪怕对方只是在店里打工的，你叫他一声“老板”，他听了心里也乐呵呵的，说不定还会多给你加两片牛肉。", "py": "Zhège cí zài Zhōngguó tèbié hǎotīng. Nǎpà duìfāng zhǐshì zài diànlǐ dǎgōng de, nǐ jiào tā yìshēng \"lǎobǎn\", tā tīng le xīnlǐ yě lè hēhē de, shuō búdìng hái huì duō gěi nǐ jiā liǎng piàn niúròu.", "vi": "Từ này ở Trung Quốc nghe rất êm tai. Dù đối phương chỉ là người làm thuê trong quán, bạn gọi một tiếng “老板”, họ nghe cũng vui trong lòng, biết đâu còn cho thêm hai lát thịt bò."}, {"t": 269.3, "zh": "第三个称呼，是现在年轻人特别喜欢用的，叫“小哥”或者“小姐姐”。", "py": "Dì sān gè chēnghu, shì xiànzài niánqīng rén tèbié xǐhuan yòng de, jiào \"xiǎogē\" huòzhě \"xiǎojiějiě\".", "vi": "Cách gọi thứ ba là cái mà giới trẻ bây giờ rất thích dùng, gọi là “小哥” hoặc “小姐姐”."}, {"t": 276.8, "zh": "比如你在奶茶店，做奶茶的都是年轻男孩女孩，你可以笑着说：“小哥，你们家什么最好喝？”", "py": "Bǐrú nǐ zài nǎichádiàn, zuò nǎichá de dōu shì niánqīng nánhái nǚhái, nǐ kěyǐ xiàozhe shuō: \"xiǎogē, nǐmen jiā shénme zuì hǎohē?\"", "vi": "Ví dụ bạn ở tiệm trà sữa, người pha đều là các bạn trẻ, bạn có thể cười nói: “Anh ơi, quán mình món nào ngon nhất?”"}, {"t": 286.8, "zh": "或者：“小姐姐，这个可以做热的吗？”", "py": "Huòzhě: \"xiǎojiějiě, zhège kěyǐ zuò rè de ma?\"", "vi": "Hoặc: “Chị ơi, món này làm nóng được không?”"}, {"t": 290.4, "zh": "听起来特别亲切，一下子就把距离拉近了。", "py": "Tīng qǐlai tèbié qīnqiè, yíxiàzi jiù bǎ jùlí lājìn le.", "vi": "Nghe rất thân thiện, một cái là kéo gần khoảng cách ngay."}, {"t": 294.7, "zh": "好了，现在服务员拿着菜单走到你面前了。接下来就到了我们今天最核心的部分。", "py": "Hǎo le, xiànzài fúwùyuán názhe càidān zǒu dào nǐ miànqián le. Jiē xiàlái jiù dào le wǒmen jīntiān zuì héxīn de bùfèn.", "vi": "Được rồi, bây giờ phục vụ đã cầm thực đơn đến trước mặt bạn. Tiếp theo là phần cốt lõi nhất hôm nay.", "sec": "Dùng “来个” thay cho “我想要”"}, {"t": 302.6, "zh": "外国朋友最喜欢说的“我想要”，中国人到底会用什么词来替换？", "py": "Wàiguó péngyou zuì xǐhuan shuō de \"wǒ xiǎng yào\", Zhōngguórén dàodǐ huì yòng shénme cí lái tìhuàn?", "vi": "Câu “我想要” mà bạn nước ngoài thích nói nhất, người Trung Quốc thực ra dùng từ gì để thay?"}, {"t": 309.6, "zh": "答案非常简单，只有一个字：“来”。", "py": "Dáàn fēicháng jiǎndān, zhǐyǒu yí ge zì: \"lái\".", "vi": "Đáp án rất đơn giản, chỉ có một chữ: “来”."}, {"t": 314.5, "zh": "就是“来回”的“来”，“过来”的“来”。在点菜的时候，中国人最爱说的一句话叫做“来个”，或者“来一份”。", "py": "Jiù shì \"láihuí\" de \"lái\", \"guòlái\" de \"lái\". Zài diǎncài de shíhou, Zhōngguórén zuì ài shuō de yí jù huà jiàozuò \"lái gè\", huòzhě \"lái yí fèn\".", "vi": "Chính là chữ “来” trong “来回”, trong “过来”. Khi gọi món, câu người Trung Quốc thích nói nhất là “来个”, hoặc “来一份”."}, {"t": 325.2, "zh": "小陈，你快给大家讲讲，为什么点菜要用“来”这个字？", "py": "Xiǎo Chén, nǐ kuài gěi dàjiā jiǎngjiǎng, wèishénme diǎncài yào yòng \"lái\" zhège zì?", "vi": "Tiểu Trần, cậu mau giảng cho mọi người đi, vì sao gọi món lại dùng chữ “来”?"}, {"t": 331.1, "zh": "大家可以体会一下：“我想要一碗牛肉面”，重点在“我想要”，听起来像是在表达自己的强烈要求。", "py": "Dàjiā kěyǐ tǐhuì yíxià: \"wǒ xiǎng yào yì wǎn niúròu miàn\", zhòngdiǎn zài \"wǒ xiǎng yào\", tīng qǐlai xiàngshì zài biǎodá zìjǐ de qiángliè yāoqiú.", "vi": "Mọi người cảm nhận thử: “我想要一碗牛肉面” trọng tâm nằm ở “我想要”, nghe như đang bày tỏ yêu cầu mạnh của bản thân."}, {"t": 341.8, "zh": "但如果你说：“老板，来个牛肉面。”重点就在“来”这个动作上。", "py": "Dàn rúguǒ nǐ shuō: \"lǎobǎn, lái gè niúròu miàn.\" zhòngdiǎn jiù zài \"lái\" zhège dòngzuò shàng.", "vi": "Nhưng nếu bạn nói: “老板，来个牛肉面.” thì trọng tâm nằm ở động tác “来”."}, {"t": 347.9, "zh": "对。“来个牛肉面”，意思就是请把牛肉面送到我这里来。", "py": "Duì. \"lái gè niúròu miàn\", yìsi jiù shì qǐng bǎ niúròu miàn sòngdào wǒ zhèlǐ lái.", "vi": "Đúng. “来个牛肉面” nghĩa là hãy mang mì bò đến chỗ tôi."}, {"t": 354.5, "zh": "听起来特别轻松，特别自然，没有任何距离感。", "py": "Tīng qǐlai tèbié qīngsōng, tèbié zìrán, méi yǒu rènhé jùlí gǎn.", "vi": "Nghe rất nhẹ nhàng, rất tự nhiên, không có chút khoảng cách nào."}, {"t": 359.3, "zh": "而且“来”这个字可以跟很多词放在一起用。", "py": "Érqiě \"lái\" zhège zì kěyǐ gēn hěn duō cí fàngzài yìqǐ yòng.", "vi": "Hơn nữa chữ “来” có thể dùng cùng rất nhiều từ."}, {"t": 364.1, "zh": "比如去面馆，你可以说：“老板，来碗牛肉面。”", "py": "Bǐrú qù miànguǎn, nǐ kěyǐ shuō: \"lǎobǎn, lái wǎn niúròu miàn.\"", "vi": "Ví dụ đến quán mì, bạn có thể nói: “老板，来碗牛肉面.”"}, {"t": 369.1, "zh": "快餐店你可以说：“来个汉堡，再来杯可乐。”", "py": "Kuàicāndiàn nǐ kěyǐ shuō: \"lái gè hànbǎo, zài lái bēi kělè.\"", "vi": "Ở quán ăn nhanh bạn có thể nói: “来个汉堡，再来杯可乐.”"}, {"t": 373.6, "zh": "跟两个朋友一起去炒菜馆，你可以说：“我们先来三个菜。”", "py": "Gēn liǎng gè péngyou yìqǐ qù chǎocài guǎn, nǐ kěyǐ shuō: \"wǒmen xiān lái sān gè cài.\"", "vi": "Đi quán xào với hai người bạn, bạn có thể nói: “我们先来三个菜.”"}, {"t": 378.7, "zh": "大家听听，是不是一下子就接地气了？完全不用说长长的“我想要”，直接说“来个什么”，清清楚楚，干脆利落。", "py": "Dàjiā tīngting, shì búshì yíxiàzi jiù jiēdìqì le? Wánquán búyòng shuō chángcháng de \"wǒ xiǎng yào\", zhíjiē shuō \"lái gè shénme\", qīngqīngchǔchǔ, gāncuìlìluò.", "vi": "Mọi người nghe xem, có phải một cái là gần gũi hẳn không? Hoàn toàn không cần nói “我想要” dài dòng, cứ nói thẳng “来个…”, rõ ràng, dứt khoát."}, {"t": 390.4, "zh": "除了“来个”，还有一个字，本来是东北话，现在北方和年轻人也特别爱用，叫做“整”。", "py": "Chúle \"lái gè\", hái yǒu yí ge zì, běnlái shì dōngběihuà, xiànzài běifāng hé niánqīng rén yě tèbié ài yòng, jiàozuò \"zhěng\".", "vi": "Ngoài “来个”, còn một chữ vốn là tiếng vùng Đông Bắc, bây giờ miền Bắc và giới trẻ cũng rất thích dùng, gọi là “整”."}, {"t": 400.0, "zh": "“整一个。”比如我们俩一起去买饮料：“小陈，你想喝什么？”“今天有点热，整个冰咖啡吧。”", "py": "\"zhěng yí ge.\" bǐrú wǒmen liǎ yìqǐ qù mǎi yǐnliào: \"Xiǎo Chén, nǐ xiǎng hē shénme?\" \"jīntiān yǒu diǎn rè, zhěng ge bīng kāfēi ba.\"", "vi": "“整一个.” Ví dụ hai đứa mình cùng đi mua đồ uống: “Tiểu Trần, cậu muốn uống gì?” “Hôm nay hơi nóng, làm một ly cà phê đá nhé.”"}, {"t": 410.3, "zh": "这个字非常生活化，非常口语。", "py": "Zhège zì fēicháng shēnghuó huà, fēicháng kǒuyǔ.", "vi": "Chữ này rất đời thường, rất khẩu ngữ."}, {"t": 413.7, "zh": "当然，如果你觉得“整”不太好掌握，那你只要记住“来个”，就已经完全足够应付绝大多数场景了。", "py": "Dāngrán, rúguǒ nǐ juéde \"zhěng\" bútài hǎo zhǎngwò, nà nǐ zhǐyào jìzhù \"lái gè\", jiù yǐjing wánquán zúgòu yìngfù juédà duōshù chǎngjǐng le.", "vi": "Tất nhiên, nếu bạn thấy “整” hơi khó nắm, thì chỉ cần nhớ “来个” là đã hoàn toàn đủ để ứng phó với phần lớn tình huống."}, {"t": 424.2, "zh": "学会了“来个”这个万能词，我们来看下一个超级实用的技巧。", "py": "Xuéhuì le \"lái gè\" zhège wànnéng cí, wǒmen láikàn xià yí ge chāojí shíyòng de jìqiǎo.", "vi": "Học được từ vạn năng “来个” rồi, ta xem kỹ thuật siêu thực dụng tiếp theo.", "sec": "Dùng “帮我” thay cho “请”"}, {"t": 430.9, "zh": "很多外国朋友学过一个礼貌词，叫做“请”。课本上经常说“请给我一杯水”“请快一点”。", "py": "Hěn duō wàiguó péngyou xué guo yí ge lǐmào cí, jiàozuò \"qǐng\". Kèběn shàng jīngcháng shuō \"qǐng gěi wǒ yì bēi shuǐ\" \"qǐng kuài yìdiǎn\".", "vi": "Nhiều bạn nước ngoài đã học một từ lịch sự gọi là “请”. Sách giáo khoa hay viết “请给我一杯水”, “请快一点”."}, {"t": 439.8, "zh": "但是在中文里，“请”这个字其实用得没有大家想象的那么多。", "py": "Dànshì zài zhōngwén lǐ, \"qǐng\" zhège zì qíshí yòng de méi yǒu dàjiā xiǎngxiàng de nàme duō.", "vi": "Nhưng trong tiếng Trung, chữ “请” thật ra không được dùng nhiều như mọi người tưởng."}, {"t": 446.2, "zh": "在餐馆里，如果你对服务员说：“请给我拿一双筷子。”服务员反而会觉得你太客气了，甚至客气得有点严肃。", "py": "Zài cānguǎn lǐ, rúguǒ nǐ duì fúwùyuán shuō: \"qǐng gěi wǒ ná yì shuāng kuàizi.\" fúwùyuán fǎnér huì juéde nǐ tài kèqì le, shènzhì kèqì de yǒu diǎn yánsù.", "vi": "Ở nhà hàng, nếu bạn nói với phục vụ: “请给我拿一双筷子.” thì phục vụ lại thấy bạn khách sáo quá, thậm chí khách sáo đến mức hơi nghiêm trọng."}, {"t": 457.3, "zh": "中国人如果想要服务员拿东西，最地道、最温和的词是什么呢？大家记好了，是两个字：“帮我”。", "py": "Zhōngguórén rúguǒ xiǎng yào fúwùyuán ná dōngxi, zuì dìdào, zuì wēnhé de cí shì shénme ne? Dàjiā jì hǎo le, shì liǎng gè zì: \"bāng wǒ\".", "vi": "Người Trung Quốc muốn nhờ phục vụ lấy đồ, từ chuẩn và dịu nhất là gì? Mọi người nhớ nhé, là hai chữ: “帮我”."}, {"t": 467.6, "zh": "“帮我”这两个字，简直是日常交流里的神器。", "py": "\"bāng wǒ\" zhè liǎng gè zì, jiǎnzhí shì rìcháng jiāoliú lǐ de shénqì.", "vi": "Hai chữ “帮我” đúng là thần khí trong giao tiếp hằng ngày."}, {"t": 472.8, "zh": "比如你想要一双筷子，不要说“请给我筷子”，你要说：“服务员，帮我拿双筷子，谢谢。”", "py": "Bǐrú nǐ xiǎng yào yì shuāng kuàizi, búyào shuō \"qǐng gěi wǒ kuàizi\", nǐ yào shuō: \"fúwùyuán, bāng wǒ ná shuāng kuàizi, xièxie.\"", "vi": "Ví dụ bạn cần một đôi đũa, đừng nói “请给我筷子”, hãy nói: “服务员，帮我拿双筷子，谢谢.”"}, {"t": 481.1, "zh": "你还想多要一个碗，你说：“服务员，帮我拿个空碗。”", "py": "Nǐ hái xiǎng duō yào yí ge wǎn, nǐ shuō: \"fúwùyuán, bāng wǒ ná gè kōng wǎn.\"", "vi": "Bạn muốn thêm một cái bát, bạn nói: “服务员，帮我拿个空碗.”"}, {"t": 487.6, "zh": "你想让服务员倒点热水，你说：“服务员，帮我倒杯水。”", "py": "Nǐ xiǎng ràng fúwùyuán dào diǎn rèshuǐ, nǐ shuō: \"fúwùyuán, bāng wǒ dào bēishuǐ.\"", "vi": "Bạn muốn phục vụ rót ít nước nóng, bạn nói: “服务员，帮我倒杯水.”"}, {"t": 492.5, "zh": "你想把吃不完的菜打包带走，你说：“服务员，帮我打包一下。”", "py": "Nǐ xiǎng bǎ chībù wán de cài dǎbāo dàizǒu, nǐ shuō: \"fúwùyuán, bāng wǒ dǎbāo yíxià.\"", "vi": "Bạn muốn gói đồ ăn không hết mang về, bạn nói: “服务员，帮我打包一下.”"}, {"t": 499.3, "zh": "大家仔细听：帮我拿，帮我倒，帮我打包。如果在后面再加个“一下”，比如“帮我打包一下”，整句话听起来既特别有礼貌，又特别像朋友之间在说话，让人听了心里特别舒服。", "py": "Dàjiā zǐxì tīng: bāng wǒ ná, bāng wǒ dào, bāng wǒ dǎbāo. Rúguǒ zài hòumiàn zài jiā gè \"yíxià\", bǐrú \"bāng wǒ dǎbāo yíxià\", zhěng jù huà tīng qǐlai jì tèbié yǒu lǐmào, yòu tèbié xiàng péngyou zhījiān zài shuōhuà, ràng rén tīng le xīnlǐ tèbié shūfu.", "vi": "Mọi người nghe kỹ: 帮我拿, 帮我倒, 帮我打包. Nếu phía sau thêm “一下”, ví dụ “帮我打包一下”, cả câu nghe vừa rất lịch sự, vừa rất giống bạn bè nói chuyện, khiến người nghe thấy dễ chịu."}, {"t": 519.9, "zh": "讲完了怎么点菜、拿东西，现在我们进入下一个场景，也是很多外国朋友最头疼的场景：提出口味要求。", "py": "Jiǎngwán le zěnme diǎncài, ná dōngxi, xiànzài wǒmen jìnrù xià yí ge chǎngjǐng, yě shì hěn duō wàiguó péngyou zuì tóuténg de chǎngjǐng: tíchū kǒuwèi yāoqiú.", "vi": "Nói xong cách gọi món, lấy đồ, giờ ta sang tình huống tiếp theo, cũng là tình huống nhiều bạn nước ngoài đau đầu nhất: nêu yêu cầu về khẩu vị.", "sec": "Nói yêu cầu về khẩu vị"}, {"t": 532.2, "zh": "去餐厅吃饭，每个人口味不一样，有人不吃辣，有人不吃香菜，有人喜欢多吃点葱。", "py": "Qù cāntīng chīfàn, měi gè rén kǒuwèi bù yíyàng, yǒu rén bù chī là, yǒu rén bù chī xiāngcài, yǒu rén xǐhuan duō chī diǎn cōng.", "vi": "Đi nhà hàng, khẩu vị mỗi người một khác, có người không ăn cay, có người không ăn rau mùi, có người thích ăn nhiều hành."}, {"t": 540.6, "zh": "外国朋友往往会说很长的句子：“服务员，我不喜欢吃辣，所以请你不要在我的菜里面放辣椒，谢谢。”", "py": "Wàiguó péngyou wǎngwǎng huì shuō hěn zhǎng de jùzi: \"fúwùyuán, wǒ bù xǐhuan chī là, suǒyǐ qǐng nǐ búyào zài wǒ de cài lǐmiàn fàng làjiāo, xièxie.\"", "vi": "Bạn nước ngoài thường nói những câu rất dài: “Phục vụ ơi, tôi không thích ăn cay, vì vậy xin bạn đừng cho ớt vào món của tôi, cảm ơn.”"}, {"t": 551.7, "zh": "句子很完整，但是太长了，厨师在后厨根本记不住这么多词。", "py": "Jùzi hěn wánzhěng, dànshì tài zhǎng le, chúshī zài hòuchú gēnběn jì búzhù zhème duō cí.", "vi": "Câu rất đầy đủ, nhưng quá dài, đầu bếp ở bếp sau căn bản không nhớ nổi nhiều từ như vậy."}, {"t": 557.8, "zh": "中国人提出口味要求啊，最核心的就三个词：多放、少放、不放。", "py": "Zhōngguórén tíchū kǒuwèi yāoqiú a, zuì héxīn de jiù sān gè cí: duō fàng, shǎo fàng, bú fàng.", "vi": "Người Trung Quốc nêu yêu cầu khẩu vị, cốt lõi chỉ có ba từ: cho nhiều, cho ít, không cho."}, {"t": 565.6, "zh": "说得太好了，我们来练习一下。如果你喜欢吃辣，你可以说：“多放点辣。”", "py": "Shuō de tàihǎo le, wǒmen lái liànxí yíxià. Rúguǒ nǐ xǐhuan chī là, nǐ kěyǐ shuō: \"duō fàng diǎn là.\"", "vi": "Nói hay quá, mình luyện thử nhé. Nếu bạn thích ăn cay, bạn có thể nói: “多放点辣.”"}, {"t": 573.6, "zh": "如果你只能吃一点点辣，你可以说：“少放点辣。”或者“微辣就行。”", "py": "Rúguǒ nǐ zhǐ néng chī yìdiǎndiǎn là, nǐ kěyǐ shuō: \"shǎo fàng diǎn là.\" huòzhě \"wēi là jiù xíng.\"", "vi": "Nếu bạn chỉ ăn được một chút cay, bạn có thể nói: “少放点辣.” hoặc “微辣就行.”"}, {"t": 580.4, "zh": "如果你一点辣椒都不能吃，你可以直接说：“不要辣。”点外卖的时候，备注里也常写“免辣”两个字。", "py": "Rúguǒ nǐ yìdiǎn làjiāo dōu bù néng chī, nǐ kěyǐ zhíjiē shuō: \"búyào là.\" diǎn wàimài de shíhou, bèizhù lǐ yě cháng xiě \"miǎnlà\" liǎng gè zì.", "vi": "Nếu bạn không ăn được chút ớt nào, bạn có thể nói thẳng: “不要辣.” Khi đặt đồ giao tận nơi, phần ghi chú cũng thường viết hai chữ “免辣”."}, {"t": 589.6, "zh": "还有一种很多外国人特别害怕的蔬菜：香菜。很多人觉得香菜有一股奇怪的味道。", "py": "Hái yǒu yì zhǒng hěn duō wàiguórén tèbié hàipà de shūcài: xiāngcài. Hěn duō rén juéde xiāngcài yǒu yì gǔ qíguài de wèidào.", "vi": "Còn một loại rau nhiều người nước ngoài rất sợ: rau mùi. Nhiều người thấy rau mùi có mùi lạ."}, {"t": 598.8, "zh": "如果你不吃香菜，怎么跟老板说？千万别说“我不喜欢绿色的香菜”。", "py": "Rúguǒ nǐ bù chī xiāngcài, zěnme gēn lǎobǎn shuō? Qiānwàn biéshuō \"wǒ bù xǐhuan lǜsè de xiāngcài\".", "vi": "Nếu bạn không ăn rau mùi, nói với chủ quán thế nào? Đừng bao giờ nói “tôi không thích rau mùi xanh”."}, {"t": 605.7, "zh": "直接在点完菜之后加一句：“老板，不要香菜啊。”或者：“老板，别放香菜。”", "py": "Zhíjiē zài diǎn wán cài zhīhòu jiā yí jù: \"lǎobǎn, búyào xiāngcài a.\" huòzhě: \"lǎobǎn, bié fàng xiāngcài.\"", "vi": "Cứ gọi món xong thì thêm một câu: “老板，不要香菜啊.” hoặc: “老板，别放香菜.”"}, {"t": 614.1, "zh": "简简单单一句话，老板立刻就能听得明明白白，绝对不会给你放错。", "py": "Jiǎnjiǎn dāndān yí jù huà, lǎobǎn lìkè jiù néng tīng de míngmíngbáibái, juéduì bú huì gěi nǐ fàngcuò.", "vi": "Chỉ một câu đơn giản, chủ quán lập tức nghe rõ ràng, tuyệt đối không cho nhầm cho bạn."}, {"t": 621.5, "zh": "聊完了点菜，接下来我们讲一个很多外国朋友在南方餐馆里经常闹笑话的场景：桌上的神秘“洗碗水”。", "py": "Liáo wán le diǎncài, jiē xiàlái wǒmen jiǎng yí ge hěn duō wàiguó péngyou zài nánfāng cānguǎn lǐ jīngcháng nào xiàohuà de chǎngjǐng: zhuōshàng de shénmì \"xǐwǎn shuǐ\".", "vi": "Nói xong chuyện gọi món, tiếp theo ta kể về một tình huống nhiều bạn nước ngoài hay gây cười ở quán miền Nam: “nước rửa bát” bí ẩn trên bàn.", "sec": "Nước rửa bát bí ẩn ở miền Nam"}, {"t": 633.8, "zh": "这个太经典了。去过中国南方，比如广东、福建一带的朋友一定见过这个画面。", "py": "Zhège tài jīngdiǎn le. Qùguò Zhōngguó nánfāng, bǐrú Guǎngdōng, Fújiàn yídài de péngyou yídìng jiàn guo zhège huàmiàn.", "vi": "Cái này kinh điển quá. Ai từng đến miền Nam Trung Quốc, như vùng Quảng Đông, Phúc Kiến, chắc chắn đã thấy cảnh này."}, {"t": 642.8, "zh": "你刚坐下来，服务员就会端上来一壶冒着热气的水，同时还会给你一个大大的空塑料盆。", "py": "Nǐ gāng zuòxià lái, fúwùyuán jiù huì duān shànglái yì hú màozhe rèqì de shuǐ, tóngshí hái huì gěi nǐ yí ge dàdà de kōng sùliào pén.", "vi": "Bạn vừa ngồi xuống, phục vụ sẽ bưng đến một ấm nước bốc hơi nóng, đồng thời đưa cho bạn một cái chậu nhựa to trống không."}, {"t": 652.1, "zh": "很多外国朋友第一次去，心想：中国餐馆服务真好，饭前还送一壶免费的热茶。然后端起杯子就想喝。", "py": "Hěn duō wàiguó péngyou dì yī cì qù, xīnxiǎng: Zhōngguó cānguǎn fúwù zhēn hǎo, fànqián hái sòng yì hú miǎnfèi de rèchá. Ránhòu duānqǐ bēizi jiù xiǎng hē.", "vi": "Nhiều bạn nước ngoài lần đầu đi, nghĩ bụng: nhà hàng Trung Quốc phục vụ tốt thật, trước bữa còn tặng một ấm trà nóng miễn phí. Rồi bưng cốc lên định uống."}, {"t": 663.2, "zh": "哎呀，千万别喝！那根本不是用来喝的茶水。", "py": "Āiyā, qiānwàn bié hē! Nà gēnběn bú shì yònglái hē de cháshuǐ.", "vi": "Ấy, đừng uống! Đó hoàn toàn không phải nước trà để uống."}, {"t": 668.2, "zh": "那壶热水和那个大塑料盆是用来烫碗筷的，这是中国南方吃饭的一个习惯。", "py": "Nà hú rèshuǐ hé nàge dà sùliào pén shì yònglái tàng wǎnkuài de, zhè shì Zhōngguó nánfāng chīfàn de yí ge xíguàn.", "vi": "Ấm nước nóng và cái chậu nhựa to đó là để tráng bát đũa, đây là một thói quen ăn uống ở miền Nam Trung Quốc."}, {"t": 677.0, "zh": "南方的朋友习惯在吃饭之前，用滚烫的热水把碗、筷子、勺子和茶杯都烫一遍。", "py": "Nánfāng de péngyou xíguàn zài chīfàn zhīqián, yòng gǔntàng de rèshuǐ bǎ wǎn, kuàizi, sháozi hé chábēi dōu tàng yí biàn.", "vi": "Người miền Nam quen trước khi ăn dùng nước sôi nóng hổi tráng qua bát, đũa, thìa và tách trà."}, {"t": 685.8, "zh": "烫完把水倒进那个大盆里，让服务员收走，然后再开始吃饭。", "py": "Tàng wán bǎ shuǐ dàojìn nàge dà pén lǐ, ràng fúwùyuán shōuzǒu, ránhòu zài kāishǐ chīfàn.", "vi": "Tráng xong đổ nước vào cái chậu lớn đó, để phục vụ mang đi, rồi mới bắt đầu ăn."}, {"t": 691.5, "zh": "如果外国朋友不知道这个习惯，把洗碗的水一口喝下去了，同桌的中国朋友肯定会当场惊呆的。", "py": "Rúguǒ wàiguó péngyou bù zhīdao zhège xíguàn, bǎ xǐwǎn de shuǐ yì kǒu hē xiàqu le, tóngzhuō de Zhōngguó péngyou kěndìng huì dāngchǎng jīngdāi de.", "vi": "Nếu bạn nước ngoài không biết thói quen này, uống một hơi hết nước rửa bát, bạn Trung Quốc cùng bàn chắc chắn sẽ sững sờ ngay tại chỗ."}, {"t": 701.1, "zh": "那如果你跟中国朋友一起去南方餐馆，你怎么表现得像个老手呢？", "py": "Nà rúguǒ nǐ gēn Zhōngguó péngyou yìqǐ qù nánfāng cānguǎn, nǐ zěnme biǎoxiàn de xiàng gè lǎoshǒu ne?", "vi": "Vậy nếu bạn cùng bạn Trung Quốc đi quán miền Nam, làm sao để tỏ ra như người từng trải?"}, {"t": 707.5, "zh": "非常简单。水端上来之后，你可以很主动地对朋友说一句：“我帮你们烫一下碗筷吧。”", "py": "Fēicháng jiǎndān. Shuǐ duān shànglái zhīhòu, nǐ kěyǐ hěn zhǔdòng de duì péngyou shuō yí jù: \"wǒ bāng nǐmen tàng yíxià wǎnkuài ba.\"", "vi": "Rất đơn giản. Sau khi nước được bưng lên, bạn có thể chủ động nói với bạn một câu: “我帮你们烫一下碗筷吧.”"}, {"t": 716.1, "zh": "你看，刚学的“帮”和“一下”又用上了。", "py": "Nǐ kàn, gāng xué de \"bāng\" hé \"yíxià\" yòu yòng shàng le.", "vi": "Cậu xem, “帮” và “一下” vừa học đã dùng được ngay."}, {"t": 720.4, "zh": "然后倒点热水，把碗筷和茶杯烫一烫，再把水倒进盆里。", "py": "Ránhòu dào diǎn rèshuǐ, bǎ wǎnkuài hé chábēi tàng yi tàng, zài bǎ shuǐ dàojìn pén lǐ.", "vi": "Sau đó rót chút nước nóng, tráng bát đũa và tách trà, rồi đổ nước vào chậu."}, {"t": 727.3, "zh": "只要你做出这个动作，你的中国朋友绝对会佩服得五体投地。", "py": "Zhǐyào nǐ zuòchū zhège dòngzuò, nǐ de Zhōngguó péngyou juéduì huì pèifú de wǔtǐtóudì.", "vi": "Chỉ cần bạn làm động tác này, bạn Trung Quốc của bạn chắc chắn sẽ nể phục sát đất."}, {"t": 733.3, "zh": "搞定了餐具，接下来就必须聊聊现在年轻人每天都要买的东西：奶茶和咖啡。", "py": "Gǎodìng le cānjù, jiē xiàlái jiù bìxū liáoliáo xiànzài niánqīng rén měitiān dōu yào mǎi de dōngxi: nǎichá hé kāfēi.", "vi": "Xong chuyện bát đũa, tiếp theo nhất định phải nói về thứ giới trẻ ngày nào cũng mua: trà sữa và cà phê.", "sec": "Mua trà sữa và cà phê"}, {"t": 741.5, "zh": "买奶茶绝对是很多外国朋友的噩梦，因为在中国买奶茶，店员的问题实在是太多了。", "py": "Mǎi nǎichá juéduì shì hěn duō wàiguó péngyou de èmèng, yīnwèi zài Zhōngguó mǎi nǎichá, diànyuán de wèntí shízài shì tài duō le.", "vi": "Mua trà sữa chắc chắn là cơn ác mộng của nhiều bạn nước ngoài, vì ở Trung Quốc mua trà sữa, câu hỏi của nhân viên thật sự quá nhiều."}, {"t": 751.3, "zh": "我们来模拟一下现场。小雨，假设我是奶茶店店员，你来找我买奶茶。", "py": "Wǒmen lái mónǐ yíxià xiànchǎng. Xiǎo Yǔ, jiǎshè wǒ shì nǎichádiàn diànyuán, nǐ lái zhǎo wǒ mǎi nǎichá.", "vi": "Mình mô phỏng tại chỗ nhé. Tiểu Vũ, giả sử mình là nhân viên tiệm trà sữa, cậu đến mua trà sữa."}, {"t": 758.9, "zh": "你听听平时店员是怎么问的。", "py": "Nǐ tīngting píngshí diànyuán shì zěnme wèn de.", "vi": "Cậu nghe thử ngày thường nhân viên hỏi thế nào."}, {"t": 762.1, "zh": "我准备好了，你来问吧。", "py": "Wǒ zhǔnbèi hǎo le, nǐ lái wèn ba.", "vi": "Mình chuẩn bị xong rồi, cậu hỏi đi."}, {"t": 764.6, "zh": "您好，喝点什么？大杯中杯，热的冰的，正常冰少冰去冰，甜度要全糖、七分糖、半糖、微糖，还是不另外加糖？要加珍珠还是椰果？", "py": "Nínhǎo, hē diǎn shénme? Dàbēi zhōngbēi, rè de bīng de, zhèngcháng bīng shǎobīng qùbīng, tiándù yào quántáng, qī fēn táng, bàntáng, wēitáng, háishì búlìng wàijiā táng? Yào jiā zhēnzhū háishì yēguǒ?", "vi": "Xin chào, quý khách uống gì ạ? Cỡ lớn hay vừa, nóng hay đá, đá bình thường, ít đá hay bỏ đá, độ ngọt đường đầy đủ, bảy phần, nửa phần, ít đường, hay không thêm đường? Thêm trân châu hay thạch dừa?"}, {"t": 781.9, "zh": "天呐，停停停！每次听到店员像说相声一样问这一大串，很多外国朋友站在柜台前，直接就大脑空白了。", "py": "Tiān na, tíngtíng tíng! Měi cì tīngdào diànyuán xiàng shuō xiàngsheng yíyàng wèn zhè yí dà chuàn, hěn duō wàiguó péngyou zhàn zài guìtái qián, zhíjiē jiù dà nǎo kòngbái le.", "vi": "Trời ơi, dừng dừng dừng! Mỗi lần nghe nhân viên hỏi một tràng dài như nói tướng thanh, nhiều bạn nước ngoài đứng trước quầy là đầu óc trống rỗng ngay."}, {"t": 794.0, "zh": "最后只能结结巴巴地说：“呃，好的，都行。”结果拿到手里，甜得根本喝不下去。", "py": "Zuìhòu zhǐ néng jiējie bābā de shuō: \"è, hǎo de, dōu xíng.\" jiéguǒ ná dào shǒulǐ, tián de gēnběn hē bú xiàqu.", "vi": "Cuối cùng chỉ biết lắp bắp: “Ờ, được, gì cũng được.” Kết quả cầm trên tay, ngọt đến mức không uống nổi."}, {"t": 803.4, "zh": "太真实了。其实大家不用害怕面对这一大串问题，你只需要搞清楚两件事。", "py": "Tài zhēnshí le. Qíshí dàjiā búyòng hàipà miànduì zhè yí dà chuàn wèntí, nǐ zhǐ xūyào gǎo qīngchǔ liǎngjiàn shì.", "vi": "Thật quá. Thật ra mọi người không cần sợ một tràng câu hỏi này, bạn chỉ cần nắm rõ hai việc."}, {"t": 810.9, "zh": "第一是温度，第二是甜度。", "py": "Dì yī shì wēndù, dì èr shì tiándù.", "vi": "Thứ nhất là nhiệt độ, thứ hai là độ ngọt."}, {"t": 814.7, "zh": "对，我们先说温度。冰的饮料一般有三个最常用的选项。", "py": "Duì, wǒmen xiān shuō wēndù. Bīng de yǐnliào yìbān yǒu sān gè zuì chángyòng de xuǎnxiàng.", "vi": "Đúng, ta nói nhiệt độ trước. Đồ uống lạnh thường có ba lựa chọn dùng nhiều nhất."}, {"t": 821.1, "zh": "第一个叫“正常冰”，就是按正常的量加冰，冰块挺多的。", "py": "Dì yí ge jiào \"zhèngcháng bīng\", jiù shì àn zhèngcháng de liàng jiābīng, bīngkuài tǐng duō de.", "vi": "Cái thứ nhất gọi là “正常冰”, tức là cho đá theo lượng bình thường, khá nhiều đá."}, {"t": 827.8, "zh": "第二个叫“少冰”，只有一点点冰块，这是中国年轻人最爱选的。", "py": "Dì èr gè jiào \"shǎobīng\", zhǐyǒu yìdiǎndiǎn bīngkuài, zhè shì Zhōngguó niánqīng rén zuì ài xuǎn de.", "vi": "Cái thứ hai gọi là “少冰”, chỉ có một chút đá, đây là lựa chọn giới trẻ Trung Quốc thích nhất."}, {"t": 834.5, "zh": "第三个叫“去冰”，意思是把冰块拿掉，但饮料本身还是凉的。", "py": "Dì sān gè jiào \"qùbīng\", yìsi shì bǎ bīngkuài nádiào, dàn yǐnliào běnshēn háishì liáng de.", "vi": "Cái thứ ba gọi là “去冰”, nghĩa là bỏ đá đi, nhưng bản thân đồ uống vẫn mát."}, {"t": 841.4, "zh": "如果你不想喝凉的，你可以选“常温”，也就是不冷也不热。", "py": "Rúguǒ nǐ bù xiǎng hē liáng de, nǐ kěyǐ xuǎn \"chángwēn\", yě jiù shì bù lěng yě bú rè.", "vi": "Nếu bạn không muốn uống lạnh, bạn có thể chọn “常温”, tức là không lạnh cũng không nóng."}, {"t": 847.5, "zh": "如果是冬天，你就可以直接选“热的”。", "py": "Rúguǒ shì dōngtiān, nǐ jiù kěyǐ zhíjiē xuǎn \"rè de\".", "vi": "Nếu là mùa đông, bạn có thể chọn thẳng “热的”."}, {"t": 850.8, "zh": "搞定了温度，再看甜度。甜度也很简单。", "py": "Gǎodìng le wēndù, zài kàn tiándù. Tiándù yě hěn jiǎndān.", "vi": "Xong nhiệt độ, xét đến độ ngọt. Độ ngọt cũng rất đơn giản."}, {"t": 855.0, "zh": "“全糖”就是标准的甜度，一般会非常甜。", "py": "\"quántáng\" jiù shì biāozhǔn de tiándù, yìbān huì fēicháng tián.", "vi": "“全糖” là độ ngọt tiêu chuẩn, thường sẽ rất ngọt."}, {"t": 859.8, "zh": "如果你不想太甜，你可以选“半糖”，也就是一半的糖。", "py": "Rúguǒ nǐ bù xiǎng tài tián, nǐ kěyǐ xuǎn \"bàntáng\", yě jiù shì yíbàn de táng.", "vi": "Nếu bạn không muốn quá ngọt, có thể chọn “半糖”, tức là một nửa lượng đường."}, {"t": 865.4, "zh": "如果你只想要一点点甜味，你可以选“微糖”或者“三分糖”。", "py": "Rúguǒ nǐ zhǐ xiǎng yào yìdiǎndiǎn tiánwèi, nǐ kěyǐ xuǎn \"wēitáng\" huòzhě \"sān fēn táng\".", "vi": "Nếu bạn chỉ muốn một chút vị ngọt, có thể chọn “微糖” hoặc “三分糖”."}, {"t": 871.6, "zh": "如果你不想再加糖，记住这五个字：“不另外加糖”，或者直接说“不加糖”。", "py": "Rúguǒ nǐ bù xiǎng zài jiātáng, jìzhù zhè wǔ gè zì: \"búlìng wàijiā táng\", huòzhě zhíjiē shuō \"bù jiātáng\".", "vi": "Nếu bạn không muốn thêm đường nữa, nhớ năm chữ này: “不另外加糖”, hoặc nói thẳng “不加糖”."}, {"t": 879.9, "zh": "不过注意哦，不加糖的奶茶本身可能还是有一点点甜的。", "py": "Búguò zhùyì ò, bù jiātáng de nǎichá běnshēn kěnéng háishì yǒu yìdiǎndiǎn tián de.", "vi": "Có điều lưu ý nhé, trà sữa không thêm đường bản thân có thể vẫn hơi ngọt một chút."}, {"t": 886.1, "zh": "温度和甜度都搞定了，下次去买奶茶或者咖啡，根本不需要等店员问你。", "py": "Wēndù hé tiándù dōu gǎodìng le, xià cì qù mǎi nǎichá huòzhě kāfēi, gēnběn bù xūyào děng diànyuán wèn nǐ.", "vi": "Nhiệt độ và độ ngọt đều xong rồi, lần sau đi mua trà sữa hoặc cà phê, hoàn toàn không cần đợi nhân viên hỏi."}, {"t": 891.1, "zh": "你走过去，直接用一个公式：“来杯”加饮料名字，再说杯型、温度、甜度。", "py": "Nǐ zǒu guòqù, zhíjiē yòng yí ge gōngshì: \"lái bēi\" jiā yǐnliào míngzì, zài shuō bēixíng, wēndù, tiándù.", "vi": "Bạn bước đến, dùng thẳng một công thức: “来杯” cộng tên đồ uống, rồi nói cỡ cốc, nhiệt độ, độ ngọt."}, {"t": 902.5, "zh": "一句话就能把所有要求全说完。比如你可以直接说：“你好，来杯奶茶，大杯，少冰，半糖。”", "py": "Yíjù huà jiù néng bǎ suǒyǒu yāoqiú quán shuōwán. Bǐrú nǐ kěyǐ zhíjiē shuō: \"nǐhǎo, lái bēi nǎichá, dàbēi, shǎobīng, bàntáng.\"", "vi": "Một câu là nói hết mọi yêu cầu. Ví dụ bạn có thể nói thẳng: “你好，来杯奶茶，大杯，少冰，半糖.”"}, {"t": 912.7, "zh": "或者去咖啡店：“你好，来杯拿铁，中杯，热的，不加糖，谢谢。”", "py": "Huòzhě qù kāfēidiàn: \"nǐhǎo, lái bēi nátiě, zhōngbēi, rè de, bù jiātáng, xièxie.\"", "vi": "Hoặc vào quán cà phê: “你好，来杯拿铁，中杯，热的，不加糖，谢谢.”"}, {"t": 920.1, "zh": "大家听听，整句话加起来十来个字，但是杯型、温度、甜度全齐了。", "py": "Dàjiā tīngting, zhěng jù huà jiā qǐlai shílái gè zì, dànshì bēixíng, wēndù, tiándù quán qí le.", "vi": "Mọi người nghe xem, cả câu cộng lại chừng mười mấy chữ, nhưng cỡ cốc, nhiệt độ, độ ngọt đều đủ cả."}, {"t": 928.1, "zh": "店员听完，手脚麻利地直接给你做，心里还会夸你是个点单高手。", "py": "Diànyuán tīng wán, shǒujiǎo málì de zhíjiē gěi nǐ zuò, xīnlǐ hái huì kuā nǐ shì gè diǎndān gāoshǒu.", "vi": "Nhân viên nghe xong, nhanh tay làm ngay cho bạn, trong lòng còn khen bạn là cao thủ gọi món."}, {"t": 935.0, "zh": "好了，饭也吃饱了，奶茶也喝足了，接下来到了全场最刺激、最精彩的环节：怎么叫服务员买单？以及中国人的“抢着买单大战”。", "py": "Hǎo le, fàn yě chībǎo le, nǎichá yě hē zú le, jiē xiàlái dào le quánchǎng zuì cìjī, zuì jīngcǎi de huánjié: zěnme jiào fúwùyuán mǎidān? Yǐjí Zhōngguórén de \"qiǎngzhe mǎidān dàzhàn\".", "vi": "Được rồi, cơm no, trà sữa cũng đã đủ, tiếp theo là phần gay cấn và đặc sắc nhất: làm sao gọi phục vụ tính tiền? Và “cuộc chiến giành trả tiền” của người Trung Quốc.", "sec": "Gọi tính tiền và cuộc chiến giành trả tiền"}, {"t": 947.4, "zh": "这也是一个重灾区。很多外国朋友吃完饭会举起手，特别客气地喊：“服务员，请给我账单。”", "py": "Zhè yě shì yí ge zhòng zāiqū. Hěn duō wàiguó péngyou chīwán fàn huì jǔqǐ shǒu, tèbié kèqì de hǎn: \"fúwùyuán, qǐng gěi wǒ zhàngdān.\"", "vi": "Đây cũng là vùng “nặng nề” nhất. Nhiều bạn nước ngoài ăn xong sẽ giơ tay, hô rất lịch sự: “服务员，请给我账单.”"}, {"t": 957.0, "zh": "老实说，在一些特别高档的西餐厅，你说“请给我账单”是可以的。", "py": "Lǎoshí shuō, zài yìxiē tèbié gāodàng de xī cāntīng, nǐ shuō \"qǐng gěi wǒ zhàngdān\" shì kěyǐ de.", "vi": "Nói thật, ở một số nhà hàng Tây thật sang, bạn nói “请给我账单” là được."}, {"t": 963.8, "zh": "但是在绝大多数普通的餐馆饭店里，如果你这么说，服务员可能会愣一下。", "py": "Dànshì zài juédà duōshù pǔtōng de cānguǎn fàndiàn lǐ, rúguǒ nǐ zhème shuō, fúwùyuán kěnéng huì lèng yíxià.", "vi": "Nhưng ở phần lớn quán ăn nhà hàng bình thường, nếu bạn nói vậy, phục vụ có thể sẽ ngẩn ra một chút."}, {"t": 970.9, "zh": "那普通餐馆里，中国人最常用的是什么词？只有两个：要么叫“买单”，要么叫“结账”。", "py": "Nà pǔtōng cānguǎn lǐ, Zhōngguórén zuì chángyòng de shì shénme cí? Zhǐyǒu liǎng gè: yàome jiào \"mǎidān\", yàome jiào \"jiézhàng\".", "vi": "Vậy ở quán ăn bình thường, người Trung Quốc dùng từ nào nhiều nhất? Chỉ có hai: hoặc “买单”, hoặc “结账”."}, {"t": 982.8, "zh": "大家吃完饭，直接抬起手，不需要站起来，微笑着对远处喊一声：“服务员，买单！”或者说：“老板，结个账。”", "py": "Dàjiā chīwán fàn, zhíjiē táiqǐ shǒu, bù xūyào zhàn qǐlai, wēixiàozhe duì yuǎnchù hǎn yìshēng: \"fúwùyuán, mǎidān!\" huòzhě shuō: \"lǎobǎn, jié gè zhàng.\"", "vi": "Ăn xong, cứ giơ tay lên, không cần đứng dậy, mỉm cười gọi về phía xa một tiếng: “服务员，买单!” hoặc nói: “老板，结个账.”"}, {"t": 994.8, "zh": "服务员听到之后，就会拿着二维码或者账单走过来，对你说：“您好，一共八十八块。”", "py": "Fúwùyuán tīngdào zhīhòu, jiù huì názhe èrwéi mǎ huòzhě zhàngdān zǒu guòlái, duì nǐ shuō: \"nínhǎo, yígòng bā shíbā kuài.\"", "vi": "Phục vụ nghe xong sẽ cầm mã QR hoặc hóa đơn đi tới, nói với bạn: “Xin chào, tổng cộng tám mươi tám tệ.”"}, {"t": 1002.5, "zh": "这时候如果你想用微信或者支付宝付钱，不需要说长长的句子：“请问我可以用手机付钱吗？”", "py": "Zhè shíhou rúguǒ nǐ xiǎng yòng wēixìn huòzhě zhīfùbǎo fùqián, bù xūyào shuō chángcháng de jùzi: \"qǐngwèn wǒ kěyǐ yòng shǒujī fùqián ma?\"", "vi": "Lúc này nếu bạn muốn trả bằng WeChat hoặc Alipay, không cần nói câu dài: “Xin hỏi tôi có thể dùng điện thoại để trả tiền không?”"}, {"t": 1013.8, "zh": "你只需要拿出手机，问一句：“微信可以吗？”或者：“扫哪里？”", "py": "Nǐ zhǐ xūyào náchū shǒujī, wèn yí jù: \"wēixìn kěyǐ ma?\" huòzhě: \"sǎo nǎlǐ?\"", "vi": "Bạn chỉ cần lấy điện thoại ra, hỏi một câu: “微信可以吗?” hoặc: “扫哪里?”"}, {"t": 1021.3, "zh": "“扫哪里？”意思是：是我扫桌上的二维码，还是你拿机器来扫我的手机？", "py": "\"sǎo nǎlǐ?\" yìsi shì: shì wǒ sǎo zhuōshàng de èrwéi mǎ, háishì nǐ ná jīqì lái sǎo wǒ de shǒujī?", "vi": "“扫哪里?” nghĩa là: tôi quét mã QR trên bàn, hay bạn cầm máy đến quét điện thoại của tôi?"}, {"t": 1028.6, "zh": "服务员就会指着桌子说：“扫桌上的码就行。”或者拿着机器说：“我扫您。”", "py": "Fúwùyuán jiù huì zhǐzhe zhuōzi shuō: \"sǎo zhuōshàng de mǎ jiù xíng.\" huòzhě názhe jīqì shuō: \"wǒ sǎo nín.\"", "vi": "Phục vụ sẽ chỉ vào bàn nói: “Quét mã trên bàn là được.” hoặc cầm máy nói: “Để tôi quét bạn.”"}, {"t": 1037.4, "zh": "整个付钱的过程，你只说了三个字：“扫哪里？”轻松又顺畅。", "py": "Zhěnggè fùqián de guòchéng, nǐ zhǐ shuō le sān gè zì: \"sǎo nǎlǐ?\" qīngsōng yòu shùnchàng.", "vi": "Cả quá trình trả tiền, bạn chỉ nói ba chữ: “扫哪里?”. Nhẹ nhàng và trôi chảy."}, {"t": 1044.1, "zh": "不过小陈，要是跟中国朋友一起吃饭，买单可就没这么简单了。", "py": "Búguò Xiǎo Chén, yàoshì gēn Zhōngguó péngyou yìqǐ chīfàn, mǎidān kě jiù méi zhème jiǎndān le.", "vi": "Nhưng Tiểu Trần này, nếu ăn cùng bạn Trung Quốc thì tính tiền không đơn giản như vậy đâu."}, {"t": 1051.5, "zh": "你是不是要说中国人吃饭最具代表性的名场面：抢着买单？", "py": "Nǐ shì búshì yào shuō Zhōngguórén chīfàn zuì jù dàibiǎoxìng de míng chǎngmiàn: qiǎngzhe mǎidān?", "vi": "Có phải cậu định nói về cảnh tượng tiêu biểu nhất khi người Trung Quốc ăn cơm: giành nhau trả tiền?"}, {"t": 1057.7, "zh": "太对了。很多刚来中国的外国朋友第一次见到这个场面，吓得以为两边要打架呢。", "py": "Tài duì le. Hěn duō gāng lái Zhōngguó de wàiguó péngyou dì yī cì jiàndào zhège chǎngmiàn, xià de yǐwéi liǎngbiān yào dǎjià ne.", "vi": "Chuẩn quá. Nhiều bạn nước ngoài mới đến Trung Quốc lần đầu thấy cảnh này, sợ đến mức tưởng hai bên sắp đánh nhau."}, {"t": 1066.6, "zh": "两个人站在收银台前，互相推对方的手，一边把对方的手机推开，一边拼命把自己的手机往前伸，嘴里还要大声喊：", "py": "Liǎng gè rén zhàn zài shōuyín tái qián, hùxiāng tuī duìfāng de shǒu, yìbiān bǎ duìfāng de shǒujī tuīkāi, yìbiān pīnmìng bǎ zìjǐ de shǒujī wǎngqián shēn, zuǐlǐ hái yào dàshēng hǎn:", "vi": "Hai người đứng trước quầy thu ngân, đẩy tay nhau, một bên gạt điện thoại của đối phương ra, một bên cố hết sức đưa điện thoại của mình lên trước, miệng còn hô to:"}, {"t": 1080.1, "zh": "“我来我来，今天谁也别跟我抢！”“不行，必须我请，上次就是你请的！”", "py": "\"wǒ lái wǒ lái, jīntiān shuí yě biégēn wǒ qiǎng!\" \"bùxíng, bìxū wǒ qǐng, shàng cì jiù shì nǐ qǐng de!\"", "vi": "“Để mình, để mình, hôm nay đừng ai giành với mình!” “Không được, phải để mình mời, lần trước chính cậu mời mà!”"}, {"t": 1088.9, "zh": "甚至有人为了抢买单，中途假装去上洗手间，偷偷把钱给付了。", "py": "Shènzhì yǒu rén wèile qiǎng mǎidān, zhōngtú jiǎzhuāng qù shàng xǐshǒu jiān, tōutōu bǎ qián jǐfù le.", "vi": "Thậm chí có người để giành trả tiền, giữa chừng giả vờ đi vệ sinh, lén trả tiền rồi."}, {"t": 1096.0, "zh": "外国朋友很不理解：大家各付各的不好吗？为什么要这么费劲地抢着买单呢？", "py": "Wàiguó péngyou hěn bù lǐjiě: dàjiā gè fù gè de bù hǎo ma? Wèishénme yào zhème fèijìn de qiǎngzhe mǎidān ne?", "vi": "Bạn nước ngoài rất khó hiểu: mỗi người trả phần mình không tốt sao? Vì sao phải tốn sức giành trả tiền như vậy?"}, {"t": 1103.2, "zh": "这其实背后有两个原因。第一，在中国文化里，请客吃饭代表着热情和对朋友的重视。", "py": "Zhè qíshí bèihòu yǒu liǎng gè yuányīn. Dì yī, zài Zhōngguó wénhuà lǐ, qǐngkè chīfàn dàibiǎo zhe rèqíng hé duì péngyou de zhòngshì.", "vi": "Thật ra phía sau có hai nguyên nhân. Thứ nhất, trong văn hóa Trung Quốc, mời ăn cơm thể hiện sự nhiệt tình và coi trọng bạn bè."}, {"t": 1115.3, "zh": "第二，中国人很看重人情的往来。如果每次都算得清清楚楚，各付各的，大家会觉得关系有点生疏。", "py": "Dì èr, Zhōngguórén hěn kànzhòng rénqíng de wǎnglái. Rúguǒ měi cì dōu suàn de qīngqīngchǔchǔ, gè fù gè de, dàjiā huì juéde guānxì yǒu diǎn shēngshū.", "vi": "Thứ hai, người Trung Quốc rất coi trọng qua lại tình nghĩa. Nếu lần nào cũng tính toán rõ ràng, ai trả phần nấy, mọi người sẽ thấy quan hệ hơi xa cách."}, {"t": 1125.6, "zh": "对。中国人常说：“这次你请，下次我请。”", "py": "Duì. Zhōngguórén cháng shuō: \"zhè cì nǐ qǐng, xià cì wǒ qǐng.\"", "vi": "Đúng. Người Trung Quốc hay nói: “Lần này cậu mời, lần sau mình mời.”"}, {"t": 1131.4, "zh": "这样一来，大家自然而然就有了借口再约下一顿饭，两个人的友情就会一直延续下去。", "py": "Zhèyàng yì lái, dàjiā zìrán érrán jiù yǒu le jièkǒu zài yuē xià yídùn fàn, liǎng gè rén de yǒuqíng jiù huì yìzhí yánxù xiàqu.", "vi": "Như vậy, mọi người tự nhiên có cớ hẹn bữa ăn tiếp theo, tình bạn của hai người sẽ cứ thế kéo dài."}, {"t": 1140.3, "zh": "但如果外国朋友遇到中国朋友拼命要请客，但自己真的很想买单，怎么说才最合适呢？", "py": "Dàn rúguǒ wàiguó péngyou yùdào Zhōngguó péngyou pīnmìng yào qǐngkè, dàn zìjǐ zhēnde hěn xiǎng mǎidān, zěnme shuō cái zuì héshì ne?", "vi": "Nhưng nếu bạn nước ngoài gặp bạn Trung Quốc cố hết sức đòi mời, mà bản thân thật sự muốn trả tiền, nói thế nào mới hợp nhất?"}, {"t": 1149.5, "zh": "你可以微笑着拉住朋友，用最真诚的语气说这句话：“今天听我的。这次我来，下次你请。”", "py": "Nǐ kěyǐ wēixiàozhe lā zhù péngyou, yòng zuì zhēnchéng de yǔqì shuō zhè jù huà: \"jīntiān tīng wǒ de. Zhècì wǒ lái, xià cì nǐ qǐng.\"", "vi": "Bạn có thể mỉm cười kéo tay bạn, dùng giọng chân thành nhất nói câu này: “Hôm nay nghe mình. Lần này mình trả, lần sau cậu mời.”"}, {"t": 1158.8, "zh": "“这次我来，下次你请”这句话太厉害了，不仅化解了尴尬，还直接跟朋友约好了下一次见面。", "py": "\"zhè cì wǒ lái, xià cì nǐ qǐng\" zhè jù huà tài lìhài le, bùjǐn huàjiě le gāngà, hái zhíjiē gēn péngyou yuē hǎo le xià yí cì jiànmiàn.", "vi": "Câu “这次我来，下次你请” quá lợi hại, không những hóa giải sự ngượng ngùng mà còn hẹn luôn lần gặp tiếp theo với bạn."}, {"t": 1167.7, "zh": "绝对会让你的中国朋友觉得你特别讲义气，特别懂事。", "py": "Juéduì huì ràng nǐ de Zhōngguó péngyou juéde nǐ tèbié jiǎng yìqì, tèbié dǒngshì.", "vi": "Chắc chắn sẽ khiến bạn Trung Quốc thấy bạn rất trọng nghĩa khí, rất hiểu chuyện."}, {"t": 1172.7, "zh": "今天我们从进门叫服务员、点菜、提口味要求，一直聊到了烫餐具、买奶茶和抢买单。", "py": "Jīntiān wǒmen cóng jìnmén jiào fúwùyuán, diǎncài, tí kǒuwèi yāoqiú, yìzhí liáodào le tàng cānjù, mǎi nǎichá hé qiǎng mǎidān.", "vi": "Hôm nay chúng mình nói từ việc vào cửa gọi phục vụ, gọi món, nêu yêu cầu khẩu vị, cho đến tráng bát đũa, mua trà sữa và giành trả tiền.", "sec": "Tổng kết: lời nói đời thường càng đơn giản càng tốt"}, {"t": 1183.1, "zh": "大家是不是发现，地道的中文真的没有那么多复杂的语法？", "py": "Dàjiā shì búshì fāxiàn, dìdào de zhōngwén zhēnde méi yǒu nàme duō fùzá de yǔfǎ?", "vi": "Mọi người có nhận ra không, tiếng Trung chính gốc thật sự không có nhiều ngữ pháp phức tạp như vậy?"}, {"t": 1190.4, "zh": "其实，越是日常的生活场景，语言越是简单，越是直接。", "py": "Qíshí, yuèshì rìcháng de shēnghuó chǎngjǐng, yǔyán yuèshì jiǎndān, yuèshì zhíjiē.", "vi": "Thật ra, tình huống đời sống càng thường ngày thì ngôn ngữ càng đơn giản, càng trực tiếp."}, {"t": 1197.1, "zh": "很多外国朋友之所以说话像机器人，就是因为在脑子里把简单的问题想复杂了。", "py": "Hěn duō wàiguó péngyou zhī suǒyǐ shuōhuà xiàng jīqìrén, jiù shì yīnwèi zài nǎozi lǐ bǎ jiǎndān de wèntí xiǎng fùzá le.", "vi": "Nhiều bạn nước ngoài sở dĩ nói chuyện như người máy là vì trong đầu nghĩ vấn đề đơn giản thành phức tạp."}, {"t": 1206.2, "zh": "总是先在脑子里写好一段语法完美的文章，然后再一个字一个字念出来。", "py": "Zǒngshì xiān zài nǎozi lǐ xiě hǎo yí duàn yǔfǎ wánměi de wénzhāng, ránhòu zài yí ge zì yí ge zì niàn chūlái.", "vi": "Lúc nào cũng viết sẵn trong đầu một đoạn văn ngữ pháp hoàn hảo rồi mới đọc từng chữ một."}, {"t": 1214.2, "zh": "其实完全不用这样。在生活里放松一点，用最简单的词配上热情的语气，你的中文立刻就会变得有生命力。", "py": "Qíshí wánquán búyòng zhèyàng. Zài shēnghuó lǐ fàngsōng yìdiǎn, yòng zuì jiǎndān de cí pèishàng rèqíng de yǔqì, nǐ de zhōngwén lìkè jiù huì biàn de yǒu shēngmìnglì.", "vi": "Thật ra hoàn toàn không cần như vậy. Trong cuộc sống hãy thoải mái hơn, dùng từ đơn giản nhất kèm giọng điệu nhiệt tình, tiếng Trung của bạn lập tức sẽ có sức sống."}, {"t": 1225.3, "zh": "在复习之前，先考考大家。第一题：你想吃一碗牛肉面，但是不要香菜，怎么跟老板说？", "py": "Zài fùxí zhīqián, xiān kǎokǎo dàjiā. Dì yī tí: nǐ xiǎng chī yì wǎn niúròu miàn, dànshì búyào xiāngcài, zěnme gēn lǎobǎn shuō?", "vi": "Trước khi ôn lại, thử thách mọi người một chút. Câu một: bạn muốn ăn một bát mì bò nhưng không lấy rau mùi, nói với chủ quán thế nào?", "sec": "Câu đố nhỏ"}, {"t": 1235.1, "zh": "先在心里说一遍。三，二，一。", "py": "Xiān zài xīnlǐ shuō yí biàn. Sān, èr, yī.", "vi": "Hãy nói thầm trong lòng một lượt. Ba, hai, một."}, {"t": 1241.2, "zh": "“老板，来碗牛肉面，别放香菜。”", "py": "\"lǎobǎn, lái wǎn niúròu miàn, bié fàng xiāngcài.\"", "vi": "“老板，来碗牛肉面，别放香菜.”"}, {"t": 1244.6, "zh": "第二题换我来问：你想喝一杯奶茶，要大杯、少冰、半糖，怎么说？", "py": "Dì èr tí huàn wǒ lái wèn: nǐ xiǎng hē yì bēi nǎichá, yào dàbēi, shǎobīng, bàntáng, zěnme shuō?", "vi": "Câu hai đổi mình hỏi: bạn muốn uống một ly trà sữa, cỡ lớn, ít đá, nửa đường, nói thế nào?"}, {"t": 1252.8, "zh": "三，二，一。", "py": "Sān, èr, yī.", "vi": "Ba, hai, một."}, {"t": 1256.7, "zh": "“你好，来杯奶茶，大杯少冰半糖。”", "py": "\"nǐhǎo, lái bēi nǎichá, dàbēi shǎobīng bàntáng.\"", "vi": "“你好，来杯奶茶，大杯少冰半糖.”"}, {"t": 1261.5, "zh": "两题都说对的朋友，你已经是点单高手了。", "py": "Liǎng tí dōu shuō duì de péngyou, nǐ yǐjing shì diǎndān gāoshǒu le.", "vi": "Bạn nào nói đúng cả hai câu, bạn đã là cao thủ gọi món rồi."}, {"t": 1265.8, "zh": "在今天节目的最后，我们像平时一样，花两分钟时间，帮大家把今天学到的点餐密码快速复习一遍。", "py": "Zài jīntiān jiémù de zuìhòu, wǒmen xiàng píngshí yíyàng, huā liǎng fēnzhōng shíjiān, bāng dàjiā bǎ jīntiān xuédào de diǎncān mìmǎ kuàisù fùxí yí biàn.", "vi": "Cuối chương trình hôm nay, như thường lệ, chúng mình dành hai phút giúp mọi người ôn nhanh “mật mã gọi món” đã học.", "sec": "Ôn lại sáu trọng điểm"}, {"t": 1276.8, "zh": "第一个重点：进门叫人最安全的是“服务员”，小店可以叫“老板”，年轻店员可以叫“小哥”或“小姐姐”。", "py": "Dì yí ge zhòngdiǎn: jìnmén jiào rén zuì ānquán de shì \"fúwùyuán\", xiǎodiàn kěyǐ jiào \"lǎobǎn\", niánqīng diànyuán kěyǐ jiào \"xiǎogē\" huò \"xiǎojiějiě\".", "vi": "Trọng điểm thứ nhất: vào cửa gọi người an toàn nhất là “服务员”, quán nhỏ có thể gọi “老板”, nhân viên trẻ có thể gọi “小哥” hoặc “小姐姐”."}, {"t": 1288.1, "zh": "第二个重点：点菜别再总说“我想要”，换成地道的“来个”或者“来一份”，想喝东西的时候可以说“来杯”。", "py": "Dì èr gè zhòngdiǎn: diǎncài bié zài zǒng shuō \"wǒ xiǎng yào\", huànchéng dìdào de \"lái gè\" huòzhě \"lái yí fèn\", xiǎng hē dōngxi de shíhou kěyǐ shuō \"lái bēi\".", "vi": "Trọng điểm thứ hai: gọi món đừng cứ nói “我想要”, hãy đổi sang “来个” hoặc “来一份” chuẩn bản xứ, lúc muốn uống gì thì nói “来杯”."}, {"t": 1300.1, "zh": "第三个重点：找服务员拿东西，别总说太正式的“请给我”，换成亲切自然的“帮我拿”或者“帮我倒”。", "py": "Dì sān gè zhòngdiǎn: zhǎo fúwùyuán ná dōngxi, bié zǒng shuō tài zhèngshì de \"qǐng gěi wǒ\", huànchéng qīnqiè zìrán de \"bāng wǒ ná\" huòzhě \"bāng wǒ dào\".", "vi": "Trọng điểm thứ ba: nhờ phục vụ lấy đồ, đừng cứ nói “请给我” quá trang trọng, hãy đổi sang “帮我拿” hoặc “帮我倒” thân thiện tự nhiên."}, {"t": 1311.4, "zh": "第四个重点：口味要求抓核心。多一点叫“多放点”，少一点叫“少放点”，不要就直接说“不放”或者“不要辣”。", "py": "Dì sì gè zhòngdiǎn: kǒuwèi yāoqiú zhuā héxīn. Duō yìdiǎn jiào \"duō fàng diǎn\", shǎo yìdiǎn jiào \"shǎo fàng diǎn\", búyào jiù zhíjiē shuō \"bú fàng\" huòzhě \"búyào là\".", "vi": "Trọng điểm thứ tư: yêu cầu khẩu vị nắm phần cốt lõi. Nhiều hơn một chút thì nói “多放点”, ít hơn thì nói “少放点”, không muốn thì nói thẳng “不放” hoặc “不要辣”."}, {"t": 1324.0, "zh": "第五个重点：奶茶点单公式。记住温度选“少冰”或“去冰”，甜度选“半糖”或“不加糖”，进门直接说：“来杯拿铁，大杯，少冰，不加糖。”", "py": "Dì wǔ gè zhòngdiǎn: nǎichá diǎndān gōngshì. Jìzhù wēndù xuǎn \"shǎobīng\" huò \"qùbīng\", tiándù xuǎn \"bàntáng\" huò \"bù jiātáng\", jìnmén zhíjiē shuō: \"lái bēi nátiě, dàbēi, shǎobīng, bù jiātáng.\"", "vi": "Trọng điểm thứ năm: công thức gọi trà sữa. Nhớ nhiệt độ chọn “少冰” hoặc “去冰”, độ ngọt chọn “半糖” hoặc “不加糖”, vào cửa nói thẳng: “来杯拿铁，大杯，少冰，不加糖.”"}, {"t": 1341.4, "zh": "第六个重点：结账买单。别说“请给我账单”，直接招手说：“服务员，买单！”或者“老板，结个账。”付钱时直接问“扫哪里”，遇到朋友抢买单，记得说一句：“这次我来，下次你请。”", "py": "Dì liù gè zhòngdiǎn: jiézhàng mǎidān. Biéshuō \"qǐng gěi wǒ zhàngdān\", zhíjiē zhāoshǒu shuō: \"fúwùyuán, mǎidān!\" huòzhě \"lǎobǎn, jié gè zhàng.\" fùqián shí zhíjiē wèn \"sǎo nǎlǐ\", yùdào péngyou qiǎng mǎidān, jìde shuō yí jù: \"zhè cì wǒ lái, xià cì nǐ qǐng.\"", "vi": "Trọng điểm thứ sáu: thanh toán. Đừng nói “请给我账单”, cứ vẫy tay nói: “服务员，买单!” hoặc “老板，结个账.” Khi trả tiền hỏi thẳng “扫哪里”, gặp bạn giành trả tiền thì nhớ nói một câu: “这次我来，下次你请.”"}, {"t": 1360.6, "zh": "大家下次去中国餐厅吃饭，或者去楼下买咖啡的时候，一定要把今天学的这几句话勇敢地用出来，看看店员听到你这么说，是不是会露出惊喜的表情。", "py": "Dàjiā xià cì qù Zhōngguó cāntīng chīfàn, huòzhě qù lóuxià mǎi kāfēi de shíhou, yídìng yào bǎ jīntiān xué de zhè jǐ jù huà yǒnggǎn de yòng chūlái, kànkan diànyuán tīngdào nǐ zhème shuō, shì búshì huì lùchū jīngxǐ de biǎoqíng.", "vi": "Lần sau mọi người đi ăn nhà hàng Trung Quốc, hoặc xuống lầu mua cà phê, nhất định hãy mạnh dạn dùng những câu học hôm nay, xem nhân viên nghe bạn nói vậy có lộ vẻ ngạc nhiên thích thú không.", "sec": "Kết thúc chương trình"}, {"t": 1374.7, "zh": "感谢大家的收听。大家在中国的餐馆点菜时，有没有遇到过什么好玩或者尴尬的事情？", "py": "Gǎnxiè dàjiā de shōutīng. Dàjiā zài Zhōngguó de cānguǎn diǎncài shí, yǒu méiyǒu yùdào guò shénme hǎowán huòzhě gāngà de shìqing?", "vi": "Cảm ơn mọi người đã nghe. Khi gọi món ở nhà hàng Trung Quốc, mọi người đã từng gặp chuyện thú vị hay ngượng ngùng nào chưa?"}, {"t": 1383.3, "zh": "非常欢迎在评论区用中文给我们留言分享。那今天这期节目就到这里。", "py": "Fēicháng huānyíng zài pínglùn qū yòng zhōngwén gěi wǒmen liúyán fēnxiǎng. Nà jīntiān zhè qī jiémù jiù dào zhèlǐ.", "vi": "Rất hoan nghênh mọi người chia sẻ bằng tiếng Trung ở phần bình luận. Chương trình hôm nay xin dừng ở đây."}, {"t": 1390.6, "zh": "小陈，我们今天中午去吃什么？", "py": "Xiǎo Chén, wǒmen jīntiān zhōngwǔ qù chī shénme?", "vi": "Tiểu Trần, trưa nay mình đi ăn gì?"}, {"t": 1393.5, "zh": "那还用说，走！下楼先来碗牛肉面。", "py": "Nà hái yòng shuō, zǒu! Xiàlóu xiān lái wǎn niúròu miàn.", "vi": "Còn phải hỏi, đi thôi! Xuống lầu trước tiên làm một bát mì bò."}, {"t": 1397.8, "zh": "多放香菜，少放辣。", "py": "Duō fàng xiāngcài, shǎo fàng là.", "vi": "Nhiều rau mùi, ít cay."}, {"t": 1399.9, "zh": "各位听众，我们下期播客再见。拜拜！", "py": "Gè wèi tīngzhòng, wǒmen xiàqī bōkè zàijiàn. Bàibài!", "vi": "Các thính giả thân mến, hẹn gặp lại ở kỳ podcast sau. Tạm biệt!"}, {"t": 1404.0, "zh": "下期见，拜拜！", "py": "Xiàqī jiàn, bàibài!", "vi": "Hẹn kỳ sau, tạm biệt!"}]}
