lines:[{"t": 6, "zh": "大家好！欢迎来到“每天中文”！", "py": "Dàjiā hǎo! Huānyíng láidào \"měitiān zhōngwén\"!", "vi": "Chào mọi người! Chào mừng đến với “Mỗi ngày tiếng Trung”!", "sec": "Mở đầu: học lâu mà vẫn không dám nói"}, {"t": 8, "zh": "我是你们的朋友，王雨。", "py": "Wǒ shì nǐmen de péngyou, wáng yǔ.", "vi": "Mình là người bạn của các bạn, Vương Vũ."}, {"t": 11, "zh": "大家好，我是李明。很高兴又和大家见面了。", "py": "Dàjiā hǎo, wǒ shì lǐ míng. Hěn gāoxìng yòu hé dàjiā jiànmiàn le.", "vi": "Chào mọi người, mình là Lý Minh. Rất vui lại được gặp mọi người."}, {"t": 15, "zh": "李明，今天我想先问你一个问题。", "py": "Lǐ míng, jīntiān wǒ xiǎng xiān wèn nǐ yí ge wèntí.", "vi": "Lý Minh, hôm nay mình muốn hỏi cậu một câu trước."}, {"t": 19, "zh": "哦？什么问题？你说。", "py": "Ò? Shénme wèntí? Nǐ shuō.", "vi": "Ồ? Câu hỏi gì? Cậu nói đi."}, {"t": 21, "zh": "是这样的，我有很多正在学习中文的朋友。", "py": "Shì zhèyàng de, wǒ yǒu hěnduō zhèngzài xuéxí zhōngwén de péngyou.", "vi": "Là thế này, mình có rất nhiều bạn đang học tiếng Trung."}, {"t": 26, "zh": "他们常常给我发信息，用汉字，写得很好。", "py": "Tāmen chángcháng gěi wǒ fā xìnxī, yòng hànzì, xiě de hěn hǎo.", "vi": "Họ thường nhắn tin cho mình bằng chữ Hán, viết rất tốt."}, {"t": 31, "zh": "他们也常常听我们的播客，他们说他们能听懂。", "py": "Tāmen yě chángcháng tīng wǒmen de bōkè, tāmen shuō tāmen néng tīng dǒng.", "vi": "Họ cũng thường nghe podcast của chúng ta, và nói là nghe hiểu được."}, {"t": 36, "zh": "嗯，这很好啊。说明他们学习很努力。", "py": "ń, zhè hěn hǎo a. Shuōmíng tāmen xuéxí hěn nǔlì.", "vi": "Ừm, thế thì tốt quá. Chứng tỏ họ học rất chăm."}, {"t": 41, "zh": "是啊。但是，他们有一个很大的问题。", "py": "Shì a. Dànshì, tāmen yǒu yí ge hěn dà de wèntí.", "vi": "Đúng vậy. Nhưng họ có một vấn đề rất lớn."}, {"t": 46, "zh": "他们不会说中文。或者说，他们不敢说中文。", "py": "Tāmen bú huì shuō zhōngwén. Huòzhě shuō, tāmen bù gǎn shuō zhōngwén.", "vi": "Họ không biết nói tiếng Trung. Hay đúng hơn là họ không dám nói."}, {"t": 51, "zh": "他们常常问我：“王雨，为什么我学了这么久，认识这么多汉字，但是就是说不出来呢？”", "py": "Tāmen chángcháng wèn wǒ: \"wáng yǔ, wèishénme wǒ xué le zhèmejiǔ, rènshi zhème duō hànzì, dànshì jiùshìshuō bù chūlái ne?\"", "vi": "Họ thường hỏi mình: “Vương Vũ, sao mình học lâu thế, biết nhiều chữ Hán thế mà vẫn không nói ra được?”"}, {"t": 59, "zh": "啊，我明白了。这是一个非常非常好的问题。", "py": "A, wǒ míngbai le. Zhè shì yí ge fēicháng fēicháng hǎo de wèntí.", "vi": "À, mình hiểu rồi. Đây là một câu hỏi rất rất hay."}, {"t": 65, "zh": "我想，很多正在听我们播客的朋友，可能也有同样的问题。", "py": "Wǒ xiǎng, hěnduō zhèngzài tīng wǒmen bōkè de péngyou, kěnéng yě yǒu tóngyàng de wèntí.", "vi": "Mình nghĩ nhiều bạn đang nghe podcast của chúng ta có lẽ cũng gặp vấn đề y hệt."}, {"t": 71, "zh": "对！所以，今天我们就想和大家聊一聊这个话题：为什么你学了很久，还是不会说中文？", "py": "Duì! Suǒyǐ, jīntiān wǒmen jiù xiǎng hé dàjiā liáo yì liáo zhège huàtí: wèishénme nǐ xué le hěn jiǔ, háishì bú huì shuō zhōngwén?", "vi": "Đúng! Vì vậy hôm nay chúng ta muốn trò chuyện về chủ đề này: vì sao bạn học đã lâu mà vẫn không biết nói tiếng Trung?"}, {"t": 81, "zh": "好。希望今天的聊天，能帮助到大家。", "py": "Hǎo. Xīwàng jīntiān de liáotiān, néng bāngzhù dào dàjiā.", "vi": "Được rồi. Hy vọng buổi trò chuyện hôm nay giúp ích được cho mọi người."}, {"t": 87, "zh": "李明，我觉得，第一个，也是最大的原因，就是“害怕”。害怕说错。", "py": "Lǐ míng, wǒ juéde, dìyígè, yě shì zuìdà de yuányīn, jiùshì \"hàipà\". Hàipà shuō cuò.", "vi": "Lý Minh, mình thấy lý do đầu tiên và cũng lớn nhất là “sợ”. Sợ nói sai.", "sec": "Lý do thứ nhất: sợ nói sai"}, {"t": 94, "zh": "我同意。很多人不是“不会说”，而是“不敢说”。", "py": "Wǒ tóngyì. Hěnduō rén búshì \"bú huì shuō\", érshì \"bù gǎn shuō\".", "vi": "Mình đồng ý. Nhiều người không phải “không biết nói” mà là “không dám nói”."}, {"t": 99, "zh": "对！就是这个“不敢”。", "py": "Duì! Jiùshì zhège \"bù gǎn\".", "vi": "Đúng! Chính là cái “không dám” này."}, {"t": 102, "zh": "我想起我刚开始学习英文的时候。我认识很多单词，在书上，我都能看懂。", "py": "Wǒ xiǎngqǐ wǒ gāng kāishǐ xuéxí yīngwén de shíhou. Wǒ rènshi hěnduō dāncí, zài shū shàng, wǒ dōu néng kàn dǒng.", "vi": "Mình nhớ lại hồi mới học tiếng Anh. Mình biết rất nhiều từ, trên sách thì đọc hiểu hết."}, {"t": 109, "zh": "但是，老师让我站起来回答问题的时候，我的天，我的心跳得非常快。", "py": "Dànshì, lǎoshī ràng wǒ zhàn qǐlai huídá wèntí de shíhou, wǒ de tiān, wǒ de xīntiào de fēicháng kuài.", "vi": "Nhưng khi thầy cô bảo mình đứng lên trả lời câu hỏi, trời ơi, tim mình đập cực nhanh."}, {"t": 116, "zh": "你害怕了。", "py": "Nǐ hàipà le.", "vi": "Cậu sợ rồi."}, {"t": 117, "zh": "是啊。我的脑子里面有很多想法，但是我的嘴巴就是不听话。", "py": "Shì a. Wǒ de nǎozi lǐmiàn yǒu hěnduō xiǎngfǎ, dànshì wǒ de zuǐbā jiùshì bùtīnghuà.", "vi": "Đúng vậy. Trong đầu mình có rất nhiều ý, nhưng cái miệng cứ không chịu nghe lời."}, {"t": 123, "zh": "我一句话也说不出来。我怕我的发音不对，怕我的句子不对，怕同学们笑我。", "py": "Wǒ yí jù huà yě shuō bù chūlái. Wǒ pà wǒ de fāyīn bú duì, pà wǒ de jùzi bú duì, pà tóngxué men xiào wǒ.", "vi": "Mình không nói nổi một câu. Mình sợ phát âm sai, sợ câu sai, sợ các bạn cười mình."}, {"t": 131, "zh": "我非常理解。这种感觉，我们叫“心理障碍”。", "py": "Wǒ fēicháng lǐjiě. Zhèzhǒng gǎnjué, wǒmen jiào \"xīnlǐzhàngài\".", "vi": "Mình rất hiểu. Cảm giác này chúng ta gọi là “rào cản tâm lý”."}, {"t": 136, "zh": "心里很想说，但是好像有一堵墙，挡住了你的嘴。", "py": "Xīnlǐ hěn xiǎng shuō, dànshì hǎoxiàng yǒu yì dǔ qiáng, dǎngzhù le nǐ de zuǐ.", "vi": "Trong lòng rất muốn nói, nhưng như có một bức tường chắn trước miệng."}, {"t": 140, "zh": "对对对，就是一堵墙！你说得太好了。你以前学外语的时候，有这种感觉吗？", "py": "Duì duì duì, jiùshì yì dǔ qiáng! Nǐ shuō de tài hǎo le. Nǐ yǐqián xué wàiyǔ de shíhou, yǒu zhèzhǒng gǎnjué ma?", "vi": "Đúng đúng đúng, chính là một bức tường! Cậu nói hay quá. Hồi trước học ngoại ngữ cậu có cảm giác này không?"}, {"t": 149, "zh": "当然有。我是一个比较喜欢追求完美的人。", "py": "Dāngrán yǒu. Wǒ shì yí ge bǐjiào xǐhuan zhuīqiú wánměi de rén.", "vi": "Dĩ nhiên là có. Mình là người khá thích theo đuổi sự hoàn hảo."}, {"t": 153, "zh": "所以，我刚开始学的时候，总想把我说的每一句话都说得完全正确。", "py": "Suǒyǐ, wǒ gāng kāishǐ xué de shíhou, zǒng xiǎng bǎ wǒ shuō de měi yí jù huà dōu shuō de wánquánzhèngquè.", "vi": "Cho nên lúc mới học, mình lúc nào cũng muốn nói câu nào cũng phải hoàn toàn chính xác."}, {"t": 160, "zh": "语法要对，用词要对，发音也要对。", "py": "Yǔfǎ yào duì, yòngcí yào duì, fāyīn yě yào duì.", "vi": "Ngữ pháp phải đúng, dùng từ phải đúng, phát âm cũng phải đúng."}, {"t": 164, "zh": "结果呢？", "py": "Jiéguǒ ne?", "vi": "Kết quả thì sao?"}, {"t": 165, "zh": "结果就是，我想得太多，说得太少。", "py": "Jiéguǒ jiùshì, wǒ xiǎng de tài duō, shuō de tài shǎo.", "vi": "Kết quả là mình nghĩ quá nhiều, nói quá ít."}, {"t": 169, "zh": "我说一句话之前，要在脑子里想五分钟。", "py": "Wǒ shuō yí jù huà zhīqián, yào zài nǎozi lǐ xiǎng wǔ fēnzhōng.", "vi": "Trước khi nói một câu, mình phải nghĩ trong đầu năm phút."}, {"t": 174, "zh": "等我想好了，别人已经开始说下一个话题了。", "py": "Děng wǒ xiǎng hǎo le, biérén yǐjing kāishǐ shuō xià yí ge huàtí le.", "vi": "Đến khi mình nghĩ xong thì người ta đã chuyển sang chủ đề tiếp theo rồi."}, {"t": 178, "zh": "哈哈哈，我也是！完全一样！那后来你是怎么改变的呢？", "py": "Hāhāhā, wǒ yě shì! Wánquán yíyàng! Nà hòulái nǐ shì zěnme gǎibiàn de ne?", "vi": "Ha ha ha, mình cũng vậy! Y hệt luôn! Vậy sau này cậu thay đổi bằng cách nào?"}, {"t": 184, "zh": "后来，我的一位中国老师对我说了一句话，改变了我。", "py": "Hòulái, wǒ de yí wèi zhōngguó lǎoshī duì wǒ shuō le yí jù huà, gǎibiàn le wǒ.", "vi": "Sau đó, một thầy giáo người Trung Quốc của mình nói với mình một câu, và câu ấy đã thay đổi mình."}, {"t": 189, "zh": "他说：“语言是用来交流的，不是用来考试的。你说错了，没关系。我能听懂你的意思，这才是最重要的。”", "py": "Tā shuō: \"yǔyán shì yònglái jiāoliú de, búshì yònglái kǎoshì de. Nǐ shuō cuò le, méi guānxì. Wǒ néng tīng dǒng nǐ de yìsi, zhè cái shì zuì zhòngyào de.\"", "vi": "Thầy nói: “Ngôn ngữ dùng để giao tiếp, không phải để thi. Em nói sai cũng không sao. Thầy hiểu ý em, đó mới là điều quan trọng nhất.”"}, {"t": 201, "zh": "说得太对了！“能听懂你的意思，这才是最重要的”。", "py": "Shuō de tài duì le! \"néng tīng dǒng nǐ de yìsi, zhè cái shì zuì zhòngyào de\".", "vi": "Nói quá đúng! “Hiểu được ý của bạn, đó mới là điều quan trọng nhất”."}, {"t": 206, "zh": "我的一个美国朋友也对我说过同样的话。", "py": "Wǒ de yí ge měiguó péngyou yě duì wǒ shuō guò tóngyàng dehuà.", "vi": "Một người bạn Mỹ của mình cũng từng nói với mình đúng câu như vậy."}, {"t": 210, "zh": "那时候，我想用英文告诉他，我昨天去看了一个电影。", "py": "Nà shíhou, wǒ xiǎng yòng yīngwén gàosù tā, wǒ zuótiān qù kàn le yí ge diànyǐng.", "vi": "Lúc đó mình muốn dùng tiếng Anh nói với anh ấy là hôm qua mình đi xem một bộ phim."}, {"t": 216, "zh": "我说：“I yesterday see a movie.”", "py": "Wǒ shuō: \"I yesterday see a movie. \"", "vi": "Mình nói: “I yesterday see a movie.”"}, {"t": 220, "zh": "嗯，这个语法是错的。", "py": "ń, zhège yǔfǎ shì cuò de.", "vi": "Ừm, ngữ pháp câu này sai rồi."}, {"t": 222, "zh": "是的，完全是中文的语法。", "py": "Shì de, wánquán shì zhōngwén de yǔfǎ.", "vi": "Đúng, hoàn toàn là ngữ pháp tiếng Trung."}, {"t": 225, "zh": "我说完以后，脸非常红。我觉得太丢人了。", "py": "Wǒ shuō wán yǐhòu, liǎn fēicháng hóng. Wǒ juéde tài diūrén le.", "vi": "Nói xong mặt mình đỏ bừng. Mình thấy xấu hổ quá."}, {"t": 229, "zh": "但是我的朋友马上就说：“Oh, a movie! Which one? Was it good?”", "py": "Dànshì wǒ de péngyou mǎshàng jiù shuō: \"Oh, a movie! Which one? Was it good? \"", "vi": "Nhưng bạn mình lập tức nói: “Oh, a movie! Which one? Was it good?”"}, {"t": 236, "zh": "他完全听懂了我的意思！他一点儿也不觉得我的语法很奇怪。", "py": "Tā wánquán tīng dǒng le wǒ de yìsi! Tā yìdiǎnér yě bù juéde wǒ de yǔfǎ hěn qíguài.", "vi": "Anh ấy hoàn toàn hiểu ý mình! Anh ấy chẳng thấy ngữ pháp của mình kỳ lạ chút nào."}, {"t": 242, "zh": "是的。他关心的是“你看了什么电影”，而不是“你的句子说得对不对”。", "py": "Shì de. Tā guānxīn de shì \"nǐ kàn le shénme diànyǐng\", ér búshì \"nǐ de jùzi shuōdéduì bú duì\".", "vi": "Đúng vậy. Anh ấy quan tâm là “bạn xem phim gì”, chứ không phải “câu của bạn nói có đúng không”."}, {"t": 249, "zh": "从那以后，我就开始变得勇敢了。", "py": "Cóng nà yǐhòu, wǒ jiù kāishǐ biàn de yǒnggǎn le.", "vi": "Từ đó trở đi, mình bắt đầu trở nên dũng cảm hơn."}, {"t": 252, "zh": "我说错了，就错了。重要的是，我说了！我表达了我的意思。", "py": "Wǒ shuō cuò le, jiù cuò le. Zhòngyào de shì, wǒ shuō le! Wǒ biǎodá le wǒ de yìsi.", "vi": "Mình nói sai thì cứ sai. Quan trọng là mình đã nói! Mình đã diễn đạt được ý của mình."}, {"t": 259, "zh": "所以，正在听我们播客的朋友们，我想告诉你们，请不要害怕。说错了，真的没关系。", "py": "Suǒyǐ, zhèngzài tīng wǒmen bōkè de péngyou men, wǒ xiǎng gàosù nǐmen, qǐng búyào hàipà. Shuō cuò le, zhēnde méi guānxì.", "vi": "Vì vậy, các bạn đang nghe podcast của chúng mình, mình muốn nói với các bạn: xin đừng sợ. Nói sai thật sự không sao."}, {"t": 267, "zh": "你的中国朋友，你的中文老师，他们一定能明白你的。", "py": "Nǐ de zhōngguó péngyou, nǐ de zhōngwén lǎoshī, tāmen yídìng néng míngbai nǐ de.", "vi": "Bạn người Trung Quốc, thầy cô dạy tiếng Trung của bạn, chắc chắn họ sẽ hiểu bạn."}, {"t": 273, "zh": "对。勇敢地张开你的嘴，这是学习说中文的第一步，也是最重要的一步。", "py": "Duì. Yǒnggǎn de zhāngkāi nǐ de zuǐ, zhè shì xuéxí shuō zhōngwén de dìyībù, yě shì zuì zhòngyào de yíbù.", "vi": "Đúng. Hãy dũng cảm mở miệng ra, đó là bước đầu tiên và cũng là bước quan trọng nhất để học nói tiếng Trung."}, {"t": 281, "zh": "王雨，除了“害怕”以外，我觉得还有第二个很重要的原因。", "py": "Wáng yǔ, chúle \"hàipà\" yǐwài, wǒ juéde háiyǒu dìèrgè hěn zhòngyào de yuányīn.", "vi": "Vương Vũ, ngoài “sợ” ra, mình thấy còn một lý do thứ hai rất quan trọng.", "sec": "Lý do thứ hai: chỉ “nạp vào”, không “xuất ra”"}, {"t": 288, "zh": "是什么？", "py": "Shì shénme?", "vi": "Là gì vậy?"}, {"t": 289, "zh": "就是很多朋友只“输入”，不“输出”。", "py": "Jiùshì hěnduō péngyou zhǐ \"shūrù\", bù \"shūchū\".", "vi": "Đó là nhiều bạn chỉ “nạp vào” mà không “xuất ra”."}, {"t": 294, "zh": "输入？输出？这是什么意思？有点像电脑的词。", "py": "Shūrù? Shūchū? Zhè shì shénme yìsi? Yǒudiǎn xiàng diànnǎo de cí.", "vi": "Nạp vào? Xuất ra? Nghĩa là gì vậy? Nghe hơi giống từ của máy tính."}, {"t": 300, "zh": "哈哈，我来解释一下。很简单。", "py": "Hāhā, wǒ lái jiěshì yí xià. Hěn jiǎndān.", "vi": "Ha ha, để mình giải thích. Rất đơn giản."}, {"t": 303, "zh": "“输入”就是你学习的过程。", "py": "\"shūrù\" jiùshì nǐ xuéxí de guòchéng.", "vi": "“Nạp vào” là quá trình bạn học."}, {"t": 306, "zh": "比如，你看书，你认汉字，你听我们的播客。", "py": "Bǐrú, nǐ kàn shū, nǐ rèn hànzì, nǐ tīng wǒmen de bōkè.", "vi": "Ví dụ bạn đọc sách, nhận mặt chữ Hán, nghe podcast của chúng mình."}, {"t": 312, "zh": "这些知识都进入了你的大脑里。这就是“输入”。", "py": "Zhèxiē zhīshí dōu jìnrù le nǐ de dànǎo lǐ. Zhè jiùshì \"shūrù\".", "vi": "Những kiến thức đó đều đi vào não của bạn. Đó chính là “nạp vào”."}, {"t": 318, "zh": "哦，我明白了。那我每天都在“输入”。", "py": "Ò, wǒ míngbai le. Nà wǒ měitiān dōu zài \"shūrù\".", "vi": "Ồ, mình hiểu rồi. Vậy mỗi ngày mình đều đang “nạp vào”."}, {"t": 322, "zh": "是的。但是，语言学习不光要有“输入”，还必须要有“输出”。", "py": "Shì de. Dànshì, yǔyán xuéxí bùguāng yào yǒu \"shūrù\", hái bìxū yào yǒu \"shūchū\".", "vi": "Đúng. Nhưng học ngôn ngữ không chỉ cần “nạp vào”, mà còn bắt buộc phải có “xuất ra”."}, {"t": 329, "zh": "“输出”就是你使用语言的过程。", "py": "\"shūchū\" jiùshì nǐ shǐyòng yǔyán de guòchéng.", "vi": "“Xuất ra” là quá trình bạn sử dụng ngôn ngữ."}, {"t": 332, "zh": "比如，你写汉字，或者，更重要的，你“说”中文。", "py": "Bǐrú, nǐ xiě hànzì, huòzhě, gèng zhòngyào de, nǐ \"shuō\" zhōngwén.", "vi": "Ví dụ bạn viết chữ Hán, hoặc quan trọng hơn là bạn “nói” tiếng Trung."}, {"t": 338, "zh": "我懂了！很多朋友每天花很多时间看书、听课，这是“输入”。", "py": "Wǒ dǒng le! Hěnduō péngyou měitiānhuā hěnduō shíjiān kàn shū, tīngkè, zhè shì \"shūrù\".", "vi": "Mình hiểu rồi! Nhiều bạn mỗi ngày dành rất nhiều thời gian đọc sách, nghe giảng, đó là “nạp vào”."}, {"t": 345, "zh": "但是他们从来不说中文，所以他们没有“输出”。", "py": "Dànshì tāmen cóngláibù shuō zhōngwén, suǒyǐ tāmen méiyǒu \"shūchū\".", "vi": "Nhưng họ chưa bao giờ nói tiếng Trung, nên họ không có “xuất ra”."}, {"t": 350, "zh": "完全正确。", "py": "Wánquánzhèngquè.", "vi": "Hoàn toàn đúng."}, {"t": 351, "zh": "王雨，我给你打一个比方。你觉得，学说中文像学什么？", "py": "Wáng yǔ, wǒ gěi nǐ dǎ yí ge bǐfāng. Nǐ juéde, xué shuō zhōngwén xiàng xué shénme?", "vi": "Vương Vũ, mình đưa ra một ví dụ so sánh nhé. Cậu thấy học nói tiếng Trung giống học cái gì?"}, {"t": 358, "zh": "嗯……像学唱歌？", "py": "ń xiàng xué chànggē?", "vi": "Ừm… giống học hát?"}, {"t": 360, "zh": "有点像。我有一个更好的比方。我觉得，学说中文，就像学游泳一样。", "py": "Yǒudiǎn xiàng. Wǒ yǒu yí ge gènghǎo de bǐfāng. Wǒ juéde, xué shuō zhōngwén, jiù xiàng xué yóuyǒng yíyàng.", "vi": "Hơi giống. Mình có một ví dụ hay hơn. Mình thấy học nói tiếng Trung giống như học bơi vậy."}, {"t": 369, "zh": "学游泳？有意思。你说说看。", "py": "Xué yóuyǒng? Yǒuyìsi. Nǐ shuō shuō kàn.", "vi": "Học bơi? Thú vị đấy. Cậu nói thử xem."}, {"t": 373, "zh": "你想，如果一个人想学游泳。他买了很多关于游泳的书，每天在家里看。", "py": "Nǐ xiǎng, rúguǒ yí ge rén xiǎng xué yóuyǒng. Tā mǎi le hěnduō guānyú yóuyǒng de shū, měitiān zài jiālǐ kàn.", "vi": "Cậu thử nghĩ, nếu có một người muốn học bơi. Anh ta mua rất nhiều sách về bơi lội, mỗi ngày ở nhà đọc."}, {"t": 382, "zh": "书上告诉他，手应该怎么动，脚应该怎么动。", "py": "Shū shàng gàosù tā, shǒu yīnggāi zěnme dòng, jiǎo yīnggāi zěnme dòng.", "vi": "Sách chỉ cho anh ta tay phải cử động thế nào, chân phải cử động thế nào."}, {"t": 386, "zh": "他还在网上看很多视频，看世界冠军是怎么游泳的。", "py": "Tā hái zài wǎngshàng kàn hěnduō shìpín, kàn shìjiè guànjūn shì zěnme yóuyǒng de.", "vi": "Anh ta còn xem rất nhiều video trên mạng, xem các nhà vô địch thế giới bơi như thế nào."}, {"t": 392, "zh": "他把所有的理论都学会了。", "py": "Tā bǎ suǒyǒu de lǐlùn dōu xuéhuì le.", "vi": "Anh ta học thuộc hết mọi lý thuyết."}, {"t": 395, "zh": "嗯，他学习很认真。", "py": "ń, tā xuéxí hěn rènzhēn.", "vi": "Ừm, anh ta học rất nghiêm túc."}, {"t": 397, "zh": "然后，我把他带到一个游泳池边，我说：“好，你现在可以下水游泳了。”", "py": "Ránhòu, wǒ bǎ tā dàidào yí ge yóuyǒngchí biān, wǒ shuō: \"hǎo, nǐ xiànzài kěyǐ xià shuǐ yóuyǒng le.\"", "vi": "Rồi mình đưa anh ta đến bên một bể bơi và nói: “Được rồi, bây giờ anh có thể xuống nước bơi được rồi.”"}, {"t": 405, "zh": "你觉得，他会游泳吗？", "py": "Nǐ juéde, tā huì yóuyǒng ma?", "vi": "Cậu nghĩ anh ta có biết bơi không?"}, {"t": 407, "zh": "他肯定不会！他会沉下去的！", "py": "Tā kěndìng bú huì! Tā huì chén xiàqu de!", "vi": "Chắc chắn là không! Anh ta sẽ chìm xuống mất!"}, {"t": 410, "zh": "为什么呢？他已经学习了那么多知识。", "py": "Wèishénme ne? Tā yǐjing xuéxí le nàme duō zhīshí.", "vi": "Vì sao chứ? Anh ta đã học nhiều kiến thức như vậy rồi mà."}, {"t": 414, "zh": "因为他从来没有下过水啊！他的身体不知道在水里是什么感觉。", "py": "Yīnwèi tā cónglái méiyǒu xiàguò shuǐ a! Tā de shēntǐ bù zhīdao zài shuǐ lǐ shì shénme gǎnjué.", "vi": "Vì anh ta chưa bao giờ xuống nước mà! Cơ thể anh ta không biết ở dưới nước là cảm giác thế nào."}, {"t": 420, "zh": "看书和自己真的去做，是两回事。", "py": "Kàn shū hé zìjǐ zhēnde qù zuò, shì liǎng huíshì.", "vi": "Đọc sách và tự mình làm thật là hai chuyện khác nhau."}, {"t": 424, "zh": "完全正确！学说中文也是一模一样的。", "py": "Wánquánzhèngquè! Xué shuō zhōngwén yě shì yìmúyíyàng de.", "vi": "Hoàn toàn đúng! Học nói tiếng Trung cũng y hệt như vậy."}, {"t": 429, "zh": "你看懂了所有的汉字，听懂了我们所有的播客，这就像那个看完了所有游泳书的人。你的大脑里有了很多知识。", "py": "Nǐ kàn dǒng le suǒyǒu de hànzì, tīng dǒng le wǒmen suǒyǒu de bōkè, zhè jiù xiàng nàge kàn wán le suǒyǒu yóuyǒng shū de rén. Nǐ de dànǎo lǐ yǒu le hěnduō zhīshí.", "vi": "Bạn đọc hiểu hết mọi chữ Hán, nghe hiểu hết mọi tập podcast của chúng mình, giống như người đã đọc hết sách bơi kia. Trong đầu bạn có rất nhiều kiến thức."}, {"t": 441, "zh": "但是，如果你从来不张开嘴巴去“说”，你的嘴巴、你的舌头，就学不会怎么发出中文的声音。", "py": "Dànshì, rúguǒ nǐ cóngláibù zhāngkāizuǐbā qù \"shuō\", nǐ de zuǐbā, nǐ de shétou, jiùxué bú huì zěnme fāchū zhōngwén de shēngyīn.", "vi": "Nhưng nếu bạn chưa bao giờ mở miệng ra để “nói”, thì miệng và lưỡi của bạn sẽ không học được cách phát ra âm thanh tiếng Trung."}, {"t": 449, "zh": "你的身体，就没有“说中文”这个习惯。", "py": "Nǐ de shēntǐ, jiù méiyǒu \"shuō zhōngwén\" zhège xíguàn.", "vi": "Cơ thể bạn sẽ không có thói quen “nói tiếng Trung”."}, {"t": 456, "zh": "你说得太好了！“说中文”是一个身体习惯！就像游泳一样，需要身体去练习。", "py": "Nǐ shuō de tài hǎo le! \"shuō zhōngwén\" shì yí ge shēntǐ xíguàn! Jiù xiàng yóuyǒng yíyàng, xūyào shēntǐ qù liànxí.", "vi": "Cậu nói hay quá! “Nói tiếng Trung” là một thói quen của cơ thể! Giống như bơi lội, cần để cơ thể luyện tập."}, {"t": 462, "zh": "只用眼睛看，只用耳朵听，是不够的。嘴巴也需要练习！", "py": "Zhǐ yòng yǎnjīng kàn, zhǐ yòng ěrduǒ tīng, shì bú gòu de. Zuǐbā yě xūyào liànxí!", "vi": "Chỉ dùng mắt nhìn, chỉ dùng tai nghe thì không đủ. Miệng cũng cần luyện tập!"}, {"t": 469, "zh": "是的。所以，朋友们，请检查一下你的学习方法。", "py": "Shì de. Suǒyǐ, péngyou men, qǐng jiǎncháyíxià nǐ de xuéxí fāngfǎ.", "vi": "Đúng vậy. Vì thế các bạn ơi, hãy kiểm tra lại phương pháp học của mình."}, {"t": 475, "zh": "你是不是每天只看不说，只听不说？如果是这样，那你可能找到了你为什么不会说中文的原因了。", "py": "Nǐ shìbúshì měitiān zhǐ kàn bù shuō, zhǐ tīng bù shuō? Rúguǒ shì zhèyàng, nà nǐ kěnéng zhǎodào le nǐ wèishénme bú huì shuō zhōngwén de yuányīn le.", "vi": "Có phải mỗi ngày bạn chỉ xem mà không nói, chỉ nghe mà không nói? Nếu vậy, có lẽ bạn đã tìm ra lý do vì sao mình không biết nói tiếng Trung rồi."}, {"t": 486, "zh": "你需要的，是马上下水，马上开始练习“说”。", "py": "Nǐ xūyào de, shì mǎ shàngxiàshuǐ, mǎshàng kāishǐ liànxí \"shuō\".", "vi": "Điều bạn cần là xuống nước ngay, bắt đầu luyện “nói” ngay."}, {"t": 493, "zh": "李明，刚才我们说了“害怕说错”和“只输入不输出”。", "py": "Lǐ míng, gāngcái wǒmen shuō le \"hàipà shuō cuò\" hé \"zhǐ shūrù bù shūchū\".", "vi": "Lý Minh, vừa rồi chúng ta đã nói về “sợ nói sai” và “chỉ nạp vào không xuất ra”.", "sec": "Lý do thứ ba: quá cầu toàn, câu chuyện của Mary"}, {"t": 500, "zh": "我想起我的一个学生，她叫玛丽。她就有一个特别典型的问题。", "py": "Wǒ xiǎngqǐ wǒ de yí ge xuéshēng, tā jiào mǎlì. Tā jiù yǒu yí ge tèbié diǎnxíng de wèntí.", "vi": "Mình nhớ đến một học trò của mình tên là Mary. Cô ấy có một vấn đề rất điển hình."}, {"t": 506, "zh": "哦？说来听听。", "py": "Ò? Shuōláitīngtīng.", "vi": "Ồ? Kể nghe thử xem."}, {"t": 508, "zh": "玛丽她是一个非常努力的学生。她学中文两年了，认识的汉字可能比我还多。", "py": "Mǎlì tā shì yí ge fēicháng nǔlì de xuéshēng. Tā xué zhōngwén liǎngnián le, rènshi de hànzì kěnéng bǐ wǒ hái duō.", "vi": "Mary là một học trò rất chăm chỉ. Cô ấy học tiếng Trung hai năm rồi, biết có khi còn nhiều chữ Hán hơn cả mình."}, {"t": 516, "zh": "她看中文新闻，都能看懂大概的意思。", "py": "Tā kàn zhòngwén xīnwén, dōu néng kàn dǒng dàgài de yìsi.", "vi": "Cô ấy đọc tin tức tiếng Trung, đều hiểu được đại ý."}, {"t": 519, "zh": "那她很厉害啊！中文水平应该很高。", "py": "Nà tā hěn lìhài a! Zhōngwén shuǐpíng yīnggāi hěn gāo.", "vi": "Vậy cô ấy giỏi quá! Trình độ tiếng Trung chắc là cao lắm."}, {"t": 523, "zh": "是的，理论上是这样。但是，她几乎不说话。", "py": "Shì de, lǐlùn shàng shì zhèyàng. Dànshì, tā jīhū bù shuōhuà.", "vi": "Đúng, về lý thuyết là vậy. Nhưng cô ấy gần như không nói gì."}, {"t": 530, "zh": "我们上课的时候，我问她问题，她总是要想很久很久。", "py": "Wǒmen shàngkè de shíhou, wǒ wèn tā wèntí, tā zǒngshì yào xiǎng hěn jiǔ hěn jiǔ.", "vi": "Lúc lên lớp, mình hỏi cô ấy, cô ấy lúc nào cũng phải nghĩ rất lâu rất lâu."}, {"t": 536, "zh": "有时候，她就不回答了，只是对我笑一笑。", "py": "Yǒushíhòu, tā jiù bù huídá le, zhǐshì duì wǒ xiàoyíxiào.", "vi": "Có khi cô ấy không trả lời luôn, chỉ mỉm cười với mình."}, {"t": 540, "zh": "她是不是也害怕说错？", "py": "Tā shìbúshì yě hàipà shuō cuò?", "vi": "Có phải cô ấy cũng sợ nói sai không?"}, {"t": 543, "zh": "有点儿。但更重要的是，她想说得太“完美”。", "py": "Yǒu diǎnér. Dàn gèng zhòngyào de shì, tā xiǎng shuō de tài \"wánměi\".", "vi": "Có một chút. Nhưng quan trọng hơn là cô ấy muốn nói quá “hoàn hảo”."}, {"t": 549, "zh": "有一次下课，我问她：“玛丽，你为什么上课不说话呢？你的中文很好啊。”", "py": "Yǒu yícì xiàkè, wǒ wèn tā: \"mǎlì, nǐ wèishénme shàngkè bù shuōhuà ne? Nǐ de zhōngwén hěn hǎo a.\"", "vi": "Có lần tan học, mình hỏi cô ấy: “Mary, sao em lên lớp không nói gì vậy? Tiếng Trung của em rất tốt mà.”"}, {"t": 557, "zh": "她怎么说？", "py": "Tā zěnme shuō?", "vi": "Cô ấy nói sao?"}, {"t": 558, "zh": "她跟我说：“王老师，我想说。但是，当我想说一句话的时候，我的脑子里会想很多问题。”", "py": "Tā gēn wǒ shuō: \"wánglǎoshī, wǒ xiǎng shuō. Dànshì, dāng wǒ xiǎng shuō yí jù huà de shíhou, wǒ de nǎozi lǐ huì xiǎng hěnduō wèntí.\"", "vi": "Cô ấy bảo mình: “Thầy Vương, em muốn nói. Nhưng khi em định nói một câu, trong đầu em lại nghĩ ra rất nhiều câu hỏi.”"}, {"t": 569, "zh": "这个词用得对不对？这个句子，中国人会这么说吗？我的四个声调都对吗？", "py": "Zhège cí yòng de duì bú duì? Zhège jùzi, zhōngguó rén huì zhème shuō ma? Wǒ de sìgè shēngdiào dōu duì ma?", "vi": "Từ này dùng có đúng không? Câu này người Trung Quốc có nói như vậy không? Bốn thanh điệu của em có đúng hết không?"}, {"t": 577, "zh": "我想来想去，然后就不知道怎么说了。”", "py": "Wǒ xiǎnglái xiǎng qù, ránhòu jiù bù zhīdao zěnme shuō le.\"", "vi": "Em nghĩ đi nghĩ lại, rồi cuối cùng không biết nói thế nào nữa.”"}, {"t": 582, "zh": "啊，这就是我刚才说的，我以前的问题。追求完美。", "py": "A, zhè jiùshì wǒ gāngcái shuō de, wǒ yǐqián de wèntí. Zhuīqiú wánměi.", "vi": "À, đây chính là vấn đề trước đây của mình mà mình vừa nói. Theo đuổi sự hoàn hảo."}, {"t": 587, "zh": "对！她想把一句话说得像一个真正的中国人一样，一点儿错都没有。", "py": "Duì! Tā xiǎng bǎ yí jù huà shuō de xiàng yí ge zhēnzhèng de zhōngguó rén yíyàng, yìdiǎnér cuò dōu méiyǒu.", "vi": "Đúng! Cô ấy muốn nói một câu giống hệt người Trung Quốc thật, không sai một chút nào."}, {"t": 594, "zh": "但是，她越是这样想，就越说不出来。", "py": "Dànshì, tā yuèshì zhèyàng xiǎng, jiù yuè shuō bù chūlái.", "vi": "Nhưng càng nghĩ như vậy, cô ấy càng nói không ra."}, {"t": 598, "zh": "我太懂这种感觉了。这就像你想走路，但是你每走一步，都要思考：", "py": "Wǒ tài dǒng zhèzhǒng gǎnjué le. Zhè jiù xiàng nǐ xiǎng zǒulù, dànshì nǐ měi zǒu yíbù, dōu yào sīkǎo:", "vi": "Mình hiểu cảm giác này quá. Giống như bạn muốn đi bộ, nhưng mỗi bước đều phải suy nghĩ:"}, {"t": 605, "zh": "我的左脚应该放在哪里？我的右脚呢？我的身体要不要往前？", "py": "Wǒ de zuǒjiǎo yīnggāi fàngzài nǎlǐ? Wǒ de yòujiǎo ne? Wǒ de shēntǐ yàobúyào wǎngqián?", "vi": "Chân trái của mình nên đặt ở đâu? Chân phải thì sao? Người mình có cần nghiêng về phía trước không?"}, {"t": 611, "zh": "想得太多，反而不会走路了。", "py": "Xiǎng de tài duō, fǎnér bú huì zǒulù le.", "vi": "Nghĩ quá nhiều thì ngược lại không biết đi nữa."}, {"t": 614, "zh": "就是这个感觉！", "py": "Jiùshì zhège gǎnjué!", "vi": "Đúng là cảm giác này!"}, {"t": 616, "zh": "所以，我告诉玛丽：“不要想那么多。语言不是数学，没有那么多‘完全正确’或者‘完全错误’。", "py": "Suǒyǐ, wǒ gàosù mǎlì: \"búyào xiǎng nàme duō. Yǔyán búshì shùxué, méiyǒu nàme duō \"wánquánzhèngquè\" huòzhě \"wánquán cuòwù\".", "vi": "Vì thế mình nói với Mary: “Đừng nghĩ nhiều như vậy. Ngôn ngữ không phải toán học, không có nhiều chuyện ‘hoàn toàn đúng’ hay ‘hoàn toàn sai’ đến thế."}, {"t": 627, "zh": "你现在是学习者，犯错是正常的，也是应该的。”", "py": "Nǐ xiànzài shì xuéxízhě, fàncuò shì zhèngcháng de, yě shì yīnggāi de.\"", "vi": "Bây giờ em là người đang học, mắc lỗi là bình thường, cũng là điều nên có.”"}, {"t": 632, "zh": "对。犯错，是学习的一部分。", "py": "Duì. Fàncuò, shì xuéxí de yíbùfèn.", "vi": "Đúng. Mắc lỗi là một phần của việc học."}, {"t": 636, "zh": "没有一个婴儿，刚开始学走路的时候，是不摔跤的。", "py": "Méiyǒu yí ge yīngér, gāng kāishǐ xué zǒulù de shíhou, shì bù shuāijiāo de.", "vi": "Không có em bé nào lúc mới tập đi mà không bị ngã."}, {"t": 641, "zh": "也没有一个人，刚开始学说话的时候，是不犯错的。", "py": "Yě méiyǒu yí ge rén, gāng kāishǐ xuéshuōhuà de shíhou, shì bú fàncuò de.", "vi": "Cũng không có ai lúc mới tập nói mà không mắc lỗi."}, {"t": 645, "zh": "是的。所以我对玛丽的建议是：忘掉“完美”。先追求“完成”。", "py": "Shì de. Suǒyǐ wǒ duì mǎlì de jiànyì shì: wàngdiào \"wánměi\". Xiān zhuīqiú \"wánchéng\".", "vi": "Đúng. Vì vậy lời khuyên của mình cho Mary là: quên “hoàn hảo” đi. Hãy theo đuổi “hoàn thành” trước."}, {"t": 654, "zh": "这个说法很好。“先完成，再完美”。什么意思呢？", "py": "Zhège shuōfǎ hěn hǎo. \"xiān wánchéng, zài wánměi\". Shénme yìsi ne?", "vi": "Cách nói này hay đấy. “Hoàn thành trước, hoàn hảo sau”. Nghĩa là gì vậy?"}, {"t": 659, "zh": "意思就是，你不要总想着说一个一百分的句子。你说一个六十分的句子，就可以了！", "py": "Yìsi jiùshì, nǐ búyào zǒng xiǎngzhe shuō yí ge yìbǎifēn de jùzi. Nǐ shuō yí ge liù shífēn de jùzi, jiù kěyǐ le!", "vi": "Nghĩa là bạn đừng lúc nào cũng nghĩ đến việc nói một câu được một trăm điểm. Nói một câu sáu mươi điểm là được rồi!"}, {"t": 669, "zh": "能让对方听懂，你就成功了。", "py": "Néng ràng duìfāng tīng dǒng, nǐ jiù chénggōng le.", "vi": "Làm cho đối phương hiểu được là bạn đã thành công."}, {"t": 672, "zh": "比如，你想告诉别人“我今天下午和朋友去咖啡馆喝了一杯拿铁”。", "py": "Bǐrú, nǐ xiǎng gàosù biérén \"wǒ jīntiānxiàwǔ hé péngyou qù kāfēiguǎn hē le yìbēi nátiě\".", "vi": "Ví dụ bạn muốn nói với người khác “chiều nay mình cùng bạn đi quán cà phê uống một ly latte”."}, {"t": 682, "zh": "这个句子有点长，有点难。", "py": "Zhège jùzi yǒudiǎn cháng, yǒudiǎn nán.", "vi": "Câu này hơi dài, hơi khó."}, {"t": 685, "zh": "嗯，对于初学者来说，是的。", "py": "ń, duìyú chūxuézhě láishuō, shì de.", "vi": "Ừm, với người mới học thì đúng là vậy."}, {"t": 688, "zh": "你可能会想，“下午”这个词声调对不对？“咖啡馆”怎么说？“拿铁”又怎么说？", "py": "Nǐ kěnéng huì xiǎng, \"xiàwǔ\" zhège cí shēngdiào duì bú duì? \"kāfēiguǎn\" zěnme shuō? \"nátiě\" yòu zěnme shuō?", "vi": "Bạn có thể sẽ nghĩ: từ “buổi chiều” thanh điệu có đúng không? “Quán cà phê” nói thế nào? “Latte” lại nói thế nào?"}, {"t": 697, "zh": "想来想去，最后放弃了，不说了。", "py": "Xiǎnglái xiǎng qù, zuìhòu fàngqì le, bù shuō le.", "vi": "Nghĩ đi nghĩ lại, cuối cùng bỏ cuộc, không nói nữa."}, {"t": 701, "zh": "很有可能。", "py": "Hěn yǒu kěnéng.", "vi": "Rất có thể."}, {"t": 702, "zh": "但如果你追求“完成”，你可以说得简单一点。你可以说：“今天。我。朋友。喝咖啡。”", "py": "Dàn rúguǒ nǐ zhuīqiú \"wánchéng\", nǐ kěyǐ shuō de jiǎndān yìdiǎn. Nǐ kěyǐ shuō: \"jīntiān. Wǒ. Péngyou. Hēkāfēi.\"", "vi": "Nhưng nếu bạn theo đuổi “hoàn thành”, bạn có thể nói đơn giản hơn. Bạn có thể nói: “Hôm nay. Tôi. Bạn. Uống cà phê.”"}, {"t": 713, "zh": "这个句子语法不对，很简单。", "py": "Zhège jùzi yǔfǎ bú duì, hěn jiǎndān.", "vi": "Câu này ngữ pháp không đúng, rất đơn giản."}, {"t": 717, "zh": "但是，你的朋友能听懂吗？", "py": "Dànshì, nǐ de péngyou néng tīng dǒng ma?", "vi": "Nhưng bạn của bạn có hiểu được không?"}, {"t": 720, "zh": "当然能！肯定能听懂。", "py": "Dāngrán néng! Kěndìng néng tīng dǒng.", "vi": "Dĩ nhiên là được! Chắc chắn hiểu được."}, {"t": 723, "zh": "这就够了！你“完成”了交流。", "py": "Zhè jiù gòu le! Nǐ \"wánchéng\" le jiāoliú.", "vi": "Thế là đủ rồi! Bạn đã “hoàn thành” việc giao tiếp."}, {"t": 726, "zh": "等你以后说得越来越好，你自然就可以说出那个完美的、一百分的句子了。", "py": "Děng nǐ yǐhòu shuō de yuèláiyuè hǎo, nǐ zìrán jiù kěyǐ shuōchū nàge wánměi de, yìbǎifēn de jùzi le.", "vi": "Đợi sau này bạn nói ngày càng giỏi, tự nhiên sẽ nói ra được câu hoàn hảo, một trăm điểm đó."}, {"t": 733, "zh": "但是现在，请从说出那个六十分的句子开始。", "py": "Dànshì xiànzài, qǐng cóng shuōchū nàge liù shífēn de jùzi kāishǐ.", "vi": "Nhưng bây giờ, hãy bắt đầu từ việc nói ra câu sáu mươi điểm đó."}, {"t": 739, "zh": "说得很好。所以，朋友们，不要让“完美”成为你的敌人。先说出来，最重要。", "py": "Shuō de hěn hǎo. Suǒyǐ, péngyou men, búyào ràng \"wánměi\" chéngwéi nǐ de dírén. Xiān shuō chūlái, zuì zhòngyào.", "vi": "Nói hay lắm. Vì thế các bạn ơi, đừng để “hoàn hảo” trở thành kẻ thù của mình. Nói ra trước mới là quan trọng nhất."}, {"t": 748, "zh": "好了，王雨。我们分析了三个主要的原因：第一，害怕说错。第二，只输入不输出。第三，太追求完美。", "py": "Hǎo le, wáng yǔ. Wǒmen fēnxī le sāngè zhǔyào de yuányīn: dìyī, hàipà shuō cuò. Dìèr, zhǐ shūrù bù shūchū. Dìsān, tài zhuīqiú wánměi.", "vi": "Được rồi, Vương Vũ. Chúng ta đã phân tích ba lý do chính: một là sợ nói sai, hai là chỉ nạp vào không xuất ra, ba là quá cầu toàn.", "sec": "Làm thế nào? Tự nói chuyện một mình"}, {"t": 758, "zh": "我们说了这么多“为什么”，现在，我们应该给朋友们一些实际的、简单的办法。告诉他们“怎么办”。", "py": "Wǒmen shuō le zhème duō \"wèishénme\", xiànzài, wǒmen yīnggāi gěi péngyou men yìxiē shíjì de, jiǎndān de bànfǎ. Gàosù tāmen \"zěnmebàn\".", "vi": "Chúng ta đã nói nhiều “vì sao” như vậy, bây giờ nên đưa cho các bạn vài cách thực tế và đơn giản. Cho họ biết “phải làm sao”."}, {"t": 767, "zh": "好啊！这是最重要的部分。你先说，你有什么好办法？", "py": "Hǎo a! Zhè shì zuì zhòngyào de bùfèn. Nǐ xiān shuō, nǐ yǒu shénme hǎo bànfǎ?", "vi": "Hay đấy! Đây là phần quan trọng nhất. Cậu nói trước đi, cậu có cách nào hay?"}, {"t": 771, "zh": "我有一个非常简单，而且每个人都可以做到的办法。就是：自言自语。", "py": "Wǒ yǒu yí ge fēichángjiǎndān, érqiě měigè rén dōu kěyǐ zuòdào de bànfǎ. Jiùshì: zìyánzìyǔ.", "vi": "Mình có một cách rất đơn giản mà ai cũng làm được. Đó là: tự nói chuyện một mình."}, {"t": 778, "zh": "自言自语？自己跟自己说话吗？", "py": "Zìyánzìyǔ? Zìjǐ gēn zìjǐ shuōhuà ma?", "vi": "Tự nói chuyện một mình? Là tự nói chuyện với chính mình sao?"}, {"t": 782, "zh": "对。很多人说：“我没有中国朋友，我不住在中国，我没有环境练习中文。”", "py": "Duì. Hěnduō rén shuō: \"wǒ méiyǒu zhōngguó péngyou, wǒ búzhù zài zhōngguó, wǒ méiyǒu huánjìng liànxí zhōngwén.\"", "vi": "Đúng. Nhiều người nói: “Mình không có bạn Trung Quốc, không sống ở Trung Quốc, không có môi trường để luyện tiếng Trung.”"}, {"t": 790, "zh": "这都不是问题。你可以创造你自己的中文环境。", "py": "Zhè dōu búshì wèntí. Nǐ kěyǐ chuàngzào nǐ zìjǐ de zhōngwén huánjìng.", "vi": "Những điều đó đều không phải vấn đề. Bạn có thể tự tạo ra môi trường tiếng Trung cho riêng mình."}, {"t": 794, "zh": "怎么创造？", "py": "Zěnme chuàngzào?", "vi": "Tạo bằng cách nào?"}, {"t": 796, "zh": "用“自言自语”的方法。比如，你早上起床的时候，你可以看着窗外，用中文说：“早上好。今天天气很好。”", "py": "Yòng \"zìyánzìyǔ\" de fāngfǎ. Bǐrú, nǐ zǎoshàng qǐchuáng de shíhou, nǐ kěyǐ kànzhe chuāngwài, yòng zhōngwén shuō: \"zǎoshànghǎo. Jīntiāntiānqì hěn hǎo.\"", "vi": "Dùng cách “tự nói chuyện một mình”. Ví dụ sáng thức dậy, bạn có thể nhìn ra ngoài cửa sổ và nói bằng tiếng Trung: “Chào buổi sáng. Hôm nay thời tiết rất đẹp.”"}, {"t": 807, "zh": "你在吃早饭的时候，可以看着你的面包，说：“这是一个面包。我喜欢吃面包。”", "py": "Nǐ zài chī zǎofàn de shíhou, kěyǐ kànzhe nǐ de miànbāo, shuō: \"zhè shì yí ge miànbāo. Wǒ xǐhuan chī miànbāo.\"", "vi": "Lúc ăn sáng, bạn có thể nhìn cái bánh mì và nói: “Đây là một cái bánh mì. Tôi thích ăn bánh mì.”"}, {"t": 814, "zh": "哈哈，这个办法太有意思了。", "py": "Hāhā, zhège bànfǎ tài yǒuyìsi le.", "vi": "Ha ha, cách này thú vị quá."}, {"t": 817, "zh": "你看到什么，就说什么。用你已经学会的、最简单的中文单词和句子去描述你周围的世界。", "py": "Nǐ kàndào shénme, jiù shuō shénme. Yòng nǐ yǐjing xuéhuì de, zuì jiǎndān de zhōngwén dāncí hé jùzi qù miáoshù nǐ zhōuwéi de shìjiè.", "vi": "Thấy gì thì nói nấy. Dùng những từ và câu tiếng Trung đơn giản nhất mà bạn đã học để miêu tả thế giới xung quanh."}, {"t": 826, "zh": "比如，你看到桌子上有一个红色的杯子，你就说：“这是一个杯子。它是红色的。我用杯子喝水。”", "py": "Bǐrú, nǐ kàndào zhuōzi shàng yǒu yí ge hóngsè de bēizi, nǐ jiù shuō: \"zhè shì yí ge bēizi. Tā shì hóngsè de. Wǒ yòng bēizi hēshuǐ.\"", "vi": "Ví dụ bạn thấy trên bàn có một cái cốc màu đỏ, bạn nói: “Đây là một cái cốc. Nó màu đỏ. Tôi dùng cốc để uống nước.”"}, {"t": 836, "zh": "我明白了！", "py": "Wǒ míngbai le!", "vi": "Mình hiểu rồi!"}, {"t": 837, "zh": "这样做有几个好处。第一，你不需要别人，一个人就可以练习。", "py": "Zhèyàng zuò yǒu jǐgè hǎochù. Dìyī, nǐ bù xūyào biérén, yí ge rén jiù kěyǐ liànxí.", "vi": "Làm vậy có mấy lợi ích. Thứ nhất, bạn không cần người khác, một mình cũng luyện được."}, {"t": 844, "zh": "第二，你不会害怕，因为没有别人听，说错了也没关系。", "py": "Dìèr, nǐ bú huì hàipà, yīnwèi méiyǒu biérén tīng, shuō cuò le yě méi guānxì.", "vi": "Thứ hai, bạn sẽ không sợ, vì không có ai nghe, nói sai cũng không sao."}, {"t": 849, "zh": "是的。而且，最重要的是，这个练习可以帮助你的大脑和嘴巴建立一个连接。", "py": "Shì de. Érqiě, zuì zhòngyào de shì, zhège liànxí kěyǐ bāngzhù nǐ de dànǎo hé zuǐbā jiànlì yí ge liánjiē.", "vi": "Đúng. Hơn nữa, quan trọng nhất là bài tập này giúp não và miệng của bạn tạo ra một sự kết nối."}, {"t": 857, "zh": "让你习惯用中文去思考，用中文去表达。", "py": "Ràng nǐ xíguàn yòng zhōngwén qù sīkǎo, yòng zhōngwén qù biǎodá.", "vi": "Giúp bạn quen với việc suy nghĩ bằng tiếng Trung và diễn đạt bằng tiếng Trung."}, {"t": 862, "zh": "这个练习很简单，但如果你每天坚持做十分钟，一个月以后，你一定会发现自己有很大的进步。", "py": "Zhège liànxí hěn jiǎndān, dàn rúguǒ nǐ měitiān jiānchí zuò shífēnzhōng, yígèyuè yǐhòu, nǐ yídìng huì fāxiànzìjǐ yǒu hěn dà de jìnbù.", "vi": "Bài tập này rất đơn giản, nhưng nếu mỗi ngày bạn kiên trì làm mười phút, sau một tháng bạn chắc chắn sẽ thấy mình tiến bộ rất nhiều."}, {"t": 871, "zh": "这个办法太好了，非常适合比较害羞的朋友。", "py": "Zhège bànfǎ tài hǎo le, fēicháng shìhé bǐjiào hàixiū de péngyou.", "vi": "Cách này hay quá, rất hợp với những bạn khá nhút nhát.", "sec": "Bạn học ngôn ngữ và nói chuyện với người thật"}, {"t": 875, "zh": "那我也有一个办法。我的办法是，去找一个“语言伙伴”。", "py": "Nà wǒ yě yǒu yí ge bànfǎ. Wǒ de bànfǎ shì, qù zhǎo yí ge \"yǔyánhuǒbàn\".", "vi": "Vậy mình cũng có một cách. Cách của mình là đi tìm một “bạn học ngôn ngữ”."}, {"t": 880, "zh": "Language partner。这个也很流行。", "py": "Language partner. Zhège yě hěn liúxíng.", "vi": "Language partner. Cái này cũng rất phổ biến."}, {"t": 883, "zh": "对。现在网络很方便，你可以在网上找到很多想学习你的母语的中国人。", "py": "Duì. Xiànzài wǎngluò hěn fāngbiàn, nǐ kěyǐ zài wǎngshàng zhǎodào hěnduō xiǎng xuéxí nǐ de mǔyǔ de zhōngguó rén.", "vi": "Đúng. Bây giờ mạng rất tiện, bạn có thể tìm thấy trên mạng nhiều người Trung Quốc muốn học tiếng mẹ đẻ của bạn."}, {"t": 890, "zh": "你们可以成为朋友，成为语言伙伴。", "py": "Nǐmen kěyǐ chéngwéi péngyou, chéngwéi yǔyánhuǒbàn.", "vi": "Hai bên có thể trở thành bạn bè, trở thành bạn học ngôn ngữ của nhau."}, {"t": 894, "zh": "然后呢？怎么练习？", "py": "Ránhòu ne? Zěnme liànxí?", "vi": "Rồi sao nữa? Luyện như thế nào?"}, {"t": 896, "zh": "你们可以约好，每周打一次电话，或者视频聊天。比如，聊三十分钟。", "py": "Nǐmen kěyǐ yuē hǎo, měizhōu dǎ yícì diànhuà, huòzhě shìpín liáotiān. Bǐrú, liáo sānshífēnzhōng.", "vi": "Hai người có thể hẹn nhau, mỗi tuần gọi điện một lần, hoặc nói chuyện video. Ví dụ nói chuyện ba mươi phút."}, {"t": 903, "zh": "前十五分钟，你们用中文说。后十五分钟，你们用你的母语说。", "py": "Qián shíwǔfēnzhōng, nǐmen yòng zhōngwén shuō. Hòu shíwǔfēnzhōng, nǐmen yòng nǐ de mǔyǔ shuō.", "vi": "Mười lăm phút đầu, hai người nói bằng tiếng Trung. Mười lăm phút sau, nói bằng tiếng mẹ đẻ của bạn."}, {"t": 908, "zh": "这样对两个人都有帮助。", "py": "Zhèyàng duì liǎnggè rén dōu yǒu bāngzhù.", "vi": "Như vậy có ích cho cả hai người."}, {"t": 911, "zh": "这个方法也很好。因为你有了一个真实的交流对象。", "py": "Zhège fāngfǎ yě hěn hǎo. Yīnwèi nǐ yǒu le yí ge zhēnshí de jiāoliú duìxiàng.", "vi": "Cách này cũng rất tốt. Vì bạn có một đối tượng giao tiếp thật."}, {"t": 916, "zh": "你可以练习听，也可以练习说。", "py": "Nǐ kěyǐ liànxí tīng, yě kěyǐ liànxí shuō.", "vi": "Bạn có thể luyện nghe, cũng có thể luyện nói."}, {"t": 918, "zh": "是的。而且，在和真人聊天的时候，你会学到很多书上没有的、非常地道的说法。", "py": "Shì de. Érqiě, zài hé zhēnrén liáotiān de shíhou, nǐ huì xuédào hěnduō shū shàng méiyǒu de, fēicháng dìdào de shuōfǎ.", "vi": "Đúng. Hơn nữa, khi trò chuyện với người thật, bạn sẽ học được nhiều cách nói rất bản xứ mà sách không có."}, {"t": 927, "zh": "如果你找不到语言伙伴，还有一个办法。", "py": "Rúguǒ nǐ zhǎo bú dào yǔyánhuǒbàn, háiyǒu yí ge bànfǎ.", "vi": "Nếu bạn không tìm được bạn học ngôn ngữ, còn một cách nữa."}, {"t": 930, "zh": "是什么？", "py": "Shì shénme?", "vi": "Là gì vậy?"}, {"t": 931, "zh": "去和真实世界的人说话。", "py": "Qù hé zhēnshíshìjiè de rén shuōhuà.", "vi": "Đi nói chuyện với những người ngoài đời thật."}, {"t": 934, "zh": "比如，如果你家楼下有卖水果的商店，你可以去和老板聊天。", "py": "Bǐrú, rúguǒ nǐjiā lóuxià yǒu mài shuǐguǒ de shāngdiàn, nǐ kěyǐ qù hé lǎobǎn liáotiān.", "vi": "Ví dụ nếu dưới nhà bạn có cửa hàng bán trái cây, bạn có thể đến trò chuyện với bà chủ."}, {"t": 939, "zh": "这个可能对初学者有点难。", "py": "Zhège kěnéng duì chūxuézhě yǒudiǎn nán.", "vi": "Cái này có lẽ hơi khó với người mới học."}, {"t": 942, "zh": "不难的。你可以从最简单的问题开始。", "py": "Bù nán de. Nǐ kěyǐ cóng zuì jiǎndān de wèntí kāishǐ.", "vi": "Không khó đâu. Bạn có thể bắt đầu từ những câu hỏi đơn giản nhất."}, {"t": 946, "zh": "在中国，我们常常叫那些年长的、友好的女性“阿姨”。", "py": "Zài zhōngguó, wǒmen chángcháng jiào nàxiē niánzhǎng de, yǒuhǎo de nǚxìng \"āyí\".", "vi": "Ở Trung Quốc, chúng mình thường gọi những người phụ nữ lớn tuổi và thân thiện là “a di” (dì)."}, {"t": 952, "zh": "你可以走到水果店，笑着对老板说：“阿姨，你好。”", "py": "Nǐ kěyǐ zǒu dào shuǐguǒdiàn, xiào zhe duì lǎobǎn shuō: \"āyí, nǐhǎo.\"", "vi": "Bạn có thể đi vào tiệm trái cây, mỉm cười nói với bà chủ: “Dì ơi, xin chào.”"}, {"t": 957, "zh": "嗯，这是一个很好的开始。", "py": "ń, zhè shì yí ge hěn hǎodekāishǐ.", "vi": "Ừm, đây là một khởi đầu rất tốt."}, {"t": 960, "zh": "然后，你可以指着苹果问：“这个多少钱一斤？”", "py": "Ránhòu, nǐ kěyǐ zhǐzhe píngguǒ wèn: \"zhège duōshǎo qián yìjīn?\"", "vi": "Sau đó bạn có thể chỉ vào quả táo và hỏi: “Cái này bao nhiêu tiền một cân?”"}, {"t": 964, "zh": "“斤”是中国常用的重量单位，一斤等于五百克。", "py": "\"jīn\" shì zhōngguó chángyòng de zhòngliàng dānwèi, yìjīn děngyú wǔbǎi kè.", "vi": "“Cân” (斤) là đơn vị đo khối lượng thường dùng ở Trung Quốc, một cân bằng năm trăm gam."}, {"t": 970, "zh": "老板会告诉你价格。你可能听不懂，没关系。你可以请她写在纸上。", "py": "Lǎobǎn huì gàosù nǐ jiàgé. Nǐ kěnéng tīngbùdǒng, méi guānxì. Nǐ kěyǐ qǐng tā xiě zài zhǐ shàng.", "vi": "Bà chủ sẽ cho bạn biết giá. Bạn có thể nghe không hiểu, không sao. Bạn có thể nhờ bà viết ra giấy."}, {"t": 976, "zh": "这个过程，你只说了两三句话，但是，这是一次真实的、成功的交流！", "py": "Zhège guòchéng, nǐ zhǐ shuō le liǎngsānjù huà, dànshì, zhè shì yícì zhēnshí de, chénggōng de jiāoliú!", "vi": "Trong quá trình này, bạn chỉ nói hai ba câu, nhưng đó là một lần giao tiếp thật và thành công!"}, {"t": 984, "zh": "你会非常有成就感。", "py": "Nǐ huì fēicháng yǒu chéngjiùgǎn.", "vi": "Bạn sẽ rất có cảm giác thành tựu."}, {"t": 986, "zh": "我同意。这种小的成功，会给你很大的信心，让你更敢于开口说中文。", "py": "Wǒ tóngyì. Zhèzhǒng xiǎo de chénggōng, huì gěi nǐ hěn dà de xìnxīn, ràng nǐ gèng gǎnyú kāikǒu shuō zhōngwén.", "vi": "Mình đồng ý. Những thành công nhỏ như vậy sẽ cho bạn rất nhiều tự tin, khiến bạn dám mở miệng nói tiếng Trung hơn."}, {"t": 993, "zh": "对！所以，我的建议是，走出去，去找人说。", "py": "Duì! Suǒyǐ, wǒ de jiànyì shì, zǒu chūqu, qù zhǎo rén shuō.", "vi": "Đúng! Vì vậy lời khuyên của mình là: hãy bước ra ngoài, đi tìm người để nói chuyện."}, {"t": 998, "zh": "哪怕只是一句“你好”，一句“谢谢”，都是了不起的开始。", "py": "Nǎpà zhǐshì yí jù \"nǐhǎo\", yí jù \"xièxie\", dōu shì liǎobùqǐ de kāishǐ.", "vi": "Dù chỉ là một câu “xin chào”, một câu “cảm ơn”, cũng đã là một khởi đầu tuyệt vời."}, {"t": 1004, "zh": "好了，今天我们聊了很多关于“如何开口说中文”的话题。时间也差不多了。", "py": "Hǎo le, jīntiān wǒmen liáo le hěnduō guānyú \"rúhé kāikǒu shuō zhōngwén\" de huàtí. Shíjiān yě chàbuduō le.", "vi": "Được rồi, hôm nay chúng ta đã nói nhiều về chủ đề “làm sao để mở miệng nói tiếng Trung”. Cũng gần hết giờ rồi.", "sec": "Tổng kết và câu hỏi cho người nghe"}, {"t": 1011, "zh": "王雨，我们像往常一样，为大家总结一下今天的内容吧。", "py": "Wáng yǔ, wǒmen xiàng wǎngcháng yíyàng, wèi dàjiā zǒngjié yí xià jīntiān de nèiróng ba.", "vi": "Vương Vũ, như mọi khi, chúng ta tóm tắt nội dung hôm nay cho mọi người nhé."}, {"t": 1016, "zh": "好的。今天我们聊了为什么你学了很久，还是不会说中文。", "py": "Hǎo de. Jīntiān wǒmen liáo le wèishénme nǐ xué le hěn jiǔ, háishì bú huì shuō zhōngwén.", "vi": "Được. Hôm nay chúng ta đã nói về việc vì sao bạn học lâu rồi mà vẫn không biết nói tiếng Trung."}, {"t": 1023, "zh": "我们觉得有三个主要原因。第一个，也是最重要的，就是“害怕”。", "py": "Wǒmen juéde yǒu sāngè zhǔyào yuányīn. Dìyígè, yě shì zuì zhòngyào de, jiùshì \"hàipà\".", "vi": "Chúng mình thấy có ba lý do chính. Thứ nhất, cũng là quan trọng nhất, là “sợ”."}, {"t": 1030, "zh": "请大家一定不要害怕说错。", "py": "Qǐng dàjiā yídìng búyào hàipà shuō cuò.", "vi": "Mong mọi người nhất định đừng sợ nói sai."}, {"t": 1034, "zh": "对。第二个原因是，很多朋友只“输入”，不“输出”。", "py": "Duì. Dìèrgè yuányīn shì, hěnduō péngyou zhǐ \"shūrù\", bù \"shūchū\".", "vi": "Đúng. Lý do thứ hai là nhiều bạn chỉ “nạp vào” mà không “xuất ra”."}, {"t": 1039, "zh": "请记住我们那个“游泳”的比喻。", "py": "Qǐng jìzhù wǒmen nàge \"yóuyǒng\" de bǐyù.", "vi": "Hãy nhớ ví dụ về “bơi lội” của chúng mình."}, {"t": 1042, "zh": "学语言不只要用眼睛和耳朵，更要用嘴巴去“练习”。", "py": "Xué yǔyán bù zhǐyào yòng yǎnjīng hé ěrduǒ, gèng yào yòng zuǐbā qù \"liànxí\".", "vi": "Học ngôn ngữ không chỉ dùng mắt và tai, mà còn phải dùng miệng để “luyện tập”."}, {"t": 1048, "zh": "是的，要下水游泳！", "py": "Shì de, yào xià shuǐ yóuyǒng!", "vi": "Đúng, phải xuống nước bơi!"}, {"t": 1050, "zh": "第三个原因是，不要太追求“完美”。", "py": "Dìsāngè yuányīn shì, búyào tài zhuīqiú \"wánměi\".", "vi": "Lý do thứ ba là đừng quá theo đuổi “hoàn hảo”."}, {"t": 1055, "zh": "请记住，先“完成”，再“完美”。", "py": "Qǐng jìzhù, xiān \"wánchéng\", zài \"wánměi\".", "vi": "Hãy nhớ: “hoàn thành” trước, “hoàn hảo” sau."}, {"t": 1059, "zh": "说一个六十分的句子，比说一个零分的句子要好一百倍！", "py": "Shuō yí ge liù shífēn de jùzi, bǐ shuō yí ge língfēn de jùzi yào hǎo yìbǎibèi!", "vi": "Nói một câu sáu mươi điểm tốt hơn nói một câu không điểm gấp một trăm lần!"}, {"t": 1065, "zh": "总结得非常好。我们也提供了一些简单的办法，比如“自言自语”，或者找“语言伙伴”，或者勇敢地去和水果店的“阿姨”说一句话。", "py": "Zǒngjié de fēicháng hǎo. Wǒmen yě tígōng le yìxiē jiǎndān de bànfǎ, bǐrú \"zìyánzìyǔ\", huòzhě zhǎo \"yǔyánhuǒbàn\", huòzhě yǒnggǎn de qù hé shuǐguǒdiàn de \"āyí\" shuō yí jù huà.", "vi": "Tóm tắt rất tốt. Chúng ta cũng đưa ra vài cách đơn giản, như “tự nói chuyện một mình”, hoặc tìm “bạn học ngôn ngữ”, hoặc dũng cảm đến nói một câu với “dì” bán trái cây."}, {"t": 1077, "zh": "希望这些方法对大家有帮助。", "py": "Xīwàng zhèxiē fāngfǎ duì dàjiā yǒu bāngzhù.", "vi": "Hy vọng những cách này giúp ích cho mọi người."}, {"t": 1080, "zh": "嗯！那么，听我们播客的朋友们，现在轮到你们了。我们想问你一个问题：", "py": "ń! Nàme, tīng wǒmen bōkè de péngyou men, xiànzài lún dào nǐmen le. Wǒmen xiǎng wèn nǐ yí ge wèntí:", "vi": "Ừm! Vậy thì các bạn nghe podcast của chúng mình, bây giờ đến lượt các bạn. Chúng mình muốn hỏi bạn một câu:"}, {"t": 1088, "zh": "为了练习说中文，你说的第一句中文是什么？你敢不敢开口说中文？", "py": "Wèile liànxí shuō zhōngwén, nǐ shuō de dìyījù zhōngwén shì shénme? Nǐ gǎnbùgǎn kāikǒu shuō zhōngwén?", "vi": "Để luyện nói tiếng Trung, câu tiếng Trung đầu tiên bạn nói là gì? Bạn có dám mở miệng nói tiếng Trung không?"}, {"t": 1096, "zh": "你有什么练习口语的好办法吗？请在下面的评论区给我们留言吧！", "py": "Nǐ yǒu shénme liànxí kǒuyǔ de hǎo bànfǎ ma? Qǐng zài xiàmiàn de pínglùnqū gěi wǒmen liúyán ba!", "vi": "Bạn có cách nào hay để luyện khẩu ngữ không? Hãy để lại bình luận cho chúng mình bên dưới nhé!"}, {"t": 1102, "zh": "我们非常期待看到你们的分享，和你们的故事。", "py": "Wǒmen fēicháng qīdài kàndào nǐmen de fēnxiǎng, hé nǐmen de gùshì.", "vi": "Chúng mình rất mong được xem những chia sẻ và câu chuyện của các bạn."}, {"t": 1106, "zh": "好的，那我们今天就到这里。感谢大家收听“每天中文”。", "py": "Hǎo de, nà wǒmen jīntiān jiù dào zhèlǐ. Gǎnxiè dàjiā shōutīng \"měitiān zhōngwén\".", "vi": "Được rồi, hôm nay chúng ta dừng ở đây. Cảm ơn mọi người đã nghe “Mỗi ngày tiếng Trung”."}, {"t": 1112, "zh": "我们下次再见。", "py": "Wǒmen xiàcì zàijiàn.", "vi": "Hẹn gặp lại lần sau."}, {"t": 1114, "zh": "再见！", "py": "Zàijiàn!", "vi": "Tạm biệt!"}]},

hl:{"v":[["外贸","wàimào","ngoại thương"],["节奏","jiézòu","nhịp độ"],["项目","xiàngmù","dự án"],["初步","chūbù","sơ bộ"],["放心","fàngxīn","yên tâm"],["沟通","gōutōng","giao tiếp, trao đổi"],["挑战","tiǎozhàn","thử thách"],["人情味","rénqíngwèi","tình người"],["加班","jiābān","tăng ca"],["效率","xiàolǜ","hiệu suất"],["主动","zhǔdòng","chủ động"],["汇报","huìbào","báo cáo"],["严格","yángé","nghiêm khắc"],["模糊","móhu","mơ hồ"],["具体","jùtǐ","cụ thể"],["批评","pīpíng","phê bình"],["适应","shìyìng","thích nghi, quen"],["成熟","chéngshú","chín chắn"],["自信","zìxìn","tự tin"]],"g":[{"t":"不仅…还…","re":"不仅.{1,16}还","k":["不仅","还"],"vi":"không chỉ… mà còn…","n":"Thêm một ý nữa."},{"t":"虽然…但是…","re":"虽然.{1,18}但是","k":["虽然","但是"],"vi":"tuy… nhưng…","n":"Hai vế đối lập."},{"t":"一边…一边…","re":"一边.{1,16}一边","k":["一边","一边"],"vi":"vừa… vừa…","n":"Hai hành động diễn ra cùng lúc."},{"t":"越来越…","re":"越来越","k":["越来越"],"vi":"ngày càng…","n":"Mức độ tăng dần."},{"t":"不是…而是…","re":"不是.{1,14}而是","k":["不是","而是"],"vi":"không phải… mà là…","n":"不是工作本身太难，而是责任变多了."},{"t":"只有…才…","re":"只有.{1,12}才","k":["只有","才"],"vi":"chỉ có… mới…","n":"Điều kiện bắt buộc."},{"t":"对…来说","re":"对.{1,6}来说","k":["对","来说"],"vi":"đối với… mà nói","n":"Nêu góc nhìn của một đối tượng."},{"t":"除了…也…","re":"除了.{1,20}也","k":["除了","也"],"vi":"ngoài… ra còn…","n":"Thêm một ý."},{"t":"不太…","re":"不太","k":["不太"],"vi":"không… lắm","n":"Phủ định nhẹ, mức độ thấp."},{"t":"比如…","re":"比如","k":["比如"],"vi":"ví dụ…","n":"Dùng để đưa ví dụ."},{"t":"从那以后","re":"从那以后","k":["从那以后"],"vi":"từ đó về sau","n":"Mốc thời gian sau một sự việc."},{"t":"一点 / 有一点","re":"有一点[^，。？！]{1,3}","k":["有一点"],"vi":"hơi, một chút","n":"有一点 + tính từ, thường mang sắc thái không như ý."}]},

文|zhōngwén,不|bù,仅|jǐn,可以|kěyǐ,更|gèng,好|hǎo,地|de,沟通|gōutōng,还|hái,可以|kěyǐ,理解|lǐjiě,老板|lǎobǎn,的|de,想法|xiǎngfǎ,和|hé,公司|gōngsī,的|de,文化|wénhuà", ""], ["有一次我把一份文件发错了，客户发现错误以后，我非常紧张，马上告诉老板。", "有|yǒu,一|yí,次|cì,我|wǒ,把|bǎ,一|yí,份|fèn,文件|wénjiàn,发|fā,错|cuò,了|le,客户|kèhù,发现|fāxiàn,错误|cuòwù,以后|yǐhòu,我|wǒ,非常|fēicháng,紧张|jǐnzhāng,马上|mǎshàng,告诉|gàosù,老板|lǎobǎn", ""], ["他希望我们做事快一点，也希望我们可以主动解决问题，而不是一直等指示。", "他|tā,希望|xīwàng,我们|wǒmen,做事|zuòshì,快|kuài,一|yì,点|diǎn,也|yě,希望|xīwàng,我们|wǒmen,可以|kěyǐ,主动|zhǔdòng,解决|jiějué,问题|wèntí,而|ér,不是|búshì,一直|yìzhí,等|děng,指示|zhǐshì", ""], ["我以为老板会生气，但是他只是平静地说：下次注意检查就好，错误是可以改的。", "我|wǒ,以为|yǐwéi,老板|lǎobǎn,会|huì,生气|shēngqì,但是|dànshì,他|tā,只是|zhǐshì,平静|píngjìng,地|de,说|shuō,下次|xiàcì,注意|zhùyì,检查|jiǎnchá,就|jiù,好|hǎo,错误|cuòwù,是|shì,可以|kěyǐ,改|gǎi,的|de", ""], ["下班以后，我也会继续学习中文，因为我发现，在办公室里，中文能力真的很重要。", "下班|xiàbān,以后|yǐhòu,我|wǒ,也|yě,会|huì,继续|jìxù,学习|xuéxí,中文|zhōngwén,因为|yīnwèi,我|wǒ,发现|fāxiàn,在|zài,办公室|bàngōngshì,里|lǐ,中文|zhōngwén,能力|nénglì,真的|zhēnde,很|hěn,重要|zhòngyào", ""]],
vis:["Câu này để lại cho tôi ấn tượng rất sâu.", "Được rồi, bây giờ câu chuyện của chúng ta bắt đầu.", "Nghe câu này, trong lòng tôi nhẹ nhõm đi nhiều.", "Tôi dần trở nên tự tin hơn, cũng chín chắn hơn.", "Ở văn phòng, nhịp độ làm việc của chúng tôi rất nhanh.", "Sếp của tôi là người Trung Quốc, ông ấy rất nghiêm túc và cũng rất nghiêm khắc.", "Dần dần, sếp cũng yên tâm hơn về công việc của tôi.", "Tôi rất căng thẳng, chỉ nói một câu: có lẽ cần một chút thời gian.", "Tôi nhớ lần đầu tham gia họp video, tôi rất căng thẳng.", "Từ đó về sau, tôi bắt đầu học cách diễn đạt rõ ràng hơn.", "Tôi sẽ thành thật nói: hơi khó, vì họ nói nhanh quá.", "Có lần sếp hỏi tôi: dự án này khi nào có thể hoàn thành?", "Khoảnh khắc đó tôi thấy ông thật ra là một người rất có tình người.", "Đôi khi tôi cũng tự hỏi, vì sao làm việc văn phòng lại mệt thế này?", "Làm việc ở văn phòng thật ra không chỉ có áp lực công việc mà còn có áp lực thời gian.", "Sếp Trung Quốc của tôi tuy nghiêm khắc nhưng cũng rất quan tâm đến đời sống của nhân viên.", "Làm việc cùng sếp Trung Quốc còn có một đặc điểm nữa, đó là hiệu suất rất quan trọng.", "Sau này tôi nhận ra, thật ra không phải bản thân công việc quá khó, mà là trách nhiệm nhiều lên.", "Sau khi cuộc họp bắt đầu, khách hàng Trung Quốc nói rất nhanh, tôi chỉ nghe hiểu được một phần nội dung.", "Sếp không phê bình tôi, ngược lại còn nói: không sao, nghe nhiều luyện nhiều sẽ ngày càng tốt hơn.", "Đôi khi sau cuộc họp sếp sẽ hỏi tôi: em thấy buổi họp hôm nay thế nào?", "Khoảnh khắc đó tôi mới nhận ra, làm việc ở văn phòng thì nói chuyện nhất định phải cụ thể, không được quá mơ hồ.", "Chủ đề hôm nay là làm việc ở văn phòng, cuộc sống đi làm thật cùng sếp người Trung Quốc.", "Nếu bạn hiện cũng đang học tiếng Trung, hoặc chuẩn bị bước vào đời đi làm, xin đừng sợ áp lực.", "Mỗi ngày có rất nhiều email phải trả lời, nhiều tài liệu phải sắp xếp, còn nhiều cuộc họp phải tham gia.", "Ví dụ buổi trưa chúng tôi cùng ăn cơm, đôi khi mọi người trò chuyện, nói chuyện công việc, cũng nói chuyện đời sống.", "Mỗi lần khó khăn là một cơ hội học hỏi; mỗi lần thử thách là một quá trình tiến bộ.", "Từ đó, mỗi sáng tôi đều sắp xếp công việc hôm nay trước, rồi chủ động báo cáo với sếp.", "Biết nói tiếng Trung không chỉ giúp giao tiếp tốt hơn mà còn giúp hiểu suy nghĩ của sếp và văn hóa công ty.", "Có lần tôi gửi nhầm một tài liệu, sau khi khách hàng phát hiện ra lỗi, tôi rất căng thẳng, lập tức báo với sếp.", "Ông mong chúng tôi làm việc nhanh hơn một chút, cũng mong chúng tôi chủ động giải quyết vấn đề, chứ không cứ chờ chỉ thị.", "Tôi tưởng sếp sẽ nổi giận, nhưng ông chỉ bình tĩnh nói: lần sau chú ý kiểm tra là được, sai thì có thể sửa.", "Sau giờ làm tôi cũng tiếp tục học tiếng Trung, vì tôi nhận ra ở văn phòng, năng lực tiếng Trung thật sự rất quan trọng."],

lines:[{"t": 2, "zh": "大家好，欢迎来到今天的中文学习播客。", "py": "Dàjiā hǎo, huānyíng láidào jīntiān de zhōngwén xuéxí bōkè.", "vi": "Chào mọi người, chào mừng đến với podcast học tiếng Trung hôm nay.", "sec": "Mở đầu: podcast cho người học HSK 3–4"}, {"t": 5, "zh": "今天的主题是在办公室工作，和中国老板一起上班的真实生活。", "py": "Jīntiān de zhǔtí shì zài bàngōngshì gōngzuò, hé zhōngguó lǎobǎn yìqǐ shàngbān de zhēnshí shēnghuó.", "vi": "Chủ đề hôm nay là làm việc ở văn phòng, cuộc sống đi làm thật cùng sếp người Trung Quốc."}, {"t": 14, "zh": "这是一期适合HSK3至4级的内容，语速会比较慢，用词也比较简单，希望可以帮助你一边听故事，一边学习中文。", "py": "Zhè shì yìqī shìhé HSK3zhì4jí de nèi róng de , yǔsù huì bǐjiàomàn, yòngcí yě bǐjiàojiǎndān, xīwàng kěyǐ bāngzhù nǐ yìbiān tīng gùshì, yìbiān xuéxí zhōngwén.", "vi": "Đây là tập phù hợp với trình độ HSK 3 đến 4, tốc độ nói khá chậm, từ ngữ cũng khá đơn giản, hy vọng giúp bạn vừa nghe truyện vừa học tiếng Trung."}, {"t": 32, "zh": "如果你现在也是一名上班族，或者将来想在公司工作，特别是和中国老板一起工作，那么今天的内容一定会让你很有共鸣。", "py": "Rúguǒ nǐ xiànzài yě shì yìmíng shàngbānzú, huòzhě jiānglái xiǎng zài gōngsī gōngzuò, tèbié shì hé zhōngguó lǎobǎn yìqǐ gōngzuò, nàme jīntiān de nèiróng yídìng huì ràng nǐ hěn yǒu gòngmíng.", "vi": "Nếu bạn hiện cũng là người đi làm, hoặc sau này muốn làm trong công ty, nhất là làm việc cùng sếp Trung Quốc, thì nội dung hôm nay chắc chắn sẽ khiến bạn đồng cảm."}, {"t": 45, "zh": "好，现在我们的故事开始了。", "py": "Hǎo, xiànzài wǒmen de gùshì kāishǐ le.", "vi": "Được rồi, bây giờ câu chuyện của chúng ta bắt đầu."}, {"t": 48, "zh": "我在一家外贸公司工作，公司不大，但是很忙。", "py": "Wǒ zài yì jiā wàimàogōngsī gōngzuò, gōngsī bú dà, dànshì hěn máng.", "vi": "Tôi làm ở một công ty ngoại thương, công ty không lớn nhưng rất bận.", "sec": "Sếp nghiêm khắc và buổi họp sáng"}, {"t": 55, "zh": "我的老板是中国人，他很认真，也很严格。", "py": "Wǒ de lǎobǎn shì zhōngguó rén, tā hěn rènzhēn, yě hěn yángé.", "vi": "Sếp của tôi là người Trung Quốc, ông ấy rất nghiêm túc và cũng rất nghiêm khắc."}, {"t": 60, "zh": "他每天都很早来公司，通常8点就已经在办公室了，而我一般八点半到公司，所以每次看到老板已经坐在电脑前工作，我都会有一点压力。", "py": "Tā měitiān dōu hěnzǎo lái gōngsī, tōngcháng 8 diǎn jiù yǐjing zài bàngōngshì le, ér wǒ yìbān bādiǎnbàn dào gōngsī, suǒyǐ měicì kàndào lǎobǎn yǐjing zuòzài diànnǎoqián gōngzuò, wǒ dū huì yǒu yì diǎn yālì.", "vi": "Ngày nào ông cũng đến công ty rất sớm, thường 8 giờ đã ở văn phòng rồi, còn tôi thường 8 rưỡi mới tới, nên mỗi lần thấy sếp đã ngồi trước máy tính làm việc, tôi đều thấy hơi áp lực."}, {"t": 78, "zh": "在办公室里，我们的工作节奏很快。", "py": "Zài bàngōngshì lǐ, wǒmen de gōngzuò jiézòu hěnkuài.", "vi": "Ở văn phòng, nhịp độ làm việc của chúng tôi rất nhanh."}, {"t": 81, "zh": "每天早上9点，我们都会开一个早会，老板会用中文问：今天的工作计划是什么？昨天的任务完成了吗？", "py": "Měitiān zǎoshàng 9 diǎn, wǒmen dū huì kāi yí ge zǎohuì, lǎobǎn huì yòng zhōngwén wèn: jīntiān de gōngzuò jìhuà shì shénme? Zuótiān de rènwù wánchéng le ma?", "vi": "Mỗi sáng 9 giờ chúng tôi đều họp một buổi họp sáng, sếp sẽ hỏi bằng tiếng Trung: kế hoạch làm việc hôm nay là gì? Nhiệm vụ hôm qua hoàn thành chưa?"}, {"t": 96, "zh": "一开始我听不太懂老板说的话，也不太敢回答，因为我担心自己说错中文，或者表达不清楚。", "py": "Yì kāishǐ wǒ tīng bú tài dǒng lǎobǎn shuō dehuà, yě bú tài gǎn huídá, yīnwèi wǒ dānxīn zìjǐ shuō cuò zhōngwén, huòzhě biǎodá bù qīngchǔ.", "vi": "Lúc đầu tôi nghe không hiểu lắm lời sếp nói, cũng không dám trả lời, vì tôi lo mình nói sai tiếng Trung hoặc diễn đạt không rõ."}, {"t": 108, "zh": "有一次老板问我：这个项目什么时候可以完成？", "py": "Yǒu yí cì lǎobǎn wèn wǒ: zhège xiàngmù shénme shíhou kěyǐ wánchéng?", "vi": "Có lần sếp hỏi tôi: dự án này khi nào có thể hoàn thành?"}, {"t": 114, "zh": "我很紧张，只说了一句：可能需要一点时间。", "py": "Wǒ hěn jǐnzhāng, zhǐ shuō le yí jù: kěnéng xūyào yì diǎn shíjiān.", "vi": "Tôi rất căng thẳng, chỉ nói một câu: có lẽ cần một chút thời gian."}, {"t": 120, "zh": "老板听了以后皱了一下眉头，说：一点时间是多久？一天，三天，还是一周？", "py": "Lǎobǎn tīng le yǐhòu zhòu le yí xià méitóu, shuō: yì diǎn shíjiān shì duōjiǔ? Yìtiān, sāntiān, háishì yì zhōu?", "vi": "Nghe xong sếp nhíu mày một cái, nói: một chút thời gian là bao lâu? Một ngày, ba ngày, hay một tuần?"}, {"t": 132, "zh": "那一刻我才发现，在办公室工作，说话一定要具体，不能太模糊。", "py": "Nàyíkè wǒ cái fāxiàn, zài bàngōngshì gōngzuò, shuōhuà yídìng yào jùtǐ, bùnéng tài móhú.", "vi": "Khoảnh khắc đó tôi mới nhận ra, làm việc ở văn phòng thì nói chuyện nhất định phải cụ thể, không được quá mơ hồ."}, {"t": 142, "zh": "从那以后，我开始学会用更清楚的方式表达。", "py": "Cóng nà yǐhòu, wǒ kāishǐ xuéhuì yòng gèng qīngchǔ de fāngshì biǎodá.", "vi": "Từ đó về sau, tôi bắt đầu học cách diễn đạt rõ ràng hơn."}, {"t": 148, "zh": "比如我会说：这个项目大概三天可以完成，或者说：今天下午可以给您一个初步的结果。", "py": "Bǐrú wǒ huì shuō: zhège xiàngmù dàgài sāntiān kěyǐ wánchéng, huòzhě shuō: jīntiānxiàwǔ kěyǐ gěi nín yí ge chūbù de jiéguǒ.", "vi": "Ví dụ tôi sẽ nói: dự án này khoảng ba ngày có thể xong, hoặc: chiều nay tôi có thể đưa anh một kết quả sơ bộ."}, {"t": 157, "zh": "慢慢地，我老板对我的工作也更放心了。", "py": "Mànmàn de, wǒ lǎobǎn duì wǒ de gōngzuò yě gèng fàngxīn le.", "vi": "Dần dần, sếp cũng yên tâm hơn về công việc của tôi."}, {"t": 160, "zh": "在办公室工作，其实不仅有工作压力，还有时间压力。", "py": "Zài bàngōngshì gōngzuò, qíshí bù jǐn yǒu gōngzuòyālì, háiyǒu shíjiānyālì.", "vi": "Làm việc ở văn phòng thật ra không chỉ có áp lực công việc mà còn có áp lực thời gian.", "sec": "Áp lực thời gian và cuộc họp video"}, {"t": 170, "zh": "每天都有很多邮件要回复，很多文件要整理，还有很多会议要参加。", "py": "Měitiān dōu yǒu hěnduō yóujiàn yào huífù, hěnduō wénjiàn yào zhěnglǐ, háiyǒu hěnduō huìyì yào cānjiā.", "vi": "Mỗi ngày có rất nhiều email phải trả lời, nhiều tài liệu phải sắp xếp, còn nhiều cuộc họp phải tham gia."}, {"t": 180, "zh": "特别是和中国客户开会的时候，我们必须用中文沟通，这对我来说是一个很大的挑战。", "py": "Tèbié shì hé zhōngguó kèhù kāihuì de shíhou, wǒmen bìxū yòng zhōngwén gōutōng, zhè duì wǒ láishuō shì yí ge hěn dà de tiǎozhàn.", "vi": "Nhất là khi họp với khách hàng Trung Quốc, chúng tôi phải giao tiếp bằng tiếng Trung, đối với tôi đây là một thử thách rất lớn."}, {"t": 191, "zh": "记得第一次参加视频会议时，我非常紧张。", "py": "Jìde dìyīcì cānjiā shìpínhuìyì shí, wǒ fēicháng jǐnzhāng.", "vi": "Tôi nhớ lần đầu tham gia họp video, tôi rất căng thẳng."}, {"t": 196, "zh": "会议开始后，中国客户说话很快，我只听懂了一部分内容。", "py": "Huìyì kāishǐ hòu, zhōngguó kèhù shuōhuà hěnkuài, wǒ zhǐ tīng dǒng le yíbùfèn nèiróng.", "vi": "Sau khi cuộc họp bắt đầu, khách hàng Trung Quốc nói rất nhanh, tôi chỉ nghe hiểu được một phần nội dung."}, {"t": 202, "zh": "我一边听一边记笔记，还要一边想怎么用中文回答，那种感觉真的很累，但是也很真实，因为这就是职场生活。", "py": "Wǒ yìbiān tīng yìbiān jìbǐjì, háiyào yìbiān xiǎng zěnme yòng zhōngwén huídá, nàzhǒng gǎnjué zhēnde hěn lèi, dànshì yě hěn zhēnshí, yīnwèi zhè jiùshì zhíchǎng shēnghuó.", "vi": "Tôi vừa nghe vừa ghi chép, lại còn phải nghĩ cách trả lời bằng tiếng Trung, cảm giác đó thật sự rất mệt, nhưng cũng rất thật, vì đó chính là cuộc sống công sở."}, {"t": 217, "zh": "有时候老板会在会议结束后问我：你觉得今天的会议怎么样？", "py": "Yǒushíhòu lǎobǎn huì zài huìyì jiéshù hòu wèn wǒ: nǐ juéde jīntiān de huìyì zěnmeyàng?", "vi": "Đôi khi sau cuộc họp sếp sẽ hỏi tôi: em thấy buổi họp hôm nay thế nào?"}, {"t": 224, "zh": "我会老实地说：有一点难，因为他们说得太快。", "py": "Wǒ huì lǎoshí de shuō: yǒu yì diǎn nán, yīnwèi tāmen shuō de tài kuài.", "vi": "Tôi sẽ thành thật nói: hơi khó, vì họ nói nhanh quá."}, {"t": 232, "zh": "老板没有批评我，反而说：没关系，多听多练就会越来越好。", "py": "Lǎobǎn méiyǒu pīpíng wǒ, fǎnér shuō: méi guānxì, duō tīng duō liàn jiù huì yuè lái yuè hǎo.", "vi": "Sếp không phê bình tôi, ngược lại còn nói: không sao, nghe nhiều luyện nhiều sẽ ngày càng tốt hơn."}, {"t": 242, "zh": "听到这句话，我心里轻松了很多。", "py": "Tīngdào zhè jù huà, wǒ xīnlǐ qīngsōng le hěnduō.", "vi": "Nghe câu này, trong lòng tôi nhẹ nhõm đi nhiều."}, {"t": 245, "zh": "除了工作内容，办公室的人际关系也很重要。", "py": "Chúle gōngzuò nèiróng, bàngōngshì de rénjìguānxì yě hěn zhòngyào.", "vi": "Ngoài nội dung công việc, các mối quan hệ ở văn phòng cũng rất quan trọng.", "sec": "Sếp quan tâm nhân viên và chuyện tăng ca"}, {"t": 251, "zh": "我的中国老板虽然严格，但是也很关心员工的生活。", "py": "Wǒ de zhōngguó lǎobǎn suīrán yángé, dànshì yě hěn guānxīn yuángōng de shēnghuó.", "vi": "Sếp Trung Quốc của tôi tuy nghiêm khắc nhưng cũng rất quan tâm đến đời sống của nhân viên."}, {"t": 257, "zh": "有一次我连续加班好几天，看起来很累，老板走过来问我：最近工作压力大吗？要注意休息。", "py": "Yǒu yí cì wǒ liánxù jiābān hǎo jǐtiān, kànqǐlái hěn lèi, lǎobǎn zǒu guòlái wèn wǒ: zuìjìn gōngzuòyālì dà ma? Yào zhùyì xiūxī.", "vi": "Có lần tôi tăng ca liên tục mấy ngày, trông rất mệt, sếp đi tới hỏi tôi: dạo này áp lực công việc lớn không? Phải chú ý nghỉ ngơi."}, {"t": 270, "zh": "那一刻我觉得，他其实是一个很有人情味的人。", "py": "Nàyíkè wǒ juéde, tā qíshí shì yí ge hěn yǒu rénqíngwèi de rén.", "vi": "Khoảnh khắc đó tôi thấy ông thật ra là một người rất có tình người."}, {"t": 276, "zh": "当然，加班在办公室是很常见的事情，特别是在项目快要结束的时候，我们常常工作到晚上7点、8点，甚至更晚。", "py": "Dāngrán, jiābān zài bàngōngshì shì hěn chángjiàn de shìqing, tèbié shì zài xiàngmù kuàiyào jiéshù de shíhou, wǒmen chángcháng gōngzuò dào wǎnshàng 7 diǎn, 8 diǎn, shènzhì gèng wǎn.", "vi": "Dĩ nhiên, tăng ca ở văn phòng là chuyện rất thường gặp, nhất là lúc dự án sắp kết thúc, chúng tôi thường làm đến 7 giờ, 8 giờ tối, thậm chí muộn hơn."}, {"t": 289, "zh": "下班以后，我常常觉得很累，只想早点回家休息，但是第二天早上还是要准时上班。", "py": "Xiàbān yǐhòu, wǒ chángcháng juéde hěn lèi, zhǐ xiǎng zǎodiǎn huíjiā xiūxī, dànshì dìèrtiān zǎoshàng háishì yào zhǔnshí shàngbān.", "vi": "Sau khi tan làm, tôi thường thấy rất mệt, chỉ muốn về nhà nghỉ sớm, nhưng sáng hôm sau vẫn phải đi làm đúng giờ."}, {"t": 300, "zh": "有时候我也会问自己，为什么办公室工作这么累？", "py": "Yǒushíhòu wǒ yě huì wèn zìjǐ, wèishénme bàngōngshì gōngzuò zhème lèi?", "vi": "Đôi khi tôi cũng tự hỏi, vì sao làm việc văn phòng lại mệt thế này?"}, {"t": 307, "zh": "后来我发现，其实不是工作本身太难，而是责任变多了。", "py": "Hòulái wǒ fāxiàn, qíshí búshì gōngzuò běnshēn tài nán, érshì zérèn biàn duō le.", "vi": "Sau này tôi nhận ra, thật ra không phải bản thân công việc quá khó, mà là trách nhiệm nhiều lên."}, {"t": 315, "zh": "在学校的时候，我们只需要完成作业，但是在公司，每一项工作都和公司的发展有关，所以不能随便对待。", "py": "Zài xuéxiào de shíhou, wǒmen zhǐ xūyào wánchéng zuòyè, dànshì zài gōngsī, měiyíxiàng gōngzuò dōu hé gōngsī de fāzhǎn yǒuguān, suǒyǐ bùnéng suíbiàn duìdài.", "vi": "Hồi còn đi học, chúng tôi chỉ cần làm xong bài tập, nhưng ở công ty, mỗi việc đều liên quan đến sự phát triển của công ty, nên không thể làm cho có."}, {"t": 328, "zh": "和中国老板一起工作还有一个特点，就是效率很重要。", "py": "Hé zhōngguó lǎobǎn yìqǐ gōngzuò háiyǒu yí ge tèdiǎn, jiùshì xiàolǜ hěn zhòngyào.", "vi": "Làm việc cùng sếp Trung Quốc còn có một đặc điểm nữa, đó là hiệu suất rất quan trọng.", "sec": "Hiệu suất và tinh thần chủ động"}, {"t": 337, "zh": "老板常说一句话：时间就是金钱。", "py": "Lǎobǎn cháng shuō yí jù huà: shíjiān jiùshì jīnqián.", "vi": "Sếp hay nói một câu: thời gian là tiền bạc."}, {"t": 341, "zh": "他希望我们做事快一点，也希望我们可以主动解决问题，而不是一直等指示。", "py": "Tā xīwàng wǒmen zuòshì kuài yì diǎn, yě xīwàng wǒmen kěyǐ zhǔdòng jiějuéwèntí, ér búshì yìzhí děng zhǐshì.", "vi": "Ông mong chúng tôi làm việc nhanh hơn một chút, cũng mong chúng tôi chủ động giải quyết vấn đề, chứ không cứ chờ chỉ thị."}, {"t": 353, "zh": "刚开始工作的时候，我习惯等老板安排任务，如果老板不说，我就不知道该做什么。", "py": "Gāng kāishǐ gōngzuò de shíhou, wǒ xíguàn děng lǎobǎn ānpái rènwù, rúguǒ lǎobǎn bù shuō, wǒ jiù bù zhīdao gāi zuò shénme.", "vi": "Lúc mới đi làm, tôi quen chờ sếp phân công nhiệm vụ, nếu sếp không nói thì tôi không biết nên làm gì."}, {"t": 363, "zh": "但是老板有一次对我说：在公司工作要学会主动思考。", "py": "Dànshì lǎobǎn yǒu yí cì duì wǒ shuō: zài gōngsī gōngzuò yào xuéhuì zhǔdòng sīkǎo.", "vi": "Nhưng có lần sếp nói với tôi: làm việc ở công ty phải học cách chủ động suy nghĩ."}, {"t": 370, "zh": "这句话让我印象很深。", "py": "Zhè jù huà ràng wǒ yìnxiàng hěn shēn.", "vi": "Câu này để lại cho tôi ấn tượng rất sâu."}, {"t": 373, "zh": "从那以后，我每天早上都会先整理今天的工作，然后主动向老板汇报。", "py": "Cóng nà yǐhòu, wǒ měitiān zǎoshàng dū huì xiān zhěnglǐ jīntiān de gōngzuò, ránhòu zhǔdòng xiàng lǎobǎn huìbào.", "vi": "Từ đó, mỗi sáng tôi đều sắp xếp công việc hôm nay trước, rồi chủ động báo cáo với sếp."}, {"t": 383, "zh": "在真实的办公室生活中，也会遇到很多小压力。", "py": "Zài zhēnshí de bàngōngshì shēnghuó zhōng, yě huì yùdào hěnduō xiǎo yālì.", "vi": "Trong cuộc sống văn phòng thật, cũng sẽ gặp nhiều áp lực nhỏ.", "sec": "Mắc lỗi và những áp lực nhỏ"}, {"t": 387, "zh": "比如工作做错了，会担心被批评；邮件写得不够专业，会担心客户不满意；中文表达不流利，也会觉得没有自信。", "py": "Bǐrú gōngzuò zuò cuò le, huì dānxīn bèi pīpíng; yóujiàn xiě de bú gòu zhuānyè, huì dānxīn kèhù bùmǎnyì; zhōngwén biǎodá bù liúlì, yě huì juéde méiyǒu zìxìn.", "vi": "Ví dụ làm sai việc thì lo bị phê bình; viết email chưa đủ chuyên nghiệp thì lo khách hàng không hài lòng; diễn đạt tiếng Trung không trôi chảy thì cũng thấy thiếu tự tin."}, {"t": 403, "zh": "这些都是很多职场新人都会遇到的问题。", "py": "Zhèxiē dōu shì hěnduō zhíchǎng xīnrén dū huì yùdào de wèntí.", "vi": "Đây đều là những vấn đề mà rất nhiều người mới đi làm sẽ gặp."}, {"t": 406, "zh": "有一次我把一份文件发错了，客户发现错误以后，我非常紧张，马上告诉老板。", "py": "Yǒu yí cì wǒ bǎ yí fènwénjiàn fā cuò le, kèhù fāxiàncuòwù yǐhòu, wǒ fēicháng jǐnzhāng, mǎshàng gàosù lǎobǎn.", "vi": "Có lần tôi gửi nhầm một tài liệu, sau khi khách hàng phát hiện ra lỗi, tôi rất căng thẳng, lập tức báo với sếp."}, {"t": 420, "zh": "我以为老板会生气，但是他只是平静地说：下次注意检查就好，错误是可以改的。", "py": "Wǒ yǐwéi lǎobǎn huì shēngqì, dànshì tā zhǐshì píngjìng de shuō: xiàcì zhùyì jiǎnchá jiù hǎo, cuòwù shì kěyǐ gǎi de.", "vi": "Tôi tưởng sếp sẽ nổi giận, nhưng ông chỉ bình tĩnh nói: lần sau chú ý kiểm tra là được, sai thì có thể sửa."}, {"t": 431, "zh": "这件事情让我学会了一个很重要的道理：在工作中犯错并不可怕，重要的是及时改正。", "py": "Zhèjiàn shìqing ràng wǒ xuéhuì le yí ge hěn zhòngyào de dàolǐ: zài gōngzuò zhōng fàncuò bìng bù kěpà, zhòngyào de shì jíshí gǎizhèng.", "vi": "Chuyện này giúp tôi hiểu một đạo lý rất quan trọng: mắc lỗi trong công việc không đáng sợ, quan trọng là kịp thời sửa."}, {"t": 442, "zh": "办公室的生活不只是工作，还有日常的小细节。", "py": "Bàngōngshì de shēnghuó bù zhǐshì gōngzuò, háiyǒu rìcháng de xiǎo xìjié.", "vi": "Cuộc sống văn phòng không chỉ là công việc, còn có những chi tiết nhỏ thường ngày.", "sec": "Đời sống văn phòng và sự trưởng thành"}, {"t": 448, "zh": "比如中午我们会一起吃午饭，有时候大家会聊天，聊工作，也聊生活。", "py": "Bǐrú zhōngwǔ wǒmen huì yìqǐ chī wǔfàn, yǒushíhòu dàjiā huì liáotiān, liáo gōngzuò, yě liáo shēnghuó.", "vi": "Ví dụ buổi trưa chúng tôi cùng ăn cơm, đôi khi mọi người trò chuyện, nói chuyện công việc, cũng nói chuyện đời sống."}, {"t": 458, "zh": "中国同事常常会问我：你适应这里的工作吗？", "py": "Zhōngguó tóngshì chángcháng huì wèn wǒ: nǐ shìyìng zhèlǐ de gōngzuò ma?", "vi": "Đồng nghiệp Trung Quốc thường hỏi tôi: em có quen với công việc ở đây không?"}, {"t": 463, "zh": "我会笑着说：虽然有压力，但是也学到了很多。", "py": "Wǒ huì xiào zhe shuō: suīrán yǒu yālì, dànshì yě xuédào le hěnduō.", "vi": "Tôi sẽ cười và nói: tuy có áp lực nhưng cũng học được rất nhiều."}, {"t": 469, "zh": "下班以后，我也会继续学习中文，因为我发现，在办公室里，中文能力真的很重要。", "py": "Xiàbān yǐhòu, wǒ yě huì jìxù xuéxí zhōngwén, yīnwèi wǒ fāxiàn, zài bàngōngshì lǐ, zhōngwén nénglì zhēnde hěn zhòngyào.", "vi": "Sau giờ làm tôi cũng tiếp tục học tiếng Trung, vì tôi nhận ra ở văn phòng, năng lực tiếng Trung thật sự rất quan trọng."}, {"t": 480, "zh": "会说中文，不仅可以更好地沟通，还可以理解老板的想法和公司的文化。", "py": "Huì shuō zhōngwén, bù jǐn kěyǐ gèng hǎo de gōutōng, hái kěyǐ lǐjiě lǎobǎn de xiǎngfǎ hé gōngsī de wénhuà.", "vi": "Biết nói tiếng Trung không chỉ giúp giao tiếp tốt hơn mà còn giúp hiểu suy nghĩ của sếp và văn hóa công ty."}, {"t": 490, "zh": "在现实生活中，很多年轻人都面临工作压力：早起上班，完成任务，面对老板，参加会议。", "py": "Zài xiànshíshēnghuó zhōng, hěnduō niánqīngrén dōu miànlín gōngzuòyālì: zǎoqǐ shàngbān, wánchéng rènwù, miànduì lǎobǎn, cānjiā huìyì.", "vi": "Trong đời thực, rất nhiều người trẻ đều đối mặt với áp lực công việc: dậy sớm đi làm, hoàn thành nhiệm vụ, đối diện sếp, tham dự họp."}, {"t": 500, "zh": "这些都是很普通的事情，但是正是这些普通的日子，组成了我们的职场生活。", "py": "Zhèxiē dōu shì hěn pǔtōng de shìqing, dànshì zhèngshì zhèxiē pǔtōng de rìzi, zǔchéng le wǒmen de zhíchǎng shēnghuó.", "vi": "Đó đều là những chuyện rất bình thường, nhưng chính những ngày bình thường này tạo nên cuộc sống công sở của chúng ta."}, {"t": 510, "zh": "有时候我也会觉得累，也会想放松一下。", "py": "Yǒushíhòu wǒ yě huì juéde lèi, yě huì xiǎng fàngsōng yí xià.", "vi": "Đôi khi tôi cũng thấy mệt, cũng muốn thư giãn một chút."}, {"t": 516, "zh": "周末的时候，我喜欢听音乐、看电影，或者和朋友聊天，让自己放松心情，因为只有休息好了，才能更好地工作。", "py": "Zhōumò de shíhou, wǒ xǐhuan tīng yīnyuè, kàn diànyǐng, huòzhě hé péngyou liáotiān, ràng zìjǐ fàngsōng xīnqíng, yīnwèi zhǐyǒu xiūxī hǎo le, cáinéng gèng hǎo de gōngzuò.", "vi": "Cuối tuần tôi thích nghe nhạc, xem phim, hoặc trò chuyện với bạn bè để thư giãn tinh thần, vì chỉ khi nghỉ ngơi tốt mới làm việc tốt hơn."}, {"t": 530, "zh": "和中国老板一起工作这段时间，我学到了很多，不只是工作技能，还有时间管理、沟通能力，还有责任感。", "py": "Hé zhōngguó lǎobǎn yìqǐ gōngzuò zhè duànshíjiān, wǒ xuédào le hěnduō, bù zhǐshì gōngzuò jìnéng, háiyǒu shíjiānguǎnlǐ, gōutōngnénglì, háiyǒu zérèngǎn.", "vi": "Trong thời gian làm việc cùng sếp Trung Quốc, tôi học được rất nhiều, không chỉ kỹ năng làm việc mà còn quản lý thời gian, năng lực giao tiếp, và cả tinh thần trách nhiệm."}, {"t": 544, "zh": "我慢慢变得更自信，也更成熟了。", "py": "Wǒ mànmàn biàn de gèng zìxìn, yě gèng chéngshú le.", "vi": "Tôi dần trở nên tự tin hơn, cũng chín chắn hơn."}, {"t": 549, "zh": "现在如果老板再问我工作计划，我不会再紧张，而是会清楚地回答。", "py": "Xiànzài rúguǒ lǎobǎn zài wèn wǒ gōngzuò jìhuà, wǒ búhuì zài jǐnzhāng, érshì huì qīngchǔ de huídá.", "vi": "Bây giờ nếu sếp hỏi lại kế hoạch công việc, tôi không còn căng thẳng nữa mà sẽ trả lời rõ ràng."}, {"t": 558, "zh": "如果开会听不懂，我也会主动请对方说慢一点，因为我知道，沟通是可以练习的，能力也是可以提高的。", "py": "Rúguǒ kāihuì tīng bù dǒng, wǒ yě huì zhǔdòng qǐng duìfāng shuō màn yì diǎn, yīnwèi wǒ zhīdao, gōutōng shì kěyǐ liànxí de, nénglì yě shì kěyǐ tígāo de.", "vi": "Nếu họp mà nghe không hiểu, tôi cũng sẽ chủ động nhờ đối phương nói chậm lại, vì tôi biết giao tiếp có thể luyện tập, năng lực cũng có thể nâng cao."}, {"t": 570, "zh": "其实办公室工作虽然有压力，但是也有成长。", "py": "Qíshí bàngōngshì gōngzuò suīrán yǒu yālì, dànshì yě yǒu chéngzhǎng.", "vi": "Thật ra làm việc văn phòng tuy có áp lực nhưng cũng có sự trưởng thành."}, {"t": 576, "zh": "每一次困难，都是一次学习的机会；每一次挑战，都是一次进步的过程。", "py": "Měi yí cì kùnnán, dōu shì yí cì xuéxí de jīhuì; měi yí cì tiǎozhàn, dōu shì yí cì jìnbù de guòchéng.", "vi": "Mỗi lần khó khăn là một cơ hội học hỏi; mỗi lần thử thách là một quá trình tiến bộ."}, {"t": 585, "zh": "如果你现在也在学习中文，或者准备进入职场，请不要害怕压力。", "py": "Rúguǒ nǐ xiànzài yě zài xuéxí zhōngwén, huòzhě zhǔnbèi jìnrù zhíchǎng, qǐng búyào hàipà yālì.", "vi": "Nếu bạn hiện cũng đang học tiếng Trung, hoặc chuẩn bị bước vào đời đi làm, xin đừng sợ áp lực.", "sec": "Lời nhắn cuối và câu hỏi cho người nghe"}, {"t": 593, "zh": "压力并不一定是坏事，有时候它会让我们变得更强。", "py": "Yālì bìngbùyídìng shì huàishì, yǒushíhòu tā huì ràng wǒmen biàn de gèng qiáng.", "vi": "Áp lực không hẳn là chuyện xấu, đôi khi nó khiến chúng ta mạnh mẽ hơn."}, {"t": 599, "zh": "最后，我想对正在努力工作的你说一句话：工作可能很忙，生活可能很累，但是只要你坚持学习，坚持努力，你一定会看到自己的进步。", "py": "Zuìhòu, wǒ xiǎng duì zhèngzài nǔlì gōngzuò de nǐ shuō yí jù huà: gōngzuò kěnéng hěn máng, shēnghuó kěnéng hěn lèi, dànshì zhǐyào nǐ jiānchí xuéxí, jiānchí nǔlì, nǐ yídìng huì kàndào zìjǐ de jìnbù.", "vi": "Cuối cùng, mình muốn nói với bạn đang nỗ lực làm việc một câu: công việc có thể rất bận, cuộc sống có thể rất mệt, nhưng chỉ cần bạn kiên trì học, kiên trì cố gắng, bạn nhất định sẽ thấy sự tiến bộ của mình."}, {"t": 614, "zh": "今天的播客就到这里了，希望这个关于办公室工作的真实故事，可以帮助你提高中文听力，也让你对职场生活有更多的了解。", "py": "Jīntiān de bōkè jiù dào zhèlǐ le, xīwàng zhège guānyú bàngōngshì gōngzuò de zhēnshí gùshì, kěyǐ bāngzhù nǐ tígāo zhōngwén tīnglì, yě ràng nǐ duì zhíchǎng shēnghuó yǒu gèng duō de liǎojiě.", "vi": "Podcast hôm nay đến đây thôi, hy vọng câu chuyện thật về công việc văn phòng này giúp bạn nâng cao khả năng nghe tiếng Trung và hiểu thêm về cuộc sống công sở."}, {"t": 631, "zh": "如果你也有和外国老板工作，或者在办公室上班的经历，欢迎在心里用中文想一想：你的工作压力来自哪里？你是怎么面对的？", "py": "Rúguǒ nǐ yě yǒu hé wàiguó lǎobǎn gōngzuò, huòzhě zài bàngōngshì shàngbān de jīnglì, huānyíng zài xīnlǐ yòng zhōngwén xiǎngyìxiǎng: nǐ de gōngzuòyālì láizì nǎlǐ? Nǐ shì zěnme miànduì de?", "vi": "Nếu bạn cũng có kinh nghiệm làm việc với sếp nước ngoài hoặc đi làm văn phòng, hãy thử nghĩ trong đầu bằng tiếng Trung: áp lực công việc của bạn đến từ đâu? Bạn đã đối mặt với nó thế nào?"}, {"t": 648, "zh": "我们下次再见，继续用简单的中文聊真实的生活。谢谢你的收听，我们下期再见。", "py": "Wǒmen xiàcì zàijiàn, jìxù yòng jiǎndān de zhōngwén liáo zhēnshí de shēnghuó. Xièxie nǐ de shōutīng, wǒmen xiàqī zàijiàn.", "vi": "Hẹn gặp lại lần sau, tiếp tục dùng tiếng Trung đơn giản để trò chuyện về cuộc sống thật. Cảm ơn bạn đã nghe, hẹn gặp lại tập sau."}]},

vis:["Bước hai, làm bài tập thay thế.", "Luyện như vậy có lợi gì?", "Thế nào là đọc theo kiểu thấp nhất?", "Còn cái bẫy thường gặp nào nữa?", "Nói nhiều rồi, phản xạ sẽ ngày càng nhanh.", "Hôm nay chúng ta sẽ nói cho thấu chuyện này.", "Luyện thêm vài lần sẽ ngày càng trôi.", "Khác thế nào? Chẳng phải đều là nói tiếng Trung sao?", "Hóa ra một bên là vẽ theo, một bên là tự vẽ.", "Càng căng thẳng, đầu óc càng trống rỗng, càng không nhớ ra.", "Bẫy thứ ba: đọc theo chỉ động miệng, không động não.", "Đây là bước then chốt nhất để từ biết thuộc đến biết dùng.", "Trước hết đọc theo bình thường, đọc theo audio hai ba lượt cho thuộc.", "Không phải bạn học không được, mà là bạn chưa luyện đến bước đó.", "Hóa ra không phải chưa nhớ, mà là chưa biết tự lấy ra dùng.", "Bước một, làm đọc theo theo từng bậc, đừng vừa bắt đầu đã bỏ văn bản.", "Khi đọc theo, sai cũng không ai biết, không ai cười bạn.", "Thật ra nhiều khi không phải không biết nói, mà là căng thẳng đến quên mất.", "Chào mọi người, chào mừng đến với podcast tiếng Trung hôm nay, mình là Linh Nguyệt.", "Độ khó cao hơn đọc theo mấy bậc, đương nhiên thấy khó.", "Cho nên không phải bạn giả vờ biết nói, mà bản thân việc đọc theo vốn có độ khó thấp.", "Đúng, như vậy bạn luyện không phải một câu mà là một mẫu câu.", "Mình tổng kết được bốn lý do chính, cái sau chạm đúng chỗ đau hơn cái trước.", "Thật ra đó mới là bước đầu, bạn mới chỉ biết đọc theo, vẫn chưa biết tự nói.", "À đúng rồi, còn có biến điệu khi đọc liền, đọc riêng thì hiểu hết, nói liền lại dễ sai.", "Khi đọc theo, bạn nghe âm thanh rồi đọc theo, là đang dùng nhận diện bị động.", "Vì vậy bạn thấy đấy, tự mở miệng khó hoàn toàn không phải do bạn ngốc, cũng không phải đọc theo vô dụng.", "Suốt tập đều là những lẽ đơn giản, không có thuật ngữ phức tạp, nghe xong là dùng được.", "Hơn nữa khi đọc theo, não bạn chỉ cần lo một việc: phát âm đúng hay không.", "Trả lời câu hỏi đầu tiên trước: vì sao đọc theo dễ thế? Có phải đọc theo vô dụng không?", "Từ đọc theo được đến tự nói được, ở giữa cần luyện tập chủ động, cần nâng cấp từng bước.", "Nhiều người rất hoang mang: chẳng lẽ việc đọc theo của mình là giả sao? Là mình tự lừa mình sao?", "Bước ba, luyện shadowing (đọc đuổi theo như cái bóng), nhưng trọng tâm không phải bắt chước phát âm mà là bắt chước nhịp điệu và cấu trúc.", "Đúng là như vậy, càng sợ sai càng không nói ra, càng không nói ra càng căng thẳng, thành vòng luẩn quẩn.", "Khi đọc theo, giống như có người đặt đáp án trước mặt bạn, bạn chỉ cần đọc theo là được.", "Hôm nay chúng ta nói về một vấn đề gần như người học tiếng Trung nào cũng từng gặp, rất thật.", "Giống như xếp hình, lúc đọc theo người khác đã ghép sẵn khối rồi, bạn chỉ cần bày lại theo.", "Lý do thứ nhất, cũng là cốt lõi nhất: từ “nhận ra được” đến “nói ra được” còn thiếu một bước: chủ động truy xuất.", "Kiên trì một tháng, bạn sẽ cảm nhận rõ khi nói tiếng Trung mình bị kẹt ngày càng ít.", "Hơn nữa tự nói với mình, không sợ sai, cũng không có áp lực, đặc biệt hợp với những bạn không dám mở miệng.", "Đúng, đây là cái bẫy thứ hai: coi đọc theo là học thuộc bài khóa, nghĩ thuộc rồi là biết nói.", "Ồ, ý cậu là khi đọc theo thật ra chúng ta chỉ bắt chước và sao chép, không phải tự tạo câu?", "Vậy cụ thể nên luyện thế nào? Có cách nào đơn giản dễ làm để từ đọc theo dần dần luyện đến tự nói được không?", "Vậy tiếp theo nói về điều mọi người quan tâm nhất: vì sao tự nói lại khó đến thế? Khó rốt cuộc ở chỗ nào?", "Giống hồi nhỏ học thuộc bài, đọc bao nhiêu lượt, tưởng thuộc rồi, gấp sách lại là quên, vì không để tâm.", "Đúng, luyện xong bốn bước này, bạn không còn chỉ biết đọc theo nữa, mà thật sự biết tự tổ chức ngôn từ, tự mở miệng nói.", "Vấn đề không phải đọc theo vô dụng, mà là đa số người chỉ làm kiểu đọc theo thấp nhất, luyện xong là dừng, không đi tiếp."],
