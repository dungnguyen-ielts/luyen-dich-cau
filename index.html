<html lang="vi">
<head>
<meta charset="utf-8">

<style>
/* Layout: one centred column, a card per sentence, two practice modes switched by a segmented control. */
:root {
  --bg: #ffffff; --side: #f7f6f3; --surface: #ffffff; --ink: #151515; --muted: #6b6b66; --line: #e7e5df;
  --clay: #151515; --clay-ink: #ffffff; --good: #1a7f4b; --good-bg: #e6f6ec;
  --bad: #d92d45; --bad-bg: #fdecef; --tile: #f5f4f0; --accent2: #f0b429; --hover: #ecebe6;
  --t1: #d6336c; --t2: #e8710a; --t3: #198754; --t4: #2f6fdd; --t0: #6b7c8c;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-han: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --side: #181817; --surface: #171716; --ink: #f1f0ec; --muted: #a09f98; --line: #2c2b28;
    --clay: #f1f0ec; --clay-ink: #151515; --good: #6fd69a; --good-bg: #14301f;
    --bad: #ff8d9b; --bad-bg: #3a1a20; --tile: #222220; --accent2: #ffc95e; --hover: #262624;
    --t1: #ff7fae; --t2: #ffa04d; --t3: #5fd596; --t4: #7fb0ff; --t0: #9fb2c3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --side: #181817; --surface: #171716; --ink: #f1f0ec; --muted: #a09f98; --line: #2c2b28;
  --clay: #f1f0ec; --clay-ink: #151515; --good: #6fd69a; --good-bg: #14301f;
  --bad: #ff8d9b; --bad-bg: #3a1a20; --tile: #222220; --accent2: #ffc95e; --hover: #262624;
  --t1: #ff7fae; --t2: #ffa04d; --t3: #5fd596; --t4: #7fb0ff; --t0: #9fb2c3; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tab { font: inherit; font-weight: 500; padding: 10px 8px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--clay); color: var(--clay-ink); }
.tab:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
.stats { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--clay); transition: width .25s; }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--clay); border-radius: 14px; box-shadow: 0 2px 10px rgba(10,134,201,.08); padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.han { font-family: var(--font-han); font-weight: 500; font-size: 28px; line-height: 1.45; text-wrap: balance; word-break: break-word; }
.en { font-size: 18px; line-height: 1.45; text-wrap: balance; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input[type="text"] { width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--tile); color: var(--ink); }
input[type="text"].ok { border-color: var(--good); background: var(--good-bg); }
input[type="text"].no { border-color: var(--bad); background: var(--bad-bg); }
button.btn { font: inherit; font-weight: 500; padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--tile); color: var(--ink); cursor: pointer; }
button.btn.main { background: var(--clay); border-color: var(--clay); color: var(--clay-ink); }
button.btn:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; }
.tip { font-size: 13px; color: var(--muted); }
.msg { padding: 10px 12px; border-radius: 10px; font-size: 15px; }
.msg.ok { background: var(--good-bg); color: var(--good); }
.msg.no { background: var(--bad-bg); color: var(--bad); }
.msg.info { background: var(--tile); border: 1px solid var(--line); color: var(--ink); }
.py { font-size: 18px; letter-spacing: .01em; }
.answer { min-height: 76px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; background: var(--tile); }
.answer.ok { border: 1.5px solid var(--good); background: var(--good-bg); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; }
.t { font: inherit; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 48px; padding: 6px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--tile); color: var(--ink); cursor: pointer; }
.t .h { font-family: var(--font-han); font-weight: 500; font-size: 22px; line-height: 1.3; }
.t .p { font-size: 12px; color: var(--muted); line-height: 1.2; }
.t.wrong { border-color: var(--bad); background: var(--bad-bg); }
.t.right { border-color: var(--good); }
.t.t1 .h, .gh.t1 { color: var(--t1); } .t.t2 .h, .gh.t2 { color: var(--t2); } .t.t3 .h, .gh.t3 { color: var(--t3); } .t.t4 .h, .gh.t4 { color: var(--t4); } .t.t0 .h, .gh.t0 { color: var(--t0); }
.t.sel { box-shadow: 0 0 0 2px var(--accent2); }
.gloss { border: 1.5px solid var(--accent2); background: var(--tile); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.gloss .gh { font-family: var(--font-han); font-size: 26px; font-weight: 700; line-height: 1.3; }
.gloss .gp { font-size: 16px; color: var(--muted); }
.gloss .gm { font-size: 17px; }
.key-tone { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.key-tone b { font-family: var(--font-han); font-size: 15px; }
.key-tone .k1 { color: var(--t1); } .key-tone .k2 { color: var(--t2); } .key-tone .k3 { color: var(--t3); } .key-tone .k4 { color: var(--t4); } .key-tone .k0 { color: var(--t0); }
.t:disabled { cursor: default; }
.ln .z mark { background: none; color: inherit; border-radius: 3px; padding: 0 1px; }
.hlv .ln .z mark.hv { background: color-mix(in srgb, #f0b429 38%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, #f0b429 38%, transparent); }
.hlg .ln .z mark.hg { background: color-mix(in srgb, #2f6fdd 22%, transparent); border-bottom: 2px solid #2f6fdd; }
.hlbox { display: flex; flex-direction: column; gap: 14px; }
.hlbox h3 { margin: 0; font-size: 15px; font-weight: 600; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.vit, .git { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; text-align: left; background: var(--tile); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; font: inherit; color: inherit; min-width: 0; }
.vit:hover, .git:hover { background: var(--hover); }
.vit .w { font-family: var(--font-han); font-size: 20px; font-weight: 600; }
.vit .p { font-size: 13px; color: var(--muted); margin-left: 8px; }
.vit .m { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.vit mark, .git mark { background: color-mix(in srgb, #f0b429 38%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.glist { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.git .gt { font-family: var(--font-han); font-size: 18px; font-weight: 600; }
.git .gm { font-size: 14px; margin-top: 2px; }
.git .gn { font-size: 13px; color: var(--muted); margin-top: 2px; }
.git .ge { font-family: var(--font-han); font-size: 15px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); line-height: 1.5; }
.git .ge mark { background: color-mix(in srgb, #2f6fdd 22%, transparent); border-bottom: 2px solid #2f6fdd; border-radius: 3px; }
.git .gv { font-size: 13px; color: var(--muted); margin-top: 2px; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.toggle input { width: 18px; height: 18px; accent-color: var(--clay); }
.end { text-align: center; align-items: center; }
.end .big { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
.theme { align-self: flex-end; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 0; text-decoration: underline; }

.player { display: flex; flex-direction: column; gap: 12px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctrl .btn { padding: 8px 14px; }
.seek { flex: 1 1 160px; min-width: 0; accent-color: var(--clay); }
.time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
select.rate { font: inherit; font-size: 14px; padding: 8px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--tile); color: var(--ink); }
.lens { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--tile); overflow: hidden; }
.lens .band { position: absolute; left: 8px; right: 8px; top: 50%; height: 0; pointer-events: none; z-index: 1; }
.lens .band::before, .lens .band::after { content: ""; position: absolute; left: 0; right: 0; border-top: 1.5px solid var(--clay); opacity: .55; }
.lens .band::before { top: -62px; } .lens .band::after { top: 62px; }
.scroller { height: min(60vh, 460px); overflow-y: auto; scroll-behavior: smooth; padding: 200px 16px; mask-image: linear-gradient(to bottom, transparent, #000 22%, #000 78%, transparent); -webkit-mask-image: linear-gradient(to bottom, transparent, #000 22%, #000 78%, transparent); scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.ln { text-align: center; padding: 8px 0; cursor: pointer; opacity: .32; transition: opacity .3s, font-size .3s; font-size: 13px; }
.ln .z { font-family: var(--font-han); font-weight: 500; font-size: 1.5em; line-height: 1.4; text-wrap: balance; }
.ln .y { font-size: 1.05em; color: var(--muted); }
.ln .v { font-size: 1em; line-height: 1.45; }
.ln[data-d="2"] { opacity: .5; font-size: 14px; }
.ln[data-d="1"] { opacity: .75; font-size: 16px; }
.ln[data-d="0"] { opacity: 1; font-size: 20px; }
.ln[data-d="0"] .z { color: var(--clay); font-weight: 700; }
.ln[data-d="0"] .y { color: var(--ink); }
.ln .sc { font-size: .72em; letter-spacing: .06em; text-transform: uppercase; color: var(--clay); margin-bottom: 6px; }
.nopy .y { display: none; } .novi .v { display: none; }
.ld { display: flex; flex-direction: column; gap: 8px; }
.ld textarea { width: 100%; min-height: 110px; font: inherit; font-size: 14px; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--tile); color: var(--ink); }
.ld summary { cursor: pointer; font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .scroller { scroll-behavior: auto; } .ln { transition: none; } }
.hanbox { font-family: var(--font-han); font-size: 24px; }
input.hanbox.ok { border-color: var(--good); background: var(--good-bg); }
input.hanbox.no { border-color: var(--bad); background: var(--bad-bg); }
.navrow { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); align-items: center; }
.navrow select { flex: 1; min-width: 0; }
.navrow .btn:disabled { opacity: .4; cursor: default; }
.cands { display: flex; flex-wrap: wrap; gap: 6px; min-height: 48px; }
.cand { font: inherit; display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--tile); color: var(--ink); cursor: pointer; }
.cand.on { border-color: var(--clay); box-shadow: 0 0 0 1px var(--clay); }
.cand .ci { font-size: 12px; color: var(--muted); }
.cand .ch { font-family: var(--font-han); font-size: 22px; line-height: 1.3; }
.diff { text-decoration: underline wavy var(--bad); text-underline-offset: 5px; }
.kb { gap: 6px; }
.key { min-width: 44px; padding: 8px 10px; font-size: 18px; }
@media (max-width: 420px) { .han { font-size: 24px; } .card { padding: 16px; } }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

/* ---- layout: sidebar + content ---- */
body { padding: 0; }
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }

.bname { font-weight: 700; font-size: 17px; }

.content { padding: 36px clamp(16px, 4vw, 48px) 56px; max-width: 860px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
header { gap: 14px; align-items: flex-start; }
.pill { font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--surface); }
h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.12; letter-spacing: -.02em; font-weight: 800; max-width: 14em; }
.kicker { display: none; }
.card { border: 1px solid var(--line); border-top: 1px solid var(--line); border-radius: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04); padding: 22px; }

button.btn { border-radius: 10px; background: var(--surface); }

html, body { margin: 0; overflow-x: hidden; }

vis:["Vậy hai điều đó khác nhau ở đâu?", "Xin chào các bạn thính giả thân mến!", "Đúng, chính là cái cảm giác sợ bỏ lỡ ấy!", "Không nghi ngờ gì nữa, đây chính là tự do thật sự.", "Khoảnh khắc ấy, mình thật sự thấy quá tuyệt vời.", "Ở một mình thật sự đã trở thành một thú vui cao cấp.", "Chào mừng các bạn đến với tập mới của «Tiếng Trung mỗi ngày»!", "Đúng rồi! Y như vậy! Hồi nhỏ mình cũng giống hệt!", "Đúng, nỗi sợ bị cô lập ấy rất mạnh mẽ.", "Bây giờ mình đơn giản là yêu chết đi được những lúc ăn cơm một mình!", "Ăn xong, mình còn có thể yên lặng húp một ngụm nước dùng.", "Nó thật ra giống quá trình một con suối nhỏ chảy ra biển hơn.", "Ha ha, mình đoán chắc chắn ai cũng cực kỳ tự giác, cực kỳ chăm chỉ!", "Mình thấy chân lý chỉ có một, đó là điều mình kiên trì.", "Lấy lại quyền đánh giá bản thân sao? Cách nói này thật đặc biệt.", "hôm nay được gặp các bạn ở đây, trong lòng mình thật sự rất vui!", "Khoảnh khắc đó, mình hoàn toàn không để tâm những người khác trong quán nhìn mình thế nào.", "Còn nhiệt huyết khi trưởng thành là sự chấp nhận sau khi buông bỏ những yêu cầu ấy.", "Sao mình phải lãng phí thời gian quý giá thế này vào việc ngủ chứ?", "Phép ví von này đẹp quá. Dòng nước tuy xiết nhưng rất dễ bị cản. Đúng!", "Đúng vậy, nhiều người mới học rất dễ sốt ruột lúc đầu.", "Cứ từ từ, đừng vội, trưởng thành luôn ở trên đường đi, học tiếng Trung cũng vậy.", "Lúc đó xung quanh rất yên tĩnh, nắng ngoài cửa sổ chiếu vào, ấm áp dễ chịu.", "Khi còn nhỏ, sự chú ý của chúng ta đều đặt hết vào thế giới bên ngoài.", "Để mình nghĩ xem... Hồi đi học, đúng là có hơi để ý ánh mắt của người khác.", "Trước đây bạn có hay tranh cãi với người khác không? Nói thật thì, trước đây là có.", "Mẹ bắt mình phải nhắm mắt ngủ, bảo trẻ con ngủ trưa mới cao được.", "Thật đấy! Cuối tuần trước mình đi một mình đến một quán ramen mình rất muốn ăn.", "Thế còn bạn bây giờ? Giờ bạn còn có cảm giác này không? Bây giờ ư? Hoàn toàn ngược lại!", "Thật ra không phải câu khó gì, ngược lại, là một cảm nghĩ nhỏ mình ngẫm nghĩ từ lâu rồi.", "Ồ? Hôm nay thấy bạn mặt mày hồng hào, tâm trạng tốt thế, định ra cho mình câu khó gì đây?", "Bạn nghĩ xem, hồi chúng ta còn bé, đứa trẻ nào lại tự nguyện đi ngủ trưa chứ?", "Tô ramen nóng hổi đó ngon hay không, chỉ có lưỡi và dạ dày của chính bạn biết.", "Nhưng bây giờ thì sao? Mua quần áo mình chỉ xem hai điều: thứ nhất là thoải mái, thứ hai là chất vải mềm.", "Nhưng lúc đó mình tràn đầy năng lượng, nằm trên giường trằn trọc, hoàn toàn không ngủ được.", "Chúng ta bắt đầu học cách lấy lại quyền đánh giá bản thân từ tay người khác về tay mình.", "Nhiều học sinh trẻ có tâm lý này, thật ra đó là một kiểu lo âu xã hội rất bình thường.", "Ha ha, chào mọi người! Tuần vừa rồi các bạn thế nào? Công việc có suôn sẻ không? Học có mệt không?", "Nói nhanh nghe thử nào, để các bạn trước màn hình và đang đeo tai nghe cùng góp ý giúp mình luôn.", "Giày cao gót mình đã cất vào hộp từ lâu, tủ giày bây giờ toàn là giày bệt và giày thể thao.", "Cứ đến trưa là mẹ kéo rèm kín mít, căn phòng bỗng tối sầm.", "Quan trọng nhất là, tuần này các bạn có nhớ giọng của chúng mình không, có lén dành thời gian luyện tiếng Trung không nào?", "Bạn nhận ra ánh mắt của người khác thật ra không thể làm bạn no thật sự, cũng không thể cho bạn sự bình yên trong lòng.", "Nghe bạn nói nhiều như vậy, mình bỗng nghĩ ra một phép ví von rất có hình ảnh. Ví von gì? Nói nghe thử.", "Mình không còn cần ai ép đi ngủ nữa, ngược lại, mình đi cầu xin cuộc sống cho chút thời gian để ngủ.", "Bạn nói đúng quá. Trước đây mình thấy thế giới ở bên ngoài, giờ mình thấy năng lượng của mình cần được giữ lại bên trong.", "Với lại, đồ uống trên bàn mình trước đây toàn là cola đá, cà phê đá, giờ cũng dần chuyển thành nước ấm và trà nóng.", "Hay nói đúng hơn, cuối cùng mình đã hiểu ra, thật ra chẳng có ai đang nhìn mình cả, ai cũng bận sống cuộc sống của mình!"],

lines:[{"t":6,"zh":"亲爱的听众朋友们，大家好呀！","py":"Qīn'ài de tīngzhòng péngyoumen, dàjiā hǎo ya!","vi":"Xin chào các bạn thính giả thân mến!","sec":"Con người có thật sự thay đổi không?"},{"t":8,"zh":"欢迎大家收听新一期的《每天中文》！","py":"Huānyíng dàjiā shōutīng xīn yì qī de 《Měitiān Zhōngwén》!","vi":"Chào mừng các bạn đến với tập mới của «Tiếng Trung mỗi ngày»!"},{"t":13,"zh":"又到了我们每周一起聊天、一起轻松学中文的时间啦，","py":"Yòu dào le wǒmen měi zhōu yìqǐ liáotiān, yìqǐ qīngsōng xué Zhōngwén de shíjiān la,","vi":"Lại đến lúc chúng ta cùng trò chuyện mỗi tuần, cùng nhau học tiếng Trung một cách nhẹ nhàng rồi,"},{"t":17,"zh":"今天能在这里见到大家，我心里真的特别开心！","py":"jīntiān néng zài zhèlǐ jiàndào dàjiā, wǒ xīnlǐ zhēn de tèbié kāixīn!","vi":"hôm nay được gặp các bạn ở đây, trong lòng mình thật sự rất vui!"},{"t":21,"zh":"哈哈，大家好！最近这一周大家过得怎么样？工作顺不顺利？学习累不累？","py":"Hāhā, dàjiā hǎo! Zuìjìn zhè yì zhōu dàjiā guò de zěnmeyàng? Gōngzuò shùn bu shùnlì? Xuéxí lèi bu lèi?","vi":"Ha ha, chào mọi người! Tuần vừa rồi các bạn thế nào? Công việc có suôn sẻ không? Học có mệt không?"},{"t":28,"zh":"最重要的是，这周有没有想念我们的声音，有没有偷偷抽时间练习中文呢？","py":"Zuì zhòngyào de shì, zhè zhōu yǒu méiyǒu xiǎngniàn wǒmen de shēngyīn, yǒu méiyǒu tōutōu chōu shíjiān liànxí Zhōngwén ne?","vi":"Quan trọng nhất là, tuần này các bạn có nhớ giọng của chúng mình không, có lén dành thời gian luyện tiếng Trung không nào?"},{"t":34,"zh":"哈哈，我猜大家肯定都超级自律、超级努力！","py":"Hāhā, wǒ cāi dàjiā kěndìng dōu chāojí zìlǜ, chāojí nǔlì!","vi":"Ha ha, mình đoán chắc chắn ai cũng cực kỳ tự giác, cực kỳ chăm chỉ!"},{"t":38,"zh":"每次在后台看到大家热情的留言和打卡，我和李明都觉得心里暖洋洋的，动力满满！","py":"Měi cì zài hòutái kàndào dàjiā rèqíng de liúyán hé dǎkǎ, wǒ hé Lǐ Míng dōu juéde xīnlǐ nuǎnyángyáng de, dònglì mǎnmǎn!","vi":"Mỗi lần thấy ở hậu trường những bình luận nhiệt tình và lượt điểm danh của các bạn, mình và Lý Minh đều thấy ấm lòng, tràn đầy động lực!"},{"t":46,"zh":"不过话说回来，李明，今天一走进录音棚看到你，我脑子里突然蹦出来一个特别好奇、特别想问你的问题。","py":"Búguò huà shuō huílái, Lǐ Míng, jīntiān yì zǒujìn lùyīnpéng kàndào nǐ, wǒ nǎozi lǐ tūrán bèng chūlái yí ge tèbié hàoqí, tèbié xiǎng wèn nǐ de wèntí.","vi":"Nhưng mà nói đi cũng phải nói lại, Lý Minh này, hôm nay vừa bước vào phòng thu thấy bạn, trong đầu mình bỗng nảy ra một câu hỏi rất tò mò, rất muốn hỏi bạn."},{"t":56,"zh":"哦？今天看你红光满面、心情这么好，准备给我出什么难题呀？","py":"Ó? Jīntiān kàn nǐ hóngguāng mǎnmiàn, xīnqíng zhème hǎo, zhǔnbèi gěi wǒ chū shénme nántí ya?","vi":"Ồ? Hôm nay thấy bạn mặt mày hồng hào, tâm trạng tốt thế, định ra cho mình câu khó gì đây?"},{"t":61,"zh":"快说出来听听，也让屏幕前和戴着耳机的朋友们一起帮我参谋参谋。","py":"Kuài shuō chūlái tīngting, yě ràng píngmù qián hé dàizhe ěrjī de péngyoumen yìqǐ bāng wǒ cānmóu cānmóu.","vi":"Nói nhanh nghe thử nào, để các bạn trước màn hình và đang đeo tai nghe cùng góp ý giúp mình luôn."},{"t":67,"zh":"其实不是什么难题，相反，是一个我琢磨了好久的小感触。","py":"Qíshí bú shì shénme nántí, xiāngfǎn, shì yí ge wǒ zhuómó le hǎojiǔ de xiǎo gǎnchù.","vi":"Thật ra không phải câu khó gì, ngược lại, là một cảm nghĩ nhỏ mình ngẫm nghĩ từ lâu rồi."},{"t":73,"zh":"李明，你觉得，人真的会变吗？现在的你，和以前那个自己，真的还是同一个人吗？","py":"Lǐ Míng, nǐ juéde, rén zhēn de huì biàn ma? Xiànzài de nǐ, hé yǐqián nà ge zìjǐ, zhēn de háishi tóng yí ge rén ma?","vi":"Lý Minh, bạn thấy con người có thật sự thay đổi không? Bạn bây giờ và bạn ngày xưa, thật sự vẫn là cùng một người sao?"},{"t":81,"zh":"哈哈，怎么前一秒还在开开心心地打招呼，下一秒突然切换成了\"哲学大师\"模式？","py":"Hāhā, zěnme qián yì miǎo hái zài kāikāi xīnxīn de dǎ zhāohu, xià yì miǎo tūrán qiēhuàn chéng le \"zhéxué dàshī\" móshì?","vi":"Ha ha, sao vừa nãy còn vui vẻ chào hỏi, giây sau đã chuyển sang chế độ \"bậc thầy triết học\" thế?"},{"t":88,"zh":"怎么突然问这么深奥的问题？快跟我说说，今天发生什么有趣的事了，让你突然开始思考人生了？","py":"Zěnme tūrán wèn zhème shēn'ào de wèntí? Kuài gēn wǒ shuōshuo, jīntiān fāshēng shénme yǒuqù de shì le, ràng nǐ tūrán kāishǐ sīkǎo rénshēng le?","vi":"Sao tự nhiên lại hỏi câu sâu sắc vậy? Kể mình nghe đi, hôm nay có chuyện thú vị gì khiến bạn bỗng bắt đầu suy ngẫm về cuộc đời?"},{"t":96,"zh":"其实不是什么大事，就是今天中午吃完饭的时候，我坐在办公室的椅子上，特别想睡觉。","py":"Qíshí bú shì shénme dà shì, jiù shì jīntiān zhōngwǔ chīwán fàn de shíhou, wǒ zuò zài bàngōngshì de yǐzi shàng, tèbié xiǎng shuìjiào.","vi":"Thật ra không có gì to tát, chỉ là sau bữa trưa hôm nay, mình ngồi trên ghế văn phòng, buồn ngủ vô cùng.","sec":"Giấc ngủ trưa: trẻ con chống cự, người lớn coi là xa xỉ"},{"t":103,"zh":"当时四周特别安静，窗外的阳光照进来，暖洋洋的。","py":"Dāngshí sìzhōu tèbié ānjìng, chuāng wài de yángguāng zhào jìnlái, nuǎnyángyáng de.","vi":"Lúc đó xung quanh rất yên tĩnh, nắng ngoài cửa sổ chiếu vào, ấm áp dễ chịu."},{"t":108,"zh":"我定了一个二十分钟的闹钟，闭上眼睛的那一刻，我突然觉得，天啊，能够安静地睡上二十分钟，简直是这个世界上最幸福、最奢侈的事情！","py":"Wǒ dìng le yí ge èrshí fēnzhōng de nàozhōng, bì shàng yǎnjing de nà yí kè, wǒ tūrán juéde, tiān a, nénggòu ānjìng de shuì shàng èrshí fēnzhōng, jiǎnzhí shì zhège shìjiè shàng zuì xìngfú, zuì shēchǐ de shìqing!","vi":"Mình đặt đồng hồ báo thức hai mươi phút, và khoảnh khắc nhắm mắt lại, mình bỗng nghĩ: trời ơi, được ngủ yên hai mươi phút, đúng là chuyện hạnh phúc và xa xỉ nhất trên đời!"},{"t":120,"zh":"哈哈，午睡确实是一件很舒服的事。不过，这怎么就让你想到\"人会不会变\"这个问题了呢？","py":"Hāhā, wǔshuì quèshí shì yí jiàn hěn shūfu de shì. Búguò, zhè zěnme jiù ràng nǐ xiǎngdào \"rén huì bu huì biàn\" zhège wèntí le ne?","vi":"Ha ha, ngủ trưa quả thật rất dễ chịu. Nhưng sao chuyện này lại khiến bạn nghĩ đến câu hỏi \"con người có thay đổi không\"?"},{"t":129,"zh":"因为在闭上眼睛的那一瞬间，我脑子里突然跳出来我小时候的画面。","py":"Yīnwèi zài bì shàng yǎnjing de nà yí shùnjiān, wǒ nǎozi lǐ tūrán tiào chūlái wǒ xiǎoshíhou de huàmiàn.","vi":"Vì vào khoảnh khắc nhắm mắt, trong đầu mình bỗng hiện lên hình ảnh hồi nhỏ."},{"t":134,"zh":"你想想看，我们小的时候，哪有一个小孩子是愿意主动午睡的？","py":"Nǐ xiǎngxiang kàn, wǒmen xiǎo de shíhou, nǎ yǒu yí ge xiǎo háizi shì yuànyì zhǔdòng wǔshuì de?","vi":"Bạn nghĩ xem, hồi chúng ta còn bé, đứa trẻ nào lại tự nguyện đi ngủ trưa chứ?"},{"t":140,"zh":"这倒是真的。我记得我小时候，每天中午最害怕听到我妈妈说的一句话就是：\"快去床上躺着，睡觉！\"","py":"Zhè dào shì zhēn de. Wǒ jìde wǒ xiǎoshíhou, měitiān zhōngwǔ zuì hàipà tīngdào wǒ māma shuō de yí jù huà jiùshì: \"Kuài qù chuáng shàng tǎngzhe, shuìjiào!\"","vi":"Cái này đúng đấy. Mình nhớ hồi nhỏ, câu mình sợ nghe nhất mỗi trưa là mẹ nói: \"Mau lên giường nằm, ngủ đi!\""},{"t":147,"zh":"对！就是这样！我小时候也是一模一样！","py":"Duì! Jiùshì zhèyàng! Wǒ xiǎoshíhou yě shì yìmú yíyàng!","vi":"Đúng rồi! Y như vậy! Hồi nhỏ mình cũng giống hệt!"},{"t":153,"zh":"一到中午，我妈妈就会把窗帘拉得严严实实的，房间里一下子变暗了。","py":"Yí dào zhōngwǔ, wǒ māma jiù huì bǎ chuānglián lā de yányán shíshí de, fángjiān lǐ yíxiàzi biàn àn le.","vi":"Cứ đến trưa là mẹ kéo rèm kín mít, căn phòng bỗng tối sầm."},{"t":159,"zh":"她要求我必须闭上眼睛睡觉，说小孩子睡午觉才能长高。","py":"Tā yāoqiú wǒ bìxū bì shàng yǎnjing shuìjiào, shuō xiǎo háizi shuì wǔjiào cái néng zhǎng gāo.","vi":"Mẹ bắt mình phải nhắm mắt ngủ, bảo trẻ con ngủ trưa mới cao được."},{"t":165,"zh":"可是我那时候精力太充沛了，躺在床上翻来覆去，根本睡不着。","py":"Kěshì wǒ nà shíhou jīnglì tài chōngpèi le, tǎng zài chuáng shàng fānlái-fùqù, gēnběn shuì bu zháo.","vi":"Nhưng lúc đó mình tràn đầy năng lượng, nằm trên giường trằn trọc, hoàn toàn không ngủ được."},{"t":170,"zh":"我看着天花板，数着墙上的时钟滴答滴答走，心里特别着急，一直在想：","py":"Wǒ kànzhe tiānhuābǎn, shǔzhe qiáng shàng de shízhōng dīdā dīdā zǒu, xīnlǐ tèbié zháojí, yìzhí zài xiǎng:","vi":"Mình nhìn trần nhà, đếm tiếng tích tắc của đồng hồ trên tường, trong lòng rất sốt ruột, cứ nghĩ mãi:"},{"t":178,"zh":"外面的太阳那么好，电视里的动画片肯定开始了，我的小伙伴们是不是已经在院子里玩捉迷藏了？","py":"Wàimiàn de tàiyáng nàme hǎo, diànshì lǐ de dònghuàpiàn kěndìng kāishǐ le, wǒ de xiǎo huǒbànmen shì bu shì yǐjīng zài yuànzi lǐ wán zhuōmícáng le?","vi":"Ngoài kia nắng đẹp thế, phim hoạt hình trên tivi chắc chắn bắt đầu rồi, đám bạn mình có phải đã chơi trốn tìm ngoài sân rồi không?"},{"t":186,"zh":"我为什么要把这么宝贵的时间浪费在睡觉上？","py":"Wǒ wèishénme yào bǎ zhème bǎoguì de shíjiān làngfèi zài shuìjiào shàng?","vi":"Sao mình phải lãng phí thời gian quý giá thế này vào việc ngủ chứ?"},{"t":190,"zh":"哈哈，你那个时候觉得睡觉是在\"浪费生命\"。","py":"Hāhā, nǐ nà ge shíhou juéde shuìjiào shì zài \"làngfèi shēngmìng\".","vi":"Ha ha, hồi đó bạn nghĩ ngủ là \"phí cả đời\"."},{"t":193,"zh":"没错！甚至有几次，我因为不想午睡，还跟我妈妈大吵大闹，最后被我妈妈批评了一顿，眼角还带着眼泪才委屈地睡着。","py":"Méi cuò! Shènzhì yǒu jǐ cì, wǒ yīnwèi bù xiǎng wǔshuì, hái gēn wǒ māma dàchǎo-dànào, zuìhòu bèi wǒ māma pīpíng le yí dùn, yǎnjiǎo hái dàizhe yǎnlèi cái wěiqu de shuìzháo.","vi":"Đúng thế! Thậm chí có mấy lần, vì không muốn ngủ trưa mà mình làm ầm ĩ với mẹ, cuối cùng bị mẹ mắng một trận, mắt còn đẫm nước mắt, tủi thân ngủ thiếp đi."},{"t":204,"zh":"可是你看，现在的我，每天早上七点起床，挤地铁上班，面对忙碌的工作。","py":"Kěshì nǐ kàn, xiànzài de wǒ, měitiān zǎoshang qī diǎn qǐchuáng, jǐ dìtiě shàngbān, miànduì mánglù de gōngzuò.","vi":"Nhưng bạn xem, mình bây giờ, sáng nào cũng dậy lúc bảy giờ, chen tàu điện ngầm đi làm, đối mặt với công việc bận rộn."},{"t":211,"zh":"到了中午，只要能让我安安静静地趴在桌子上睡十五分钟，我都觉得这是生活给我的巨大奖赏。","py":"Dào le zhōngwǔ, zhǐyào néng ràng wǒ ān'ān jìngjìng de pā zài zhuōzi shàng shuì shíwǔ fēnzhōng, wǒ dōu juéde zhè shì shēnghuó gěi wǒ de jùdà jiǎngshǎng.","vi":"Đến trưa, chỉ cần được nằm yên trên bàn ngủ mười lăm phút, mình đã thấy đó là phần thưởng lớn mà cuộc sống dành cho mình."},{"t":219,"zh":"我再也不用任何人逼我睡觉了，相反，我是求着生活给我一点睡觉的时间。","py":"Wǒ zài yě bú yòng rènhé rén bī wǒ shuìjiào le, xiāngfǎn, wǒ shì qiúzhe shēnghuó gěi wǒ yìdiǎn shuìjiào de shíjiān.","vi":"Mình không còn cần ai ép đi ngủ nữa, ngược lại, mình đi cầu xin cuộc sống cho chút thời gian để ngủ."},{"t":226,"zh":"所以我刚才就在想，那个小时候拼命反抗午睡的王雨，和现在这个把午睡当成宝贝的王雨，真的是同一个人吗？","py":"Suǒyǐ wǒ gāngcái jiù zài xiǎng, nà ge xiǎoshíhou pīnmìng fǎnkàng wǔshuì de Wáng Yǔ, hé xiànzài zhège bǎ wǔshuì dàngchéng bǎobèi de Wáng Yǔ, zhēn de shì tóng yí ge rén ma?","vi":"Nên vừa rồi mình cứ nghĩ: Vương Vũ hồi nhỏ ra sức chống lại giấc ngủ trưa, và Vương Vũ bây giờ coi giấc ngủ trưa như báu vật, thật sự là cùng một người sao?"},{"t":235,"zh":"这真是一个特别生动的小细节。其实你刚才说的这种感觉，心理学上有一个非常有意思的解释。","py":"Zhè zhēn shì yí ge tèbié shēngdòng de xiǎo xìjié. Qíshí nǐ gāngcái shuō de zhè zhǒng gǎnjué, xīnlǐxué shàng yǒu yí ge fēicháng yǒuyìsi de jiěshì.","vi":"Đây đúng là một chi tiết nhỏ rất sinh động. Thật ra cảm giác bạn vừa nói, tâm lý học có một lời giải thích rất thú vị."},{"t":243,"zh":"人在小的时候，我们的注意力全都在外面的世界上。","py":"Rén zài xiǎo de shíhou, wǒmen de zhùyìlì quán dōu zài wàimiàn de shìjiè shàng.","vi":"Khi còn nhỏ, sự chú ý của chúng ta đều đặt hết vào thế giới bên ngoài."},{"t":248,"zh":"世界对我们来说太新奇了，有各种各样的游戏、朋友、新鲜的声音，所以我们的能量是向外散发的，我们害怕错过任何外面的事情。","py":"Shìjiè duì wǒmen lái shuō tài xīnqí le, yǒu gèzhǒng-gèyàng de yóuxì, péngyou, xīnxiān de shēngyīn, suǒyǐ wǒmen de néngliàng shì xiàng wài sànfā de, wǒmen hàipà cuòguò rènhé wàimiàn de shìqing.","vi":"Thế giới quá mới lạ với chúng ta, có đủ loại trò chơi, bạn bè, âm thanh mới mẻ, nên năng lượng của chúng ta hướng ra ngoài, và chúng ta sợ bỏ lỡ bất cứ điều gì ở bên ngoài."},{"t":260,"zh":"对，就是那种害怕错过的心情！","py":"Duì, jiùshì nà zhǒng hàipà cuòguò de xīnqíng!","vi":"Đúng, chính là cái cảm giác sợ bỏ lỡ ấy!"},{"t":262,"zh":"但是当我们长大成人，进入社会以后，我们每天要面对很多工作、人际关系和生活压力，我们的精力和能量每天都在被大量消耗。","py":"Dànshì dāng wǒmen zhǎngdà chéngrén, jìnrù shèhuì yǐhòu, wǒmen měitiān yào miànduì hěn duō gōngzuò, rénjì guānxi hé shēnghuó yālì, wǒmen de jīnglì hé néngliàng měitiān dōu zài bèi dàliàng xiāohào.","vi":"Nhưng khi lớn lên, bước vào xã hội, mỗi ngày chúng ta phải đối mặt với nhiều công việc, các mối quan hệ và áp lực cuộc sống, tinh lực và năng lượng của chúng ta bị tiêu hao rất nhiều mỗi ngày."},{"t":274,"zh":"这时候，午睡对你来说，已经不是单纯的\"闭上眼睛\"，它变成了一个小小的避风港。","py":"Zhè shíhou, wǔshuì duì nǐ lái shuō, yǐjīng bú shì dānchún de \"bì shàng yǎnjing\", tā biànchéng le yí ge xiǎoxiǎo de bìfēnggǎng.","vi":"Lúc này, giấc ngủ trưa với bạn không còn đơn thuần là \"nhắm mắt\", mà trở thành một bến trú nhỏ bé."},{"t":281,"zh":"在这个二十分钟里，你不需要回复工作消息，不需要微笑，不需要做任何决定，你只是完完全全地属于你自己。","py":"Zài zhège èrshí fēnzhōng lǐ, nǐ bù xūyào huífù gōngzuò xiāoxi, bù xūyào wēixiào, bù xūyào zuò rènhé juédìng, nǐ zhǐshì wánwán quánquán de shǔyú nǐ zìjǐ.","vi":"Trong hai mươi phút ấy, bạn không cần trả lời tin nhắn công việc, không cần mỉm cười, không cần đưa ra quyết định nào, bạn chỉ hoàn toàn thuộc về chính mình."},{"t":291,"zh":"所以，你不是变了一个人，而是你对\"休息\"的理解变了，你学会了怎么照顾自己的身体和内心。","py":"Suǒyǐ, nǐ bú shì biàn le yí ge rén, ér shì nǐ duì \"xiūxi\" de lǐjiě biàn le, nǐ xuéhuì le zěnme zhàogù zìjǐ de shēntǐ hé nèixīn.","vi":"Vì vậy bạn không phải đã thành người khác, mà là cách bạn hiểu về \"nghỉ ngơi\" đã thay đổi, bạn học được cách chăm sóc cơ thể và tâm hồn mình."},{"t":299,"zh":"你说得太对了。以前我觉得世界在外面，现在我觉得我的能量需要留在里面。","py":"Nǐ shuō de tài duì le. Yǐqián wǒ juéde shìjiè zài wàimiàn, xiànzài wǒ juéde wǒ de néngliàng xūyào liú zài lǐmiàn.","vi":"Bạn nói đúng quá. Trước đây mình thấy thế giới ở bên ngoài, giờ mình thấy năng lượng của mình cần được giữ lại bên trong."},{"t":306,"zh":"而且除了午睡这件事，我最近还发现了另一个特别明显的改变。哦？是什么？快跟我分享一下。","py":"Érqiě chúle wǔshuì zhè jiàn shì, wǒ zuìjìn hái fāxiàn le lìng yí ge tèbié míngxiǎn de gǎibiàn. Ó? Shì shénme? Kuài gēn wǒ fēnxiǎng yíxià.","vi":"Ngoài chuyện ngủ trưa, gần đây mình còn nhận ra một thay đổi rất rõ rệt khác. Ồ? Là gì vậy? Kể mình nghe với."},{"t":314,"zh":"就是关于\"一个人吃饭\"。李明，你上大学或者刚工作的时候，害怕一个人吃饭吗？","py":"Jiùshì guānyú \"yí ge rén chīfàn\". Lǐ Míng, nǐ shàng dàxué huòzhě gāng gōngzuò de shíhou, hàipà yí ge rén chīfàn ma?","vi":"Là chuyện \"ăn cơm một mình\". Lý Minh, hồi bạn học đại học hoặc mới đi làm, bạn có sợ ăn một mình không?","sec":"Ăn một mình: vượt qua hiệu ứng tiêu điểm"},{"t":321,"zh":"让我想想……上学的时候，确实会有一点在意别人的目光。","py":"Ràng wǒ xiǎngxiang... Shàngxué de shíhou, quèshí huì yǒu yìdiǎn zàiyì biérén de mùguāng.","vi":"Để mình nghĩ xem... Hồi đi học, đúng là có hơi để ý ánh mắt của người khác."},{"t":327,"zh":"如果大家都是三五成群一起去食堂，自己一个人坐一张大桌子，好像会觉得有点尴尬。","py":"Rúguǒ dàjiā dōu shì sānwǔ-chéngqún yìqǐ qù shítáng, zìjǐ yí ge rén zuò yì zhāng dà zhuōzi, hǎoxiàng huì juéde yǒudiǎn gāngà.","vi":"Nếu mọi người đều đi căng-tin theo từng nhóm ba bốn người, còn mình ngồi một mình ở cái bàn lớn, thì cảm thấy hơi ngượng."},{"t":335,"zh":"何止是一点点尴尬啊！我读高中的时候，如果哪一天我的好朋友请假没来学校，我甚至宁愿不去食堂吃午饭，或者只去小卖部买个面包躲在教室里吃。","py":"Hézhǐ shì yìdiǎndiǎn gāngà a! Wǒ dú gāozhōng de shíhou, rúguǒ nǎ yì tiān wǒ de hǎo péngyou qǐngjià méi lái xuéxiào, wǒ shènzhì nìngyuàn bú qù shítáng chī wǔfàn, huòzhě zhǐ qù xiǎomàibù mǎi ge miànbāo duǒ zài jiàoshì lǐ chī.","vi":"Đâu chỉ hơi ngượng! Hồi cấp ba, nếu hôm nào bạn thân xin nghỉ không đến trường, mình thậm chí thà không đi căng-tin ăn trưa, hoặc chỉ ra quầy mua ổ bánh mì rồi trốn trong lớp ăn."},{"t":348,"zh":"因为在那个时候的我看来，如果一个人在食堂吃饭，周围的同学可能会觉得：\"你看那个人，怎么总是自己一个人，她是不是没有朋友啊？她是不是性格很奇怪？\"","py":"Yīnwèi zài nà ge shíhou de wǒ kànlái, rúguǒ yí ge rén zài shítáng chīfàn, zhōuwéi de tóngxué kěnéng huì juéde: \"Nǐ kàn nà ge rén, zěnme zǒngshì zìjǐ yí ge rén, tā shì bu shì méiyǒu péngyou a? Tā shì bu shì xìnggé hěn qíguài?\"","vi":"Vì lúc đó mình nghĩ, nếu ăn một mình ở căng-tin, các bạn xung quanh có thể sẽ nghĩ: \"Nhìn người đó kìa, sao cứ ở một mình, có phải không có bạn không? Có phải tính cách kỳ lạ không?\""},{"t":361,"zh":"那种感觉，就像是舞台上的聚光灯突然打在你身上，周围所有人都在看着你、评价你。","py":"Nà zhǒng gǎnjué, jiù xiàng shì wǔtái shàng de jùguāngdēng tūrán dǎ zài nǐ shēnshang, zhōuwéi suǒyǒu rén dōu zài kànzhe nǐ, píngjià nǐ.","vi":"Cảm giác ấy như có ánh đèn sân khấu bỗng chiếu vào bạn, mọi người xung quanh đều nhìn và đánh giá bạn."},{"t":369,"zh":"很多年轻的学生都有这种心理，这其实是一种很正常的社交焦虑。","py":"Hěn duō niánqīng de xuésheng dōu yǒu zhè zhǒng xīnlǐ, zhè qíshí shì yì zhǒng hěn zhèngcháng de shèjiāo jiāolǜ.","vi":"Nhiều học sinh trẻ có tâm lý này, thật ra đó là một kiểu lo âu xã hội rất bình thường."},{"t":374,"zh":"因为在学校那个环境里，集体认同感太重要了。如果不属于任何一个小团体，就好像自己成了一个失败者。","py":"Yīnwèi zài xuéxiào nà ge huánjìng lǐ, jítǐ rèntónggǎn tài zhòngyào le. Rúguǒ bù shǔyú rènhé yí ge xiǎo tuántǐ, jiù hǎoxiàng zìjǐ chéng le yí ge shībàizhě.","vi":"Vì trong môi trường trường học, cảm giác thuộc về tập thể rất quan trọng. Nếu không thuộc về nhóm nhỏ nào, cứ như mình là kẻ thất bại."},{"t":383,"zh":"是的，那种被孤立的恐惧感特别强烈。","py":"Shì de, nà zhǒng bèi gūlì de kǒngjù gǎn tèbié qiángliè.","vi":"Đúng, nỗi sợ bị cô lập ấy rất mạnh mẽ."},{"t":387,"zh":"大学毕业刚开始租房住的时候也是，如果下班去餐馆吃饭，看到别人都是情侣或者一家人，我一个人点一个菜，都觉得服务员看我的眼神好像带着同情，所以我总是匆匆忙忙吃完就走。","py":"Dàxué bìyè gāng kāishǐ zūfáng zhù de shíhou yě shì, rúguǒ xiàbān qù cānguǎn chīfàn, kàndào biérén dōu shì qínglǚ huòzhě yì jiārén, wǒ yí ge rén diǎn yí ge cài, dōu juéde fúwùyuán kàn wǒ de yǎnshén hǎoxiàng dàizhe tóngqíng, suǒyǐ wǒ zǒngshì cōngcōng-mángmáng chīwán jiù zǒu.","vi":"Lúc mới tốt nghiệp đại học đi thuê nhà cũng vậy. Nếu tan làm đi ăn nhà hàng, thấy người khác đều đi theo cặp hay cả gia đình, còn mình gọi một món một mình, mình cảm thấy ánh mắt phục vụ nhìn mình như có chút thương hại, nên lúc nào cũng ăn vội vàng rồi đi."},{"t":403,"zh":"有时候甚至一边吃一边假装看手机，假装自己很忙，假装有人在给我发消息，以此来掩盖自己的不自在。","py":"Yǒu shíhou shènzhì yìbiān chī yìbiān jiǎzhuāng kàn shǒujī, jiǎzhuāng zìjǐ hěn máng, jiǎzhuāng yǒu rén zài gěi wǒ fā xiāoxi, yǐ cǐ lái yǎngài zìjǐ de bú zìzai.","vi":"Có khi còn vừa ăn vừa giả vờ xem điện thoại, giả vờ bận, giả vờ có người đang nhắn tin cho mình, để che giấu sự không thoải mái."},{"t":411,"zh":"那现在的你呢？现在你还会有这种感觉吗？现在？完全相反！","py":"Nà xiànzài de nǐ ne? Xiànzài nǐ hái huì yǒu zhè zhǒng gǎnjué ma? Xiànzài? Wánquán xiāngfǎn!","vi":"Thế còn bạn bây giờ? Giờ bạn còn có cảm giác này không? Bây giờ ư? Hoàn toàn ngược lại!"},{"t":416,"zh":"现在的我，简直爱死了一个人吃饭的时间！","py":"Xiànzài de wǒ, jiǎnzhí àisǐ le yí ge rén chīfàn de shíjiān!","vi":"Bây giờ mình đơn giản là yêu chết đi được những lúc ăn cơm một mình!"},{"t":420,"zh":"哈哈，已经从\"害怕\"变成\"享受\"了。","py":"Hāhā, yǐjīng cóng \"hàipà\" biànchéng \"xiǎngshòu\" le.","vi":"Ha ha, đã từ \"sợ\" chuyển thành \"tận hưởng\" rồi."},{"t":424,"zh":"真的！上周末我自己一个人去了一家我很想吃的拉面馆。","py":"Zhēn de! Shàng zhōumò wǒ zìjǐ yí ge rén qù le yì jiā wǒ hěn xiǎng chī de lāmiànguǎn.","vi":"Thật đấy! Cuối tuần trước mình đi một mình đến một quán ramen mình rất muốn ăn."},{"t":428,"zh":"店里人很多，我就坐在靠墙的小吧台旁边。我戴着耳机，一边听着轻松的音乐，一边看着热气腾腾的拉面端上来。","py":"Diàn lǐ rén hěn duō, wǒ jiù zuò zài kào qiáng de xiǎo bātái pángbiān. Wǒ dàizhe ěrjī, yìbiān tīngzhe qīngsōng de yīnyuè, yìbiān kànzhe rèqì téngténg de lāmiàn duān shànglái.","vi":"Quán rất đông, mình ngồi ở quầy nhỏ cạnh tường. Mình đeo tai nghe, vừa nghe nhạc nhẹ vừa nhìn tô ramen nóng hổi được bưng ra."},{"t":437,"zh":"那一瞬间，我真的觉得太美好了。","py":"Nà yí shùnjiān, wǒ zhēn de juéde tài měihǎo le.","vi":"Khoảnh khắc ấy, mình thật sự thấy quá tuyệt vời."},{"t":440,"zh":"我不必去迁就别人的口味，我想吃什么就吃什么，我想吃得慢一点就吃得慢一点。","py":"Wǒ búbì qù qiānjiù biérén de kǒuwèi, wǒ xiǎng chī shénme jiù chī shénme, wǒ xiǎng chī de màn yìdiǎn jiù chī de màn yìdiǎn.","vi":"Mình không cần chiều theo khẩu vị của người khác, muốn ăn gì thì ăn, muốn ăn chậm một chút thì ăn chậm."},{"t":446,"zh":"我不需要在嚼着食物的时候还要思考该找什么话题跟对方聊天，也不用担心自己吃相好不好看。","py":"Wǒ bù xūyào zài jiáozhe shíwù de shíhou hái yào sīkǎo gāi zhǎo shénme huàtí gēn duìfāng liáotiān, yě búyòng dānxīn zìjǐ chīxiàng hǎo bu hǎokàn.","vi":"Mình không cần vừa nhai vừa nghĩ nên tìm chủ đề gì để nói chuyện với đối phương, cũng không lo dáng ăn của mình đẹp hay không."},{"t":454,"zh":"吃完之后，我还可以安安静静地喝一口汤。","py":"Chīwán zhīhòu, wǒ hái kěyǐ ān'ān jìngjìng de hē yì kǒu tāng.","vi":"Ăn xong, mình còn có thể yên lặng húp một ngụm nước dùng."},{"t":457,"zh":"那一刻，我根本不在乎店里的其他人怎么看我。","py":"Nà yí kè, wǒ gēnběn bú zàihu diàn lǐ de qítā rén zěnme kàn wǒ.","vi":"Khoảnh khắc đó, mình hoàn toàn không để tâm những người khác trong quán nhìn mình thế nào."},{"t":461,"zh":"或者说，我终于明白了，其实根本没有人在看我，大家都在忙着过自己的生活呢！","py":"Huòzhě shuō, wǒ zhōngyú míngbai le, qíshí gēnběn méiyǒu rén zài kàn wǒ, dàjiā dōu zài mángzhe guò zìjǐ de shēnghuó ne!","vi":"Hay nói đúng hơn, cuối cùng mình đã hiểu ra, thật ra chẳng có ai đang nhìn mình cả, ai cũng bận sống cuộc sống của mình!"},{"t":467,"zh":"你这句话说到了最核心的地方，\"其实根本没有人在看我\"。","py":"Nǐ zhè jù huà shuō dào le zuì héxīn de dìfang, \"qíshí gēnběn méiyǒu rén zài kàn wǒ\".","vi":"Câu này của bạn nói trúng chỗ cốt lõi nhất: \"thật ra chẳng có ai đang nhìn mình\"."},{"t":473,"zh":"心理学里有一个词叫\"焦点效应\"。意思是说，我们年轻的时候，总是以为自己是世界的中心，觉得所有人的眼睛都在盯着自己，我们的一举一动都会被别人放大和评价。","py":"Xīnlǐxué lǐ yǒu yí ge cí jiào \"jiāodiǎn xiàoyìng\". Yìsi shì shuō, wǒmen niánqīng de shíhou, zǒngshì yǐwéi zìjǐ shì shìjiè de zhōngxīn, juéde suǒyǒu rén de yǎnjing dōu zài dīngzhe zìjǐ, wǒmen de yìjǔ-yídòng dōu huì bèi biérén fàngdà hé píngjià.","vi":"Tâm lý học có một thuật ngữ gọi là \"hiệu ứng tiêu điểm\". Nghĩa là khi còn trẻ, chúng ta luôn tưởng mình là trung tâm của thế giới, cảm thấy mọi ánh mắt đều đổ dồn vào mình, mọi cử chỉ của mình đều bị người khác phóng đại và đánh giá."},{"t":485,"zh":"没错，小时候总觉得自己是个主角。对，","py":"Méi cuò, xiǎoshíhou zǒng juéde zìjǐ shì ge zhǔjué. Duì,","vi":"Đúng vậy, hồi nhỏ lúc nào cũng thấy mình là nhân vật chính. Ừ,"},{"t":489,"zh":"但随着年龄的增长，经历的事情多了，我们慢慢就会明白两个道理：第一，大部分人其实都只关心他们自己，他们没有那么多的时间和精力去注意一个陌生人是不是一个人在吃饭。","py":"Dàn suízhe niánlíng de zēngzhǎng, jīnglì de shìqing duō le, wǒmen mànmàn jiù huì míngbai liǎng ge dàolǐ: dì yī, dà bùfen rén qíshí dōu zhǐ guānxīn tāmen zìjǐ, tāmen méiyǒu nàme duō de shíjiān hé jīnglì qù zhùyì yí ge mòshēngrén shì bu shì yí ge rén zài chīfàn.","vi":"nhưng khi tuổi tăng lên, trải nghiệm nhiều hơn, dần dần chúng ta sẽ hiểu hai điều. Thứ nhất, phần lớn mọi người chỉ quan tâm đến bản thân họ, họ không có nhiều thời gian và sức lực để chú ý một người lạ có đang ăn một mình hay không."},{"t":502,"zh":"第二，也是更重要的一点，","py":"Dì èr, yě shì gèng zhòngyào de yì diǎn,","vi":"Thứ hai, và quan trọng hơn,"},{"t":504,"zh":"我们开始学会把评价自己的权利，从别人手里收回到自己手里。","py":"Wǒmen kāishǐ xuéhuì bǎ píngjià zìjǐ de quánlì, cóng biérén shǒu lǐ shōuhuí dào zìjǐ shǒu lǐ.","vi":"Chúng ta bắt đầu học cách lấy lại quyền đánh giá bản thân từ tay người khác về tay mình."},{"t":508,"zh":"把评价自己的权利收回来？这个说法很特别。","py":"Bǎ píngjià zìjǐ de quánlì shōu huílái? Zhège shuōfǎ hěn tèbié.","vi":"Lấy lại quyền đánh giá bản thân sao? Cách nói này thật đặc biệt."},{"t":512,"zh":"是的。年轻的时候，我们特别需要别人的肯定。别人觉得我们合群，我们才觉得自己是正常的；别人觉得我们受欢迎，我们才觉得自己是有价值的。","py":"Shì de. Niánqīng de shíhou, wǒmen tèbié xūyào biérén de kěndìng. Biérén juéde wǒmen héqún, wǒmen cái juéde zìjǐ shì zhèngcháng de; biérén juéde wǒmen shòu huānyíng, wǒmen cái juéde zìjǐ shì yǒu jiàzhí de.","vi":"Đúng. Khi còn trẻ, chúng ta đặc biệt cần sự công nhận của người khác. Người khác thấy mình hòa nhập thì mình mới thấy mình bình thường; người khác thấy mình được yêu mến thì mình mới thấy mình có giá trị."},{"t":523,"zh":"但是随着一年又一年的成长，你经历过很多快乐，也经历过很多挫折，你开始看清楚自己真正需要的是什么。","py":"Dànshì suízhe yì nián yòu yì nián de chéngzhǎng, nǐ jīnglì guo hěn duō kuàilè, yě jīnglì guo hěn duō cuòzhé, nǐ kāishǐ kàn qīngchu zìjǐ zhēnzhèng xūyào de shì shénme.","vi":"Nhưng theo từng năm trưởng thành, bạn trải qua nhiều niềm vui, cũng trải qua nhiều thất bại, bạn bắt đầu nhìn rõ mình thật sự cần gì."},{"t":531,"zh":"你发现，别人的眼光其实不能给你真正的饱腹感，也不能给你内心的平静。","py":"Nǐ fāxiàn, biérén de yǎnguāng qíshí bù néng gěi nǐ zhēnzhèng de bǎofù gǎn, yě bù néng gěi nǐ nèixīn de píngjìng.","vi":"Bạn nhận ra ánh mắt của người khác thật ra không thể làm bạn no thật sự, cũng không thể cho bạn sự bình yên trong lòng."},{"t":537,"zh":"那一碗热腾腾的拉面好不好吃，只有你自己的舌头和胃知道。","py":"Nà yì wǎn rè téngténg de lāmiàn hǎo bu hǎochī, zhǐyǒu nǐ zìjǐ de shétou hé wèi zhīdào.","vi":"Tô ramen nóng hổi đó ngon hay không, chỉ có lưỡi và dạ dày của chính bạn biết."},{"t":542,"zh":"这时候，你就不再需要用\"我有很多朋友陪我吃饭\"来向全世界证明你过得好了。","py":"Zhè shíhou, nǐ jiù bú zài xūyào yòng \"wǒ yǒu hěn duō péngyou péi wǒ chīfàn\" lái xiàng quán shìjiè zhèngmíng nǐ guò de hǎo le.","vi":"Lúc này, bạn không còn cần dùng câu \"tôi có nhiều bạn cùng ăn cơm\" để chứng minh với cả thế giới rằng mình sống tốt nữa."},{"t":548,"zh":"听你这么一分析，我突然觉得心里暖洋洋的。原来我不是变得冷漠了，或者变得不合群了，而是我变得更加自信和自由了。","py":"Tīng nǐ zhème yì fēnxī, wǒ tūrán juéde xīnlǐ nuǎnyángyáng de. Yuánlái wǒ bú shì biàn de lěngmò le, huòzhě biàn de bù héqún le, ér shì wǒ biàn de gèngjiā zìxìn hé zìyóu le.","vi":"Nghe bạn phân tích vậy, bỗng nhiên mình thấy ấm lòng. Hóa ra mình không phải trở nên lạnh nhạt hay lạc lõng, mà là mình trở nên tự tin và tự do hơn."},{"t":557,"zh":"毫无疑问，这就是真正的自由。","py":"Háo wú yíwèn, zhè jiù shì zhēnzhèng de zìyóu.","vi":"Không nghi ngờ gì nữa, đây chính là tự do thật sự."},{"t":560,"zh":"所谓成熟，很多时候并不是指你赚了多少钱，或者你有多大的权力，而是你终于可以在独处的时候，感到深深的舒适和安全。","py":"Suǒwèi chéngshú, hěn duō shíhou bìng bú shì zhǐ nǐ zhuàn le duōshao qián, huòzhě nǐ yǒu duō dà de quánlì, ér shì nǐ zhōngyú kěyǐ zài dúchǔ de shíhou, gǎndào shēnshēn de shūshì hé ānquán.","vi":"Cái gọi là trưởng thành, nhiều khi không phải là bạn kiếm được bao nhiêu tiền hay có bao nhiêu quyền lực, mà là cuối cùng bạn có thể cảm thấy thoải mái và an toàn sâu sắc khi ở một mình."},{"t":570,"zh":"独处真的成了一种高级的享受。","py":"Dúchǔ zhēn de chéng le yì zhǒng gāojí de xiǎngshòu.","vi":"Ở một mình thật sự đã trở thành một thú vui cao cấp."},{"t":573,"zh":"其实说起来，不仅是午睡和一个人吃饭，我发现这几年，自己在很多日常的小习惯上，都在悄悄发生改变。","py":"Qíshí shuō qǐlái, bùjǐn shì wǔshuì hé yí ge rén chīfàn, wǒ fāxiàn zhè jǐ nián, zìjǐ zài hěn duō rìcháng de xiǎo xíguàn shàng, dōu zài qiāoqiāo fāshēng gǎibiàn.","vi":"Thật ra không chỉ ngủ trưa và ăn một mình, mình thấy mấy năm nay, nhiều thói quen nhỏ hằng ngày của mình đều đang lặng lẽ thay đổi.","sec":"Thoải mái hơn sĩ diện: ý nghĩa thật của 养生"},{"t":582,"zh":"比如以前买衣服，只要好看、显瘦、拍照上镜，哪怕那件衣服料子特别硬、穿着特别不舒服，甚至高跟鞋把脚磨破了皮，我也觉得无所谓，觉得为了漂亮这一切都是值得的。","py":"Bǐrú yǐqián mǎi yīfu, zhǐyào hǎokàn, xiǎn shòu, pāizhào shàng jìng, nǎpà nà jiàn yīfu liàozi tèbié yìng, chuānzhe tèbié bù shūfu, shènzhì gāogēnxié bǎ jiǎo mó pò le pí, wǒ yě juéde wúsuǒwèi, juéde wèile piàoliang zhè yíqiè dōu shì zhídé de.","vi":"Ví dụ trước đây mua quần áo, chỉ cần đẹp, làm mình trông gầy, chụp ảnh lên hình, dù vải rất cứng, mặc rất khó chịu, thậm chí giày cao gót cọ trầy cả da chân, mình cũng thấy không sao, thấy vì đẹp thì tất cả đều đáng."},{"t":596,"zh":"但是现在呢？我买衣服只看两点：第一是舒服，第二是面料柔软。","py":"Dànshì xiànzài ne? Wǒ mǎi yīfu zhǐ kàn liǎng diǎn: dì yī shì shūfu, dì èr shì miànliào róuruǎn.","vi":"Nhưng bây giờ thì sao? Mua quần áo mình chỉ xem hai điều: thứ nhất là thoải mái, thứ hai là chất vải mềm."},{"t":602,"zh":"高跟鞋早就被我收进箱子里了，我现在鞋柜里全是平底鞋和运动鞋。","py":"Gāogēnxié zǎo jiù bèi wǒ shōu jìn xiāngzi lǐ le, wǒ xiànzài xiéguì lǐ quán shì píngdǐxié hé yùndòngxié.","vi":"Giày cao gót mình đã cất vào hộp từ lâu, tủ giày bây giờ toàn là giày bệt và giày thể thao."},{"t":608,"zh":"这就是大家常说的\"成年人的妥协\"，但这其实不是妥协，是对自己身体的尊重。","py":"Zhè jiù shì dàjiā cháng shuō de \"chéngniánrén de tuǒxié\", dàn zhè qíshí bú shì tuǒxié, shì duì zìjǐ shēntǐ de zūnzhòng.","vi":"Đây là cái mọi người hay gọi là \"sự nhượng bộ của người trưởng thành\", nhưng thật ra không phải nhượng bộ, mà là sự tôn trọng cơ thể của chính mình."},{"t":615,"zh":"我也一样，我记得我二十岁出头的时候，冬天为了看起来帅气，里面只穿一件薄薄的衬衫，外面套一件大衣，在寒风中冻得发抖，还要装出一副一点都不冷的样子。","py":"Wǒ yě yíyàng, wǒ jìde wǒ èrshí suì chūtóu de shíhou, dōngtiān wèile kàn qǐlái shuàiqì, lǐmiàn zhǐ chuān yí jiàn báobáo de chènshān, wàimiàn tào yí jiàn dàyī, zài hánfēng zhōng dòng de fādǒu, hái yào zhuāng chū yí fù yìdiǎn dōu bù lěng de yàngzi.","vi":"Mình cũng vậy, mình nhớ hồi hai mươi mấy tuổi, mùa đông để trông cho phong độ, bên trong chỉ mặc một chiếc sơ mi mỏng, bên ngoài khoác áo măng-tô, run cầm cập trong gió lạnh mà vẫn làm ra vẻ chẳng lạnh chút nào."},{"t":627,"zh":"典型的\"为了风度不要温度\"！对，那时候觉得穿羽绒服、穿秋裤是一件特别老土的事情。","py":"Diǎnxíng de \"wèile fēngdù búyào wēndù\"! Duì, nà shíhou juéde chuān yǔróngfú, chuān qiūkù shì yí jiàn tèbié lǎotǔ de shìqing.","vi":"Đúng kiểu \"cần phong độ chứ không cần ấm\"! Đúng, hồi đó mình thấy mặc áo lông vũ, mặc quần giữ nhiệt là chuyện quê mùa."},{"t":634,"zh":"可是现在到了冬天，天刚有一点点凉，不需要任何人提醒，我自己就会主动把最厚的羽绒服翻出来，甚至早早地穿上了秋裤。","py":"Kěshì xiànzài dào le dōngtiān, tiān gāng yǒu yìdiǎndiǎn liáng, bù xūyào rènhé rén tíxǐng, wǒ zìjǐ jiù huì zhǔdòng bǎ zuì hòu de yǔróngfú fān chūlái, shènzhì zǎozǎo de chuān shàng le qiūkù.","vi":"Nhưng bây giờ đến mùa đông, trời mới se lạnh một chút, không cần ai nhắc, mình tự lôi chiếc áo lông vũ dày nhất ra, thậm chí mặc quần giữ nhiệt từ sớm."},{"t":644,"zh":"而且，我桌上的饮料，以前全是冰可乐、冰咖啡，现在也慢慢变成了温水和热茶。","py":"Érqiě, wǒ zhuō shàng de yǐnliào, yǐqián quán shì bīng kělè, bīng kāfēi, xiànzài yě mànmàn biànchéng le wēnshuǐ hé rè chá.","vi":"Với lại, đồ uống trên bàn mình trước đây toàn là cola đá, cà phê đá, giờ cũng dần chuyển thành nước ấm và trà nóng."},{"t":648,"zh":"哎，李明，你这也太符合中国人说的\"养生\"了吧！","py":"Āi, Lǐ Míng, nǐ zhè yě tài fúhé Zhōngguórén shuō de \"yǎngshēng\" le ba!","vi":"Ôi, Lý Minh, thế này quá hợp với cái mà người Trung Quốc gọi là \"dưỡng sinh\" rồi!"},{"t":655,"zh":"确实是这样。很多外国朋友学中文的时候，经常听到\"养生\"这个词，可能会觉得这是一种老年人的生活方式，或者觉得这只是喝喝枸杞水、泡泡脚。","py":"Quèshí shì zhèyàng. Hěn duō wàiguó péngyou xué Zhōngwén de shíhou, jīngcháng tīngdào \"yǎngshēng\" zhège cí, kěnéng huì juéde zhè shì yì zhǒng lǎoniánrén de shēnghuó fāngshì, huòzhě juéde zhè zhǐshì hēhe gǒuqǐ shuǐ, pàopao jiǎo.","vi":"Đúng vậy. Nhiều bạn nước ngoài khi học tiếng Trung hay nghe từ \"dưỡng sinh\", có thể nghĩ đó là lối sống của người già, hoặc chỉ là uống nước kỷ tử, ngâm chân."},{"t":665,"zh":"但其实在中国文化里，\"养生\"的深层含义，是一种顺应自然、懂得珍惜和保护自己生命力量的生活态度。","py":"Dàn qíshí zài Zhōngguó wénhuà lǐ, \"yǎngshēng\" de shēncéng hányì, shì yì zhǒng shùnyìng zìrán, dǒngde zhēnxī hé bǎohù zìjǐ shēngmìng lìliàng de shēnghuó tàidù.","vi":"Nhưng thật ra trong văn hóa Trung Hoa, ý nghĩa sâu xa của \"dưỡng sinh\" là một thái độ sống thuận theo tự nhiên, biết trân trọng và bảo vệ sinh lực của chính mình."},{"t":675,"zh":"年轻的时候，我们觉得自己身体好，有用不完的力气和健康，所以我们随意挥霍；长大之后，我们意识到身体是我们在世界上生活唯一的依靠，照顾好它，是一种对自己负责的成熟。","py":"Niánqīng de shíhou, wǒmen juéde zìjǐ shēntǐ hǎo, yǒu yòng bu wán de lìqi hé jiànkāng, suǒyǐ wǒmen suíyì huīhuò; zhǎngdà zhīhòu, wǒmen yìshí dào shēntǐ shì wǒmen zài shìjiè shàng shēnghuó wéiyī de yīkào, zhàogù hǎo tā, shì yì zhǒng duì zìjǐ fùzé de chéngshú.","vi":"Khi còn trẻ, chúng ta thấy mình khỏe, có sức lực và sức khỏe dùng không hết, nên tùy ý phung phí; lớn lên, chúng ta nhận ra cơ thể là chỗ dựa duy nhất để sống trên đời, chăm sóc tốt nó là một sự trưởng thành biết chịu trách nhiệm với bản thân."},{"t":689,"zh":"我完全同意。而且我觉得这种成熟，不仅体现在对身体的态度上，还体现在我们对待他人、对待矛盾的心态上。","py":"Wǒ wánquán tóngyì. Érqiě wǒ juéde zhè zhǒng chéngshú, bùjǐn tǐxiàn zài duì shēntǐ de tàidu shàng, hái tǐxiàn zài wǒmen duìdài tārén, duìdài máodùn de xīntài shàng.","vi":"Mình hoàn toàn đồng ý. Và mình thấy sự trưởng thành này không chỉ thể hiện ở thái độ với cơ thể, mà còn ở cách chúng ta đối xử với người khác và xử lý mâu thuẫn."},{"t":699,"zh":"你以前是个容易跟别人争论的人吗？坦白讲，以前是的。","py":"Nǐ yǐqián shì ge róngyì gēn biérén zhēnglùn de rén ma? Tǎnbái jiǎng, yǐqián shì de.","vi":"Trước đây bạn có hay tranh cãi với người khác không? Nói thật thì, trước đây là có."},{"t":704,"zh":"年轻的时候，胜负心特别强。如果在网上看到一个观点跟我不同，或者在工作中跟同事有分歧，我一定要跟对方争个高低，非要说服对方不可。","py":"Niánqīng de shíhou, shèngfùxīn tèbié qiáng. Rúguǒ zài wǎngshàng kàndào yí ge guāndiǎn gēn wǒ bù tóng, huòzhě zài gōngzuò zhōng gēn tóngshì yǒu fēnqí, wǒ yídìng yào gēn duìfāng zhēng ge gāodī, fēi yào shuōfú duìfāng bùkě.","vi":"Hồi trẻ, tính hiếu thắng của mình rất mạnh. Nếu thấy trên mạng có quan điểm khác mình, hoặc bất đồng với đồng nghiệp trong công việc, mình nhất định phải phân cao thấp với đối phương, nhất định phải thuyết phục được họ."},{"t":714,"zh":"我觉得真理只有一个，那就是我坚持的那个。","py":"Wǒ juéde zhēnlǐ zhǐyǒu yí ge, nà jiù shì wǒ jiānchí de nà ge.","vi":"Mình thấy chân lý chỉ có một, đó là điều mình kiên trì."},{"t":718,"zh":"如果争论输了，我能生一整天的闷气，晚上躺在床上还要复盘：\"哎呀，我刚才那句话应该这么说，这样就能把他反驳回去了！\"","py":"Rúguǒ zhēnglùn shū le, wǒ néng shēng yì zhěng tiān de mènqì, wǎnshang tǎng zài chuáng shàng hái yào fùpán: \"Āiyā, wǒ gāngcái nà jù huà yīnggāi zhème shuō, zhèyàng jiù néng bǎ tā fǎnbó huíqù le!\"","vi":"Nếu tranh luận thua, mình có thể hờn dỗi cả ngày, tối nằm trên giường còn phải nghĩ lại: \"Ôi, câu vừa rồi lẽ ra mình phải nói thế này, như vậy là có thể phản bác lại anh ta rồi!\""},{"t":727,"zh":"太真实了！我们都有过这种在脑子里跟别人吵架的经历。那现在呢？现在的你如果遇到不同意见，会怎么样？","py":"Tài zhēnshí le! Wǒmen dōu yǒu guo zhè zhǒng zài nǎozi lǐ gēn biérén chǎojià de jīnglì. Nà xiànzài ne? Xiànzài de nǐ rúguǒ yùdào bùtóng yìjiàn, huì zěnmeyàng?","vi":"Quá thật! Ai trong chúng ta cũng từng có trải nghiệm cãi nhau với người khác ngay trong đầu. Thế còn bây giờ? Nếu gặp ý kiến khác, bạn sẽ thế nào?"},{"t":735,"zh":"现在如果别人跟我意见不合，只要不涉及原则问题或者严重的工作底线，我大部分时候只会微笑着说一句：\"嗯，你说的也有道理。\"或者在心里对自己说一句：\"好吧，你开心就好。\"","py":"Xiànzài rúguǒ biérén gēn wǒ yìjiàn bù hé, zhǐyào bù shèjí yuánzé wèntí huòzhě yánzhòng de gōngzuò dǐxiàn, wǒ dà bùfen shíhou zhǐ huì wēixiàozhe shuō yí jù: \"Èn, nǐ shuō de yě yǒu dàolǐ.\" Huòzhě zài xīnlǐ duì zìjǐ shuō yí jù: \"Hǎo ba, nǐ kāixīn jiù hǎo.\"","vi":"Bây giờ nếu người khác không hợp ý mình, miễn là không đụng đến vấn đề nguyên tắc hay giới hạn công việc nghiêm trọng, phần lớn thời gian mình chỉ mỉm cười nói: \"Ừm, bạn nói cũng có lý.\" Hoặc thầm nói với mình: \"Thôi được, bạn vui là được.\""},{"t":748,"zh":"哈哈，\"你开心就好\"！这真的是成年人最温柔也最强大的防御武器了。","py":"Hāhā, \"nǐ kāixīn jiù hǎo\"! Zhè zhēn de shì chéngniánrén zuì wēnróu yě zuì qiángdà de fángyù wǔqì le.","vi":"Ha ha, \"bạn vui là được\"! Đây thật sự là vũ khí phòng thủ dịu dàng nhất và mạnh nhất của người trưởng thành."},{"t":753,"zh":"没错。因为我逐渐明白了，每个人的成长背景、生活经历、看问题的角度都完全不同。世界上很多事情本来就没有绝对的对和错。","py":"Méi cuò. Yīnwèi wǒ zhújiàn míngbai le, měi ge rén de chéngzhǎng bèijǐng, shēnghuó jīnglì, kàn wèntí de jiǎodù dōu wánquán bù tóng. Shìjiè shàng hěn duō shìqing běnlái jiù méiyǒu juéduì de duì hé cuò.","vi":"Đúng thế. Vì mình dần hiểu ra rằng hoàn cảnh lớn lên, trải nghiệm sống và góc nhìn của mỗi người đều hoàn toàn khác nhau. Nhiều việc trên đời vốn không có đúng sai tuyệt đối."},{"t":765,"zh":"而且，人的观念是很难被一场争论改变的。与其花两个小时去跟一个不同频道的人争论得面红耳赤、心情糟糕，不如把这宝贵的时间省下来，去读半本书，或者去公园散个步。","py":"Érqiě, rén de guānniàn shì hěn nán bèi yì chǎng zhēnglùn gǎibiàn de. Yǔqí huā liǎng ge xiǎoshí qù gēn yí ge bù tóng píndào de rén zhēnglùn de miànhóng-ěrchì, xīnqíng zāogāo, bùrú bǎ zhè bǎoguì de shíjiān shěng xiàlái, qù dú bàn běn shū, huòzhě qù gōngyuán sàn ge bù.","vi":"Hơn nữa, quan điểm của một người rất khó thay đổi chỉ bằng một cuộc tranh luận. Thay vì dành hai tiếng cãi đến đỏ mặt tía tai, tâm trạng tồi tệ với một người không cùng tần số, chi bằng tiết kiệm thời gian quý giá này, đọc nửa cuốn sách hoặc ra công viên đi dạo."},{"t":780,"zh":"这就是我们常说的\"不再内耗\"了吧。","py":"Zhè jiù shì wǒmen cháng shuō de \"bú zài nèihào\" le ba.","vi":"Đây chính là cái ta hay gọi là \"không còn tự hao mòn nội tâm\" nhỉ."},{"t":783,"zh":"是的。我们常说的\"内耗\"，就是把宝贵的心理能量浪费在无意义的抵抗和纠缠中。成熟的一个重要标志，就是我们学会了给自己的情绪做\"减法\"。","py":"Shì de. Wǒmen cháng shuō de \"nèihào\", jiùshì bǎ bǎoguì de xīnlǐ néngliàng làngfèi zài wú yìyì de dǐkàng hé jiūchán zhōng. Chéngshú de yí ge zhòngyào biāozhì, jiùshì wǒmen xuéhuì le gěi zìjǐ de qíngxù zuò \"jiǎnfǎ\".","vi":"Đúng. Cái ta hay gọi là \"nội hao\" là lãng phí năng lượng tinh thần quý giá vào những việc chống đối và vướng mắc vô nghĩa. Một dấu hiệu quan trọng của sự trưởng thành là ta học cách làm \"phép trừ\" với cảm xúc của mình."},{"t":795,"zh":"我们开始明白，世界不是围着我们转的，我们改变不了别人，我们唯一能真正掌控的，只有我们自己的心情和反应。","py":"Wǒmen kāishǐ míngbai, shìjiè bú shì wéizhe wǒmen zhuàn de, wǒmen gǎibiàn bù liǎo biérén, wǒmen wéiyī néng zhēnzhèng zhǎngkòng de, zhǐyǒu wǒmen zìjǐ de xīnqíng hé fǎnyìng.","vi":"Chúng ta bắt đầu hiểu rằng thế giới không xoay quanh mình, ta không thể thay đổi người khác, thứ duy nhất ta thật sự kiểm soát được chỉ là tâm trạng và phản ứng của chính mình."},{"t":803,"zh":"听你说了这么多，我突然想到了一个很有画面的比喻。什么比喻？说来听听。","py":"Tīng nǐ shuō le zhème duō, wǒ tūrán xiǎngdào le yí ge hěn yǒu huàmiàn de bǐyù. Shénme bǐyù? Shuō lái tīngting.","vi":"Nghe bạn nói nhiều như vậy, mình bỗng nghĩ ra một phép ví von rất có hình ảnh. Ví von gì? Nói nghe thử."},{"t":809,"zh":"我觉得，一个人的成长，并不像我们小时候看电影那样，突然有一天发生了一场天大的灾难，或者发生了一件轰轰烈烈的大事，然后主角突然在一夜之间就变成了大人。","py":"Wǒ juéde, yí ge rén de chéngzhǎng, bìng bú xiàng wǒmen xiǎoshíhou kàn diànyǐng nàyàng, tūrán yǒu yì tiān fāshēng le yì chǎng tiān dà de zāinàn, huòzhě fāshēng le yí jiàn hōnghōng-lièliè de dàshì, ránhòu zhǔjué tūrán zài yí yè zhījiān jiù biànchéng le dàren.","vi":"Mình thấy sự trưởng thành của một người không giống như phim ảnh hồi nhỏ ta xem, tự dưng một ngày xảy ra thảm họa kinh thiên hay một sự kiện ầm ầm sóng gió, rồi nhân vật chính qua một đêm biến thành người lớn.","sec":"Phép ví von dòng sông: chấm dứt nội hao (内耗)"},{"t":824,"zh":"它其实更像是一条小溪流向大海的过程。","py":"Tā qíshí gèng xiàng shì yì tiáo xiǎoxī liú xiàng dàhǎi de guòchéng.","vi":"Nó thật ra giống quá trình một con suối nhỏ chảy ra biển hơn."},{"t":828,"zh":"小溪在一开始的时候，水流很急，遇到小石头就会激起很大的水花，发出很大的声响，它特别想向世界证明自己的存在，冲劲特别大。","py":"Xiǎoxī zài yì kāishǐ de shíhou, shuǐliú hěn jí, yùdào xiǎo shítou jiù huì jīqǐ hěn dà de shuǐhuā, fāchū hěn dà de shēngxiǎng, tā tèbié xiǎng xiàng shìjiè zhèngmíng zìjǐ de cúnzài, chōngjìn tèbié dà.","vi":"Lúc đầu con suối chảy rất xiết, gặp hòn đá nhỏ là bắn tung bọt nước, phát ra tiếng động lớn, nó rất muốn chứng minh sự tồn tại của mình với thế giới, xung lực rất mạnh."},{"t":838,"zh":"这个比喻非常美。水流虽然急，但是很容易受阻。对！","py":"Zhège bǐyù fēicháng měi. Shuǐliú suīrán jí, dànshì hěn róngyì shòu zǔ. Duì!","vi":"Phép ví von này đẹp quá. Dòng nước tuy xiết nhưng rất dễ bị cản. Đúng!"},{"t":845,"zh":"但是慢慢地，这条小溪往前流，容纳了更多的泥沙和水流，它变得越来越宽，越来越深，最后变成了一条平稳的大河。","py":"Dànshì mànmàn de, zhè tiáo xiǎoxī wǎng qián liú, róngnà le gèng duō de nísha hé shuǐliú, tā biàn de yuè lái yuè kuān, yuè lái yuè shēn, zuìhòu biànchéng le yì tiáo píngwěn de dàhé.","vi":"Nhưng dần dần, con suối chảy về phía trước, chứa thêm nhiều phù sa và dòng nước, nó ngày càng rộng, ngày càng sâu, cuối cùng thành một dòng sông lớn êm đềm."},{"t":855,"zh":"当石头再掉进大河里的时候，它不会再大惊小怪地激起漫天的水花，而是平静地泛起几圈涟漪，然后轻轻地把石头包裹在水底，继续平静而坚定地向前流淌。","py":"Dāng shítou zài diào jìn dàhé lǐ de shíhou, tā bú huì zài dàjīng-xiǎoguài de jīqǐ màntiān de shuǐhuā, ér shì píngjìng de fàn qǐ jǐ quān liányī, ránhòu qīngqīng de bǎ shítou bāoguǒ zài shuǐdǐ, jìxù píngjìng ér jiāndìng de xiàng qián liútǎng.","vi":"Khi hòn đá lại rơi xuống dòng sông lớn, nó không còn làm ầm ĩ bắn tung nước nữa, mà lặng lẽ gợn lên vài vòng sóng, rồi nhẹ nhàng bao bọc hòn đá dưới đáy nước, tiếp tục trôi về phía trước, bình thản và vững vàng."},{"t":870,"zh":"那些午睡的习惯、一个人吃饭的自在、穿舒服衣服的踏实、面对争吵时的平静，其实就是那条大河包容生活的方式。","py":"Nàxiē wǔshuì de xíguàn, yí ge rén chīfàn de zìzai, chuān shūfu yīfu de tāshi, miànduì zhēngchǎo shí de píngjìng, qíshí jiùshì nà tiáo dàhé bāoróng shēnghuó de fāngshì.","vi":"Những thói quen ngủ trưa, sự thoải mái khi ăn một mình, sự vững lòng khi mặc đồ dễ chịu, sự bình tĩnh khi đối diện cãi vã, thật ra chính là cách dòng sông lớn ấy bao dung cuộc sống."},{"t":880,"zh":"这个比喻真的太棒了。它准确地表达出了那种\"静悄悄的改变\"。","py":"Zhège bǐyù zhēn de tài bàng le. Tā zhǔnquè de biǎodá chū le nà zhǒng \"jìng qiāoqiāo de gǎibiàn\".","vi":"Vương Vũ, phép ví von này thật tuyệt. Nó diễn tả chính xác kiểu \"thay đổi lặng lẽ\" đó."},{"t":887,"zh":"很多时候，我们甚至感觉不到自己在变。你今天早上照镜子，觉得自己的脸跟昨天一模一样；你今天去上班，走的路跟昨天也一模一样。但是，就在这日复一日的琐碎生活里，那些看似微不足道的选择，慢慢塑造了一个全新的你。","py":"Hěn duō shíhou, wǒmen shènzhì gǎnjué bù dào zìjǐ zài biàn. Nǐ jīntiān zǎoshang zhào jìngzi, juéde zìjǐ de liǎn gēn zuótiān yìmú yíyàng; nǐ jīntiān qù shàngbān, zǒu de lù gēn zuótiān yě yìmú yíyàng. Dànshì, jiù zài zhè rìfù-yírì de suǒsuì shēnghuó lǐ, nàxiē kànsì wēi bù zú dào de xuǎnzé, mànmàn sùzào le yí ge quánxīn de nǐ.","vi":"Nhiều lúc, chúng ta thậm chí không cảm thấy mình đang thay đổi. Sáng nay soi gương, thấy mặt mình y hệt hôm qua; hôm nay đi làm, con đường đi cũng y hệt hôm qua. Nhưng chính trong cuộc sống vụn vặt ngày này qua ngày khác, những lựa chọn tưởng như nhỏ bé ấy từ từ nhào nặn nên một con người hoàn toàn mới."},{"t":905,"zh":"不过李明，我有时候也会听到一些身边的朋友，包括一些在学习中文的年轻听众表达过一种迷茫。","py":"Búguò Lǐ Míng, wǒ yǒu shíhou yě huì tīngdào yìxiē shēnbiān de péngyou, bāokuò yìxiē zài xuéxí Zhōngwén de niánqīng tīngzhòng biǎodá guo yì zhǒng mímáng.","vi":"Nhưng Lý Minh này, đôi khi mình cũng nghe một số bạn bè xung quanh,"},{"t":913,"zh":"他们会问：\"如果我们变得越来越平静，越来越不争不抢，越来越喜欢一个人待着，这会不会说明我们正在变得麻木？\"","py":"Tāmen huì wèn: \"Rúguǒ wǒmen biàn de yuè lái yuè píngjìng, yuè lái yuè bù zhēng bù qiǎng, yuè lái yuè xǐhuan yí ge rén dāizhe, zhè huì bu huì shuōmíng wǒmen zhèngzài biàn de mámù?\"","vi":"kể cả vài thính giả trẻ đang học tiếng Trung, bày tỏ một sự hoang mang. Họ hỏi: \"Nếu chúng ta ngày càng bình lặng, ngày càng không tranh không giành, ngày càng thích ở một mình, điều đó có nghĩa là chúng ta đang trở nên tê liệt không?\""},{"t":922,"zh":"\"或者说，我们是不是失去了年轻时的那种热情和理想？我们是不是变成了自己小时候最讨厌的那种无聊的大人？\"","py":"\"Huòzhě shuō, wǒmen shì bu shì shīqù le niánqīng shí de nà zhǒng rèqíng hé lǐxiǎng? Wǒmen shì bu shì biànchéng le zìjǐ xiǎoshíhou zuì tǎoyàn de nà zhǒng wúliáo de dàren?\"","vi":"\"Hay nói cách khác, có phải chúng ta đã mất đi nhiệt huyết và lý tưởng thời trẻ? Có phải chúng ta đã thành kiểu người lớn nhàm chán mà hồi nhỏ mình ghét nhất?\""},{"t":931,"zh":"这是一个非常深刻而且非常真实的困惑。我相信很多人在二十多岁或者三十岁的时候，都会在心里问过自己这个问题。","py":"Zhè shì yí ge fēicháng shēnkè érqiě fēicháng zhēnshí de kùnhuò. Wǒ xiāngxìn hěn duō rén zài èrshí duō suì huòzhě sānshí suì de shíhou, dōu huì zài xīnlǐ wèn guo zìjǐ zhège wèntí.","vi":"Đây là một nỗi băn khoăn rất sâu sắc và rất thật. Mình tin nhiều người ở tuổi hai mươi mấy hay ba mươi đều từng tự hỏi mình câu này trong lòng."},{"t":941,"zh":"但是我想对有这种担忧的朋友说：平静，绝对不等于麻木；接受现实，也绝对不等于放弃生活。","py":"Dànshì wǒ xiǎng duì yǒu zhè zhǒng dānyōu de péngyou shuō: Píngjìng, juéduì bù děngyú mámù; jiēshòu xiànshí, yě juéduì bù děngyú fàngqì shēnghuó.","vi":"Nhưng mình muốn nói với những bạn có nỗi lo này: bình tĩnh tuyệt đối không đồng nghĩa với tê liệt, chấp nhận thực tế cũng tuyệt đối không đồng nghĩa với từ bỏ cuộc sống."},{"t":949,"zh":"那这两者的区别是什么呢？","py":"Nà zhè liǎng zhě de qūbié shì shénme ne?","vi":"Vậy hai điều đó khác nhau ở đâu?"},{"t":951,"zh":"麻木，是因为害怕痛苦而关闭了自己的感受，对世界失去了好奇心，不再爱任何人，也不再爱自己，只是机械地活着。","py":"Mámù, shì yīnwèi hàipà tòngkǔ ér guānbì le zìjǐ de gǎnshòu, duì shìjiè shīqù le hàoqíxīn, bú zài ài rènhé rén, yě bú zài ài zìjǐ, zhǐshì jīxiè de huózhe.","vi":"Tê liệt là vì sợ đau khổ mà đóng cửa cảm xúc của mình, mất đi sự tò mò với thế giới, không còn yêu ai, cũng không còn yêu bản thân, chỉ sống một cách máy móc."},{"t":961,"zh":"但是我们刚才说的这种平静，恰恰是因为我们更懂得爱了。我们不仅依然对生活中的美好保持着敏感，比如一顿好吃的饭、一个温暖的午后、一本好书，更重要的是，我们学会了用一种更宽容、更温柔的态度去面对这个并不完美的世界，面对并不完美的自己。","py":"Dànshì wǒmen gāngcái shuō de zhè zhǒng píngjìng, qiàqià shì yīnwèi wǒmen gèng dǒngde ài le. Wǒmen bùjǐn yīrán duì shēnghuó zhōng de měihǎo bǎochízhe mǐngǎn, bǐrú yí dùn hǎochī de fàn, yí ge wēnnuǎn de wǔhòu, yì běn hǎo shū, gèng zhòngyào de shì, wǒmen xuéhuì le yòng yì zhǒng gèng kuānróng, gèng wēnróu de tàidu qù miànduì zhège bìng bù wánměi de shìjiè, miànduì bìng bù wánměi de zìjǐ.","vi":"Còn sự bình tĩnh chúng ta vừa nói chính là vì ta hiểu yêu thương hơn. Ta không chỉ vẫn nhạy cảm với những điều đẹp trong cuộc sống, như một bữa ăn ngon, một buổi chiều ấm áp, một cuốn sách hay, mà quan trọng hơn, ta đã học cách đối diện với thế giới không hoàn hảo này, và với chính mình không hoàn hảo, bằng một thái độ khoan dung, dịu dàng hơn."},{"t":982,"zh":"也就是古人说的\"看清了生活的真相，却依然热爱生活\"。","py":"Yě jiùshì gǔrén shuō de \"kànqīng le shēnghuó de zhēnxiàng, què yīrán rè'ài shēnghuó\".","vi":"Cũng chính là câu người xưa nói: \"nhìn rõ sự thật của cuộc sống mà vẫn yêu cuộc sống\"."},{"t":987,"zh":"没错。年轻时的热情，往往带着很多对世界的\"要求\"，我们要求世界按照我们的想法运转，要求所有人都喜欢我们，要求付出马上就能看到回报。","py":"Méi cuò. Niánqīng shí de rèqíng, wǎngwǎng dàizhe hěn duō duì shìjiè de \"yāoqiú\", wǒmen yāoqiú shìjiè ànzhào wǒmen de xiǎngfǎ yùnzhuǎn, yāoqiú suǒyǒu rén dōu xǐhuan wǒmen, yāoqiú fùchū mǎshàng jiù néng kàndào huíbào.","vi":"Đúng vậy. Nhiệt huyết thời trẻ thường kèm theo nhiều \"yêu cầu\" đối với thế giới: ta yêu cầu thế giới vận hành theo ý ta, yêu cầu mọi người đều thích ta, yêu cầu bỏ công ra là thấy kết quả ngay."},{"t":999,"zh":"而长大后的热情，是一种放下要求之后的接纳。","py":"Ér zhǎngdà hòu de rèqíng, shì yì zhǒng fàngxià yāoqiú zhīhòu de jiēnà.","vi":"Còn nhiệt huyết khi trưởng thành là sự chấp nhận sau khi buông bỏ những yêu cầu ấy."},{"t":1003,"zh":"就像我们学中文一样，很多刚开始学语言的同学，总希望在两三个月内就能说得像母语者一样流利，遇到一点生词或者听不懂的句子就会特别沮丧，甚至觉得自己没有语言天赋。","py":"Jiù xiàng wǒmen xué Zhōngwén yíyàng, hěn duō gāng kāishǐ xué yǔyán de tóngxué, zǒng xīwàng zài liǎng-sān ge yuè nèi jiù néng shuō de xiàng mǔyǔzhě yíyàng liúlì, yùdào yìdiǎn shēngcí huòzhě tīng bu dǒng de jùzi jiù huì tèbié jǔsàng, shènzhì juéde zìjǐ méiyǒu yǔyán tiānfù.","vi":"Giống như việc chúng ta học tiếng Trung vậy, nhiều bạn mới bắt đầu học ngôn ngữ luôn mong trong hai ba tháng nói lưu loát như người bản xứ, gặp một chút từ mới hay câu nghe không hiểu là rất nản, thậm chí thấy mình không có năng khiếu ngôn ngữ."},{"t":1018,"zh":"是啊，很多初学者在刚开始的时候特别容易着急。","py":"Shì a, hěn duō chūxuézhě zài gāng kāishǐ de shíhou tèbié róngyì zháojí.","vi":"Đúng vậy, nhiều người mới học rất dễ sốt ruột lúc đầu."},{"t":1021,"zh":"但是，如果你换一种成熟的心态去看待它，你就会明白，掌握一门语言就像小树长成大树一样，是需要时间的。","py":"Dànshì, rúguǒ nǐ huàn yì zhǒng chéngshú de xīntài qù kàndài tā, nǐ jiù huì míngbai, zhǎngwò yì mén yǔyán jiù xiàng xiǎo shù zhǎng chéng dà shù yíyàng, shì xūyào shíjiān de.","vi":"Nhưng nếu bạn đổi sang tâm thế trưởng thành để nhìn nhận, bạn sẽ hiểu rằng thành thạo một ngôn ngữ giống như cây non lớn thành cây to, cần có thời gian."},{"t":1031,"zh":"你不需要每天都逼着自己背几百个单词，你只要每天保持一点点接触，每天听我们聊聊天，今天学会了两个词，明天弄懂了一个语法。","py":"Nǐ bù xūyào měitiān dōu bīzhe zìjǐ bèi jǐ bǎi ge dāncí, nǐ zhǐyào měitiān bǎochí yìdiǎndiǎn jiēchù, měitiān tīng wǒmen liáoliao tiān, jīntiān xuéhuì le liǎng ge cí, míngtiān nòng dǒng le yí ge yǔfǎ.","vi":"Bạn không cần mỗi ngày ép mình học thuộc hàng trăm từ, chỉ cần mỗi ngày giữ liên hệ một chút, mỗi ngày nghe chúng mình trò chuyện, hôm nay học được hai từ, mai hiểu thêm một điểm ngữ pháp."},{"t":1042,"zh":"也许你今天感觉不到进步，但只要你坚持一年、两年，突然有一天你会发现，你竟然能听懂一整期中文播客了，你竟然能自然地用中文表达自己的情绪了。","py":"Yěxǔ nǐ jīntiān gǎnjué bù dào jìnbù, dàn zhǐyào nǐ jiānchí yì nián, liǎng nián, tūrán yǒu yì tiān nǐ huì fāxiàn, nǐ jìngrán néng tīng dǒng yì zhěng qī Zhōngwén bòkè le, nǐ jìngrán néng zìrán de yòng Zhōngwén biǎodá zìjǐ de qíngxù le.","vi":"Có thể hôm nay bạn không cảm thấy tiến bộ, nhưng chỉ cần kiên trì một hai năm, bỗng một ngày bạn sẽ thấy mình lại nghe hiểu được cả một tập podcast tiếng Trung, lại có thể diễn đạt cảm xúc bằng tiếng Trung một cách tự nhiên."},{"t":1054,"zh":"这种不知不觉中的进步，不也正是成长的魅力所在吗？太对了。","py":"Zhè zhǒng bù zhī bù jué zhōng de jìnbù, bù yě zhèng shì chéngzhǎng de mèilì suǒzài ma? Tài duì le.","vi":"Sự tiến bộ lúc nào không hay ấy, chẳng phải chính là nét quyến rũ của sự trưởng thành sao? Đúng quá."},{"t":1059,"zh":"这种进步不是一瞬间的奇迹，而是一点一滴的累积。就像我们今天聊的话题一样，我们并不是在某一个特定的生日那天，突然变成了一个\"大人\"。","py":"Zhè zhǒng jìnbù bú shì yí shùnjiān de qíjì, ér shì yìdiǎn-yìdī de lěijī. Jiù xiàng wǒmen jīntiān liáo de huàtí yíyàng, wǒmen bìng bú shì zài mǒu yí ge tèdìng de shēngrì nà tiān, tūrán biànchéng le yí ge \"dàren\".","vi":"Sự tiến bộ này không phải phép màu trong chốc lát mà là sự tích lũy từng chút một. Giống như chủ đề hôm nay, chúng ta không phải đến một ngày sinh nhật cụ thể nào đó bỗng trở thành \"người lớn\"."},{"t":1070,"zh":"是的。我们是在某一个不想起床却必须准时上班的早晨，在某一个因为喝到一杯热汤而感到幸福的中午，在某一个学会跟自己握手言和的夜晚，悄悄地成长为一个更加成熟的人。","py":"Shì de. Wǒmen shì zài mǒu yí ge bù xiǎng qǐchuáng què bìxū zhǔnshí shàngbān de zǎochen, zài mǒu yí ge yīnwèi hēdào yì bēi rè tāng ér gǎndào xìngfú de zhōngwǔ, zài mǒu yí ge xuéhuì gēn zìjǐ wòshǒu-yánhé de yèwǎn, qiāoqiāo de chéngzhǎng wéi yí ge gèngjiā chéngshú de rén.","vi":"Đúng. Chúng ta lặng lẽ trưởng thành thành một người chín chắn hơn vào một buổi sáng không muốn dậy nhưng vẫn phải đi làm đúng giờ, vào một buổi trưa thấy hạnh phúc vì được uống một bát canh nóng, vào một đêm học được cách làm hòa với chính mình."},{"t":1086,"zh":"今天跟你聊了这么多，我感觉自己心里的很多小问号都得到了解答。","py":"Jīntiān gēn nǐ liáo le zhème duō, wǒ gǎnjué zìjǐ xīnlǐ de hěn duō xiǎo wènhào dōu dédào le jiědá.","vi":"Hôm nay trò chuyện với bạn nhiều như vậy, mình thấy nhiều dấu chấm hỏi nhỏ trong lòng đã có lời giải."},{"t":1091,"zh":"虽然我们可能会怀念小时候那个无忧无虑、充满活力、在操场上肆无忌惮奔跑的自己，但我真心觉得，我也非常喜欢现在的自己。","py":"Suīrán wǒmen kěnéng huì huáiniàn xiǎoshíhou nà ge wúyōu-wúlǜ, chōngmǎn huólì, zài cāochǎng shàng sì wú jìdàn bēnpǎo de zìjǐ, dàn wǒ zhēnxīn juéde, wǒ yě fēicháng xǐhuan xiànzài de zìjǐ.","vi":"Dù có lẽ chúng ta sẽ nhớ cô bé hay cậu bé vô lo vô nghĩ, tràn đầy sức sống, chạy nhảy không kiêng dè trên sân trường ngày xưa, nhưng mình thật lòng thấy mình cũng rất thích con người hiện tại."},{"t":1101,"zh":"现在的自己更从容，更明白自己的方向，也更懂得怎么让自己过得舒服。能够真诚地喜欢现在的自己，这就是成长能带给我们的最好的礼物。","py":"Xiànzài de zìjǐ gèng cóngróng, gèng míngbai zìjǐ de fāngxiàng, yě gèng dǒngde zěnme ràng zìjǐ guò de shūfu. Nénggòu zhēnchéng de xǐhuan xiànzài de zìjǐ, zhè jiù shì chéngzhǎng néng dàigěi wǒmen de zuì hǎo de lǐwù.","vi":"Con người hiện tại bình thản hơn, rõ hướng đi hơn, và biết cách làm mình thoải mái hơn. Có thể chân thành thích con người hiện tại của mình, đó là món quà tuyệt nhất mà sự trưởng thành mang lại."},{"t":1112,"zh":"我们今天其实聊到了很多非常有画面感的词汇，比如小时候觉得很珍贵、长大了更觉得珍贵的\"午休\"，从尴尬变成享受的\"独处\"，还有面对矛盾时的\"平静\"与\"包容\"。","py":"Wǒmen jīntiān qíshí liáodào le hěn duō fēicháng yǒu huàmiàn gǎn de cíhuì, bǐrú xiǎoshíhou juéde hěn zhēnguì, zhǎngdà le gèng juéde zhēnguì de \"wǔxiū\", cóng gāngà biànchéng xiǎngshòu de \"dúchǔ\", hái yǒu miànduì máodùn shí de \"píngjìng\" yǔ \"bāoróng\".","vi":"Hôm nay chúng ta thật ra đã nói đến nhiều từ rất giàu hình ảnh, như \"nghỉ trưa\" mà hồi nhỏ thấy quý, lớn lên càng thấy quý, \"ở một mình\" từ ngượng ngùng thành tận hưởng, và \"bình tĩnh\" cùng \"bao dung\" khi đối diện mâu thuẫn."},{"t":1126,"zh":"这些词汇不仅仅是语言学习中的知识点，更是我们每个人在生活这所大学校里，慢慢学会的人生智慧。","py":"Zhèxiē cíhuì bù jǐnjǐn shì yǔyán xuéxí zhōng de zhīshidiǎn, gèng shì wǒmen měi ge rén zài shēnghuó zhè suǒ dà xuéxiào lǐ, mànmàn xuéhuì de rénshēng zhìhuì.","vi":"Những từ này không chỉ là điểm kiến thức trong học ngôn ngữ, mà còn là trí tuệ sống mỗi người dần học được trong ngôi trường lớn là cuộc đời.","sec":"Ôn từ vựng chính và suy ngẫm về việc học ngôn ngữ"},{"t":1135,"zh":"听了我们今天的故事，不知道不管你是在通勤的路上，还是正戴着耳机安静休息的你，有没有在某一个瞬间产生共鸣呢？","py":"Tīng le wǒmen jīntiān de gùshi, bù zhīdào bùguǎn nǐ shì zài tōngqín de lù shàng, háishi zhèng dàizhe ěrjī ānjìng xiūxi de nǐ, yǒu méiyǒu zài mǒu yí ge shùnjiān chǎnshēng gòngmíng ne?","vi":"Nghe câu chuyện hôm nay của chúng mình, dù bạn đang trên đường đi làm hay đang đeo tai nghe nghỉ ngơi yên tĩnh, bạn có thấy đồng cảm ở một khoảnh khắc nào không?"},{"t":1143,"zh":"在过去的这一年或者几年里，你身上有没有发生一些静悄悄的改变？比如，你是不是也开始爱上了独处？或者你发现自己在哪一个小习惯上，已经变得跟以前完全不一样了？","py":"Zài guòqù de zhè yì nián huòzhě jǐ nián lǐ, nǐ shēnshang yǒu méiyǒu fāshēng yìxiē jìng qiāoqiāo de gǎibiàn? Bǐrú, nǐ shì bu shì yě kāishǐ àishàng le dúchǔ? Huòzhě nǐ fāxiàn zìjǐ zài nǎ yí ge xiǎo xíguàn shàng, yǐjīng biàn de gēn yǐqián wánquán bù yíyàng le?","vi":"Trong một năm hay vài năm qua, bạn có những thay đổi lặng lẽ nào không? Ví dụ, bạn có bắt đầu yêu việc ở một mình không? Hay bạn thấy mình ở thói quen nhỏ nào đã khác hẳn trước đây?"},{"t":1157,"zh":"我们非常期待听到你们的声音。如果你们愿意，欢迎在评论区给我们留言，用简单的中文写下你的小故事，分享那些属于你自己的、细微而美好的成长瞬间。","py":"Wǒmen fēicháng qīdài tīngdào nǐmen de shēngyīn. Rúguǒ nǐmen yuànyì, huānyíng zài pínglùnqū gěi wǒmen liúyán, yòng jiǎndān de Zhōngwén xiěxià nǐ de xiǎo gùshi, fēnxiǎng nàxiē shǔyú nǐ zìjǐ de, xìwēi ér měihǎo de chéngzhǎng shùnjiān.","vi":"Chúng mình rất mong được nghe tiếng nói của các bạn. Nếu bạn muốn, hãy để lại bình luận, viết câu chuyện nhỏ của bạn bằng tiếng Trung đơn giản, chia sẻ những khoảnh khắc trưởng thành tinh tế mà đẹp đẽ của riêng bạn."},{"t":1170,"zh":"慢慢来，不着急，成长永远在路上，学中文也是一样。","py":"Mànmàn lái, bù zháojí, chéngzhǎng yǒngyuǎn zài lù shàng, xué Zhōngwén yě shì yíyàng.","vi":"Cứ từ từ, đừng vội, trưởng thành luôn ở trên đường đi, học tiếng Trung cũng vậy."},{"t":1175,"zh":"感谢大家收听今天的节目，希望你今天也能睡一个舒服的好觉，吃一顿开心踏实的饭。我们下期节目再见，祝大家今天都有一个好心情。再见啦！再见。","py":"Gǎnxiè dàjiā shōutīng jīntiān de jiémù, xīwàng nǐ jīntiān yě néng shuì yí ge shūfu de hǎo jiào, chī yí dùn kāixīn tāshi de fàn. Wǒmen xià qī jiémù zàijiàn, zhù dàjiā jīntiān dōu yǒu yí ge hǎo xīnqíng. Zàijiàn la! Zàijiàn.","vi":"Cảm ơn mọi người đã nghe chương trình hôm nay, mong hôm nay bạn cũng có một giấc ngủ ngon lành, một bữa cơm vui vẻ và vững dạ. Hẹn gặp lại ở tập sau, chúc mọi người hôm nay có tâm trạng tốt. Tạm biệt nhé! Tạm biệt."}]},
{id:"l2",zh:"选择比努力更重要",vi:"Chọn lựa quan trọng hơn nỗ lực",level:"HSK 3–5",audio:"episode2.mp3",

vis:["Anh ta có nhận ra mình sai không?", "Đó chính là sức mạnh của sự lựa chọn.", "Là Tiểu Giai, bạn cùng phòng đại học của mình.", "Cậu giải thích cho mình được không?", "(cười) Người này buồn cười quá đi!", "Ồ? Chuyện gì vậy? Kể nghe thử xem.", "Lúc đó cũng là ngành rất hot.", "Hướng sai rồi, dừng lại chính là tiến lên.", "Vậy cậu đã thay đổi tình hình này thế nào?", "Haizz, giá mà quen cậu sớm vài năm thì hay biết mấy.", "Nhưng chọn lựa thì giống vô lăng của xe.", "Cô ấy càng nỗ lực thì càng xa mục tiêu kiếm tiền.", "Đây cũng là biểu hiện của việc không biết cắt lỗ kịp thời phải không?", "Còn mù quáng bắt đầu thức đêm tăng ca ngay không?", "Mình tưởng chỉ cần chăm chỉ học thì nhất định học tốt.", "Đúng. Nếu hướng sai, dừng lại chính là tiến lên.", "Thực tập chưa đầy ba tháng, mình đã hoàn toàn không chịu nổi.", "Tiền đề đó là: hướng đi của bạn phải đúng.", "Lương tuy rất thấp nhưng mỗi ngày mình làm việc rất vui.", "Nhưng bạn phải biết, hướng sai rồi thì dừng lại chính là tiến lên.", "Haizz, mình thật sự thấy buồn thay cho cô ấy, trong lòng rất khó chịu.", "Điểm số của mình tuy khá tốt nhưng mình chẳng vui chút nào.", "Nhưng cô ấy lại mở tiệm trong một khu dân cư rất cũ kỹ.", "Điều đó có nghĩa là anh ấy tự đặt trần của mình rất thấp.", "Hãy tự nhủ, đây không phải lỗi của mình mà là phương pháp này không hợp với mình.", "Wow, đem đạo lý đưa ra quyết định áp dụng vào học tiếng Trung thật quá sát!", "Ừ. Vừa nãy nghe cô ấy khóc trong điện thoại, mình suýt rơi nước mắt.", "Chỉ có tự mình trải nghiệm mới đưa ra được lựa chọn sát thực tế nhất.", "Nhưng nhìn Tiểu Giai như vậy, mình bỗng thấy câu này có phải là nói dối không?", "Ngân hàng đại diện cho an toàn và ổn định, công ty khởi nghiệp đại diện cho thử thách và rủi ro.", "Ngựa chạy nhanh đến mấy, mang nhiều tiền đến mấy, người đánh xe giỏi đến mấy, nhưng hướng ngược rồi mà!", "Nếu sợ chọn sai mà không chọn, bạn sẽ mãi chỉ dừng tại chỗ.", "Nỗ lực giống như động cơ ô tô, động cơ càng tốt thì xe chạy càng nhanh.", "Bạn không cần nghỉ việc ngay, đem hết tiền tiết kiệm đi thuê mặt bằng, mua máy pha cà phê.", "Mình nhất định sẽ dành thời gian xác nhận rõ từng mục tiêu và nhu cầu cốt lõi trước.", "Đúng vậy, nếu quán cà phê không có khách, chẳng phải mình phá sản sao? Rủi ro lớn quá.", "Nhưng nhiều người khi nói câu này đã quên một tiền đề rất quan trọng.", "Mấy năm khởi nghiệp của Tiểu Giai chính là lái một chiếc xe rất nhanh nhưng hoàn toàn đi sai đường.", "Mình tin chỉ cần chọn đúng hướng, với năng lực của cậu, nhất định làm việc rất tốt.", "Khi đưa ra quyết định, ta phải học cách xem ý kiến người khác là tham khảo chứ không phải tiêu chuẩn.", "Mình thấy trên trang cá nhân cô ấy hay đăng ảnh dậy làm bánh mì lúc bốn giờ sáng, gần như quanh năm không nghỉ.", "Nếu bạn muốn đi Bắc Kinh mà vô lăng cứ chỉ về phía nam, lái về hướng Quảng Châu.", "Cậu biết không, mình bẩm sinh không nhạy với con số, nhìn mấy bảng báo cáo tài chính phức tạp là đau đầu.", "Cậu cho một ví dụ đời thường được không? Mình nghĩ nhiều thính giả có thể chưa quen khái niệm này.", "Đúng. Tiểu Trương ở ngân hàng không phải không nỗ lực, anh ấy ngày nào cũng đi làm đúng giờ, nghiêm túc hoàn thành việc cấp trên giao.", "Lúc đó đầu mình toàn là lời người ta nói ngành nào tốt, hoàn toàn quên hỏi bản thân rốt cuộc thích gì.", "Hôm nay chúng ta nói nhiều về chủ đề chọn lựa và nỗ lực, cũng nhắc đến vài từ vựng rất cốt lõi.", "Mình sẽ nghĩ, mình đã bỏ tiền mua vé rồi, nếu không xem hết thì tiền chẳng phải tiêu phí sao?"],
