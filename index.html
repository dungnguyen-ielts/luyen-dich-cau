lines:[{"t": 0.4, "zh": "大家好，欢迎收听今天的中文播客，我是玲月。", "py": "Dàjiā hǎo, huānyíng shōutīng jīntiān de zhōngwén bōkè, wǒ shì língyuè.", "vi": "Chào mọi người, chào mừng đến với podcast tiếng Trung hôm nay, mình là Linh Nguyệt.", "sec": "Mở đầu: đọc theo thì trôi, tự nói thì bí"}, {"t": 4.9, "zh": "大家好，我是江川。", "py": "Dàjiā hǎo, wǒ shì jiāngchuān.", "vi": "Chào mọi người, mình là Giang Xuyên."}, {"t": 6.8, "zh": "今天我们聊一个几乎所有中文学习者都遇到过的问题，特别真实。", "py": "Jīntiān wǒmen liáo yí ge jīhū suǒyǒu zhōngwén xuéxízhě dōu yùdào guò de wèntí, tèbié zhēnshí.", "vi": "Hôm nay chúng ta nói về một vấn đề gần như người học tiếng Trung nào cũng từng gặp, rất thật."}, {"t": 12.9, "zh": "太真实了。", "py": "Tài zhēnshí le.", "vi": "Thật quá đi."}, {"t": 14.8, "zh": "最近好多学生跟我说：“老师，我跟着音频读课文读得特别顺，发音也没问题，觉得自己中文挺好的，可一到真的跟中国人说话，脑子就一片空白，半天蹦不出一个完整的句子。”", "py": "Zuìjìn hǎoduō xuéshēng gēn wǒ shuō: \"lǎoshī, wǒ gēnzhe yīnpín dú kèwén dú de tèbié shùn, fāyīn yě méi wèntí, juéde zìjǐ zhōngwén tǐng hǎo de, kě yí dào zhēnde gēn zhōngguó rén shuōhuà, nǎozi jiù yípiànkòngbái, bàntiān bèng bù chū yí ge wánzhěng de jùzi.\"", "vi": "Dạo này nhiều học trò nói với mình: “Cô ơi, em đọc theo audio bài khóa rất trôi, phát âm cũng không vấn đề gì, cứ tưởng tiếng Trung của mình khá lắm, nhưng đến lúc nói chuyện thật với người Trung Quốc thì đầu óc trống rỗng, mãi không nặn ra nổi một câu hoàn chỉnh.”"}, {"t": 33.6, "zh": "嗨，没错。", "py": "Hāi, méicuò.", "vi": "Ôi, đúng vậy."}, {"t": 35.0, "zh": "有人说自己跟读的时候连声调都准得很，可是自己想说一句话，不是忘了词就是说错声调，怎么想怎么别扭。", "py": "Yǒurén shuō zìjǐ gēndú de shíhou lián shēngdiào dōu zhǔn de hěn, kěshì zìjǐ xiǎng shuō yíjù huà, búshì wàng le cí jiùshìshuō cuò shēngdiào, zěnme xiǎng zěnme bièniǔ.", "vi": "Có người nói lúc đọc theo thì đến thanh điệu cũng chuẩn, nhưng khi tự muốn nói một câu thì hoặc quên từ hoặc sai thanh điệu, nghĩ kiểu gì cũng thấy gượng."}, {"t": 45.8, "zh": "明明每个词都学过，凑到一起就不会说了。", "py": "Míngmíng měi ge cí dōu xué guo, còu dào yìqǐ jiù búhuì shuō le.", "vi": "Rõ ràng từ nào cũng học rồi, ghép lại với nhau thì lại không biết nói."}, {"t": 50.1, "zh": "就像有个学生跟我形容的：“跟读的时候，我觉得我能跟中国人吵架，真开口的时候，我连点一杯奶茶都费劲。”", "py": "Jiù xiàng yǒu gè xuéshēng gēn wǒ xíngróng de: \"gēndú de shíhou, wǒ juéde wǒ néng gēn zhōngguó rén chǎojià, zhēn kāikǒu de shíhou, wǒ lián diǎn yìbēi nǎichá dōu fèijìn.\"", "vi": "Giống như một học trò từng tả với mình: “Lúc đọc theo em thấy mình có thể cãi nhau với người Trung Quốc, đến lúc mở miệng thật thì gọi một ly trà sữa cũng thấy khó.”"}, {"t": 61.3, "zh": "这个形容特别准。", "py": "Zhège xíngróng tèbié zhǔn.", "vi": "Cách tả này chuẩn quá."}, {"t": 63.8, "zh": "很多人就很困惑：难道我跟读都是假的吗？是我自己骗自己吗？", "py": "Hěnduō rén jiù hěn kùnhuò: nándào wǒ gēndú dōu shì jiǎ de ma? Shì wǒ zìjǐ piàn zìjǐ ma?", "vi": "Nhiều người rất hoang mang: chẳng lẽ việc đọc theo của mình là giả sao? Là mình tự lừa mình sao?"}, {"t": 70.0, "zh": "为什么能跟和能自己说之间差了这么远？", "py": "Wèishénme néng gēn hé néng zìjǐ shuō zhījiān chà le zhème yuǎn?", "vi": "Vì sao giữa “đọc theo được” và “tự nói được” lại cách xa như vậy?"}, {"t": 75.6, "zh": "今天我们就把这件事聊透。", "py": "Jīntiān wǒmen jiù bǎ zhèjiàn shì liáo tòu.", "vi": "Hôm nay chúng ta sẽ nói cho thấu chuyện này."}, {"t": 77.6, "zh": "先说说跟读为什么简单，再讲自己开口到底难在哪，最后给大家几个特别实用的练习方法，帮你从只会跟读练到自己也能说。", "py": "Xiān shuō shuō gēndú wèishénme jiǎndān, zài jiǎng zìjǐ kāikǒu dàodǐ nán zài nǎ, zuìhòu gěi dàjiā jǐ ge tèbié shíyòng de liànxí fāngfǎ, bāng nǐ cóng zhǐ huì gēndú liàn dào zìjǐ yě néng shuō.", "vi": "Trước tiên nói vì sao đọc theo dễ, rồi nói tự mở miệng rốt cuộc khó ở đâu, cuối cùng đưa ra vài cách luyện thật thực dụng, giúp bạn từ chỉ biết đọc theo đến tự nói được."}, {"t": 92.5, "zh": "全程都是很简单的大道理，没有复杂的术语，听完就能用。", "py": "Quánchéng dōu shì hěn jiǎndān de dàdàolǐ, méiyǒu fùzá de shùyǔ, tīng wán jiù néng yòng.", "vi": "Suốt tập đều là những lẽ đơn giản, không có thuật ngữ phức tạp, nghe xong là dùng được."}, {"t": 97.3, "zh": "先回答第一个问题，为什么跟读这么简单？是不是跟读没用？", "py": "Xiān huídá dìyí ge wèntí, wèishénme gēndú zhème jiǎndān? Shìbúshì gēndú méiyòng?", "vi": "Trả lời câu hỏi đầu tiên trước: vì sao đọc theo dễ thế? Có phải đọc theo vô dụng không?", "sec": "Vì sao đọc theo lại dễ"}, {"t": 103.3, "zh": "当然不是。", "py": "Dāngrán búshì.", "vi": "Dĩ nhiên không phải."}, {"t": 104.8, "zh": "因为跟读的时候，你的大脑做的工作和自己说话的时候根本不是一回事。", "py": "Yīnwèi gēndú de shíhou, nǐ de dànǎo zuò de gōngzuò hé zìjǐ shuōhuà de shíhou gēnběn búshì yì huíshì.", "vi": "Vì khi đọc theo, công việc não bạn làm hoàn toàn không giống lúc tự nói."}, {"t": 111.0, "zh": "怎么不一样？不都是说中文吗？", "py": "Zěnme bù yíyàng? Bù dōu shì shuō zhōngwén ma?", "vi": "Khác thế nào? Chẳng phải đều là nói tiếng Trung sao?"}, {"t": 114.6, "zh": "差远了。", "py": "Chàyuǎnle.", "vi": "Khác xa lắm."}, {"t": 116.5, "zh": "跟读的时候，相当于有人把答案放在你面前，你只要照着念就行。", "py": "Gēndú de shíhou, xiāngdāngyú yǒurén bǎ dáàn fàngzài nǐ miànqián, nǐ zhǐyào zhàozhe niàn jiù xíng.", "vi": "Khi đọc theo, giống như có người đặt đáp án trước mặt bạn, bạn chỉ cần đọc theo là được."}, {"t": 122.3, "zh": "首先，不用你想词，每个字每个词都摆在那。", "py": "Shǒuxiān, búyòng nǐ xiǎng cí, měi ge zì měi ge cí dōu bǎizài nà.", "vi": "Thứ nhất, không cần bạn nghĩ từ, từng chữ từng từ đều bày sẵn ở đó."}, {"t": 128.4, "zh": "其次，不用你想顺序，句子结构已经给你搭好了，甚至连发音、声调、停顿，音频里都示范好了。", "py": "Qícì, búyòng nǐ xiǎng shùnxù, jùzi jiégòu yǐjing gěi nǐ dā hǎo le, shènzhì lián fāyīn, shēngdiào, tíngdùn, yīnpín lǐ dōu shìfàn hǎo le.", "vi": "Thứ hai, không cần bạn nghĩ trật tự, cấu trúc câu đã dựng sẵn cho bạn, thậm chí phát âm, thanh điệu, chỗ ngắt nghỉ, audio cũng làm mẫu sẵn rồi."}, {"t": 138.0, "zh": "哦，你的意思是跟读的时候我们其实只是模仿和复制，不用自己创造句子？", "py": "Ò, nǐ de yìsi shì gēndú de shíhou wǒmen qíshí zhǐshì mófǎng hé fùzhì, búyòng zìjǐ chuàngzào jùzi?", "vi": "Ồ, ý cậu là khi đọc theo thật ra chúng ta chỉ bắt chước và sao chép, không phải tự tạo câu?"}, {"t": 147.0, "zh": "对，就是这个意思。", "py": "Duì, jiùshì zhège yìsi.", "vi": "Đúng, chính là ý đó."}, {"t": 149.4, "zh": "打个比方，跟读就像照着字帖写字，你不用想这个字怎么写，笔顺是什么，照着描就行。", "py": "Dǎgèbǐfāng, gēndú jiù xiàng zhàozhe zìtiè xiězì, nǐ búyòng xiǎng zhège zì zěnme xiě, bǐshùn shì shénme, zhàozhe miáo jiù xíng.", "vi": "Nói ví dụ nhé, đọc theo giống như chép chữ theo mẫu, bạn không cần nghĩ chữ này viết thế nào, thứ tự nét ra sao, cứ tô theo là xong."}, {"t": 158.0, "zh": "自己说话呢，相当于给你一张白纸，让你自己写一篇文章，难度完全不是一个级别的。", "py": "Zìjǐ shuōhuà ne, xiāngdāngyú gěi nǐ yìzhāngbáizhǐ, ràng nǐ zìjǐ xiě yìpiān wénzhāng, nándù wánquán búshì yí ge jíbié de.", "vi": "Còn tự nói thì giống như đưa bạn một tờ giấy trắng, bảo bạn tự viết một bài văn, độ khó hoàn toàn không cùng một cấp."}, {"t": 166.7, "zh": "这么一说就懂了，我就说嘛，为什么跟读的时候特别流畅，自己一开口就卡。", "py": "Zhème yì shuō jiù dǒng le, wǒ jiù shuō ma, wèishénme gēndú de shíhou tèbié liúchàng, zìjǐ yì kāikǒu jiù kǎ.", "vi": "Nghe vậy là hiểu rồi, mình đã bảo mà, sao lúc đọc theo thì thật trôi chảy, còn tự mở miệng là kẹt."}, {"t": 174.6, "zh": "原来一个照着画，一个自己画。", "py": "Yuánlái yí ge zhàozhe huà, yí ge zìjǐ huà.", "vi": "Hóa ra một bên là vẽ theo, một bên là tự vẽ."}, {"t": 178.9, "zh": "而且跟读的时候，你的大脑只需要管一件事：发音对不对。", "py": "Érqiě gēndú de shíhou, nǐ de dànǎo zhǐ xūyào guǎn yíjiàn shì: fāyīn duì bú duì.", "vi": "Hơn nữa khi đọc theo, não bạn chỉ cần lo một việc: phát âm đúng hay không."}, {"t": 185.3, "zh": "不用考虑下一个词是什么，不用考虑语法对不对，也不用担心说错丢面子。", "py": "Búyòng kǎolǜ xià yí ge cí shì shénme, búyòng kǎolǜ yǔfǎ duì bú duì, yě búyòng dānxīn shuōcuò diūmiànzi.", "vi": "Không phải nghĩ từ tiếp theo là gì, không phải nghĩ ngữ pháp đúng không, cũng không phải lo nói sai mất mặt."}, {"t": 192.5, "zh": "注意力全放在声音上，当然觉得简单。", "py": "Zhùyìlì quán fàngzài shēngyīn shàng, dāngrán juéde jiǎndān.", "vi": "Sự chú ý đặt hết vào âm thanh, đương nhiên thấy dễ."}, {"t": 195.3, "zh": "还有一点我觉得很重要，跟读的时候是被动的，音频说一句你跟一句，节奏是别人带着你走。", "py": "Háiyǒu yìdiǎn wǒ juéde hěn zhòngyào, gēndú de shíhou shì bèidòng de, yīnpín shuō yíjù nǐ gēn yíjù, jiézòu shì biérén dài zhe nǐ zǒu.", "vi": "Còn một điểm mình thấy rất quan trọng: đọc theo là bị động, audio nói một câu bạn theo một câu, nhịp độ là người khác dẫn bạn đi."}, {"t": 206.7, "zh": "自己说话的时候，节奏要自己控制，下一句说什么要自己想。", "py": "Zìjǐ shuōhuà de shíhou, jiézòu yào zìjǐ kòngzhì, xià yíjù shuō shénme yào zìjǐ xiǎng.", "vi": "Khi tự nói, nhịp độ phải tự điều khiển, câu tiếp theo nói gì phải tự nghĩ."}, {"t": 213.1, "zh": "没错。", "py": "Méicuò.", "vi": "Đúng vậy."}, {"t": 213.9, "zh": "所以不是你假装会说，是跟读本身的难度就低。", "py": "Suǒyǐ búshì nǐ jiǎzhuānghuì shuō, shì gēndú běnshēn de nándù jiù dī.", "vi": "Cho nên không phải bạn giả vờ biết nói, mà bản thân việc đọc theo vốn có độ khó thấp."}, {"t": 219.1, "zh": "它是很好的入门练习，但它只是输入阶段的练习，离真正的主动输出还有好几步的距离。", "py": "Tā shì hěn hǎo de rùmén liànxí, dàn tā zhǐshì shūrù jiēduàn de liànxí, lí zhēnzhèng de zhǔdòng shūchū háiyǒu hǎojǐbù de jùlí.", "vi": "Nó là bài tập nhập môn rất tốt, nhưng chỉ là bài tập ở giai đoạn đầu vào, còn cách việc chủ động nói ra thật sự mấy bước nữa."}, {"t": 229.5, "zh": "那接下来就说说大家最关心的，为什么自己说就这么难？难到底在什么地方？", "py": "Nà jiēxiàlái jiù shuō shuō dàjiā zuì guānxīn de, wèishénme zìjǐ shuō jiù zhème nán? Nán dàodǐ zài shénme dìfang?", "vi": "Vậy tiếp theo nói về điều mọi người quan tâm nhất: vì sao tự nói lại khó đến thế? Khó rốt cuộc ở chỗ nào?", "sec": "Bốn lý do khiến tự nói khó"}, {"t": 237.1, "zh": "我总结了四个最主要的原因，一个比一个戳痛点。", "py": "Wǒ zǒngjié le sì ge zuì zhǔyào de yuányīn, yí ge bǐ yí ge chuō tòngdiǎn.", "vi": "Mình tổng kết được bốn lý do chính, cái sau chạm đúng chỗ đau hơn cái trước."}, {"t": 243.0, "zh": "第一个，也是最核心的，从认得出到说得出来，中间差了一步：主动提取。", "py": "Dìyí ge, yě shì zuì héxīn de, cóng rènde chū dào shuō de chūlái, zhōngjiān chà le yíbù: zhǔdòngtíqǔ.", "vi": "Lý do thứ nhất, cũng là cốt lõi nhất: từ “nhận ra được” đến “nói ra được” còn thiếu một bước: chủ động truy xuất."}, {"t": 251.5, "zh": "什么叫主动提取？", "py": "Shénme jiào zhǔdòngtíqǔ?", "vi": "Thế nào là chủ động truy xuất?"}, {"t": 254.6, "zh": "比如你学过“奶茶”这个词，看到“奶茶”这两个拼音，或者听到别人说，你知道是什么意思，这叫被动识别。", "py": "Bǐrú nǐ xué guo \"nǎichá\" zhège cí, kàndào \"nǎichá\" zhè liǎng ge pīnyīn, huòzhě tīngdào biérén shuō, nǐ zhīdao shì shénme yìsi, zhè jiào bèidòngshíbié.", "vi": "Ví dụ bạn đã học từ “trà sữa”, thấy hai chữ pinyin đó, hoặc nghe người khác nói, bạn biết nghĩa là gì, đó gọi là nhận diện bị động."}, {"t": 265.4, "zh": "跟读的时候，你听到声音照着念，用的就是被动识别。", "py": "Gēndú de shíhou, nǐ tīngdào shēngyīn zhàozhe niàn, yòng de jiùshì bèidòngshíbié.", "vi": "Khi đọc theo, bạn nghe âm thanh rồi đọc theo, là đang dùng nhận diện bị động."}, {"t": 271.6, "zh": "那主动提取就是，我想喝奶茶的时候，自己从脑子里把“奶茶”这个词找出来。", "py": "Nà zhǔdòngtíqǔ jiùshì, wǒ xiǎng hē nǎichá de shíhou, zìjǐ cóng nǎozilǐ bǎ \"nǎichá\" zhège cí zhǎo chūlái.", "vi": "Còn chủ động truy xuất là khi mình muốn uống trà sữa, tự tìm từ “trà sữa” ra từ trong đầu."}, {"t": 279.4, "zh": "对，就是你想说一个东西，没有任何提示，全靠自己从记忆里把这个词挖出来，还要说对发音，说对声调。", "py": "Duì, jiùshì nǐ xiǎng shuō yí ge dōngxi, méiyǒu rènhé tíshì, quán kào zìjǐ cóng jìyìlǐ bǎ zhège cí wāchūlái, háiyào shuō duì fāyīn, shuō duì shēngdiào.", "vi": "Đúng, tức là bạn muốn nói một thứ, không có gợi ý nào, hoàn toàn nhờ tự đào từ đó ra khỏi trí nhớ, còn phải nói đúng phát âm, đúng thanh điệu."}, {"t": 291.6, "zh": "这就像你看书的时候，很多字你都认识，但让你自己写的时候，很多字就写不出来了。", "py": "Zhè jiù xiàng nǐ kànshū de shíhou, hěnduō zì nǐ dōu rènshi, dàn ràng nǐ zìjǐ xiě de shíhou, hěnduō zì jiù xiě bù chūlái le.", "vi": "Giống như khi đọc sách, nhiều chữ bạn đều nhận ra, nhưng bắt bạn tự viết thì nhiều chữ lại viết không ra."}, {"t": 299.2, "zh": "太有体会了。", "py": "Tài yǒu tǐhuì le.", "vi": "Thấm thía quá."}, {"t": 300.1, "zh": "很多学生都说，这个词我学过，我听得懂，可就是说的时候想不起来。", "py": "Hěnduō xuéshēng dōu shuō, zhège cí wǒ xué guo, wǒ tīngdedǒng, kě jiùshìshuō de shíhou xiǎngbùqǐlái.", "vi": "Nhiều học trò nói: từ này em học rồi, nghe hiểu được, nhưng lúc nói lại không nhớ ra."}, {"t": 307.6, "zh": "原来不是没记住，是不会自己拿出来用。", "py": "Yuánlái búshì méi jìzhù, shì búhuì zìjǐ ná chūlái yòng.", "vi": "Hóa ra không phải chưa nhớ, mà là chưa biết tự lấy ra dùng."}, {"t": 313.1, "zh": "第二个原因，跟读只练了单个的音，没练快速组句子。", "py": "Dìèr ge yuányīn, gēndú zhǐ liàn le dān ge de yīn, méi liàn kuàisù zǔ jùzi.", "vi": "Lý do thứ hai: đọc theo chỉ luyện từng âm riêng lẻ, chưa luyện ghép câu nhanh."}, {"t": 320.2, "zh": "怎么说？", "py": "Zěnme shuō?", "vi": "Nghĩa là sao?"}, {"t": 320.9, "zh": "很多人跟读，注意力全在每个字的发音准不准，声调对不对。", "py": "Hěnduō rén gēndú, zhùyìlì quán zài měi ge zì de fāyīn zhǔn bùzhǔn, shēngdiào duì bú duì.", "vi": "Nhiều người khi đọc theo, chú ý toàn ở chỗ phát âm từng chữ có chuẩn không, thanh điệu có đúng không."}, {"t": 326.5, "zh": "比如“我”读第三声，“很”读第三声，分开读都对。", "py": "Bǐrú \"wǒ\" dú dìsānshēng, \"hěn\" dú dìsānshēng, fēnkāi dú dōu duì.", "vi": "Ví dụ “我” đọc thanh ba, “很” đọc thanh ba, đọc riêng thì đều đúng."}, {"t": 332.2, "zh": "但两个第三声连在一起，第一个要变第二声。", "py": "Dàn liǎng ge dìsānshēng liánzàiyìqǐ, dìyí ge yào biàn dìèrshēng.", "vi": "Nhưng hai thanh ba đứng liền nhau thì chữ đầu phải đổi thành thanh hai."}, {"t": 336.7, "zh": "很多人自己说的时候就反应不过来。", "py": "Hěnduō rén zìjǐ shuō de shíhou jiù fǎnyìng bú guòlái.", "vi": "Nhiều người khi tự nói thì không kịp phản ứng."}, {"t": 339.4, "zh": "哦对，还有连读变调，单独读都懂，连起来说就容易错。", "py": "Ò duì, háiyǒu liándú biàndiào, dāndú dú dōu dǒng, lián qǐlai shuō jiù róngyì cuò.", "vi": "À đúng rồi, còn có biến điệu khi đọc liền, đọc riêng thì hiểu hết, nói liền lại dễ sai."}, {"t": 346.2, "zh": "不只是发音，还有组词组句子。", "py": "Bù zhǐshì fāyīn, háiyǒu zǔ cízǔ jùzi.", "vi": "Không chỉ phát âm, còn có việc ghép từ ghép câu."}, {"t": 351.1, "zh": "比如你学过“我”“吃”“饭”三个词，跟读的时候都没问题，但自己想说“我吃饭”，要想顺序对不对，要不要加“了”，现在说还是过去说，这些都是跟读的时候不用想的。", "py": "Bǐrú nǐ xué guo \"wǒ\" \"chī\" \"fàn\" sān ge cí, gēndú de shíhou dōu méi wèntí, dàn zìjǐ xiǎng shuō \"wǒ chīfàn\", yào xiǎng shùnxù duì bú duì, yào búyào jiā \"le\", xiànzài shuō háishì guòqù shuō, zhèxiē dōu shì gēndú de shíhou búyòng xiǎng de.", "vi": "Ví dụ bạn đã học ba từ “tôi”, “ăn”, “cơm”, lúc đọc theo đều không vấn đề, nhưng khi tự muốn nói “tôi ăn cơm”, phải nghĩ trật tự có đúng không, có cần thêm “了” không, nói về hiện tại hay quá khứ, những điều này lúc đọc theo đều không phải nghĩ."}, {"t": 370.0, "zh": "就像积木，跟读的时候别人已经把积木拼好了，你只要照着摆一遍。", "py": "Jiù xiàng jīmù, gēndú de shíhou biérén yǐjing bǎ jīmù pīn hǎo le, nǐ zhǐyào zhàozhe bǎi yíbiàn.", "vi": "Giống như xếp hình, lúc đọc theo người khác đã ghép sẵn khối rồi, bạn chỉ cần bày lại theo."}, {"t": 377.0, "zh": "自己说话是，要你自己从一堆积木里挑出来，再拼出想要的样子。", "py": "Zìjǐ shuōhuà shì, yào nǐ zìjǐ cóng yìduī jīmù lǐ tiāochūlái, zài pīnchū xiǎngyào de yàngzi.", "vi": "Còn tự nói thì phải tự chọn từ một đống khối ra, rồi ghép thành hình mình muốn."}, {"t": 384.8, "zh": "特别准确。", "py": "Tèbié zhǔnquè.", "vi": "Rất chính xác."}, {"t": 386.9, "zh": "第三个原因，很多人说话之前先在心里说母语，再翻译成中文。", "py": "Dìsān ge yuányīn, hěnduō rén shuōhuà zhīqián xiān zài xīnlǐ shuō mǔyǔ, zài fānyìchéng zhōngwén.", "vi": "Lý do thứ ba: nhiều người trước khi nói thường nói thầm bằng tiếng mẹ đẻ trong lòng rồi mới dịch sang tiếng Trung."}, {"t": 394.7, "zh": "这个太普遍了。", "py": "Zhège tài pǔbiàn le.", "vi": "Cái này quá phổ biến."}, {"t": 397.3, "zh": "我见过很多学生，说一句中文先低头想半天，其实就是在心里翻译。", "py": "Wǒ jiàn guo hěnduō xuéshēng, shuō yíjù zhōngwén xiān dītóu xiǎng bàntiān, qíshí jiùshì zài xīnlǐ fānyì.", "vi": "Mình gặp nhiều học trò, nói một câu tiếng Trung là cúi đầu nghĩ hồi lâu, thật ra là đang dịch thầm trong bụng."}, {"t": 404.0, "zh": "跟读的时候你不用翻译，直接跟着中文说就行。", "py": "Gēndú de shíhou nǐ búyòng fānyì, zhíjiē gēnzhe zhōngwén shuō jiù xíng.", "vi": "Khi đọc theo bạn không cần dịch, cứ đọc theo tiếng Trung là được."}, {"t": 409.0, "zh": "但自己说话的时候，很多人习惯先想母语：我想说这句话用中文怎么说，先翻译再开口，中间多了一道工序，当然慢，当然卡。", "py": "Dàn zìjǐ shuōhuà de shíhou, hěnduō rén xíguàn xiān xiǎng mǔyǔ: wǒ xiǎng shuō zhè jù huà yòng zhōngwén zěnme shuō, xiān fānyì zài kāikǒu, zhōngjiān duō le yídào gōngxù, dāngrán màn, dāngrán kǎ.", "vi": "Nhưng khi tự nói, nhiều người quen nghĩ tiếng mẹ đẻ trước: câu này mình muốn nói thì tiếng Trung nói thế nào, dịch trước rồi mới mở miệng, giữa chừng thêm một công đoạn, đương nhiên chậm, đương nhiên kẹt."}, {"t": 423.4, "zh": "而且翻译的时候，还容易按照母语的顺序说，说出的中文很奇怪。", "py": "Érqiě fānyì de shíhou, hái róngyì ànzhào mǔyǔ de shùnxù shuō, shuōchū de zhōngwén hěn qíguài.", "vi": "Hơn nữa khi dịch, còn dễ nói theo trật tự của tiếng mẹ đẻ, tiếng Trung nói ra rất kỳ."}, {"t": 430.4, "zh": "第四个原因，也是很多人忽略的，心理压力。", "py": "Dìsì ge yuányīn, yě shì hěnduō rén hūlüè de, xīnlǐyālì.", "vi": "Lý do thứ tư, cũng là điều nhiều người bỏ qua: áp lực tâm lý."}, {"t": 435.2, "zh": "跟读的时候错了也没人知道，没人笑话你。", "py": "Gēndú de shíhou cuò le yě méi rén zhīdao, méi rén xiàohuà nǐ.", "vi": "Khi đọc theo, sai cũng không ai biết, không ai cười bạn."}, {"t": 439.6, "zh": "可真的跟人说话的时候，你会担心发音错了怎么办，语法错了怎么办，对方会不会听不懂。", "py": "Kě zhēnde gēn rén shuōhuà de shíhou, nǐ huì dānxīn fāyīn cuò le zěnmebàn, yǔfǎ cuò le zěnmebàn, duìfāng huì búhuì tīngbùdǒng.", "vi": "Nhưng khi nói chuyện với người thật, bạn sẽ lo phát âm sai thì sao, ngữ pháp sai thì sao, đối phương có nghe không hiểu không."}, {"t": 448.8, "zh": "越紧张，脑子越空白，越想不起来。", "py": "Yuè jǐnzhāng, nǎozi yuè kòngbái, yuè xiǎngbùqǐlái.", "vi": "Càng căng thẳng, đầu óc càng trống rỗng, càng không nhớ ra."}, {"t": 453.3, "zh": "真的是这样，越怕说错越说不出来，越说不出来越紧张，恶性循环。", "py": "Zhēnde shì zhèyàng, yuè pà shuōcuò yuè shuōbùchūlái, yuè shuōbùchūlái yuè jǐnzhāng, èxìngxúnhuán.", "vi": "Đúng là như vậy, càng sợ sai càng không nói ra, càng không nói ra càng căng thẳng, thành vòng luẩn quẩn."}, {"t": 461.6, "zh": "其实很多时候不是不会说，是紧张得忘了。", "py": "Qíshí hěnduō shíhou búshì búhuì shuō, shì jǐnzhāng de wàng le.", "vi": "Thật ra nhiều khi không phải không biết nói, mà là căng thẳng đến quên mất."}, {"t": 467.0, "zh": "所以你看，自己开口难根本不是你笨，也不是跟读没用。", "py": "Suǒyǐ nǐ kàn, zìjǐ kāikǒu nán gēnběn búshì nǐ bèn, yě búshì gēndú méiyòng.", "vi": "Vì vậy bạn thấy đấy, tự mở miệng khó hoàn toàn không phải do bạn ngốc, cũng không phải đọc theo vô dụng."}, {"t": 473.6, "zh": "是这四件事加在一起：要自己找词，要自己组句，要克服翻译习惯，还要克服紧张。", "py": "Shì zhè sìjiàn shì jiāzàiyìqǐ: yào zìjǐ zhǎocí, yào zìjǐ zǔ jù, yào kèfú fānyì xíguàn, háiyào kèfú jǐnzhāng.", "vi": "Mà là bốn việc này cộng lại: phải tự tìm từ, tự ghép câu, phải vượt qua thói quen dịch, và còn phải vượt qua căng thẳng."}, {"t": 484.6, "zh": "难度比跟读高了好几个等级，当然会觉得难。", "py": "Nándù bǐ gēndú gāo le hǎojǐ ge děngjí, dāngrán huì juéde nán.", "vi": "Độ khó cao hơn đọc theo mấy bậc, đương nhiên thấy khó."}, {"t": 489.9, "zh": "说到这肯定有人会问，那跟读是不是没用？我以后不用跟读了？", "py": "Shuō dào zhè kěndìng yǒurén huì wèn, nà gēndú shìbúshì méiyòng? Wǒ yǐhòu búyòng gēndú le?", "vi": "Nói đến đây chắc chắn có người hỏi: vậy đọc theo là vô dụng sao? Sau này mình khỏi đọc theo nữa à?", "sec": "Đọc theo không vô dụng, nhưng đừng sa vào ba cái bẫy"}, {"t": 496.2, "zh": "当然不是。", "py": "Dāngrán búshì.", "vi": "Dĩ nhiên không phải."}, {"t": 497.9, "zh": "跟读是非常好的基础练习，特别适合练发音，练语感。", "py": "Gēndú shì fēicháng hǎo de jīchǔ liànxí, tèbié shìhé liàn fāyīn, liàn yǔgǎn.", "vi": "Đọc theo là bài tập nền rất tốt, đặc biệt hợp để luyện phát âm, luyện cảm giác ngôn ngữ."}, {"t": 504.5, "zh": "问题不是跟读没用，是大部分人只做了最低级的跟读，练完就停了，没有往下走。", "py": "Wèntí búshì gēndú méiyòng, shì dàbùfèn rén zhǐ zuò le zuì dījí de gēndú, liàn wán jiù tíng le, méiyǒu wǎngxiàzǒu.", "vi": "Vấn đề không phải đọc theo vô dụng, mà là đa số người chỉ làm kiểu đọc theo thấp nhất, luyện xong là dừng, không đi tiếp."}, {"t": 512.6, "zh": "什么叫最低级的跟读？", "py": "Shénme jiào zuì dījí de gēndú?", "vi": "Thế nào là đọc theo kiểu thấp nhất?"}, {"t": 514.8, "zh": "就是打开音频跟着读一遍，读完就关了，觉得我会读了，这篇课文我学会了。", "py": "Jiùshì dǎkāi yīnpín gēnzhe dú yíbiàn, dúwán jiù guān le, juéde wǒhuì dú le, zhè piān kèwén wǒ xuéhuì le.", "vi": "Là mở audio đọc theo một lượt, đọc xong tắt luôn, nghĩ mình đọc được rồi, bài khóa này mình học xong rồi."}, {"t": 522.8, "zh": "其实这只是第一步，你只会照着念，还不会自己说。", "py": "Qíshí zhè zhǐshì dìyībù, nǐ zhǐ huì zhàozhe niàn, hái búhuì zìjǐ shuō.", "vi": "Thật ra đó mới là bước đầu, bạn mới chỉ biết đọc theo, vẫn chưa biết tự nói."}, {"t": 527.1, "zh": "我见过很多学生，一篇课文读得滚瓜烂熟，可是问他：你今天早上吃了什么？他还是不会说。", "py": "Wǒ jiàn guo hěnduō xuéshēng, yìpiān kèwén dú de gǔnguālànshú, kěshì wèn tā: nǐ jīntiān zǎoshàng chī le shénme? Tā háishì búhuì shuō.", "vi": "Mình gặp nhiều học trò, một bài khóa đọc thuộc làu làu, nhưng hỏi: sáng nay em ăn gì? em vẫn không biết nói."}, {"t": 534.9, "zh": "因为课文里的句子是“我早上吃了面包和牛奶”，他只会背这一句，换成“我吃了包子”，他就不会了。", "py": "Yīnwèi kèwén lǐ de jùzi shì \"wǒ zǎoshàng chī le miànbāo hé niúnǎi\", tā zhǐ huì bèi zhè yíjù, huànchéng \"wǒ chī le bāozi\", tā jiù búhuì le.", "vi": "Vì câu trong bài là “sáng tôi ăn bánh mì và sữa”, em chỉ thuộc đúng câu này, đổi thành “tôi ăn bánh bao” là em không biết."}, {"t": 544.8, "zh": "没错，这就是第二个误区，把跟读当成了背课文，觉得背下来了就会说了。", "py": "Méicuò, zhè jiùshì dìèr ge wùqū, bǎ gēndú dàngchéng le bèi kèwén, juéde bèixiàlái le jiù huì shuō le.", "vi": "Đúng, đây là cái bẫy thứ hai: coi đọc theo là học thuộc bài khóa, nghĩ thuộc rồi là biết nói."}, {"t": 551.4, "zh": "但语言是活的，不是只有课文里那种说法，你要学会的是用这些词自己造新的句子，而不是只会背原句。", "py": "Dàn yǔyán shì huó de, búshì zhǐyǒu kèwén lǐ nàzhǒng shuōfǎ, nǐ yào xuéhuì de shì yòng zhèxiē cí zìjǐ zào xīn de jùzi, ér búshì zhǐ huì bèi yuán jù.", "vi": "Nhưng ngôn ngữ là sống, không chỉ có cách nói trong bài khóa, điều bạn cần học là dùng những từ này tự đặt câu mới, chứ không phải chỉ thuộc câu gốc."}, {"t": 559.0, "zh": "还有什么常见的误区？", "py": "Háiyǒu shénme chángjiàn de wùqū?", "vi": "Còn cái bẫy thường gặp nào nữa?"}, {"t": 561.7, "zh": "第三个误区，跟读只动嘴，不动脑。", "py": "Dìsān ge wùqū, gēndú zhǐ dòngzuǐ, bú dòngnǎo.", "vi": "Bẫy thứ ba: đọc theo chỉ động miệng, không động não."}, {"t": 565.1, "zh": "很多人跟读的时候脑子在想别的事，嘴巴机械地跟着念，声音是出来了，但根本没往心里去。", "py": "Hěnduō rén gēndú de shíhou nǎozi zài xiǎng biéde shì, zuǐbā jīxiè de gēnzhe niàn, shēngyīn shì chūlái le, dàn gēnběn méi wǎng xīnlǐ qù.", "vi": "Nhiều người khi đọc theo đầu óc nghĩ chuyện khác, miệng đọc theo như máy, tiếng thì phát ra, nhưng hoàn toàn không đi vào lòng."}, {"t": 572.9, "zh": "读了十遍，关上音频还是什么都不记得。", "py": "Dú le shíbiàn, guānshàng yīnpín háishì shénme dōu bú jìde.", "vi": "Đọc mười lượt, tắt audio rồi vẫn chẳng nhớ gì."}, {"t": 575.3, "zh": "就像我们小时候背课文，读了好多遍，好像背下来了，合上书就忘，因为没走心。", "py": "Jiù xiàng wǒmen xiǎoshíhòu bèi kèwén, dú le hǎoduōbiàn, hǎoxiàng bèixiàlái le, hé shàngshū jiù wàng, yīnwèi méi zǒu xīn.", "vi": "Giống hồi nhỏ học thuộc bài, đọc bao nhiêu lượt, tưởng thuộc rồi, gấp sách lại là quên, vì không để tâm."}, {"t": 582.1, "zh": "所以跟读本身是好方法，但用错了方法，就会出现“跟读很溜，开口不会”的情况。", "py": "Suǒyǐ gēndú běnshēn shì hǎo fāngfǎ, dàn yòng cuò le fāngfǎ, jiù huì chūxiàn \"gēndú hěn liū, kāikǒu búhuì\" de qíngkuàng.", "vi": "Cho nên bản thân đọc theo là phương pháp tốt, nhưng dùng sai cách thì sẽ ra tình trạng “đọc theo rất trôi, mở miệng lại không biết”."}, {"t": 589.6, "zh": "它是基础，不是终点，你得用对方法，一步步从跟读过渡到自己说。", "py": "Tā shì jīchǔ, búshì zhōngdiǎn, nǐ de yòng duì fāngfǎ, yíbùbù cóng gēndú guòdù dào zìjǐ shuō.", "vi": "Nó là nền tảng chứ không phải điểm cuối, bạn phải dùng đúng cách, từng bước chuyển từ đọc theo sang tự nói."}, {"t": 595.1, "zh": "那具体该怎么练呢？有没有简单好操作的方法，从跟读慢慢练到自己能说？", "py": "Nà jùtǐ gāi zěnme liàn ne? Yǒuméiyǒu jiǎndān hǎo cāozuò de fāngfǎ, cóng gēndú mànmàn liàn dào zìjǐ néng shuō?", "vi": "Vậy cụ thể nên luyện thế nào? Có cách nào đơn giản dễ làm để từ đọc theo dần dần luyện đến tự nói được không?", "sec": "Bốn bước luyện từ đọc theo đến tự nói"}, {"t": 602.6, "zh": "当然有，都是我教学里常用的方法，特别适合初中级的学习者，一共四步，每天练十五到二十分钟就行。", "py": "Dāngrán yǒu, dōu shì wǒ jiàoxué lǐ chángyòng de fāngfǎ, tèbié shìhé chūzhōngjí de xuéxízhě, yígòng sìbù, měitiān liàn shíwǔ dào èrshífēnzhōng jiù xíng.", "vi": "Dĩ nhiên có, đều là những cách mình hay dùng khi dạy, đặc biệt hợp với người học sơ trung cấp, tổng cộng bốn bước, mỗi ngày luyện mười lăm đến hai mươi phút là đủ."}, {"t": 609.5, "zh": "第一步是什么？", "py": "Dìyībù shì shénme?", "vi": "Bước thứ nhất là gì?"}, {"t": 611.1, "zh": "第一步，先做梯度跟读，不要上来就脱稿。", "py": "Dìyībù, xiān zuò tīdù gēndú, búyào shànglái jiù tuōgǎo.", "vi": "Bước một, làm đọc theo theo từng bậc, đừng vừa bắt đầu đã bỏ văn bản."}, {"t": 614.6, "zh": "先正常跟读，跟着音频读两三遍，读熟。", "py": "Xiān zhèngcháng gēndú, gēnzhe yīnpín dú liǎngsānbiàn, dúshú.", "vi": "Trước hết đọc theo bình thường, đọc theo audio hai ba lượt cho thuộc."}, {"t": 618.0, "zh": "然后看着文本不跟音频，自己读一遍。", "py": "Ránhòu kànzhe wénběn bù gēn yīnpín, zìjǐ dú yíbiàn.", "vi": "Sau đó nhìn văn bản, không theo audio, tự đọc một lượt."}, {"t": 621.6, "zh": "最后合上书，试着自己说一遍，想不起来再看一眼。", "py": "Zuìhòu hé shàngshū, shì zhe zìjǐ shuō yíbiàn, xiǎngbùqǐlái zài kàn yìyǎn.", "vi": "Cuối cùng gấp sách lại, thử tự nói một lượt, không nhớ ra thì nhìn lại một cái."}, {"t": 626.7, "zh": "就是从跟读音频到自己看着读，再到不看也能说，慢慢升级，对吧？", "py": "Jiù shìcóng gēndú yīnpín dào zìjǐ kànzhe dú, zài dào bú kàn yě néng shuō, mànmàn shēngjí, duì ba?", "vi": "Tức là từ đọc theo audio, đến tự nhìn mà đọc, rồi đến không nhìn cũng nói được, nâng cấp dần dần, đúng không?"}, {"t": 632.0, "zh": "对，不要一下子跳得太快，也不要永远停在第一步。", "py": "Duì, búyào yíxiàzi tiào de tài kuài, yě búyào yǒngyuǎn tíng zài dìyībù.", "vi": "Đúng, đừng nhảy quá nhanh một lúc, cũng đừng mãi dừng ở bước đầu."}, {"t": 636.0, "zh": "每篇课文都要走完这三步，才算真的练过。", "py": "Měipiān kèwén dōu yào zǒu wán zhè sānbù, cái suàn zhēnde liàn guò.", "vi": "Mỗi bài khóa đều phải đi hết ba bước này mới tính là thật sự đã luyện."}, {"t": 639.5, "zh": "第二步呢？", "py": "Dìèrbù ne?", "vi": "Bước hai thì sao?"}, {"t": 640.8, "zh": "第二步，做替换练习。", "py": "Dìèrbù, zuò tìhuàn liànxí.", "vi": "Bước hai, làm bài tập thay thế."}, {"t": 642.1, "zh": "这是从会背到会用最关键的一步。", "py": "Zhè shìcóng huì bèi dào huì yòng zuì guānjiàn de yíbù.", "vi": "Đây là bước then chốt nhất để từ biết thuộc đến biết dùng."}, {"t": 645.2, "zh": "比如课文里说“我喜欢吃苹果”，你就把“苹果”换成别的词：“我喜欢吃香蕉”“我喜欢吃面条”，再把“喜欢”换成“不喜欢”：“我不喜欢吃苹果”。", "py": "Bǐrú kèwén lǐ shuō \"wǒ xǐhuan chī píngguǒ\", nǐ jiù bǎ \"píngguǒ\" huànchéng biéde cí: \"wǒ xǐhuan chī xiāngjiāo\" \"wǒ xǐhuan chī miàntiáo\", zài bǎ \"xǐhuan\" huànchéng \"bù xǐhuan\": \"wǒ bù xǐhuan chī píngguǒ\".", "vi": "Ví dụ trong bài nói “tôi thích ăn táo”, bạn đổi “táo” thành từ khác: “tôi thích ăn chuối”, “tôi thích ăn mì”, rồi đổi “thích” thành “không thích”: “tôi không thích ăn táo”."}, {"t": 656.9, "zh": "哦，就是句子结构不变，换里面的词，自己造新句子。", "py": "Ò, jiùshì jùzi jiégòu búbiàn, huàn lǐmiàn de cí, zìjǐ zào xīn jùzi.", "vi": "Ồ, tức là cấu trúc câu giữ nguyên, thay từ bên trong, tự đặt câu mới."}, {"t": 662.8, "zh": "没错，这样你练的就不是一个句子，是一个句型。", "py": "Méicuò, zhèyàng nǐ liàn de jiù búshì yí ge jùzi, shì yí ge jùxíng.", "vi": "Đúng, như vậy bạn luyện không phải một câu mà là một mẫu câu."}, {"t": 665.6, "zh": "以后遇到类似的情况，你就能自己换词说，不用死背课文。", "py": "Yǐhòu yùdào lèisì de qíngkuàng, nǐ jiù néng zìjǐ huàn cí shuō, búyòng sǐbèi kèwén.", "vi": "Sau này gặp tình huống tương tự, bạn có thể tự đổi từ mà nói, không cần học vẹt bài khóa."}, {"t": 670.0, "zh": "比如学会“我想去北京”，你就能说“我想去上海”“我想去公园”，一下子就会了好多句子。", "py": "Bǐrú xuéhuì \"wǒ xiǎng qù běijīng\", nǐ jiù néng shuō \"wǒ xiǎng qù shànghǎi\" \"wǒ xiǎng qù gōngyuán\", yíxiàzi jiù huì le hǎoduō jùzi.", "vi": "Ví dụ học được “tôi muốn đi Bắc Kinh”, bạn sẽ nói được “tôi muốn đi Thượng Hải”, “tôi muốn đi công viên”, bỗng chốc biết thêm rất nhiều câu."}, {"t": 677.0, "zh": "这个方法太好了，既简单又有用。", "py": "Zhège fāngfǎ tàihǎole, jì jiǎndān yòu yǒuyòng.", "vi": "Cách này tuyệt quá, vừa đơn giản vừa hữu ích."}, {"t": 680.3, "zh": "第三步呢？", "py": "Dìsānbù ne?", "vi": "Bước ba thì sao?"}, {"t": 681.6, "zh": "第三步，练影子跟读，但重点不是模仿发音，是模仿节奏和结构。", "py": "Dìsānbù, liàn yǐngzigēndú, dàn zhòngdiǎn búshì mófǎng fāyīn, shì mófǎng jiézòu hé jiégòu.", "vi": "Bước ba, luyện shadowing (đọc đuổi theo như cái bóng), nhưng trọng tâm không phải bắt chước phát âm mà là bắt chước nhịp điệu và cấu trúc."}, {"t": 686.6, "zh": "影子跟读是什么？", "py": "Yǐngzigēndú shì shénme?", "vi": "Shadowing là gì?"}, {"t": 688.6, "zh": "就是音频说半句，你就跟着说半句，比他慢一点点，像影子一样跟着。", "py": "Jiùshì yīnpín shuō bànjù, nǐ jiù gēnzhe shuō bànjù, bǐ tā màn yìdiǎndiǎn, xiàng yǐngzi yíyàng gēnzhe.", "vi": "Là audio nói nửa câu, bạn nói theo nửa câu, chậm hơn một chút xíu, bám theo như cái bóng."}, {"t": 693.9, "zh": "很多人做影子跟读，只注意模仿声音准不准，其实更重要的是听他怎么停顿，怎么连起来说，哪个词快，哪个词慢。", "py": "Hěnduō rén zuò yǐngzigēndú, zhǐ zhùyì mófǎng shēngyīn zhǔn bùzhǔn, qíshí gèng zhòngyào de shì tīng tā zěnme tíngdùn, zěnme lián qǐlai shuō, nǎge cí kuài, nǎge cí màn.", "vi": "Nhiều người làm shadowing chỉ chú ý bắt chước âm có chuẩn không, thật ra quan trọng hơn là nghe họ ngắt nghỉ thế nào, nói liền ra sao, từ nào nhanh, từ nào chậm."}, {"t": 702.9, "zh": "这样练有什么好处？", "py": "Zhèyàng liàn yǒu shénme hǎochù?", "vi": "Luyện như vậy có lợi gì?"}, {"t": 705.8, "zh": "这样练久了，你说话就不用一个字一个字地想，会自然而然地按中文的节奏说出来。", "py": "Zhèyàng liàn jiǔ le, nǐ shuōhuà jiù búyòng yí ge zì yí ge zì de xiǎng, huì zìránérrán de àn zhōngwén de jiézòu shuō chūlái.", "vi": "Luyện lâu như vậy, khi nói bạn không phải nghĩ từng chữ từng chữ, mà sẽ tự nhiên nói ra theo nhịp điệu của tiếng Trung."}, {"t": 712.4, "zh": "不会出现“我—吃—饭—了”这样一个字一个字蹦的情况，说出来更自然。", "py": "Búhuì chūxiàn \"wǒ chī fàn le\" zhèyàng yí ge zì yí ge zì bèng de qíngkuàng, shuō chūlái gèng zìrán.", "vi": "Sẽ không xảy ra tình trạng nói từng chữ một kiểu “tôi—ăn—cơm—rồi”, nói ra tự nhiên hơn."}, {"t": 718.1, "zh": "那第四步就是自己开口练了吧？", "py": "Nà dìsìbù jiùshì zìjǐ kāikǒu liàn le ba?", "vi": "Vậy bước bốn là tự mở miệng luyện đúng không?"}, {"t": 721.4, "zh": "对，第四步，每天十分钟自言自语练习。", "py": "Duì, dìsìbù, měitiān shífēnzhōng zìyánzìyǔ liànxí.", "vi": "Đúng, bước bốn, mỗi ngày mười phút luyện tự nói chuyện một mình."}, {"t": 725.6, "zh": "不用跟别人说，就自己跟自己说。", "py": "Búyòng gēn biérén shuō, jiù zìjǐ gēn zìjǐ shuō.", "vi": "Không cần nói với người khác, tự nói với chính mình."}, {"t": 727.9, "zh": "比如你做饭的时候，用中文说：我现在要做饭，我要洗青菜，水开了。", "py": "Bǐrú nǐ zuòfàn de shíhou, yòng zhōngwén shuō: wǒ xiànzài yào zuòfàn, wǒ yào xǐ qīngcài, shuǐ kāi le.", "vi": "Ví dụ lúc nấu cơm, bạn nói bằng tiếng Trung: bây giờ tôi nấu cơm, tôi rửa rau, nước sôi rồi."}, {"t": 733.2, "zh": "走路的时候说：今天天气很好，路边的花开了。", "py": "Zǒulù de shíhou shuō: jīntiāntiānqì hěn hǎo, lùbiān de huā kāi le.", "vi": "Lúc đi bộ nói: hôm nay thời tiết rất đẹp, hoa bên đường đã nở."}, {"t": 738.0, "zh": "就是看到什么说什么，想到什么说什么，不用怕错。", "py": "Jiùshì kàndào shénme shuō shénme, xiǎngdào shénme shuō shénme, búyòng pàcuò.", "vi": "Tức là thấy gì nói nấy, nghĩ gì nói nấy, không cần sợ sai."}, {"t": 742.0, "zh": "没错，不用追求复杂的句子，简单的就行。", "py": "Méicuò, búyòng zhuīqiú fùzá de jùzi, jiǎndān de jiù xíng.", "vi": "Đúng, không cần theo đuổi câu phức tạp, đơn giản là được."}, {"t": 745.6, "zh": "重点是练习不用翻译，直接说中文的习惯。", "py": "Zhòngdiǎn shì liànxí búyòng fānyì, zhíjiē shuō zhōngwén de xíguàn.", "vi": "Trọng tâm là luyện thói quen không dịch, nói thẳng tiếng Trung."}, {"t": 749.0, "zh": "想到了什么，直接用中文说出来，别先想母语。", "py": "Xiǎngdào le shénme, zhíjiē yòng zhōngwén shuō chūlái, bié xiān xiǎng mǔyǔ.", "vi": "Nghĩ ra điều gì thì nói thẳng bằng tiếng Trung, đừng nghĩ tiếng mẹ đẻ trước."}, {"t": 752.5, "zh": "说多了，反应就越来越快。", "py": "Shuō duō le, fǎnyìng jiù yuèláiyuèkuài.", "vi": "Nói nhiều rồi, phản xạ sẽ ngày càng nhanh."}, {"t": 755.2, "zh": "而且自己跟自己说，不用怕说错，也没有压力，特别适合不敢开口的朋友。", "py": "Érqiě zìjǐ gēn zìjǐ shuō, búyòng pà shuōcuò, yě méiyǒu yālì, tèbié shìhé bùgǎn kāikǒu de péngyou.", "vi": "Hơn nữa tự nói với mình, không sợ sai, cũng không có áp lực, đặc biệt hợp với những bạn không dám mở miệng."}, {"t": 761.2, "zh": "对，这四步练下来，你就不是只会照着念了，是真的会自己组织语言，自己开口说。", "py": "Duì, zhè sìbù liànxiàlái, nǐ jiù búshì zhǐ huì zhàozhe niàn le, shì zhēnde huì zìjǐ zǔzhī yǔyán, zìjǐ kāikǒu shuō.", "vi": "Đúng, luyện xong bốn bước này, bạn không còn chỉ biết đọc theo nữa, mà thật sự biết tự tổ chức ngôn từ, tự mở miệng nói."}, {"t": 767.2, "zh": "坚持一个月，你就能明显感觉到自己说中文的时候卡壳越来越少了。", "py": "Jiānchí yígèyuè, nǐ jiù néng míngxiǎn gǎnjué dào zìjǐ shuō zhōngwén de shíhou qiǎké yuèláiyuèshǎo le.", "vi": "Kiên trì một tháng, bạn sẽ cảm nhận rõ khi nói tiếng Trung mình bị kẹt ngày càng ít."}, {"t": 774.1, "zh": "今天我们聊了很多，从跟读简单的原因，到开口难的四个原因，再到四个具体的练习方法。", "py": "Jīntiān wǒmen liáo le hěnduō, cóng gēndú jiǎndān de yuányīn, dào kāikǒu nán de sì ge yuányīn, zài dào sì ge jùtǐ de liànxí fāngfǎ.", "vi": "Hôm nay chúng ta nói nhiều thứ, từ lý do đọc theo dễ, đến bốn lý do mở miệng khó, rồi đến bốn cách luyện cụ thể.", "sec": "Tổng kết"}, {"t": 783.0, "zh": "其实总结起来就是一句话：跟读不是没用，它是基础，但不是终点。", "py": "Qíshí zǒngjié qǐlai jiùshì yíjù huà: gēndú búshì méiyòng, tā shì jīchǔ, dàn búshì zhōngdiǎn.", "vi": "Thật ra tóm lại chỉ một câu: đọc theo không vô dụng, nó là nền tảng nhưng không phải điểm cuối."}, {"t": 789.8, "zh": "从能跟读到能自己说，中间需要主动练习，需要一步步升级。", "py": "Cóng néng gēndú dào néng zìjǐ shuō, zhōngjiān xūyào zhǔdòng liànxí, xūyào yíbùbù shēngjí.", "vi": "Từ đọc theo được đến tự nói được, ở giữa cần luyện tập chủ động, cần nâng cấp từng bước."}, {"t": 797.4, "zh": "不是你学不会，是你还没练到那一步。", "py": "Búshì nǐ xué búhuì, shì nǐ hái méi liàn dào nà yíbù.", "vi": "Không phải bạn học không được, mà là bạn chưa luyện đến bước đó."}, {"t": 801.0, "zh": "语言学习没有捷径，但也没有那么难。", "py": "Yǔyán xuéxí méiyǒu jiéjìng, dàn yě méiyǒu nàme nán.", "vi": "Học ngôn ngữ không có đường tắt, nhưng cũng không khó đến thế."}, {"t": 804.3, "zh": "找对方法慢慢来，每天练一点，时间长了，自然就能流利地说出来。", "py": "Zhǎo duì fāngfǎ mànmànlái, měitiān liàn yìdiǎn, shíjiān zhǎng le, zìrán jiù néng liúlìdì shuō chūlái.", "vi": "Tìm đúng cách rồi từ từ, mỗi ngày luyện một chút, lâu dần tự nhiên sẽ nói trôi chảy."}, {"t": 810.9, "zh": "也想告诉大家，不用因为说不好就不敢开口。", "py": "Yě xiǎng gàosù dàjiā, búyòng yīnwèi shuō bùhǎo jiù bùgǎn kāikǒu.", "vi": "Cũng muốn nói với mọi người, đừng vì nói chưa tốt mà không dám mở miệng."}, {"t": 814.2, "zh": "所有说得好的人都是从磕磕巴巴开始的。", "py": "Suǒyǒu shuōdéhǎo de rén dōu shìcóng kēkēbābā kāishǐ de.", "vi": "Tất cả những người nói giỏi đều bắt đầu từ ấp úng."}, {"t": 819.2, "zh": "说错很正常，卡壳也很正常。", "py": "Shuōcuò hěn zhèngcháng, qiǎké yě hěn zhèngcháng.", "vi": "Nói sai rất bình thường, kẹt cũng rất bình thường."}, {"t": 822.1, "zh": "多练习几次就会越来越顺。", "py": "Duō liànxí jǐcì jiù huì yuèláiyuè shùn.", "vi": "Luyện thêm vài lần sẽ ngày càng trôi."}, {"t": 825.3, "zh": "欢迎大家在评论区留言：你有没有遇到过跟读很顺，开口不会的情况？你是怎么练习的？", "py": "Huānyíng dàjiā zài pínglùn qū liúyán: nǐ yǒuméiyǒu yùdào guò gēndú hěn shùn, kāikǒu búhuì de qíngkuàng? Nǐ shì zěnme liànxí de?", "vi": "Mời mọi người để lại bình luận: bạn có từng gặp tình trạng đọc theo rất trôi nhưng mở miệng lại không biết nói không? Bạn đã luyện thế nào?"}, {"t": 832.0, "zh": "今天的节目就到这里，感谢大家的收听。", "py": "Jīntiān de jiémù jiù dào zhèlǐ, gǎnxiè dàjiā de shōutīng.", "vi": "Chương trình hôm nay đến đây thôi, cảm ơn mọi người đã nghe."}, {"t": 836.9, "zh": "我们下期节目再见。", "py": "Wǒmen xiàqī jiémù zàijiàn.", "vi": "Hẹn gặp lại ở tập sau."}, {"t": 839.5, "zh": "再见。", "py": "Zàijiàn.", "vi": "Tạm biệt."}]},

vis:["Còn cậu thì sao? Buổi sáng cậu uống gì?", "Ừm, câu hỏi hay đấy.", "Chọn trà á? Cậu có nhiều loại trà lắm hả?", "Học tiếng Trung thật sự cần công phu.", "Quá trình pha trà cũng khá phức tạp.", "Không phải nước hoa, là mùi cà phê.", "Quá trình này làm mình thấy rất thư giãn.", "Có lúc mình thật sự thấy rất sốt ruột.", "Buổi sáng của mình hoàn toàn khác cậu đấy.", "Bạn vội thì nước quá nóng, trà sẽ không ngon.", "Ừ, mình có trà xanh, hồng trà, còn có cả trà ô long nữa.", "Vậy ngày nào cậu cũng đến cùng một quán à?", "Sáng nay cậu chắc chắn đã uống cà phê, đúng không?", "Vì chính quá trình này đã là một sự thưởng thức.", "Trà và cà phê, đây đúng là một chủ đề thú vị.", "Sáng nay mình ra khỏi nhà vội lắm, không xịt nước hoa.", "Mình cũng muốn kể cho cậu nghe thế giới cà phê thú vị đến mức nào.", "Trong lúc chờ nước sôi, mình chọn loại trà hôm nay sẽ uống.", "Lúc trời nóng mình thích uống trà xanh, cảm giác rất thanh mát.", "Mình đồng ý. Quán cà phê cũng đã trở thành một không gian giao lưu mới.", "Mình thấy quá trình học tiếng Trung giống như pha một tách công phu trà.", "Nghe có vẻ cậu thật sự yêu trà, giống như mình yêu cà phê vậy.", "Mình thì ngược lại hoàn toàn với cậu, buổi sáng mình thích từ từ pha một tách trà.", "Mình thấy cà phê rất giống cuộc sống ở thành phố bây giờ, nhịp độ rất nhanh.", "Các văn nhân thời xưa đều thích vừa uống trà vừa viết chữ, vẽ tranh.", "Giống như pha trà, mỗi bước bạn làm đều ảnh hưởng đến hương vị của trà.", "Mình thường dậy lúc bảy rưỡi, rồi rửa mặt, thay quần áo, tám giờ là phải ra khỏi nhà.", "Mình hiểu rồi, vậy mình chọn trà là vì mình thích nhịp sống buổi sáng.", "Ừm, trước đây có thể mình sẽ nghĩ vậy, nhưng từ khi quen cậu thì mình thấy không phải.", "Ừm, cái này đúng. Latte mình uống có rất nhiều sữa, calo có thể không thấp.", "Mình hoàn toàn đồng ý, nhất là mười năm nay, quán cà phê ở Trung Quốc mở ngày càng nhiều.", "Mình thấy điều này cho thấy Trung Quốc đang ngày càng cởi mở, ngày càng quốc tế hóa.", "Nhà mình có khách đến, việc đầu tiên bố mẹ mình làm là pha trà mời khách.", "Mình thích vừa đi bộ vừa uống cà phê, cà phê nóng làm mình thấy rất tỉnh táo.", "Ở Trung Quốc, ngày càng nhiều người bắt đầu thích cà phê, nhưng trà thì đã có lịch sử mấy nghìn năm.", "Bạn cần mỗi ngày dành một chút thời gian, giống như mỗi ngày tráng đồ trà, đun nước, pha trà vậy.", "Thư giãn là một lý do, còn một lý do rất quan trọng nữa, mình thấy uống trà tốt cho sức khỏe.", "Nhưng tuy cà phê rất thịnh hành, vị trí của trà trong lòng người Trung Quốc vẫn rất quan trọng.", "Mình có nghe nói, uống trà sáng có phải là vừa uống trà vừa ăn nhiều món điểm tâm nhỏ ngon lắm không?", "Đúng. Nên cậu xem, cà phê đại diện cho một cách giao lưu mới, quốc tế hóa, nhịp độ nhanh.", "Cậu nói đúng, nên hôm nay chúng ta sẽ nói về chuyện này: trà hay cà phê? Vì sao cậu chọn nó?", "Đúng. Công phu trà nghĩa là bạn cần dùng nhiều thời gian và tâm sức để pha một tách trà thật nghiêm túc.", "Muốn pha công phu trà, bạn cần kiên nhẫn, cần thời gian, cần làm từng bước một, không được vội.", "Vậy nên đừng vội, cứ từ từ, tận hưởng quá trình học tiếng Trung, giống như tận hưởng quá trình pha trà.", "Trong bộ đồ trà có rất nhiều kiến thức, mình thấy việc tìm hiểu những kiến thức đó tự nó đã là một chuyện rất thú vị.", "Mình hiểu rồi, vậy trọng tâm của công phu trà không phải là uống, mà là quá trình đó và thời gian ngồi trò chuyện bên nhau.", "Quan trọng nhất là tin vào sức mạnh của công phu, tin rằng thời gian và nỗ lực bạn bỏ ra mỗi ngày đều không uổng phí.", "Còn trà, nhất là như công phu trà, đại diện cho một cách giao lưu truyền thống, yên tĩnh, nhịp độ chậm.", "Nó cần thời gian, cần kiên nhẫn, cần chúng ta tận hưởng quá trình, chứ không phải chỉ nghĩ đến một kết quả nhanh chóng."],

lines:[{"t": 7.0, "zh": "大家好，欢迎收听每天中文，我是李明。", "py": "Dàjiā hǎo, huānyíng shōutīng měitiān zhōngwén, wǒ shì Lǐ Míng.", "vi": "Chào mọi người, chào mừng đến với Mỗi Ngày Trung Văn, mình là Lý Minh.", "sec": "Mở đầu: mùi cà phê trên người cậu"}, {"t": 11.0, "zh": "大家好，我是王羽，很高兴又和大家见面了。", "py": "Dàjiā hǎo, wǒ shì Wáng Yǔ, hěn gāoxìng yòu hé dàjiā jiànmiàn le.", "vi": "Chào mọi người, mình là Vương Vũ, rất vui lại được gặp mọi người."}, {"t": 16.9, "zh": "王羽啊，我们又见面了。", "py": "Wáng Yǔ a, wǒmen yòu jiànmiàn le.", "vi": "Vương Vũ à, mình lại gặp nhau rồi."}, {"t": 18.0, "zh": "我闻到你身上的味道了。", "py": "Wǒ wén dào nǐ shēnshàng de wèidào le.", "vi": "Mình ngửi thấy mùi trên người cậu rồi đấy."}, {"t": 21.1, "zh": "味道？什么味道？", "py": "Wèidào? Shénme wèidào?", "vi": "Mùi á? Mùi gì cơ?"}, {"t": 22.6, "zh": "我今天早上出门很着急，没有用香水。", "py": "Wǒ jīntiān zǎoshàng chūmén hěn zháojí, méiyǒu yòng xiāngshuǐ.", "vi": "Sáng nay mình ra khỏi nhà vội lắm, không xịt nước hoa."}, {"t": 27.5, "zh": "不是香水，是咖啡的味道。", "py": "Búshì xiāngshuǐ, shì kāfēi de wèidào.", "vi": "Không phải nước hoa, là mùi cà phê."}, {"t": 30.4, "zh": "你今天早上一定喝咖啡了，对不对？", "py": "Nǐ jīntiān zǎoshàng yídìng hē kāfēi le, duì bú duì?", "vi": "Sáng nay cậu chắc chắn đã uống cà phê, đúng không?"}, {"t": 35.2, "zh": "鼻子真好！", "py": "Bízi zhēn hǎo!", "vi": "Mũi cậu thính thật!"}, {"t": 36.6, "zh": "是的，我每天早上都要喝一杯咖啡。", "py": "Shì de, wǒ měitiān zǎoshàng dōu yào hē yì bēi kāfēi.", "vi": "Đúng vậy, sáng nào mình cũng phải uống một ly cà phê."}, {"t": 40.8, "zh": "没有咖啡，我感觉一天都不能开始。", "py": "Méiyǒu kāfēi, wǒ gǎnjué yì tiān dōu bùnéng kāishǐ.", "vi": "Không có cà phê là mình thấy cả ngày không thể bắt đầu được."}, {"t": 45.4, "zh": "你呢？你早上喝什么？", "py": "Nǐ ne? Nǐ zǎoshàng hē shénme?", "vi": "Còn cậu thì sao? Buổi sáng cậu uống gì?"}, {"t": 48.0, "zh": "我正好和你相反，我早上喜欢慢慢地泡一杯茶。", "py": "Wǒ zhènghǎo hé nǐ xiāngfǎn, wǒ zǎoshàng xǐhuan mànmàn de pào yì bēi chá.", "vi": "Mình thì ngược lại hoàn toàn với cậu, buổi sáng mình thích từ từ pha một tách trà."}, {"t": 54.1, "zh": "茶的味道让我觉得很舒服，很安静。", "py": "Chá de wèidào ràng wǒ juéde hěn shūfu, hěn ānjìng.", "vi": "Mùi trà làm mình thấy rất dễ chịu, rất yên tĩnh."}, {"t": 58.5, "zh": "茶和咖啡，这真是一个有意思的话题。", "py": "Chá hé kāfēi, zhè zhēnshì yí ge yǒu yìsi de huàtí.", "vi": "Trà và cà phê, đây đúng là một chủ đề thú vị."}, {"t": 62.9, "zh": "在中国，越来越多的人开始喜欢咖啡，但是茶有几千年的历史。", "py": "Zài zhōngguó, yuèláiyuè duō de rén kāishǐ xǐhuan kāfēi, dànshì chá yǒu jǐqiānnián de lìshǐ.", "vi": "Ở Trung Quốc, ngày càng nhiều người bắt đầu thích cà phê, nhưng trà thì đã có lịch sử mấy nghìn năm."}, {"t": 70.7, "zh": "说得对，所以我们今天就来聊一聊这个：茶还是咖啡？你为什么选择它？", "py": "Shuō de duì, suǒyǐ wǒmen jīntiān jiù lái liáo yì liáo zhège: chá háishì kāfēi? Nǐ wèishénme xuǎnzé tā?", "vi": "Cậu nói đúng, nên hôm nay chúng ta sẽ nói về chuyện này: trà hay cà phê? Vì sao cậu chọn nó?"}, {"t": 79.5, "zh": "好主意！我很想听听你为什么那么喜欢喝茶。", "py": "Hǎo zhǔyì! Wǒ hěn xiǎng tīngting nǐ wèishénme nàme xǐhuan hē chá.", "vi": "Ý hay đấy! Mình rất muốn nghe vì sao cậu thích uống trà đến thế."}, {"t": 85.1, "zh": "我也想告诉你，咖啡的世界多么有意思。", "py": "Wǒ yě xiǎng gàosù nǐ, kāfēi de shìjiè duōme yǒu yìsi.", "vi": "Mình cũng muốn kể cho cậu nghe thế giới cà phê thú vị đến mức nào."}, {"t": 89.2, "zh": "好的，那我们就从我们每个人的选择开始吧。", "py": "Hǎo de, nà wǒmen jiù cóng wǒmen měi gè rén de xuǎnzé kāishǐ ba.", "vi": "Được, vậy mình bắt đầu từ lựa chọn của mỗi người nhé."}, {"t": 93.7, "zh": "好的，李明，你先说吧。", "py": "Hǎo de, Lǐ Míng, nǐ xiān shuō ba.", "vi": "Được rồi, Lý Minh, cậu nói trước đi.", "sec": "Buổi sáng của người uống trà"}, {"t": 95.2, "zh": "你每天早上的喝茶时间是什么样的？", "py": "Nǐ měitiān zǎoshàng de hē chá shíjiān shì shénme yàng de?", "vi": "Giờ uống trà mỗi sáng của cậu như thế nào?"}, {"t": 100.5, "zh": "我的早上很简单，也很慢。", "py": "Wǒ de zǎoshàng hěn jiǎndān, yě hěn màn.", "vi": "Buổi sáng của mình rất đơn giản, và cũng rất chậm."}, {"t": 103.1, "zh": "我一般早上七点起床，然后我会先去厨房烧水。", "py": "Wǒ yìbān zǎoshàng qī diǎn qǐchuáng, ránhòu wǒ huì xiān qù chúfáng shāoshuǐ.", "vi": "Mình thường dậy lúc bảy giờ sáng, rồi việc đầu tiên là vào bếp đun nước."}, {"t": 108.0, "zh": "在等水开的时候，我会选今天要喝的茶。", "py": "Zài děng shuǐ kāi de shíhou, wǒ huì xuǎn jīntiān yào hē de chá.", "vi": "Trong lúc chờ nước sôi, mình chọn loại trà hôm nay sẽ uống."}, {"t": 113.5, "zh": "选茶？你有很多种茶吗？", "py": "Xuǎn chá? Nǐ yǒu hěn duō zhǒng chá ma?", "vi": "Chọn trà á? Cậu có nhiều loại trà lắm hả?"}, {"t": 116.6, "zh": "是的，我有绿茶、红茶，还有乌龙茶。", "py": "Shì de, wǒ yǒu lǜchá, hóngchá, háiyǒu wūlóngchá.", "vi": "Ừ, mình có trà xanh, hồng trà, còn có cả trà ô long nữa."}, {"t": 120.1, "zh": "天气热的时候，我喜欢喝绿茶，感觉很清爽。", "py": "Tiānqì rè de shíhou, wǒ xǐhuan hē lǜchá, gǎnjué hěn qīngshuǎng.", "vi": "Lúc trời nóng mình thích uống trà xanh, cảm giác rất thanh mát."}, {"t": 124.8, "zh": "天气冷的时候，我喜欢喝红茶，感觉很暖和。", "py": "Tiānqì lěng de shíhou, wǒ xǐhuan hē hóngchá, gǎnjué hěn nuǎnhuo.", "vi": "Lúc trời lạnh mình thích uống hồng trà, cảm giác rất ấm."}, {"t": 129.4, "zh": "听起来很专业呀！", "py": "Tīng qǐlai hěn zhuānyè ya!", "vi": "Nghe chuyên nghiệp quá!"}, {"t": 132.0, "zh": "然后呢？", "py": "Ránhòu ne?", "vi": "Rồi sao nữa?"}, {"t": 133.3, "zh": "水开了以后，我用热水先把茶杯和茶壶洗一下，让它们变热。", "py": "Shuǐ kāi le yǐhòu, wǒ yòng rèshuǐ xiān bǎ chábēi hé cháhú xǐ yíxià, ràng tāmen biàn rè.", "vi": "Nước sôi rồi, mình dùng nước nóng tráng qua chén và ấm trà trước, cho chúng nóng lên."}, {"t": 140.7, "zh": "然后把茶叶放进茶壶，倒进热水，等一两分钟就可以喝了。", "py": "Ránhòu bǎ cháyè fàngjìn cháhú, dào jìn rèshuǐ, děng yì liǎng fēnzhōng jiù kěyǐ hē le.", "vi": "Sau đó cho lá trà vào ấm, rót nước nóng vào, chờ một hai phút là uống được."}, {"t": 147.4, "zh": "哇，听你这么说，我觉得喝茶需要很多时间。", "py": "Wa, tīng nǐ zhème shuō, wǒ juéde hē chá xūyào hěn duō shíjiān.", "vi": "Chà, nghe cậu nói thế mình thấy uống trà cần nhiều thời gian thật."}, {"t": 154.0, "zh": "是的，需要一点时间，但我不觉得这是浪费时间。", "py": "Shì de, xūyào yìdiǎn shíjiān, dàn wǒ bù juéde zhè shì làngfèi shíjiān.", "vi": "Ừ, cần một chút thời gian, nhưng mình không thấy đó là lãng phí."}, {"t": 158.7, "zh": "在这个时间里啊，我可以什么都不想，只看着茶叶在水里慢慢打开。", "py": "Zài zhège shíjiān lǐ a, wǒ kěyǐ shénme dōu bùxiǎng, zhǐ kànzhe cháyè zài shuǐ lǐ mànmàn dǎkāi.", "vi": "Trong khoảng thời gian đó, mình có thể chẳng nghĩ gì cả, chỉ nhìn lá trà từ từ nở ra trong nước."}, {"t": 164.7, "zh": "这个过程让我觉得很放松。", "py": "Zhège guòchéng ràng wǒ juéde hěn fàngsōng.", "vi": "Quá trình này làm mình thấy rất thư giãn."}, {"t": 167.3, "zh": "然后我会端着我的茶，坐在窗户旁边，一边喝茶，一边看书，或者想一想今天要做的事情。", "py": "Ránhòu wǒ huì duān zhe wǒ de chá, zuòzài chuānghù pángbiān, yìbiān hē chá, yìbiān kànshū, huòzhě xiǎngyìxiǎng jīntiān yào zuò de shìqing.", "vi": "Rồi mình bưng tách trà ngồi cạnh cửa sổ, vừa uống trà vừa đọc sách, hoặc nghĩ xem hôm nay phải làm những việc gì."}, {"t": 176.1, "zh": "太美好了，听起来像电影里的生活。", "py": "Tài měihǎo le, tīng qǐlai xiàng diànyǐng lǐ de shēnghuó.", "vi": "Đẹp quá, nghe như cuộc sống trong phim vậy."}, {"t": 180.0, "zh": "我的早上和你完全不一样哦。", "py": "Wǒ de zǎoshàng hé nǐ wánquán bù yíyàng ò.", "vi": "Buổi sáng của mình hoàn toàn khác cậu đấy.", "sec": "Buổi sáng của người uống cà phê"}, {"t": 183.8, "zh": "说来听听，你早上的咖啡时间是什么样的？", "py": "Shuō lái tīngting, nǐ zǎoshàng de kāfēi shíjiān shì shénme yàng de?", "vi": "Kể nghe xem nào, giờ cà phê buổi sáng của cậu như thế nào?"}, {"t": 189.1, "zh": "我的早上啊，可以用一个字来说，就是“快”。", "py": "Wǒ de zǎoshàng a, kěyǐ yòng yí ge zì láishuō, jiùshì \"kuài\".", "vi": "Buổi sáng của mình ấy à, có thể nói bằng một chữ, đó là “nhanh”."}, {"t": 193.4, "zh": "我一般七点半起床，然后洗脸，换衣服，八点就要出门。", "py": "Wǒ yìbān qī diǎn bàn qǐchuáng, ránhòu xǐ liǎn, huàn yīfu, bā diǎn jiù yào chūmén.", "vi": "Mình thường dậy lúc bảy rưỡi, rồi rửa mặt, thay quần áo, tám giờ là phải ra khỏi nhà."}, {"t": 199.4, "zh": "我没有时间在家里做咖啡。", "py": "Wǒ méiyǒu shíjiān zài jiālǐ zuò kāfēi.", "vi": "Mình không có thời gian pha cà phê ở nhà."}, {"t": 202.5, "zh": "那你在哪里喝咖啡呢？", "py": "Nà nǐ zài nǎlǐ hē kāfēi ne?", "vi": "Vậy cậu uống cà phê ở đâu?"}, {"t": 204.8, "zh": "我家楼下就有一个咖啡店，我每天出门的时候都会去那里买一杯拿铁。", "py": "Wǒ jiā lóuxià jiù yǒu yí ge kāfēidiàn, wǒ měitiān chūmén de shíhou dū huì qù nàlǐ mǎi yì bēi nátiě.", "vi": "Ngay dưới nhà mình có một quán cà phê, ngày nào ra khỏi nhà mình cũng ghé đó mua một ly latte."}, {"t": 211.2, "zh": "我喜欢一边走路一边喝咖啡，热的咖啡让我觉得很有精神。", "py": "Wǒ xǐhuan yìbiān zǒulù yìbiān hē kāfēi, rè de kāfēi ràng wǒ juéde hěn yǒu jīngshén.", "vi": "Mình thích vừa đi bộ vừa uống cà phê, cà phê nóng làm mình thấy rất tỉnh táo."}, {"t": 218.6, "zh": "所以你每天都去同一个咖啡店？", "py": "Suǒyǐ nǐ měitiān dōu qù tóng yí ge kāfēidiàn?", "vi": "Vậy ngày nào cậu cũng đến cùng một quán à?"}, {"t": 222.4, "zh": "对，那个咖啡店的店员都认识我了。", "py": "Duì, nàge kāfēidiàn de diànyuán dōu rènshi wǒ le.", "vi": "Ừ, nhân viên quán đó nhận ra mình hết rồi."}, {"t": 226.1, "zh": "他们看到我就会问：“王小姐，今天还是一杯热拿铁呢？”", "py": "Tāmen kàndào wǒ jiù huì wèn: \"Wáng xiǎojiě, jīntiān háishì yì bēi rè nátiě ne?\"", "vi": "Họ thấy mình là hỏi: “Chị Vương, hôm nay vẫn là một ly latte nóng ạ?”"}, {"t": 232.3, "zh": "我觉得这样很亲切，也很快，很方便。", "py": "Wǒ juéde zhèyàng hěn qīnqiè, yě hěn kuài, hěn fāngbiàn.", "vi": "Mình thấy như vậy rất thân thiện, lại nhanh, lại tiện."}, {"t": 235.3, "zh": "我明白了，所以我选择茶，是因为我喜欢早上的生活。", "py": "Wǒ míngbai le, suǒyǐ wǒ xuǎnzé chá, shì yīnwèi wǒ xǐhuan zǎoshàng de shēnghuó.", "vi": "Mình hiểu rồi, vậy mình chọn trà là vì mình thích nhịp sống buổi sáng."}, {"t": 241.9, "zh": "你选择咖啡，是因为你需要快和方便。", "py": "Nǐ xuǎnzé kāfēi, shì yīnwèi nǐ xūyào kuài hé fāngbiàn.", "vi": "Còn cậu chọn cà phê là vì cậu cần nhanh và tiện."}, {"t": 247.0, "zh": "可以这么说。", "py": "Kěyǐ zhème shuō.", "vi": "Có thể nói vậy."}, {"t": 248.6, "zh": "我觉得咖啡和现在城市的生活很像，节奏很快。", "py": "Wǒ juéde kāfēi hé xiànzài chéngshì de shēnghuó hěn xiàng, jiézòu hěn kuài.", "vi": "Mình thấy cà phê rất giống cuộc sống ở thành phố bây giờ, nhịp độ rất nhanh."}, {"t": 254.5, "zh": "茶呢，更像是一种传统的生活方式，需要慢慢来。", "py": "Chá ne, gèng xiàng shì yì zhǒng chuántǒng de shēnghuófāngshì, xūyào mànmàn lái.", "vi": "Còn trà thì giống một lối sống truyền thống hơn, cần phải từ từ."}, {"t": 260.2, "zh": "王羽，你刚才说你喝咖啡是为了让自己有精神，除了这个，还有别的原因吗？", "py": "Wáng Yǔ, nǐ gāngcái shuō nǐ hē kāfēi shì wèile ràng zìjǐ yǒu jīngshén, chúle zhège, háiyǒu biéde yuányīn ma?", "vi": "Vương Vũ, vừa nãy cậu nói uống cà phê là để mình tỉnh táo, ngoài điều đó ra còn lý do nào khác không?", "sec": "Vì sao Vương Vũ thích cà phê"}, {"t": 268.8, "zh": "你为什么那么喜欢咖啡？", "py": "Nǐ wèishénme nàme xǐhuan kāfēi?", "vi": "Vì sao cậu thích cà phê đến thế?"}, {"t": 271.1, "zh": "嗯，这是一个好问题。", "py": "Èn, zhè shì yí ge hǎo wèntí.", "vi": "Ừm, câu hỏi hay đấy."}, {"t": 273.1, "zh": "我觉得，第一，我真的很喜欢咖啡的味道。", "py": "Wǒ juéde, dìyī, wǒ zhēn de hěn xǐhuan kāfēi de wèidào.", "vi": "Mình nghĩ, thứ nhất, mình thật sự thích hương vị cà phê."}, {"t": 279.0, "zh": "苦苦的，但是又很香。", "py": "Kǔkǔ de, dànshì yòu hěn xiāng.", "vi": "Đắng đắng, nhưng lại rất thơm."}, {"t": 282.0, "zh": "特别是拿铁，里面有牛奶，所以味道更好。", "py": "Tèbié shì nátiě, lǐmiàn yǒu niúnǎi, suǒyǐ wèidào gèng hǎo.", "vi": "Nhất là latte, bên trong có sữa nên vị ngon hơn."}, {"t": 287.4, "zh": "我喝过一次美式咖啡，太苦了，我不太喜欢。", "py": "Wǒ hē guò yícì měishìkāfēi, tài kǔ le, wǒ bú tài xǐhuan.", "vi": "Mình từng uống một lần cà phê Americano, đắng quá, mình không thích lắm."}, {"t": 292.8, "zh": "美式咖啡是比较苦，你可以试试拿铁或者卡布奇诺。", "py": "Měishìkāfēi shì bǐjiào kǔ, nǐ kěyǐ shìshi nátiě huòzhě kǎbùqínuò.", "vi": "Americano đúng là khá đắng, cậu có thể thử latte hoặc cappuccino."}, {"t": 299.1, "zh": "第二，就像我刚才说的，它能让我很快有精神，开始一天的工作。", "py": "Dìèr, jiù xiàng wǒ gāngcái shuō de, tā néng ràng wǒ hěn kuài yǒu jīngshén, kāishǐ yì tiān de gōngzuò.", "vi": "Thứ hai, như mình vừa nói, nó giúp mình tỉnh táo rất nhanh để bắt đầu công việc một ngày."}, {"t": 306.0, "zh": "你知道，我的工作需要想很多新的东西，它真的能帮助我。", "py": "Nǐ zhīdao, wǒ de gōngzuò xūyào xiǎng hěn duō xīn de dōngxi, tā zhēn de néng bāngzhù wǒ.", "vi": "Cậu biết đấy, công việc của mình cần nghĩ ra rất nhiều thứ mới, nó thật sự giúp được mình."}, {"t": 312.1, "zh": "我理解。", "py": "Wǒ lǐjiě.", "vi": "Mình hiểu."}, {"t": 312.7, "zh": "还有一个很重要的原因，我喜欢咖啡店那个地方。", "py": "Háiyǒu yí ge hěn zhòngyào de yuányīn, wǒ xǐhuan kāfēidiàn nàge dìfang.", "vi": "Còn một lý do rất quan trọng nữa, mình thích không gian quán cà phê."}, {"t": 319.6, "zh": "周末的时候，我常常和朋友去咖啡店见面。", "py": "Zhōumò de shíhou, wǒ chángcháng hé péngyou qù kāfēidiàn jiànmiàn.", "vi": "Cuối tuần mình hay hẹn bạn bè gặp nhau ở quán cà phê."}, {"t": 323.7, "zh": "你们在咖啡店做什么？", "py": "Nǐmen zài kāfēidiàn zuò shénme?", "vi": "Mọi người làm gì ở quán cà phê?"}, {"t": 326.3, "zh": "聊天啊，或者一起看书，用电脑工作。", "py": "Liáotiān a, huòzhě yìqǐ kànshū, yòng diànnǎo gōngzuò.", "vi": "Trò chuyện thôi, hoặc cùng đọc sách, dùng máy tính làm việc."}, {"t": 330.1, "zh": "咖啡店的环境很好，有舒服的椅子，好听的音乐。", "py": "Kāfēidiàn de huánjìng hěn hǎo, yǒu shūfu de yǐzi, hǎotīng de yīnyuè.", "vi": "Môi trường quán cà phê rất tốt, có ghế ngồi thoải mái, nhạc nghe hay."}, {"t": 335.7, "zh": "大家都在那里做自己的事情，感觉很自由，也很舒服。", "py": "Dàjiā dōu zài nàlǐ zuò zìjǐ de shìqing, gǎnjué hěn zìyóu, yě hěn shūfu.", "vi": "Ai cũng làm việc của riêng mình ở đó, cảm giác rất tự do, cũng rất dễ chịu."}, {"t": 341.6, "zh": "我觉得咖啡店现在是很多年轻人喜欢去的社交的地方。", "py": "Wǒ juéde kāfēidiàn xiànzài shì hěn duō niánqīngrén xǐhuan qù de shèjiāo de dìfang.", "vi": "Mình thấy quán cà phê bây giờ là nơi giao lưu mà nhiều bạn trẻ thích đến."}, {"t": 349.0, "zh": "这倒是真的。", "py": "Zhè dǎo shì zhēn de.", "vi": "Cái này đúng thật."}, {"t": 350.3, "zh": "现在北京、上海的街上到处都是咖啡店。", "py": "Xiànzài běijīng, shànghǎi de jiēshàng dàochù dōu shì kāfēidiàn.", "vi": "Bây giờ trên phố Bắc Kinh, Thượng Hải đâu đâu cũng là quán cà phê."}, {"t": 353.8, "zh": "我有时候路过，也看到里面坐满了年轻人。", "py": "Wǒ yǒu shíhou lùguò, yě kàndào lǐmiàn zuòmǎn le niánqīngrén.", "vi": "Thỉnh thoảng đi ngang qua, mình cũng thấy bên trong ngồi đầy các bạn trẻ."}, {"t": 357.4, "zh": "那我问你，你觉得喝茶是老年人才做的事情吗？", "py": "Nà wǒ wèn nǐ, nǐ juéde hē chá shì lǎoniánrén cái zuò de shìqing ma?", "vi": "Vậy mình hỏi cậu, cậu có thấy uống trà là việc chỉ người lớn tuổi mới làm không?"}, {"t": 362.2, "zh": "嗯，以前我可能会这么想，但是认识你以后，我觉得不是。", "py": "Èn, yǐqián wǒ kěnéng huì zhème xiǎng, dànshì rènshi nǐ yǐhòu, wǒ juéde búshì.", "vi": "Ừm, trước đây có thể mình sẽ nghĩ vậy, nhưng từ khi quen cậu thì mình thấy không phải."}, {"t": 369.6, "zh": "你就不老。哈哈。", "py": "Nǐ jiù bù lǎo. Hāhā.", "vi": "Cậu đâu có già. Haha."}, {"t": 371.4, "zh": "那你呢，李明？你为什么那么喜欢茶？", "py": "Nà nǐ ne, Lǐ Míng? Nǐ wèishénme nàme xǐhuan chá?", "vi": "Thế còn cậu, Lý Minh? Vì sao cậu thích trà đến vậy?", "sec": "Vì sao Lý Minh thích trà"}, {"t": 375.0, "zh": "只是因为它让你放松吗？", "py": "Zhǐshì yīnwèi tā ràng nǐ fàngsōng ma?", "vi": "Chỉ vì nó giúp cậu thư giãn thôi sao?"}, {"t": 377.8, "zh": "放松是一个原因，还有一个很重要的原因，我觉得喝茶对身体好。", "py": "Fàngsōng shì yí ge yuányīn, háiyǒu yí ge hěn zhòngyào de yuányīn, wǒ juéde hē chá duì shēntǐ hǎo.", "vi": "Thư giãn là một lý do, còn một lý do rất quan trọng nữa, mình thấy uống trà tốt cho sức khỏe."}, {"t": 384.0, "zh": "对身体好？怎么说？", "py": "Duì shēntǐ hǎo? Zěnme shuō?", "vi": "Tốt cho sức khỏe? Sao lại nói vậy?"}, {"t": 386.2, "zh": "很多书上都说，茶叶里有很多好的东西，可以帮助你的身体。", "py": "Hěn duō shū shàng dōu shuō, cháyè lǐ yǒu hěn duō hǎo de dōngxi, kěyǐ bāngzhù nǐ de shēntǐ.", "vi": "Nhiều sách nói trong lá trà có rất nhiều thứ tốt, có thể giúp ích cho cơ thể."}, {"t": 393.2, "zh": "比如绿茶，可以帮助你不容易老。", "py": "Bǐrú lǜchá, kěyǐ bāngzhù nǐ bù róngyì lǎo.", "vi": "Ví dụ trà xanh có thể giúp bạn lâu già."}, {"t": 396.1, "zh": "当然，这个需要长时间喝才有用。", "py": "Dāngrán, zhège xūyào cháng shíjiān hē cái yǒu yòng.", "vi": "Dĩ nhiên, cái này phải uống lâu dài mới có tác dụng."}, {"t": 399.3, "zh": "但是喝茶不加糖，不加奶，所以它没有很多热量，不会让你变胖。", "py": "Dànshì hē chá bù jiā táng, bù jiā nǎi, suǒyǐ tā méiyǒu hěn duō rèliàng, bú huì ràng nǐ biàn pàng.", "vi": "Nhưng uống trà không cho đường, không cho sữa, nên nó không có nhiều calo, không làm bạn béo lên."}, {"t": 406.2, "zh": "嗯，这倒是。我喝的拿铁里面有很多牛奶，热量可能不低。", "py": "Èn, zhè dǎo shì. Wǒ hē de nátiě lǐmiàn yǒu hěn duō niúnǎi, rèliàng kěnéng bù dī.", "vi": "Ừm, cái này đúng. Latte mình uống có rất nhiều sữa, calo có thể không thấp."}, {"t": 413.2, "zh": "而且啊，我觉得喝茶是一种文化，茶有中国几千年的历史了。", "py": "Érqiě a, wǒ juéde hē chá shì yì zhǒng wénhuà, chá yǒu zhōngguó jǐqiānnián de lìshǐ le.", "vi": "Hơn nữa, mình thấy uống trà là một nét văn hóa, trà có mấy nghìn năm lịch sử ở Trung Quốc rồi."}, {"t": 420.0, "zh": "古代的文人，他们都喜欢一边喝茶一边写字画画。", "py": "Gǔdài de wénrén, tāmen dōu xǐhuan yìbiān hē chá yìbiān xiězì huàhuà.", "vi": "Các văn nhân thời xưa đều thích vừa uống trà vừa viết chữ, vẽ tranh."}, {"t": 423.6, "zh": "我觉得喝茶的时候，能感受到这种中国文化。", "py": "Wǒ juéde hē chá de shíhou, néng gǎnshòu dào zhè zhǒng zhōngguó wénhuà.", "vi": "Mình thấy lúc uống trà có thể cảm nhận được nét văn hóa Trung Hoa này."}, {"t": 430.3, "zh": "哇，你把喝茶说得这么有意思！", "py": "Wa, nǐ bǎ hē chá shuō de zhème yǒu yìsi!", "vi": "Chà, cậu nói chuyện uống trà thú vị quá!"}, {"t": 433.2, "zh": "我以前觉得喝茶就是喝一杯热水。", "py": "Wǒ yǐqián juéde hē chá jiùshì hē yì bēi rèshuǐ.", "vi": "Trước đây mình nghĩ uống trà chỉ là uống một ly nước nóng."}, {"t": 437.7, "zh": "不一样的，不同的茶有不同的味道，需要用不同的水温、不同的时间。", "py": "Bù yíyàng de, bùtóng de chá yǒu bùtóng de wèidào, xūyào yòng bùtóng de shuǐwēn, bùtóng de shíjiān.", "vi": "Không giống đâu, mỗi loại trà có một hương vị khác nhau, cần dùng nhiệt độ nước khác nhau, thời gian khác nhau."}, {"t": 446.6, "zh": "茶具里面有很多知识，我觉得研究这些知识本身就是一件很有意思的事。", "py": "Chájù lǐmiàn yǒu hěn duō zhīshí, wǒ juéde yánjiū zhèxiē zhīshí běnshēn jiùshì yí jiàn hěn yǒu yìsi de shì.", "vi": "Trong bộ đồ trà có rất nhiều kiến thức, mình thấy việc tìm hiểu những kiến thức đó tự nó đã là một chuyện rất thú vị."}, {"t": 453.8, "zh": "听起来你真的很爱茶，就像我很爱咖啡一样。", "py": "Tīng qǐlai nǐ zhēn de hěn ài chá, jiù xiàng wǒ hěn ài kāfēi yíyàng.", "vi": "Nghe có vẻ cậu thật sự yêu trà, giống như mình yêu cà phê vậy."}, {"t": 459.2, "zh": "是的，我们都找到了自己喜欢的饮料。", "py": "Shì de, wǒmen dōu zhǎodào le zìjǐ xǐhuan de yǐnliào.", "vi": "Đúng thế, cả hai ta đều tìm được thức uống mình thích."}, {"t": 463.7, "zh": "李明，你刚才说茶是中国几千年的文化，但是现在我觉得在中国，咖啡也变得非常流行了，你觉得呢？", "py": "Lǐ Míng, nǐ gāngcái shuō chá shì zhōngguó jǐqiānnián de wénhuà, dànshì xiànzài wǒ juéde zài zhōngguó, kāfēi yě biàn de fēicháng liúxíng le, nǐ juéde ne?", "vi": "Lý Minh, vừa nãy cậu nói trà là văn hóa mấy nghìn năm của Trung Quốc, nhưng mình thấy bây giờ ở Trung Quốc cà phê cũng trở nên rất thịnh hành, cậu nghĩ sao?", "sec": "Trà và cà phê trong xã hội Trung Quốc"}, {"t": 476.7, "zh": "我完全同意，特别是这十年，中国的咖啡店开得越来越多。", "py": "Wǒ wánquán tóngyì, tèbié shì zhè shínián, zhōngguó de kāfēidiàn kāi de yuèláiyuè duō.", "vi": "Mình hoàn toàn đồng ý, nhất là mười năm nay, quán cà phê ở Trung Quốc mở ngày càng nhiều."}, {"t": 483.8, "zh": "我父母那个时候，很少有人喝咖啡。", "py": "Wǒ fùmǔ nàge shíhou, hěn shǎo yǒu rén hē kāfēi.", "vi": "Thời bố mẹ mình, rất ít người uống cà phê."}, {"t": 487.3, "zh": "他们觉得那个东西又黑又苦。", "py": "Tāmen juéde nàge dōngxi yòu hēi yòu kǔ.", "vi": "Họ thấy thứ đó vừa đen vừa đắng."}, {"t": 490.5, "zh": "对，我妈也是。她来北京看我，我带她去咖啡店。", "py": "Duì, wǒ mā yě shì. Tā lái běijīng kàn wǒ, wǒ dài tā qù kāfēidiàn.", "vi": "Ừ, mẹ mình cũng vậy. Bà đến Bắc Kinh thăm mình, mình dẫn bà đến quán cà phê."}, {"t": 498.1, "zh": "一杯拿铁，她喝了一口就说：“这是什么？不好喝。”", "py": "Yì bēi nátiě, tā hē le yìkǒu jiù shuō: \"zhè shì shénme? Bù hǎohē.\"", "vi": "Một ly latte, bà uống một ngụm là nói: “Đây là cái gì thế? Không ngon.”"}, {"t": 504.0, "zh": "我们的妈妈可能是一样的。", "py": "Wǒmen de māma kěnéng shì yíyàng de.", "vi": "Mẹ của hai đứa mình chắc giống nhau."}, {"t": 507.7, "zh": "但是你看，我们这一代，还有比我们更年轻的人，很多人都开始接受并且喜欢咖啡了。", "py": "Dànshì nǐ kàn, wǒmen zhè yídài, háiyǒu bǐ wǒmen gèng niánqīng de rén, hěn duō rén dōu kāishǐ jiēshòu bìngqiě xǐhuan kāfēi le.", "vi": "Nhưng cậu xem, thế hệ chúng ta và cả những người trẻ hơn, rất nhiều người đã bắt đầu chấp nhận và thích cà phê."}, {"t": 515.7, "zh": "我觉得这说明中国正在变得越来越开放，越来越国际化。", "py": "Wǒ juéde zhè shuōmíng zhōngguó zhèngzài biàn de yuèláiyuè kāifàng, yuèláiyuè guójìhuà.", "vi": "Mình thấy điều này cho thấy Trung Quốc đang ngày càng cởi mở, ngày càng quốc tế hóa."}, {"t": 522.0, "zh": "我们愿意去了解和接受别的国家的文化和生活方式。", "py": "Wǒmen yuànyì qù liǎojiě hé jiēshòu biéde guójiā de wénhuà hé shēnghuófāngshì.", "vi": "Chúng ta sẵn lòng tìm hiểu và đón nhận văn hóa và lối sống của các nước khác."}, {"t": 526.7, "zh": "我同意。咖啡店也成了一个新的社交空间。", "py": "Wǒ tóngyì. Kāfēidiàn yě chéng le yí ge xīn de shèjiāo kōngjiān.", "vi": "Mình đồng ý. Quán cà phê cũng đã trở thành một không gian giao lưu mới."}, {"t": 532.6, "zh": "以前人们和朋友见面，可能会去茶馆或者饭店。", "py": "Yǐqián rénmen hé péngyou jiànmiàn, kěnéng huì qù cháguǎn huòzhě fàndiàn.", "vi": "Trước đây người ta gặp bạn bè thường đến quán trà hoặc nhà hàng."}, {"t": 537.0, "zh": "现在很多人会说：“我们找个咖啡店坐吧。”", "py": "Xiànzài hěn duō rén huì shuō: \"wǒmen zhǎo gè kāfēidiàn zuò ba.\"", "vi": "Bây giờ nhiều người sẽ nói: “Mình tìm quán cà phê ngồi đi.”"}, {"t": 542.6, "zh": "是的。", "py": "Shì de.", "vi": "Đúng vậy."}, {"t": 542.9, "zh": "但是虽然咖啡很流行，茶在中国人心里的位置还是非常重要的。", "py": "Dànshì suīrán kāfēi hěn liúxíng, chá zài zhōngguó rén xīnlǐ de wèizhì háishì fēicháng zhòngyào de.", "vi": "Nhưng tuy cà phê rất thịnh hành, vị trí của trà trong lòng người Trung Quốc vẫn rất quan trọng."}, {"t": 549.9, "zh": "我的家里来了客人，我爸爸妈妈第一件事就是给客人泡茶。", "py": "Wǒ de jiālǐ lái le kèrén, wǒ bàba māma dì yī jiàn shì jiùshì gěi kèrén pàochá.", "vi": "Nhà mình có khách đến, việc đầu tiên bố mẹ mình làm là pha trà mời khách."}, {"t": 555.9, "zh": "对，这是中国的礼貌。", "py": "Duì, zhè shì zhōngguó de lǐmào.", "vi": "Đúng, đó là phép lịch sự của người Trung Quốc."}, {"t": 557.9, "zh": "是的，用一杯好茶来欢迎朋友，表示我们对你的尊重和欢迎。", "py": "Shì de, yòng yì bēi hǎo chá lái huānyíng péngyou, biǎoshì wǒmen duì nǐ de zūnzhòng hé huānyíng.", "vi": "Đúng, dùng một tách trà ngon để đón bạn, thể hiện sự tôn trọng và chào đón của chúng ta dành cho bạn."}, {"t": 564.6, "zh": "而且在中国南方的一些地方，喝茶是一种非常重要的生活习惯。", "py": "Érqiě zài zhōngguó nánfāng de yìxiē dìfang, hē chá shì yì zhǒng fēicháng zhòngyào de shēnghuóxíguàn.", "vi": "Hơn nữa ở một số nơi miền nam Trung Quốc, uống trà là một thói quen sinh hoạt rất quan trọng."}, {"t": 571.7, "zh": "比如广东，人们早上要去茶楼喝早茶。", "py": "Bǐrú guǎngdōng, rénmen zǎoshàng yào qù chálóu hē zǎochá.", "vi": "Ví dụ ở Quảng Đông, buổi sáng người ta phải đến trà lâu uống trà sáng."}, {"t": 576.8, "zh": "我听说过，喝早茶是不是可以一边喝茶，一边吃很多好吃的小点心？", "py": "Wǒ tīngshuō guò, hē zǎochá shìbúshì kěyǐ yìbiān hē chá, yìbiān chī hěn duō hǎochī de xiǎodiǎnxīn?", "vi": "Mình có nghe nói, uống trà sáng có phải là vừa uống trà vừa ăn nhiều món điểm tâm nhỏ ngon lắm không?"}, {"t": 583.8, "zh": "完全正确。", "py": "Wánquán zhèngquè.", "vi": "Hoàn toàn chính xác."}, {"t": 584.6, "zh": "喝早茶不只是喝茶，更重要的是和家人朋友在一起，慢慢地吃东西、聊天。", "py": "Hē zǎochá bù zhǐshì hē chá, gèng zhòngyào de shì hé jiārén péngyou zài yìqǐ, mànmàn de chī dōngxi, liáotiān.", "vi": "Uống trà sáng không chỉ là uống trà, quan trọng hơn là ở bên gia đình bạn bè, từ từ ăn uống và trò chuyện."}, {"t": 592.7, "zh": "那是一种非常舒服的生活方式。", "py": "Nà shì yì zhǒng fēicháng shūfu de shēnghuófāngshì.", "vi": "Đó là một lối sống rất dễ chịu."}, {"t": 597.4, "zh": "真好，我以后一定要去广东试一试。", "py": "Zhēn hǎo, wǒ yǐhòu yídìng yào qù guǎngdōng shìyíshì.", "vi": "Hay quá, sau này mình nhất định phải đến Quảng Đông thử một lần."}, {"t": 601.6, "zh": "说到茶的文化，我听说过一个词，叫“功夫茶”。", "py": "Shuō dào chá de wénhuà, wǒ tīngshuō guò yí ge cí, jiào \"gōngfu chá\".", "vi": "Nói đến văn hóa trà, mình có nghe một từ gọi là “công phu trà”.", "sec": "Trà công phu"}, {"t": 605.8, "zh": "这个“功夫”和我们说的“中国功夫”是一回事吗？", "py": "Zhège \"gōngfu\" hé wǒmen shuō de \"zhōngguó gōngfu\" shì yì huí shì ma?", "vi": "“Công phu” này có phải cùng một chuyện với “võ thuật Trung Hoa” mà ta hay nói không?"}, {"t": 611.0, "zh": "哈哈，这是一个很好的问题，很多学习中文的朋友可能也会有这个疑问。", "py": "Hāhā, zhè shì yí ge hěn hǎo de wèntí, hěn duō xuéxí zhōngwén de péngyou kěnéng yě huì yǒu zhège yíwèn.", "vi": "Haha, câu hỏi rất hay, nhiều bạn đang học tiếng Trung chắc cũng có thắc mắc này."}, {"t": 619.1, "zh": "这里的“功夫”不是打架的那个功夫。", "py": "Zhèlǐ de \"gōngfu\" búshì dǎjià de nàge gōngfu.", "vi": "“Công phu” ở đây không phải là công phu đánh nhau."}, {"t": 623.1, "zh": "在这里，“功夫”的意思是时间和努力。", "py": "Zài zhèlǐ, \"gōngfu\" de yìsi shì shíjiān hé nǔlì.", "vi": "Ở đây, “công phu” có nghĩa là thời gian và nỗ lực."}, {"t": 627.5, "zh": "时间和努力？", "py": "Shíjiān hé nǔlì?", "vi": "Thời gian và nỗ lực?"}, {"t": 629.0, "zh": "对。功夫茶的意思是，你需要用很多时间和心思，很认真地去泡一杯茶。", "py": "Duì. gōngfu chá de yìsi shì, nǐ xūyào yòng hěn duō shíjiān hé xīnsī, hěn rènzhēn de qù pào yì bēi chá.", "vi": "Đúng. Công phu trà nghĩa là bạn cần dùng nhiều thời gian và tâm sức để pha một tách trà thật nghiêm túc."}, {"t": 637.7, "zh": "它的茶具很小，茶杯也非常小，可能你一口就能喝完。", "py": "Tā de chájù hěn xiǎo, chábēi yě fēicháng xiǎo, kěnéng nǐ yìkǒu jiù néng hēwán.", "vi": "Bộ đồ trà của nó rất nhỏ, chén cũng rất nhỏ, có thể bạn chỉ một ngụm là hết."}, {"t": 644.9, "zh": "泡茶的过程也比较复杂。", "py": "Pàochá de guòchéng yě bǐjiào fùzá.", "vi": "Quá trình pha trà cũng khá phức tạp."}, {"t": 648.8, "zh": "为什么要那么麻烦呢？", "py": "Wèishénme yào nàme máfán ne?", "vi": "Sao phải phiền phức thế?"}, {"t": 651.5, "zh": "因为这个过程本身就是一种享受。", "py": "Yīnwèi zhège guòchéng běnshēn jiùshì yì zhǒng xiǎngshòu.", "vi": "Vì chính quá trình này đã là một sự thưởng thức."}, {"t": 655.4, "zh": "大家坐在一起，看着一个人慢慢地洗茶具、泡茶、倒茶，这个过程很安静，能让人静下来。", "py": "Dàjiā zuòzài yìqǐ, kànzhe yí ge rén mànmàn de xǐ chájù, pàochá, dào chá, zhège guòchéng hěn ānjìng, néng ràng rén jìng xiàlai.", "vi": "Mọi người ngồi cùng nhau, nhìn một người từ từ tráng đồ trà, pha trà, rót trà, quá trình này rất yên tĩnh, khiến người ta lắng lại."}, {"t": 668.0, "zh": "这是一种非常传统的社交方式，和朋友一起喝功夫茶，可以聊很长时间。", "py": "Zhè shì yì zhǒng fēicháng chuántǒng de shèjiāo fāngshì, hé péngyou yìqǐ hē gōngfu chá, kěyǐ liáo hěn cháng shíjiān.", "vi": "Đây là một cách giao lưu rất truyền thống, cùng bạn bè uống công phu trà có thể trò chuyện rất lâu."}, {"t": 676.1, "zh": "我明白了，所以功夫茶的重点不是喝，而是那个过程和在一起聊天的时间。", "py": "Wǒ míngbai le, suǒyǐ gōngfu chá de zhòngdiǎn búshì hē, érshì nàge guòchéng hé zài yìqǐ liáotiān de shíjiān.", "vi": "Mình hiểu rồi, vậy trọng tâm của công phu trà không phải là uống, mà là quá trình đó và thời gian ngồi trò chuyện bên nhau."}, {"t": 683.2, "zh": "这是一个很有意思的文化。", "py": "Zhè shì yí ge hěn yǒu yìsi de wénhuà.", "vi": "Đây là một nét văn hóa rất thú vị."}, {"t": 686.2, "zh": "是的。所以你看，咖啡代表着一种新的、国际化的、快节奏的社交方式。", "py": "Shì de. Suǒyǐ nǐ kàn, kāfēi dàibiǎo zhe yì zhǒng xīn de, guójìhuà de, kuài jiézòu de shèjiāo fāngshì.", "vi": "Đúng. Nên cậu xem, cà phê đại diện cho một cách giao lưu mới, quốc tế hóa, nhịp độ nhanh."}, {"t": 694.4, "zh": "而茶，特别是像功夫茶这样的，代表着一种传统的、安静的、慢节奏的社交方式。", "py": "Ér chá, tèbié shì xiàng gōngfu chá zhèyàng de, dàibiǎo zhe yì zhǒng chuántǒng de, ānjìng de, màn jiézòu de shèjiāo fāngshì.", "vi": "Còn trà, nhất là như công phu trà, đại diện cho một cách giao lưu truyền thống, yên tĩnh, nhịp độ chậm."}, {"t": 703.0, "zh": "这两种方式现在都在中国存在，我觉得非常好。", "py": "Zhè liǎng zhǒng fāngshì xiànzài dōu zài zhōngguó cúnzài, wǒ juéde fēicháng hǎo.", "vi": "Hai cách này bây giờ đều tồn tại ở Trung Quốc, mình thấy rất tốt."}, {"t": 708.0, "zh": "李明，今天和你聊了这么多关于茶和咖啡的事情，我学到了很多，我也很开心。", "py": "Lǐ Míng, jīntiān hé nǐ liáo le zhème duō guānyú chá hé kāfēi de shìqing, wǒ xuédào le hěn duō, wǒ yě hěn kāixīn.", "vi": "Lý Minh, hôm nay nói chuyện với cậu nhiều chuyện về trà và cà phê như vậy, mình học được nhiều điều, cũng rất vui.", "sec": "Học tiếng Trung như pha trà công phu"}, {"t": 716.9, "zh": "其实，王羽，我觉得喝茶、喝咖啡和我们学习中文也有一些像的地方。", "py": "Qíshí, Wáng Yǔ, wǒ juéde hē chá, hē kāfēi hé wǒmen xuéxí zhōngwén yě yǒu yìxiē xiàng de dìfang.", "vi": "Thật ra, Vương Vũ, mình thấy uống trà, uống cà phê và việc học tiếng Trung của chúng ta cũng có vài điểm giống nhau."}, {"t": 723.2, "zh": "哦？怎么说？这个很有意思。", "py": "Ò? Zěnme shuō? Zhège hěn yǒu yìsi.", "vi": "Ồ? Sao lại nói vậy? Cái này thú vị đây."}, {"t": 725.9, "zh": "我觉得学习中文的过程就像泡一杯功夫茶。", "py": "Wǒ juéde xuéxí zhōngwén de guòchéng jiù xiàng pào yì bēi gōngfu chá.", "vi": "Mình thấy quá trình học tiếng Trung giống như pha một tách công phu trà."}, {"t": 732.2, "zh": "泡功夫茶？为什么？", "py": "Pào gōngfu chá? Wèishénme?", "vi": "Pha công phu trà? Vì sao?"}, {"t": 734.1, "zh": "你想泡功夫茶，你需要耐心，你需要时间，你需要一步一步地做，不能着急。", "py": "Nǐ xiǎng pào gōngfu chá, nǐ xūyào nàixīn, nǐ xūyào shíjiān, nǐ xūyào yí bù yí bù de zuò, bùnéng zháojí.", "vi": "Muốn pha công phu trà, bạn cần kiên nhẫn, cần thời gian, cần làm từng bước một, không được vội."}, {"t": 742.4, "zh": "你着急，水太热，茶就不好喝了。", "py": "Nǐ zháojí, shuǐ tài rè, chá jiù bù hǎohē le.", "vi": "Bạn vội thì nước quá nóng, trà sẽ không ngon."}, {"t": 746.9, "zh": "你时间太短，茶的味道出不来。", "py": "Nǐ shíjiān tài duǎn, chá de wèidào chūbùlái.", "vi": "Thời gian quá ngắn thì hương vị của trà không ra được."}, {"t": 749.3, "zh": "学习中文不也是这样吗？", "py": "Xuéxí zhōngwén bù yě shì zhèyàng ma?", "vi": "Học tiếng Trung chẳng phải cũng như vậy sao?"}, {"t": 752.0, "zh": "我好像有点明白了。", "py": "Wǒ hǎoxiàng yǒudiǎn míngbai le.", "vi": "Hình như mình hiểu một chút rồi."}, {"t": 754.4, "zh": "你不能希望今天学习，明天中文就变得非常好。", "py": "Nǐ bùnéng xīwàng jīntiān xuéxí, míngtiān zhōngwén jiù biàn de fēicháng hǎo.", "vi": "Bạn không thể hy vọng hôm nay học xong, ngày mai tiếng Trung đã trở nên rất giỏi."}, {"t": 759.2, "zh": "你需要每天都花一点点时间，就像每天洗茶具、烧水、泡茶一样。", "py": "Nǐ xūyào měitiān dōu huā yìdiǎndiǎn shíjiān, jiù xiàng měitiān xǐ chájù, shāoshuǐ, pàochá yíyàng.", "vi": "Bạn cần mỗi ngày dành một chút thời gian, giống như mỗi ngày tráng đồ trà, đun nước, pha trà vậy."}, {"t": 767.1, "zh": "今天记五个汉字，明天练习一个句子，每天都做一点。", "py": "Jīntiān jì wǔ gè hànzì, míngtiān liànxí yí ge jùzi, měitiān dōu zuò yìdiǎn.", "vi": "Hôm nay nhớ năm chữ Hán, ngày mai luyện một câu, mỗi ngày làm một chút."}, {"t": 772.6, "zh": "慢慢地，时间长了，你的中文茶才能泡出好的味道。", "py": "Mànmàn de, shíjiān cháng le, nǐ de zhōngwén chá cáinéng pào chū hǎo de wèidào.", "vi": "Từ từ, thời gian dài rồi, “trà tiếng Trung” của bạn mới pha ra được hương vị ngon."}, {"t": 778.8, "zh": "这就是功夫。", "py": "Zhè jiùshì gōngfu.", "vi": "Đó chính là công phu."}, {"t": 779.8, "zh": "我觉得这个比喻太好了。", "py": "Wǒ juéde zhège bǐyù tài hǎo le.", "vi": "Mình thấy phép so sánh này hay quá."}, {"t": 782.0, "zh": "学中文真的需要功夫。", "py": "Xué zhōngwén zhēn de xūyào gōngfu.", "vi": "Học tiếng Trung thật sự cần công phu.", "sec": "Khi bạn thấy sốt ruột"}, {"t": 785.0, "zh": "有时候我真的觉得很着急。", "py": "Yǒu shíhou wǒ zhēn de juéde hěn zháojí.", "vi": "Có lúc mình thật sự thấy rất sốt ruột."}, {"t": 788.6, "zh": "我觉得自己学了这么长时间，为什么还是说得不好，听得不懂？", "py": "Wǒ juéde zìjǐ xué le zhème cháng shíjiān, wèishénme háishì shuō de bù hǎo, tīng de bù dǒng?", "vi": "Mình thấy mình đã học lâu như vậy, sao vẫn nói không tốt, nghe không hiểu?"}, {"t": 795.4, "zh": "我就希望自己能快一点，再快一点。", "py": "Wǒ jiù xīwàng zìjǐ néng kuài yìdiǎn, zài kuài yìdiǎn.", "vi": "Mình chỉ mong bản thân nhanh một chút, rồi nhanh thêm chút nữa."}, {"t": 798.5, "zh": "我非常理解，每个学习中文的人可能都有这个时候。", "py": "Wǒ fēicháng lǐjiě, měi gè xuéxí zhōngwén de rén kěnéng dōu yǒu zhège shíhou.", "vi": "Mình rất hiểu, người học tiếng Trung nào chắc cũng có lúc như vậy."}, {"t": 804.9, "zh": "会觉得很累，看不到自己的进步。", "py": "Huì juéde hěn lèi, kànbúdào zìjǐ de jìnbù.", "vi": "Thấy rất mệt, không nhìn ra sự tiến bộ của mình."}, {"t": 807.7, "zh": "对，就是这种感觉。", "py": "Duì, jiùshì zhè zhǒng gǎnjué.", "vi": "Đúng, chính là cảm giác này."}, {"t": 810.2, "zh": "我希望学习中文能像喝咖啡一样，喝下去马上就有精神，马上就能看到效果。", "py": "Wǒ xīwàng xuéxí zhōngwén néng xiàng hē kāfēi yíyàng, hē xiàqù mǎshàng jiù yǒu jīngshén, mǎshàng jiù néng kàndào xiàoguǒ.", "vi": "Mình mong học tiếng Trung có thể giống như uống cà phê, uống vào là tỉnh ngay, thấy hiệu quả ngay."}, {"t": 819.7, "zh": "但是我知道这是不可能的。", "py": "Dànshì wǒ zhīdao zhè shì bù kěnéng de.", "vi": "Nhưng mình biết điều đó là không thể."}, {"t": 823.3, "zh": "李明，你有什么好的建议吗？", "py": "Lǐ Míng, nǐ yǒu shénme hǎo de jiànyì ma?", "vi": "Lý Minh, cậu có lời khuyên nào hay không?"}, {"t": 826.8, "zh": "我觉得，当你觉得着急的时候，不要对自己太严格。", "py": "Wǒ juéde, dāng nǐ juéde zháojí de shíhou, búyào duì zìjǐ tài yángé.", "vi": "Mình nghĩ, khi bạn thấy sốt ruột thì đừng quá khắt khe với bản thân."}, {"t": 831.4, "zh": "你可以休息一下，或者换一种学习方法。", "py": "Nǐ kěyǐ xiūxī yíxià, huòzhě huàn yì zhǒng xuéxí fāngfǎ.", "vi": "Bạn có thể nghỉ một chút, hoặc đổi cách học."}, {"t": 835.5, "zh": "比如你一直看书，觉得很没有意思，那你可以试着去看一个简单的中国电影，或者听一首中文歌。", "py": "Bǐrú nǐ yìzhí kànshū, juéde hěn méi yǒu yìsi, nà nǐ kěyǐ shì zhe qù kàn yí ge jiǎndān de zhōngguó diànyǐng, huòzhě tīng yìshǒu zhōngwén gē.", "vi": "Ví dụ bạn cứ đọc sách mãi và thấy chán, thì có thể thử xem một bộ phim Trung Quốc đơn giản, hoặc nghe một bài hát tiếng Trung."}, {"t": 845.2, "zh": "嗯，这是个好办法。", "py": "Èn, zhè shì gè hǎo bànfǎ.", "vi": "Ừm, đây là cách hay."}, {"t": 847.3, "zh": "最重要的是要相信功夫的力量，要相信你每天花的时间和努力都不会浪费。", "py": "Zuì zhòngyào de shì yào xiāngxìn gōngfu de lìliàng, yào xiāngxìn nǐ měitiān huā de shíjiān hé nǔlì dōu bú huì làngfèi.", "vi": "Quan trọng nhất là tin vào sức mạnh của công phu, tin rằng thời gian và nỗ lực bạn bỏ ra mỗi ngày đều không uổng phí."}, {"t": 856.7, "zh": "就像泡茶一样，你做的每一步都会影响茶的味道。", "py": "Jiù xiàng pàochá yíyàng, nǐ zuò de měi yí bù dū huì yǐngxiǎng chá de wèidào.", "vi": "Giống như pha trà, mỗi bước bạn làm đều ảnh hưởng đến hương vị của trà."}, {"t": 862.2, "zh": "所以别着急，慢慢来，享受学习中文这个过程，就像享受泡茶的过程一样。", "py": "Suǒyǐ bié zháojí, mànmàn lái, xiǎngshòu xuéxí zhōngwén zhège guòchéng, jiù xiàng xiǎngshòu pàochá de guòchéng yíyàng.", "vi": "Vậy nên đừng vội, cứ từ từ, tận hưởng quá trình học tiếng Trung, giống như tận hưởng quá trình pha trà."}, {"t": 870.5, "zh": "谢谢你，李明，听你这么说，我感觉好多了。", "py": "Xièxie nǐ, Lǐ Míng, tīng nǐ zhème shuō, wǒ gǎnjué hǎo duō le.", "vi": "Cảm ơn cậu, Lý Minh, nghe cậu nói vậy mình thấy khá hơn nhiều rồi."}, {"t": 875.2, "zh": "我以后会把学中文当成是为自己泡一杯功夫茶，需要耐心，也需要享受这个过程。", "py": "Wǒ yǐhòu huì bǎ xué zhōngwén dàngchéng shì wèi zìjǐ pào yì bēi gōngfu chá, xūyào nàixīn, yě xūyào xiǎngshòu zhège guòchéng.", "vi": "Sau này mình sẽ coi việc học tiếng Trung như tự pha cho mình một tách công phu trà, cần kiên nhẫn, cũng cần tận hưởng quá trình ấy."}, {"t": 884.0, "zh": "对，我们可以选择像喝咖啡一样快速的生活，但我们也需要像喝茶一样，给自己一些慢下来的时间，特别是在学习的时候。", "py": "Duì, wǒmen kěyǐ xuǎnzé xiàng hē kāfēi yíyàng kuàisù de shēnghuó, dàn wǒmen yě xūyào xiàng hē chá yíyàng, gěi zìjǐ yìxiē màn xiàlai de shíjiān, tèbié shì zài xuéxí de shíhou.", "vi": "Ừ, chúng ta có thể chọn lối sống nhanh như uống cà phê, nhưng cũng cần giống như uống trà, cho bản thân một chút thời gian chậm lại, nhất là lúc học."}, {"t": 898.2, "zh": "说得太好了！", "py": "Shuō de tài hǎo le!", "vi": "Nói hay quá!"}, {"t": 899.9, "zh": "好了，今天我们聊了很多关于茶和咖啡的话题，时间也差不多了。", "py": "Hǎo le, jīntiān wǒmen liáo le hěn duō guānyú chá hé kāfēi de huàtí, shíjiān yě chàbuduō le.", "vi": "Thôi nào, hôm nay chúng ta nói rất nhiều về trà và cà phê, cũng gần hết giờ rồi.", "sec": "Tổng kết và lời chào"}, {"t": 906.7, "zh": "是啊，时间过得真快。", "py": "Shì a, shíjiān guò de zhēn kuài.", "vi": "Ừ nhỉ, thời gian trôi nhanh thật."}, {"t": 909.3, "zh": "今天我们聊了茶和咖啡。", "py": "Jīntiān wǒmen liáo le chá hé kāfēi.", "vi": "Hôm nay chúng ta đã nói về trà và cà phê."}, {"t": 911.9, "zh": "王羽喜欢咖啡，因为它代表着一种快速、现代的生活方式，而且咖啡店也是一个很好的社交空间。", "py": "Wáng Yǔ xǐhuan kāfēi, yīnwèi tā dàibiǎo zhe yì zhǒng kuàisù, xiàndài de shēnghuófāngshì, érqiě kāfēidiàn yě shì yí ge hěn hǎo de shèjiāo kōngjiān.", "vi": "Vương Vũ thích cà phê vì nó đại diện cho một lối sống nhanh, hiện đại, hơn nữa quán cà phê cũng là một không gian giao lưu rất tốt."}, {"t": 922.2, "zh": "我喜欢茶，因为它对身体好，也代表着一种慢下来、享受过程的中国传统文化。", "py": "Wǒ xǐhuan chá, yīnwèi tā duì shēntǐ hǎo, yě dàibiǎo zhe yì zhǒng màn xiàlai, xiǎngshòu guòchéng de zhōngguó chuántǒng wénhuà.", "vi": "Mình thích trà vì nó tốt cho sức khỏe, cũng đại diện cho một nét văn hóa truyền thống Trung Hoa là chậm lại và tận hưởng quá trình."}, {"t": 931.6, "zh": "对，最重要的是，我们发现学习中文就像泡一杯中国的功夫茶。", "py": "Duì, zuì zhòngyào de shì, wǒmen fāxiàn xuéxí zhōngwén jiù xiàng pào yì bēi zhōngguó de gōngfu chá.", "vi": "Đúng, quan trọng nhất là chúng ta phát hiện học tiếng Trung giống như pha một tách công phu trà của Trung Quốc."}, {"t": 939.1, "zh": "它需要时间，需要耐心，需要我们享受这个过程，而不是只想着一个快速的结果。", "py": "Tā xūyào shíjiān, xūyào nàixīn, xūyào wǒmen xiǎngshòu zhège guòchéng, ér búshì zhǐ xiǎngzhe yí ge kuàisù de jiéguǒ.", "vi": "Nó cần thời gian, cần kiên nhẫn, cần chúng ta tận hưởng quá trình, chứ không phải chỉ nghĩ đến một kết quả nhanh chóng."}, {"t": 947.0, "zh": "对。如果大家想看我们今天聊天的完整文本，可以去我们的博客看看。", "py": "Duì. Rúguǒ dàjiā xiǎng kàn wǒmen jīntiān liáotiān de wánzhěng wénběn, kěyǐ qù wǒmen de bókè kànkan.", "vi": "Đúng. Nếu mọi người muốn xem toàn văn cuộc trò chuyện hôm nay, có thể ghé blog của chúng mình."}, {"t": 955.2, "zh": "我们的博客地址是 chinesedailypodcast.blogspot.com。", "py": "Wǒmen de bókè dìzhǐ shì chinesedailypodcast.blogspot.com.", "vi": "Địa chỉ blog của chúng mình là chinesedailypodcast.blogspot.com."}, {"t": 960.0, "zh": "是的，欢迎大家去看一看。", "py": "Shì de, huānyíng dàjiā qù kànyíkàn.", "vi": "Đúng vậy, mời mọi người ghé xem."}, {"t": 963.1, "zh": "那，听众朋友们，你们呢？你们喜欢喝茶还是喝咖啡？", "py": "Nà, tīngzhòng péngyoumen, nǐmen ne? Nǐmen xǐhuan hē chá háishì hē kāfēi?", "vi": "Vậy các bạn nghe đài thì sao? Các bạn thích uống trà hay cà phê?"}, {"t": 968.1, "zh": "或者你觉得学习中文更像什么？", "py": "Huòzhě nǐ juéde xuéxí zhōngwén gèng xiàng shénme?", "vi": "Hoặc bạn thấy học tiếng Trung giống điều gì hơn?"}, {"t": 971.4, "zh": "请在我们的博客下面留言告诉我们吧，我们很想听你们的故事。", "py": "Qǐng zài wǒmen de bókè xiàmiàn liúyán gàosù wǒmen ba, wǒmen hěn xiǎng tīng nǐmen de gùshì.", "vi": "Hãy để lại bình luận dưới blog cho chúng mình biết nhé, chúng mình rất muốn nghe câu chuyện của các bạn."}, {"t": 978.4, "zh": "好的，今天的《每天中文》就到这里，感谢大家的收听。", "py": "Hǎo de, jīntiān de \"měitiān zhōngwén\" jiù dào zhèlǐ, gǎnxiè dàjiā de shōutīng.", "vi": "Được rồi, tập Mỗi Ngày Trung Văn hôm nay xin dừng ở đây, cảm ơn mọi người đã lắng nghe."}, {"t": 982.3, "zh": "我是王羽。", "py": "Wǒ shì Wáng Yǔ.", "vi": "Mình là Vương Vũ."}, {"t": 983.8, "zh": "我是李明。", "py": "Wǒ shì Lǐ Míng.", "vi": "Mình là Lý Minh."}, {"t": 986.0, "zh": "我们下次再见。", "py": "Wǒmen xiàcì zàijiàn.", "vi": "Hẹn gặp lại lần sau."}, {"t": 988.2, "zh": "再见！", "py": "Zàijiàn!", "vi": "Tạm biệt!"}]},
{id:"l9",zh:"HSKK 中级样题：网上购物，还是去商店买？",vi:"HSKK trung cấp, bài mẫu: mua sắm online hay ra cửa hàng?",level:"HSK 3–4",audio:"episode9.mp3",
hl:{"v": [["网上购物", "wǎngshàng gòuwù", "mua sắm trực tuyến"], ["方便", "fāngbiàn", "tiện lợi"], ["逛街", "guàngjiē", "đi dạo phố, đi mua sắm"], ["价格", "jiàgé", "giá cả"], ["比较", "bǐjiào", "so sánh"], ["退货", "tuìhuò", "trả hàng"], ["试穿", "shìchuān", "mặc thử"], ["日用品", "rìyòngpǐn", "đồ dùng hằng ngày"], ["愿意", "yuànyì", "sẵn lòng, muốn"], ["麻烦", "máfan", "phiền phức, rắc rối"]], "g": [{"t": "第一 / 第二 / 总的来说", "re": "^(第一|第二|总的来说)", "k": [], "vi": "thứ nhất / thứ hai / nói tóm lại", "n": "Khung liệt kê ý rồi chốt lại, rất hợp để dựng bài nói HSKK."}, {"t": "不过…", "re": "不过", "k": ["不过"], "vi": "nhưng, có điều…", "n": "Chuyển ý nhẹ hơn 但是, thường mở đầu vế nêu mặt trái."}, {"t": "比…便宜", "re": "比[^，。]{1,6}(便宜|好|贵|大|小)", "k": ["比"], "vi": "… rẻ hơn …", "n": "So sánh: A 比 B + tính từ."}, {"t": "像…这些…", "re": "像[^。]{1,10}这些", "k": ["像", "这些"], "vi": "những thứ như…", "n": "Nêu ví dụ cho một nhóm đồ vật."}]},
raw:[["先说网上购物的好处。", "先|xiān,说|shuō,网上|wǎngshàng,购物|gòuwù,的|de,好处|hǎochù", ""], ["不过，网上购物也有问题。", "不过|búguò,网上|wǎngshàng,购物|gòuwù,也|yě,有|yǒu,问题|wèntí", ""], ["第二，选择多，价格也常常比商店便宜。", "第二|dìèr,选择|xuǎnzé,多|duō,价格|jiàgé,也|yě,常常|chángcháng,比|bǐ,商店|shāngdiàn,便宜|piányi", ""], ["总的来说，我觉得两种方式各有各的好处。", "总的来说|zǒng de lái shuō,我|wǒ,觉得|juéde,两种|liǎngzhǒng,方式|fāngshì,各|gè,有|yǒu,各|gè,的|de,好处|hǎochù", ""], ["我可以在不同的网店比较一下，再决定买哪一个。", "我|wǒ,可以|kěyǐ,在|zài,不同|bùtóng,的|de,网店|wǎngdiàn,比较|bǐjiào,一|yí,下|xià,再|zài,决定|juédìng,买|mǎi,哪|nǎ,一个|yí ge", ""], ["有时候收到的东西和照片不一样，退货还很麻烦。", "有时候|yǒushíhòu,收到|shōudào,的|de,东西|dōngxi,和|hé,照片|zhàopiān,不|bù,一样|yíyàng,退货|tuìhuò,还|hái,很|hěn,麻烦|máfán", ""], ["我更喜欢网上购物，不过有些东西，我还是会去商店买。", "我|wǒ,更|gèng,喜欢|xǐhuan,网上|wǎngshàng,购物|gòuwù,不过|búguò,有些|yǒuxiē,东西|dōngxi,我|wǒ,还是|háishì,会|huì,去|qù,商店|shāngdiàn,买|mǎi", ""], ["不用出门，在手机上点几下，过两三天东西就送到家里了。", "不用|búyòng,出门|chūmén,在|zài,手机|shǒujī,上|shàng,点|diǎn,几下|jǐxià,过|guò,两三天|liǎng sān tiān,东西|dōngxi,就|jiù,送到|sòngdào,家里|jiālǐ,了|le", ""], ["平时买日用品，我会在网上买；买衣服的时候，我会去商店。", "平时|píngshí,买|mǎi,日用品|rìyòngpǐn,我|wǒ,会|huì,在|zài,网上|wǎngshàng,买|mǎi,买|mǎi,衣服|yīfú,的|de,时候|shíhou,我|wǒ,会|huì,去|qù,商店|shāngdiàn", ""], ["所以像衣服、鞋子这些需要试穿的东西，我更愿意去商店买。", "所以|suǒyǐ,像|xiàng,衣服|yīfú,鞋子|xiézi,这些|zhèxiē,需要|xūyào,试穿|shìchuān,的|de,东西|dōngxi,我|wǒ,更|gèng,愿意|yuànyì,去|qù,商店|shāngdiàn,买|mǎi", ""], ["我平时工作很忙，没有时间逛街，所以网上购物帮了我很大的忙。", "我|wǒ,平时|píngshí,工作|gōngzuò,很|hěn,忙|máng,没有|méiyǒu,时间|shíjiān,逛街|guàngjiē,所以|suǒyǐ,网上|wǎngshàng,购物|gòuwù,帮|bāng,了|le,我|wǒ,很|hěn,大|dà,的|de,忙|máng", ""]],
vis:["Nói về điểm tốt của mua sắm online trước.", "Nhưng mua sắm online cũng có vấn đề.", "Thứ hai, lựa chọn nhiều, giá cũng thường rẻ hơn cửa hàng.", "Nói tóm lại, mình thấy hai cách đều có cái hay riêng.", "Mình có thể so sánh giữa các cửa hàng online khác nhau rồi mới quyết định mua cái nào.", "Đôi khi đồ nhận được khác với ảnh, trả hàng cũng rất phiền.", "Mình thích mua sắm online hơn, nhưng có vài thứ mình vẫn sẽ ra cửa hàng mua.", "Không cần ra khỏi nhà, bấm vài cái trên điện thoại, hai ba ngày sau đồ đã được giao tới nhà.", "Ngày thường mua đồ dùng hằng ngày thì mình mua online; lúc mua quần áo thì mình ra cửa hàng.", "Vì vậy những thứ cần mặc thử như quần áo, giày dép, mình thích ra cửa hàng mua hơn.", "Ngày thường mình làm việc rất bận, không có thời gian đi dạo phố, nên mua sắm online giúp mình rất nhiều."],
